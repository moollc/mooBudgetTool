<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mBT Stages Tool</title>
</head>
<body>
    <div id="stages-viewport" class="w-full h-full min-h-[80vh]">
        <div class="flex flex-col items-center justify-center h-[60vh] text-center" id="stages-loader">
            <div class="w-24 h-24 bg-white rounded-full shadow-lg flex items-center justify-center mb-6 text-emerald-300 animate-pulse">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Loading Stages...</h2>
        </div>
    </div>
    <script>
        (async function() {
            console.log('mBTStages.html: Initializing...');
            const container = document.getElementById('stages-viewport');
            
            const render = () => {
                if (window.mBT && window.mBT.ui && window.budget && typeof window.mBT.ui.renderStagesView === 'function') {
                    console.log('mBTStages.html: Rendering Stages View');
                    container.innerHTML = window.mBT.ui.renderStagesView();
                    if (typeof window.mBT.ui.initStagesInteractions === 'function') {
                        window.mBT.ui.initStagesInteractions(container);
                    }
                } else {
                    console.warn('mBT Stages UI or Budget not ready, retrying...');
                    setTimeout(render, 100);
                }
            };
            
            render();
        })();
    </script>
</body>
</html>
