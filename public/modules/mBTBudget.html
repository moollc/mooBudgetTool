<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mBT Budget Ledger</title>
</head>
<body>
    <div id="budget-viewport" class="w-full h-full">
        <!-- The core engine will populate this via mBT.ui.refresh() -->
    </div>
    <script>
        (function() {
            console.log('mBTBudget.html: Initializing..');
            var container = document.getElementById('budget-viewport');
            
            var render = function () {
                if (window.mBT && window.mBT.ui && window.budget && typeof window.mBT.ui.refresh === 'function') {
                    console.log('mBTBudget.html: Refreshing UI');
                    window.mBT.ui.refresh(container);
                } else {
                    console.warn('mBT UI or Budget not ready, retrying..');
                    setTimeout(render, 100);
                }
            };
            
            render();
        })();
    </script>
</body>
</html>
