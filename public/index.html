<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="mBT Monolith - Offline-first Film Production Budget Tool">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>mBT Monolith - Moo Budget Tool</title>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192x192.png">
    <link rel="mask-icon" href="./cow-maskable.svg" type="image/svg+xml">

    <link href="./globals.css" rel="stylesheet"/>
</head>
<body class="bg-slate-50 overflow-hidden">
    <!-- App Root - Loaded via Vite -->
    <div id="app" class="h-screen flex"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('SW registered:', reg))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>

    <!-- Core App Load -->
    <script type="module" src="./core/mBT.core.js"></script>
</body>
</html>
