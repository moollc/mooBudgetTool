<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBT Contacts - Department Management</title>
  <script src="../../scripts/storage.js"></script>
  <script src="../../scripts/engine/mbtle.js"></script>
  <script src="../../lib/localforage.min.js"></script>
  <script src="../../lib/tailwind.min.js"></script>
  <script src="../../core/components/EmbeddedMode.js"></script>
  <style type="text/tailwindcss">
    /* mBT-Contacts Module */
:root {
  --mBT-theme-primary: #1e88e5;
  --mBT-theme-danger: #e53935;
}

.contact-card { @apply bg-white rounded-lg shadow-sm border border-gray-200 p-4; }
.department-section { @apply mb-6; }
</style>
</head>

<body class="bg-gray-50 font-sans">

  <div class="min-h-screen pb-8">

    <!-- Header -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-gray-800">MBT Contacts</h1>
        <p class="text-sm text-gray-500 mt-1">Department Contacts & Rate Lookup</p>
      </div>
      <button id="print-contacts-btn"
        class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print Directory
      </button>
    </div>

    <!-- Main Layout -->
    <main class="px-6 py-6">

      <!-- Search Bar -->
      <div class="search-container mb-4">
        <div class="relative">
          <input type="text" id="contact-search"
            class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Search contacts...">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
      </div>

      <!-- Project Filter -->
      <section class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Project</label>
        <select id="project-filter" class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-lg">
          <option value="">All Projects</option>
        </select>
      </section>

      <!-- Department Tabs -->
      <section class="mb-6">
        <div class="flex flex-wrap gap-2">
          <button data-dept=""
            class="dept-tab px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">All</button>
          <button data-dept="Production"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Production</button>
          <button data-dept="Art"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Art</button>
          <button data-dept="Camera"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Camera</button>
          <button data-dept="Sound"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Sound</button>
          <button data-dept="Electrical"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Electrical</button>
          <button data-dept="Editing"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Editing</button>
          <button data-dept="Post"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Post</button>
          <button data-dept="Transport"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Transport</button>
          <button data-dept="Craft Services"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Craft
            Services</button>
          <button data-dept="Miscellaneous"
            class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm">Miscellaneous</button>
        </div>
      </section>

      <!-- Contacts List -->
      <section>
        <div id="contacts-list" class="space-y-3">
          <!-- Contacts will be inserted here by JavaScript -->
        </div>
        <div id="empty-state" class="hidden text-center py-12">
          <p class="text-gray-500">No contacts found.</p>
        </div>
      </section>

    </main>

  </div>

  <script>
    (function () {
      const STORAGE = window.mBT.storage;
      let currentProjectId = '';
      let currentDept = '';
      let allContactsData = []; // Outer scope for search

      // Departments with standard daily rates
      const STANDARD_RATES = {
        'Production': 450,
        'Art': 350,
        'Camera': 400,
        'Sound': 380,
        'Electrical': 370,
        'Editing': 420,
        'Post': 400,
        'Transport': 300,
        'Craft Services': 200,
        'Miscellaneous': 150
      };

      // Render contacts for current filter
      function renderContacts() {
        const list = document.getElementById('contacts-list');
        const empty = document.getElementById('empty-state');

        list.innerHTML = '';

        STORAGE.getItem(CONTACTS_STORE).then(contacts => {
          allContactsData = contacts || [];
          let filtered = allContactsData;

          // Filter by project if selected
          if (currentProjectId) {
            filtered = filtered.filter(c => c.projectId === currentProjectId);
          }

          // Filter by department if selected
          if (currentDept) {
            filtered = filtered.filter(c => c.department === currentDept);
          }

          if (filtered.length === 0) {
            empty.classList.remove('hidden');
            return;
          }
          empty.classList.add('hidden');

          filtered.forEach(contact => {
            const el = createContactCard(contact);
            list.appendChild(el);
          });

          updateEmptyState(filtered.length === 0);
        }).catch(() => {
          list.innerHTML = '<p class="text-center text-gray-500 py-8">Error loading contacts</p>';
        });
      }

      function createContactCard(contact) {
        const card = document.createElement('div');
        card.className = 'contact-card';

        const name = contact.name || 'Unnamed';
        const email = contact.email || 'N/A';
        const phone = contact.phone || 'N/A';
        const dept = contact.department || 'General';
        const rate = contact.rate || STANDARD_RATES[dept] || '?';
        const rateFormatted = typeof rate === 'number' ? '$' + rate.toLocaleString('en-US', { minimumFractionDigits: 2 }) : rate;
        const project = contact.projectName || contact.projectId || 'N/A';

        card.innerHTML = `
      <div class="flex items-start justify-between">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-semibold text-gray-800 truncate">${escapeHtml(name)}</span>
            <span class="dept-badge text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium">${escapeHtml(dept)}</span>
          </div>
          ${project !== 'N/A' ? `<p class="text-xs text-gray-500">Project: ${escapeHtml(project)}</p>` : ''}
          
          <div class="mt-2 space-y-1 text-sm">
            ${email !== 'N/A' ? `
              <div class="flex items-center gap-2 text-gray-600">
                <span class="text-gray-400"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                <a href="mailto:${email}" class="hover:text-blue-600 truncate">${escapeHtml(email)}</a>
              </div>
            ` : ''}
            ${phone !== 'N/A' ? `
              <div class="flex items-center gap-2 text-gray-600">
                <span class="text-gray-400"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
                <a href="tel:${phone}" class="hover:text-blue-600">${escapeHtml(phone)}</a>
              </div>
            ` : ''}
          </div>
        </div>
        <div class="text-right" style="min-width:min(120px,30vw);">
          <p class="text-xs text-gray-500 uppercase">Daily Rate</p>
          <p class="text-lg font-bold text-gray-800">${rateFormatted}</p>
        </div>
      </div>
    `;

        return card;
      }

      // Load projects for filter dropdown
      function loadProjectsForFilter() {
        STORAGE.getItem(PROJECTS_STORE).then(projects => {
          const filter = document.getElementById('project-filter');
          const projectMap = {};
          (projects || []).forEach(p => {
            if (!p.name) {
              projectMap[p.id] = 'Untitled';
            } else {
              projectMap[p.id] = p.name;
            }
          });

          const options = Object.entries(projectMap)
            .map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`)
            .join('');

          filter.innerHTML = '<option value="">All Projects</option>' + options;
        }).catch(() => {
          document.getElementById('project-filter').innerHTML = '<option value="">All Projects</option>';
        });
      }

      // Tab switching
      document.querySelectorAll('.dept-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // Update active state
          document.querySelectorAll('.dept-tab').forEach(t => {
            t.classList.remove('bg-blue-600', 'text-white');
            t.classList.add('bg-gray-200', 'text-gray-700');
          });
          tab.classList.remove('bg-gray-200', 'text-gray-700');
          tab.classList.add('bg-blue-600', 'text-white');

          currentDept = tab.dataset.dept;
          renderContacts();
        });
      });

      // Project filter change
      document.getElementById('project-filter').addEventListener('change', (e) => {
        currentProjectId = e.target.value;
        renderContacts();
      });

      // Add contact modal
      function showAddContactModal() {
        const modal = document.createElement('div');
        modal.id = 'add-contact-modal';
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
        modal.innerHTML = `
      <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
          <h2 class="text-lg font-semibold">Add Contact</h2>
          <button class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input type="text" id="contact-name" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="John Doe">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Department *</label>
            <select id="contact-dept" class="w-full px-3 py-2 border border-gray-300 rounded">
              <option value="Production">Production</option>
              <option value="Art">Art</option>
              <option value="Camera">Camera</option>
              <option value="Sound">Sound</option>
              <option value="Electrical">Electrical</option>
              <option value="Editing">Editing</option>
              <option value="Post">Post</option>
              <option value="Transport">Transport</option>
              <option value="Craft Services">Craft Services</option>
              <option value="Miscellaneous">Miscellaneous</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="contact-email" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="john@example.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
            <input type="tel" id="contact-phone" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="+1 (555) 123-4567">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Custom Daily Rate ($)</label>
            <input type="number" step="0.01" id="contact-rate" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="Leave empty for standard rate">
            <p class="text-xs text-gray-500 mt-1">Leave empty to use department standard rate</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Project (Optional)</label>
            <input type="text" id="contact-project" class="w-full px-3 py-2 border border-gray-300 rounded" placeholder="Project name or ID">
          </div>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
          <button class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded">Cancel</button>
          <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded" id="save-contact">Save</button>
        </div>
      </div>
    `;

        document.body.appendChild(modal);

        modal.querySelector('button.close').addEventListener('click', closeModal);
        modal.querySelector('button').addEventListener('click', function(e) {
            if (e.target.classList.contains('bg-gray-200') || e.target.textContent.includes('Cancel')) {
                closeModal();
            }
        });
        modal.querySelector('#save-contact').addEventListener('click', saveContact);
      }

      function closeModal() {
        const modal = document.getElementById('add-contact-modal');
        if (modal) modal.remove();
      }

      function saveContact() {
        const name = document.getElementById('contact-name').value;
        const dept = document.getElementById('contact-dept').value;
        const email = document.getElementById('contact-email').value;
        const phone = document.getElementById('contact-phone').value;
        const customRateStr = document.getElementById('contact-rate').value;
        let rate = customRateStr ? parseFloat(customRateStr) : STANDARD_RATES[dept];
        const project = document.getElementById('contact-project').value;

        if (!name) {
          alert('Name is required');
          return;
        }

        const contact = {
          name,
          department: dept,
          email: email || null,
          phone: phone || null,
          rate: rate || null,
          projectId: currentProjectId || null,
          projectName: project || null,
          lastModified: new Date().toISOString()
        };

        STORAGE.getItem(CONTACTS_STORE).then(contacts => {
          STORAGE.setItem(CONTACTS_STORE, [...(contacts || []), contact]).then(() => {
            alert('Contact added!');
            closeModal();
            renderContacts();
          });
        });
      }

      // Delete contact
      function confirmDeleteContact(id) {
        if (!confirm('Delete this contact?')) return;

        STORAGE.getItem(CONTACTS_STORE).then(contacts => {
          const filtered = contacts.filter(c => c.id !== id);
          STORAGE.setItem(CONTACTS_STORE, filtered).then(() => {
            renderContacts();
          });
        });
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Print handler
      document.getElementById('print-contacts-btn').addEventListener('click', () => {
        const query = document.getElementById('contact-search').value.toLowerCase();
        let contactsToPrint = allContactsData;
        if (query) {
          contactsToPrint = allContactsData.filter(c => {
            const name = (c.name || '').toLowerCase();
            const email = (c.email || '').toLowerCase();
            const dept = (c.department || '').toLowerCase();
            return name.includes(query) || email.includes(query) || dept.includes(query);
          });
        }

        const printHTML = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>MBT Contacts Directory</title>
            <style>
              body { font-family: sans-serif; padding: 20px; color: #333; }
              table { width: 100%; border-collapse: collapse; margin-top: 20px; }
              th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
              th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
              .text-right { text-align: right; }
              .header { border-bottom: 2px solid #10b981; padding-bottom: 10px; margin-bottom: 20px; }
              @media print { .no-print { display: none; } }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>MBT Contacts Directory</h1>
              <p>Generated on: ${new Date().toLocaleString()}</p>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th class="text-right">Daily Rate</th>
                </tr>
              </thead>
              <tbody>
                ${contactsToPrint.map(c => `
                  <tr>
                    <td>${escapeHtml(c.name)}</td>
                    <td>${escapeHtml(c.department)}</td>
                    <td>${escapeHtml(c.email || 'N/A')}</td>
                    <td>${escapeHtml(c.phone || 'N/A')}</td>
                    <td class="text-right">$${(c.rate || 0).toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <scr' + 'ipt>window.onload = () => { window.print(); window.close(); };</scr' + 'ipt>
          </body>
          </html>
        `;

        const printWindow = window.open('', '_blank');
        printWindow.document.write(printHTML);
        printWindow.document.close();
      });

      // Search handler
      let searchTimeout = null;
      document.getElementById('contact-search').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          const query = e.target.value.toLowerCase();
          if (query) {
            // Filter contacts by name or email
            const filteredContacts = allContactsData.filter(c => {
              const name = (c.name || '').toLowerCase();
              const email = (c.email || '').toLowerCase();
              const dept = (c.department || '').toLowerCase();
              return name.includes(query) || email.includes(query) || dept.includes(query);
            });
            renderContacts();
          }
        }, 300);
      });


      // Initialize
      loadProjectsForFilter();
      renderContacts();
    })();
  </script>
</body>

</html>
