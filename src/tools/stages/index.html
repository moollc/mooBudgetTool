                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
            },

            /* ========= Interaction Handlers ========= */

            balanceSliders: function(changedKey, value) {
                stagesPushUndo();
                var b      = this.state.project;
                var stages = b.targetLock.stages;
                var KEYS   = this.state.KEYS;
                var newVal = parseFloat(value);
                if (isNaN(newVal)) newVal = 0;

                var lockedKeys    = KEYS.filter(function(k) { return k !== changedKey && stages[k].locked; });
                var unlockedKeys  = KEYS.filter(function(k) { return k !== changedKey && !stages[k].locked; });
                var lockedTotal   = lockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                var maxAvail      = 100 - lockedTotal;

                if (newVal > maxAvail) newVal = maxAvail;
                if (newVal < 0)        newVal = 0;
                /* When all siblings are locked, slack cannot move elsewhere; pin to remaining share */
                if (unlockedKeys.length === 0) newVal = maxAvail;
                stages[changedKey].ratio = newVal;

                var remaining          = Math.max(0, 100 - newVal - lockedTotal);
                var currentUnlockedSum = unlockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                unlockedKeys.forEach(function(k) {
                    stages[k].ratio = currentUnlockedSum <= 0.01
                        ? remaining / unlockedKeys.length
                        : remaining * (stages[k].ratio / currentUnlockedSum);
                });

                var total = KEYS.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                var drift = 100 - total;
                if (Math.abs(drift) > 0.01) {
                    var snapKey = changedKey;
                    if (unlockedKeys.length > 0) {
                        var bestVal = stages[unlockedKeys[0]].ratio || 0;
                        snapKey = unlockedKeys[0];
                        unlockedKeys.forEach(function(k) {
                            if ((stages[k].ratio || 0) > bestVal) {
                                bestVal = stages[k].ratio || 0;
                                snapKey = k;
                            }
                        });
                    }
                    stages[snapKey].ratio = (stages[snapKey].ratio || 0) + drift;
                }

                this.render();
            },

            applyPreset: function(name) {
                var ratios = STAGE_PRESETS[name];
                if (!ratios) return;
                stagesPushUndoImmediate();
                var stages = this.state.project.targetLock.stages;
                Object.keys(ratios).forEach(function(k) {
                    if (stages[k]) { stages[k].ratio = ratios[k]; stages[k].locked = false; }
                });
                this.render();
                this.save();
            },

            toggleLock: function(key) {
                stagesPushUndoImmediate();
                var s = this.state.project.targetLock.stages[key];
                s.locked = !s.locked;
                this.render();
                this.save();
            },

            updateStageDays: function(key, val) {
                stagesPushUndo();
                this.state.project.targetLock.stages[key].days = parseFloat(val) || 0;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            updateStageOffset: function(key, val) {

                this.state.project.targetLock.stages[key].offsetDays = parseFloat(val) || 0;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            syncDays: function(key) {
                var val = validateTimeline(this.state.project, key);
                if (val.maxNeeded > 0) {
                    stagesPushUndoImmediate();
                    this.state.project.targetLock.stages[key].days = val.maxNeeded;

            /* Phase 195: Surgical refresh + debounced save — preserves mobile input focus */
            updateItemDays: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {

            updateItemRate: function(itemId, stageKey, val) {

            /* Multiplier saves immediately — rare input, high persistence value */
            updateItemMultiplier: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    stagesPushUndoImmediate();
                    var _raw = (val === '' || val === null || val === undefined) ? 1 : parseFloat(val);
                    item.stageData[stageKey].multiplier = isNaN(_raw) ? 1 : _raw;
                    _mBTStagesSurgicalRefresh(itemId, stageKey);

            updateCap: function(val) {
                var self = this;
                var next = parseFloat(val) || 0;
                var prev = this.state.project.targetLock.totalCap || 0;
                var applyCap = function() {
                    stagesPushUndo();
                    self.state.project.targetLock.totalCap = next;
                    self.renderSliders();
                    self.renderVitals();
                    self.save();
                };
                /* Warn when replacing an existing cap -- change cascades to every stage segment cap in the main budget */
                if (prev > 0 && next !== prev) {
                    stagesConfirm(
                        'Changing the Budget Cap will update every stage cap in the main budget. Continue?',
                        applyCap,
                        'Budget Cap'
                    );
                    var overlay = document.getElementById('stages-confirm-overlay');

                        var cancelBtn = overlay.querySelector('#stages-confirm-cancel');
                        if (cancelBtn) cancelBtn.addEventListener('click', revertCap);
                        overlay.addEventListener('click', function(e) {

            updateDate: function(type, val) {
                stagesPushUndoImmediate();
                if (type === 'start')    this.state.project.startDate    = val;
                else                     this.state.project.deliveryDate = val;
                this.renderVitals();
                this.renderStageCards();

            },

            bulkAction: function(action) {
                stagesPushUndoImmediate();
                var b    = this.state.project;
                var KEYS = this.state.KEYS;
                if (action === 'lockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = true; });
                    this.render(); this.save();
                } else if (action === 'unlockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = false; });
                    this.render(); this.save();
                } else if (action === 'syncDays') {
                    KEYS.forEach(function(k) {
                        var val = validateTimeline(b, k);
                        if (val.maxNeeded > 0) b.targetLock.stages[k].days = val.maxNeeded;
                    });
                    this.render(); this.save();
                } else if (action === 'dedupe') {
                    /* Remove items assigned to multiple stages that share same description */
                    var seen = {};
                    Object.values(b.sections || {}).forEach(function(sec) {
                        (sec.items || []).forEach(function(item) {
                            var desc = (item.description || '').toLowerCase().trim();
                            if (!item.stageData) return;
                            KEYS.forEach(function(k) {
                                if (!item.stageData[k]) return;
                                var key = desc + '|' + k;
                                if (seen[key]) delete item.stageData[k];
                                else seen[key] = true;
                            });
                        });
                    });
                    this.render(); this.save();
                }
            },

            autoFillAll: function() {
                stagesPushUndoImmediate();
                var b    = this.state.project;
                var tl   = b.targetLock;
                var KEYS = this.state.KEYS;
                Object.values(b.sections || {}).forEach(function(sec) {
                    (sec.items || []).forEach(function(item) {
                        if (!item.stageData) item.stageData = {};
                        var desc   = (item.description || '').toLowerCase();
                        var target = 'prod';
                        if (desc.includes('post') || desc.includes('edit') || desc.includes('vfx') || desc.includes('grade') || desc.includes('color')) target = 'post';
                        else if (desc.includes('pre') || desc.includes('scout') || desc.includes('cast') || desc.includes('rehearsal')) target = 'pre';
                        else if (desc.includes('dev') || desc.includes('script') || desc.includes('option') || desc.includes('treatment')) target = 'dev';
                        else if (desc.includes('dist') || desc.includes('deliver') || desc.includes('master') || desc.includes('dcp')) target = 'dist';
                        if (!item.stageData[target]) {
                            item.stageData[target] = { days: tl.stages[target].days || 1, rate: item.rate || 0, order: 0 };
                        }
                    });
                });
                this.render(); this.save();
            },

            clearAll: function() {
                var self = this;
                stagesConfirm('Clear all stage assignments?', function() {
                    stagesPushUndoImmediate();
                    Object.values(self.state.project.sections || {}).forEach(function(sec) {
                        (sec.items || []).forEach(function(item) { item.stageData = {}; });
                    });
                    self.render(); self.save();
                }, 'Clear All Stages');
            },

            /* ========= Add Item Modal ========= */

            openAddModal: function(stageKey) {
                this.state._modalStage = stageKey;
                var stageTitle = this.state.TITLES[stageKey] || stageKey.toUpperCase();
                dom.getElementById('modal-title').textContent = 'Add to ' + stageTitle;

            _buildModalList: function(term) {
                var b      = this.state.project;
                var sk     = this.state._modalStage;
                var q      = (term || '').toLowerCase();
                var self   = this;

                /* Existing budget items not yet in this stage */
                var existing = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[sk]) return;
                        if (q && !(item.description || '').toLowerCase().includes(q)) return;
                        existing.push({ id: item.id, description: item.description, rate: item.rate, isExisting: true, secName: secName });
                    });
                });

                /* OG rate database */
                var ogFiltered = (this.state.ogItems || []).filter(function(i) {
                    return !q || (i.description || '').toLowerCase().includes(q);
                }).slice(0, 20);

                var all = existing.slice(0, 15).concat(ogFiltered);

                if (!all.length) {
                    dom.getElementById('modal-list').innerHTML = '<div class="p-6 text-center text-[9px] font-black text-slate-300 uppercase tracking-widest">No matches</div>';
                    return;
                }

                dom.getElementById('modal-list').innerHTML = all.map(function(item) {
                    var badge = item.isExisting
                        ? '<span class="text-[7px] font-black text-emerald-600 uppercase tracking-widest">From Budget · ' + esc(item.secName) + '</span>'
                        : '<span class="text-[7px] font-black text-blue-400 uppercase tracking-widest">Rate DB</span>';
                    var action = item.isExisting
                        ? 'mBTStages._assignExisting(\'' + esc(item.id) + '\')'
                        : 'mBTStages._assignFromOG(\'' + esc(item.id) + '\')';
                    return '<div onclick="' + action + '" class="p-3 border-b border-slate-50 bg-white hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors">' +
                        '<div>' +
                            '<div class="text-[11px] font-bold text-slate-700">' + esc(item.description) + '</div>' +
                            badge +
                        '</div>' +
                        '<div class="text-[10px] font-mono font-bold text-slate-500 ml-4 shrink-0">' + fmt(item.rate) + '</div>' +
                    '</div>';
                }).join('');
            },

            _assignExisting: function(itemId) {
                var sk   = this.state._modalStage;
                var item = this._findItem(itemId);
                if (!item) return;
                stagesPushUndoImmediate();
                if (!item.stageData) item.stageData = {};
                item.stageData[sk] = { days: 1, rate: item.rate || 0, order: 0 };
                this.closeAddModal();
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            _assignFromOG: function(ogId) {
                var sk       = this.state._modalStage;
                var b        = this.state.project;
                var ogItem   = (this.state.ogItems || []).find(function(i) { return i.id === ogId; });
                if (!ogItem) return;
                stagesPushUndoImmediate();

                /* Guess target section */
                var secNames = Object.keys(b.sections || {});
                var targetSec = secNames.find(function(s) { return /production/i.test(s); }) || secNames[0];
                if (sk === 'post') targetSec = secNames.find(function(s) { return /post|edit/i.test(s); }) || targetSec;
                if (sk === 'dev')  targetSec = secNames.find(function(s) { return /dev|creative/i.test(s); }) || targetSec;
                if (!targetSec || !b.sections[targetSec]) return;

                var newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),

                    quantity: 1, unit: ogItem.unit || 'Day', multiplier: 1,

                };
                newItem.stageData[sk] = { days: 1, rate: ogItem.rate || 0, order: 0 };
                b.sections[targetSec].items.push(newItem);

                this.closeAddModal();
                this.renderVitals();
                this.renderStageCards();

            },

            addCustomItem: function() {
                var sk   = this.state._modalStage;
                var b    = this.state.project;
                var desc = (dom.getElementById('custom-desc').value || '').trim();
                var rate = parseFloat(dom.getElementById('custom-rate').value) || 0;
                var unit = dom.getElementById('custom-unit').value;
                if (!desc) { dom.getElementById('custom-desc').focus(); return; }
                stagesPushUndoImmediate();

                var secNames  = Object.keys(b.sections || {});
                var targetSec = secNames.find(function(s) { return /production/i.test(s); }) || secNames[0];
                if (sk === 'post') targetSec = secNames.find(function(s) { return /post|edit/i.test(s); }) || targetSec;
                if (sk === 'dev')  targetSec = secNames.find(function(s) { return /dev|creative/i.test(s); }) || targetSec;
                if (!targetSec || !b.sections[targetSec]) return;

                var newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                    description: desc, quantity: 1, unit: unit, multiplier: 1,
                    rate: rate, actual: 0, rateType: 'negotiable', stageData: {}
                };
                newItem.stageData[sk] = { days: 1, rate: rate, order: 0 };
                b.sections[targetSec].items.push(newItem);

                /* Reset form */
                dom.getElementById('custom-desc').value = '';
                dom.getElementById('custom-rate').value = '';
                this.closeAddModal();

            },

            /* ========= Persistence ========= */

            save: function() {
                var self = this;
                if (!self.state.project) return;
                var cleanProject = JSON.parse(JSON.stringify(self.state.project));
                /* Stamp updated_at so the monolith's OPFS/localforage reconciliation picks the newer record */
                cleanProject.updated_at = new Date().toISOString();

                var savePromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    /* Shell bridge: write back to localforage so the shell sees changes.
                       Also mirror to OPFS when available -- the monolith's loader prefers whichever
                       store has the newer updated_at, so both must stay in step. */
                    var parentOPFS = null;
                    try {
                        if (window.parent && window.parent !== window && window.parent.mBTOPFS && window.parent.mBTOPFS.isReady && window.parent.mBTOPFS.isReady()) {
                            parentOPFS = window.parent.mBTOPFS;
                        }
                    } catch (_) { /* cross-origin: ignore */ }
                    var lfP = localforage.setItem(self.state._projectKey, cleanProject);
                    var opfsP = parentOPFS ? parentOPFS.save(self.state._projectKey, cleanProject).catch(function () { return null; }) : Promise.resolve();
                    savePromise = Promise.all([lfP, opfsP]);
                } else if (window.mBT && window.mBT.storage) {
                    savePromise = window.mBT.storage.updateProject(cleanProject);
                } else {
                    return;
                }

                savePromise.then(function() {
                    /* Notify shell to reload budget from storage */
                    var stages = cleanProject.targetLock ? cleanProject.targetLock.stages : {};
                    var msg = { type: 'mbt:tool-action', action: 'reconcile', payload: { stages: stages } };
                    if (window.mBTBridge) window.mBTBridge.send('reconcile', { stages: stages });
                    else if (window.parent !== window) window.parent.postMessage(msg, window.location.origin);
                }).catch(function(err) {
                    console.error('[Stages] Save failed:', err);
                });
            },

            syncFromDb: function() {
                var self = this;
                var loadPromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    loadPromise = localforage.getItem(self.state._projectKey);
                } else if (self.state.projectId && window.mBT && window.mBT.storage) {
                    loadPromise = window.mBT.storage.getProject(self.state.projectId);
                } else { return; }
                loadPromise.then(function(project) {
                    if (project) { self.state.project = project; self.render(); }
                });
            },

            /* ========= Drag and Drop ========= */

            initDragAndDrop: function() {
                var self = this;
                /* Phase 62: read RBAC role from parent's localStorage — if viewer, mount static */
                var rbacRole = 'editor';
                try { rbacRole = localStorage.getItem('mbt_rbac_role') || 'editor'; } catch(_) {}
                var isViewOnly = (rbacRole === 'viewer');

                dom.querySelectorAll('.stage-drop-zone').forEach(function(zone) {
                    var instance = new Sortable(zone, {
                        group: 'stages',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        dragClass: 'sortable-drag',
                        disabled: isViewOnly,  /* Natively kills drag-and-drop for view-only users */
                        onEnd: function(evt) {
                            stagesPushUndoImmediate();
                            var itemId    = evt.item.dataset.id;
                            var fromStage = evt.from.dataset.stage;
                            var toStage   = evt.to.dataset.stage;

                            if (fromStage !== toStage) {
                                var item = self._findItem(itemId);
                                if (item && item.stageData && item.stageData[fromStage]) {
                                    item.stageData[toStage] = Object.assign({}, item.stageData[fromStage]);
                                    delete item.stageData[fromStage];
                                }
                            }

                            /* Persist new order */
                            var itemsInStage = Array.from(evt.to.children).map(function(c) { return c.dataset.id; });
                            itemsInStage.forEach(function(id, idx) {
                                var item = self._findItem(id);
                                if (item && item.stageData && item.stageData[toStage]) item.stageData[toStage].order = idx;
                            });

                            self.renderVitals();
                            self.renderStageCards();
                            self.save();
                        }
                    });
                });
            },

            /* ========= Carousel Grab-Scroll ========= */

            _initCarouselScroll: function() {
                var slider = dom.getElementById('stages-layout');
                var isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', function(e) {
                    if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
                    if (e.target.closest('.stage-item') || e.target.closest('.stage-drop-zone')) return;
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                    slider.style.cursor = 'grabbing';
                });
                slider.addEventListener('mouseleave', function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mouseup',    function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mousemove',  function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    slider.scrollLeft = scrollLeft - (e.pageX - slider.offsetLeft - startX) * 2;
                });
            },

            /* ========= Tab Navigation Bar ========= */

            _initTabBarScrollHint: function() {
                var bar = dom.getElementById('stages-tab-bar');
                var fadeR = dom.getElementById('stages-tab-bar-fade-r');
                if (!bar || !fadeR) return;
                var update = function() {
                    var overflow = bar.scrollWidth > bar.clientWidth + 1;
                    var atEnd = bar.scrollLeft >= bar.scrollWidth - bar.clientWidth - 1;
                    if (overflow && !atEnd) {
                        fadeR.classList.add('visible');
                    } else {
                        fadeR.classList.remove('visible');
                    }
                };
                bar.addEventListener('scroll', update);
                window.addEventListener('resize', update);
                if (typeof ResizeObserver !== 'undefined') {
                    try {
                        var ro = new ResizeObserver(update);
                        ro.observe(bar);
                    } catch (e) { /* ignore */ }
                }
                update();
            },

            _initTabNavigation: function() {
                var self = this;
                var tabs = dom.querySelectorAll('.tab-btn');
                self._tabBtns = tabs;

                /* Tab click handler — looks up panel lazily at click time */
                tabs.forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        var targetPanelId = this.dataset.tab;
                        var targetPanel = dom.getElementById(targetPanelId);
                        if (!targetPanel) return;
                        targetPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        tabs.forEach(function(t) { t.classList.remove('active'); });
                        this.classList.add('active');
                    });
                });

                /* Create IntersectionObserver once — panels attached after cards render via _observeTabPanels() */
                self._tabObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (!entry.isIntersecting) return;
                        var panelId = entry.target.id;
                        if (!panelId) return;
                        self._tabBtns.forEach(function(t) { t.classList.remove('active'); });
                        var tab = dom.querySelector('.tab-btn[data-tab="' + panelId + '"]');
                        if (tab) tab.classList.add('active');
                    });
                }, {
                    root: dom.getElementById('stages-layout'),
                    rootMargin: '0px',
                    threshold: 0.4
                });
            },

            /* Re-attach scroll spy after every renderStageCards call */
            _observeTabPanels: function() {
                if (!this._tabObserver) return;
                var panels = ['panel-setup', 'panel-vitals', 'panel-cashflow', 'dev', 'pre', 'prod', 'post', 'dist'];
                this._tabObserver.disconnect();
                var obs = this._tabObserver;
                panels.forEach(function(id) {
                    var el = dom.getElementById(id);
                    if (el) obs.observe(el);
                });
            },

            /* ========= Utilities ========= */

            _findItem: function(id) {
                var b = this.state.project;
                var found = null;
                Object.values(b.sections || {}).forEach(function(sec) {
                    if (found) return;
                    var item = (sec.items || []).find(function(i) { return i.id === id; });
                    if (item) found = item;
                });
                return found;
            },

            _showError: function(msg) {
                dom.getElementById('stages-layout').innerHTML =
                    '<div class="flex-grow flex items-center justify-center">' +
                        '<div class="text-center">' +
                            '<p class="text-4xl font-black text-slate-200 uppercase tracking-tighter mb-2">Not Connected</p>' +
                            '<p class="text-[11px] font-bold text-slate-400">' + esc(msg) + '</p>' +
                        '</div>' +
                    '</div>';
            }
        };

        window.onload = function() { mBTStages.init(); };
    </script>
</body>
</html>
