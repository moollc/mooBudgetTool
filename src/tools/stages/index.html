<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mooBudgetTool — Stages</title>
    <script src="../../lib/tailwind.min.js"></script>
    <script src="../../core/components/ToolBridge.js"></script>
    <script src="../../core/components/EmbeddedMode.js"></script>
    <script src="../../lib/Sortable.min.js"></script>
    <script src="../../lib/localforage.min.js"></script>
    <script src="../../core/mBT.assets.js"></script>
    <script src="../../core/mBT.templates.js"></script>
    <script src="../../lib/html2pdf.bundle.min.js"></script>
    <script>
        /* Theme Bridge: Instant Inheritance */
        (function() {
            var activeTheme = localStorage.getItem('mbt_active_theme') || 'light';
            document.documentElement.className = 'mbt-theme-' + activeTheme;
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Theme Bridge: Bilateral Architecture */
        .mbt-theme-dark { background-color: #020617; color: white; }
        .mbt-theme-dark .stage-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(24px); border-color: rgba(255, 255, 255, 0.1); }
        .mbt-theme-dark .mbt-header { background-color: #0f172a; border-bottom-color: #1e293b; }
        .mbt-theme-dark #panel-setup { background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); }
        
        .stage-card { background: #fff; border-right: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; position: relative; z-index: 1; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-radius: 16px; }
        .burn-ring { transition: stroke-dashoffset 1s ease-out, stroke 0.5s ease; }
        .conflict-glow { box-shadow: 0 0 20px rgba(245,158,11,0.2); border-color: #f59e0b !important; animation: pulse-amber 2s infinite; }
        @keyframes pulse-amber {
            0%   { box-shadow: 0 0 0 0   rgba(245,158,11,0.4); }
            70%  { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
            100% { box-shadow: 0 0 0 0   rgba(245,158,11,0); }
        }
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }
        .sortable-drag  { cursor: grabbing; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        /* Phase 62: RBAC view-only state — applied via body[data-rbac-role="viewer"] */
        body[data-rbac-role="viewer"] .stage-remove-btn    { display: none !important; }
        body[data-rbac-role="viewer"] .stage-draggable     { cursor: default !important; }
        body[data-rbac-role="viewer"] input                { opacity: 0.45 !important; pointer-events: none !important; }
        body[data-rbac-role="viewer"] #stage-add-btn,
        body[data-rbac-role="viewer"] [onclick*="clearAll"],
        body[data-rbac-role="viewer"] [onclick*="autoFillAll"],
        body[data-rbac-role="viewer"] [onclick*="bulkAction"],
        body[data-rbac-role="viewer"] [onclick*="syncFromDb"] { opacity: 0.4 !important; pointer-events: none !important; }
        .sync-bounce { animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.2,1)} }
        /* Tab Navigation Bar */
        .tab-btn.active { color: #2563eb; background: #dbeafe; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #2563eb; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .tab-btn[data-tab="panel-setup"] { min-width: 70px; }
        .tab-btn[data-tab="panel-vitals"] { min-width: 70px; }
        .tab-btn[data-tab="panel-cashflow"] { min-width: 80px; }
        /* Add-item modal */
        #add-item-modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); }
        #add-item-modal.open { display:flex; }
        /* Responsive shell: fill iframe/viewport, avoid hard clip on narrow widths */
        html, body { width: 100%; height: 100%; min-width: 0; box-sizing: border-box; }
        body { max-width: 100vw; }
        .mbt-header { min-width: 0; width: 100%; }
        /* Tab bar overflow: visible thin scrollbar once 8 tabs exceeded fit */
        #stages-tab-bar-wrap { position: relative; }
        #stages-tab-bar { width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #94a3b8 #f1f5f9; padding-bottom: 1px; }
        #stages-tab-bar::-webkit-scrollbar { height: 5px; }
        #stages-tab-bar::-webkit-scrollbar-track { background: #f1f5f9; }
        #stages-tab-bar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        #stages-tab-bar .tab-btn { flex-shrink: 0; }
        #stages-tab-bar-fade-r { position: absolute; top: 0; right: 0; bottom: 0; width: 32px; pointer-events: none; background: linear-gradient(to right, rgba(248,250,252,0) 0%, #f8fafc 75%); opacity: 0; transition: opacity 0.2s; z-index: 1; }
        #stages-tab-bar-fade-r.visible { opacity: 1; }
        #stages-header-right { min-width: 0; flex-shrink: 1; }
        #active-project-name { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #stages-layout, #stages-skeleton { width: 100%; min-width: 0; }
        /* Cashflow carousel card: wider than siblings so the week table breathes
           (reverted full-overlay per user feedback) */
        #panel-cashflow { min-height: 0; }
        @media (min-width: 720px) {
            #panel-setup { width: min(28vw, 380px) !important; min-width: 280px !important; }
            #panel-vitals { width: min(32vw, 420px) !important; min-width: 300px !important; }
            #panel-cashflow { width: min(72vw, 920px) !important; min-width: 560px !important; }
            #stage-cards-container .stage-card { width: min(26vw, 400px) !important; min-width: 260px !important; }
        }
        @media (max-width: 640px) {
            #stages-tab-bar .tab-btn { min-width: 40px !important; padding-left: 5px; padding-right: 5px; font-size: 8px; }
            #stages-tab-bar .tab-btn[data-tab="panel-setup"],
            #stages-tab-bar .tab-btn[data-tab="panel-vitals"],
            #stages-tab-bar .tab-btn[data-tab="panel-cashflow"] { min-width: 40px !important; }
        }
        @media (max-width: 520px) {
            #active-project-name { max-width: 72px; }
        }
        /* --- Tap targets: 44px minimum for all buttons and links --- */
        button, a { min-height: 44px; }
    </style>
</head>
<body class="bg-slate-50 h-screen w-full min-w-0 max-w-full overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <div class="mbt-header h-12 bg-slate-100 flex items-center justify-between px-4 border-b border-slate-200 shrink-0 z-50 min-w-0 w-full overflow-hidden relative">
        <div id="stages-watermark-wrap" class="absolute pointer-events-none select-none" style="left:176px;right:0;top:0;bottom:0;overflow:hidden;">
            <span id="stages-watermark" aria-hidden="true" class="absolute inset-0 flex items-center justify-start text-slate-300 font-black uppercase whitespace-nowrap" style="font-size:34px;line-height:1;letter-spacing:1px;">Stages</span>
        </div>
        <div id="stages-header-icons" class="flex items-center gap-2 min-w-0 shrink-0 relative z-10">
            <button id="btn-back" aria-label="Close" title="Close" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <button id="btn-stages-undo" disabled title="Undo (Ctrl+Z)" onclick="stagesUndo();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors disabled:opacity-30 disabled:pointer-events-none shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            </button>
            <button id="btn-stages-redo" disabled title="Redo (Ctrl+Y)" onclick="stagesRedo();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors disabled:opacity-30 disabled:pointer-events-none shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            </button>
            <button id="btn-stages-export-pdf" title="Export PDF" onclick="stagesExportPdf();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </button>
        </div>
        <div id="stages-header-right" class="flex items-center gap-3 min-w-0 shrink-0 relative z-10 ml-auto">
            <span id="unsaved-indicator" style="opacity:0;transition:opacity 0.2s;" class="text-[8px] font-black text-amber-600 uppercase tracking-widest shrink-0">&#9679; Unsaved</span>
            <span id="active-project-name" class="text-slate-900 text-[13px] font-black uppercase tracking-tight truncate max-w-[160px] bg-slate-100/90 px-1 rounded relative z-10">—</span>
        </div>
    </div>

    <!-- Sticky Tab Navigation Bar -->
    <div id="stages-tab-bar-wrap" class="sticky top-0 z-40 shrink-0 min-w-0 w-full">
        <div id="stages-tab-bar" class="bg-slate-50 border-b border-slate-200 flex items-center px-4 min-w-0 w-full overflow-x-auto">
            <div class="flex items-center gap-1.5 flex-nowrap shrink-0">
                <button data-tab="panel-setup" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Setup</button>
                <button data-tab="panel-vitals" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Vitals</button>
                <button data-tab="panel-cashflow" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Cashflow</button>
                <button data-tab="dev" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dev</button>
                <button data-tab="pre" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Pre</button>
                <button data-tab="prod" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Prod</button>
                <button data-tab="post" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Post</button>
                <button data-tab="dist" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dist</button>
            </div>
        </div>
        <div id="stages-tab-bar-fade-r" aria-hidden="true"></div>
    </div>

    <!-- Skeleton loader — hidden once project data is rendered -->
    <div id="stages-skeleton" class="flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 gap-3 p-3">
        <div class="animate-pulse min-w-[320px] w-[320px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-2/3"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[340px] w-[340px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[300px] w-[300px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-3/4"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
        </div>
    </div>

    <!-- Main Layout -->
    <div id="stages-layout" class="hidden flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 snap-x snap-mandatory cursor-grab active:cursor-grabbing select-none">

        <!-- Setup Panel -->
        <div id="panel-setup" class="stage-card min-w-[320px] w-[320px] snap-start shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Configuration</span>
                <button onclick="mBTStages.syncFromDb()" aria-label="Sync from budget database" class="text-slate-500 hover:text-blue-400 transition-colors uppercase text-[8px] font-black tracking-widest flex items-center gap-1.5">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Sync
                </button>
            </div>
            <div class="p-6 space-y-8 overflow-y-auto no-scrollbar">
                <!-- Dates -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Start Date</label>
                        <input type="date" id="start-date" aria-label="Project start date" onchange="mBTStages.updateDate('start', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors">
                    </div>
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Delivery Target</label>
                        <input type="date" id="delivery-date" aria-label="Project delivery target date" onchange="mBTStages.updateDate('delivery', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors" id="delivery-date-input">
                    </div>
                </div>
                <!-- Cap -->
                <div>
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Total Cap Limit</label>
                    <div class="flex items-center gap-2 border-b-2 border-slate-700 pb-1">
                        <span class="text-slate-600 text-xl font-black">$</span>
                        <input type="number" id="total-cap" aria-label="Total cap limit" placeholder="0.00" onchange="mBTStages.updateCap(this.value)" class="w-full bg-transparent text-2xl font-black text-slate-900 outline-none placeholder-slate-400">
                    </div>
                </div>
                <!-- Sliders -->
                <div id="preset-sliders" class="space-y-6"></div>
                <!-- Industry Preset -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-2 block">Distribution Model</label>
                    <select id="stages-preset-select" aria-label="Distribution model preset" onchange="mBTStages.applyPreset(this.value); this.value=''" class="w-full bg-slate-800 text-white text-[10px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 cursor-pointer appearance-none">
                        <option value="" disabled selected>Load Industry Preset..</option>
                    </select>
                </div>
                <!-- Bulk Operations -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-3 block">Bulk Operations</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="mBTStages.bulkAction('lockAll')" aria-label="Lock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Lock All</button>
                        <button onclick="mBTStages.bulkAction('unlockAll')" aria-label="Unlock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Unlock All</button>
                        <button onclick="mBTStages.bulkAction('syncDays')" aria-label="Sync stage days to max item days" class="bg-slate-800 hover:bg-amber-600 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Sync Days</button>
                        <button onclick="mBTStages.bulkAction('dedupe')" aria-label="Remove duplicate items across stages" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Dedupe</button>
                        <button onclick="mBTStages.autoFillAll()" aria-label="Auto fill stage assignments" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            Auto Fill
                        </button>
                        <button onclick="mBTStages.clearAll()" aria-label="Clear all stage assignments" class="col-span-2 bg-slate-800 hover:bg-rose-800 text-slate-400 hover:text-rose-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Clear All Stages</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vitals Panel -->
        <div id="panel-vitals" class="stage-card min-w-[340px] w-[340px] snap-center shrink-0">
            <div class="p-4 border-b border-slate-100 shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Project Vital Signs</span>
            </div>
            <div class="p-8 flex flex-col items-center flex-grow overflow-y-auto no-scrollbar">
                <!-- SVG Burn Ring -->
                <div class="relative w-48 h-48 mb-8">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" stroke="#f1f5f9" stroke-width="12" fill="none"/>
                        <circle id="burn-meter" cx="50" cy="50" r="44" stroke="#2563eb" stroke-width="12" fill="none" stroke-dasharray="276.46" stroke-dashoffset="276.46" class="burn-ring" stroke-linecap="round"/>
                        <circle id="actual-burn-meter" cx="50" cy="50" r="36" stroke="#10b981" stroke-width="6" fill="none" stroke-dasharray="226.19" stroke-dashoffset="226.19" class="burn-ring" stroke-linecap="round" style="display:none"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
                        <span id="burn-pct" class="text-4xl font-black text-slate-900 leading-none tracking-tighter truncate w-full px-2 block">0%</span>
                        <span id="burn-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Burn</span>
                    </div>
                </div>
                <!-- Stats -->
                <div class="w-full space-y-2">
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Grand Total</span>
                        <span id="stat-grand-total" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cap Limit</span>
                        <span id="stat-total-cap" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Daily Burn</span>
                        <span id="stat-daily-burn" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Runway</span>
                        <span id="stat-runway" class="text-sm font-black text-slate-900">0 Days</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Risk</span>

    <script>
        /* ========= mBT Stages v24 ========= */
        var dom = document.currentScript ? document.currentScript.getRootNode() : document;
        if (dom === document && window.shadowRoot) dom = window.shadowRoot;

        /* --- XSS Escape --- */
        function esc(str) {
            var d = document.createElement('div');
            d.textContent = String(str || '');
            return d.innerHTML;
        }

        var _stagesDialogEl = null;
        function _stagesRemoveDialog() {
            if (_stagesDialogEl && _stagesDialogEl.parentNode) {
                _stagesDialogEl.parentNode.removeChild(_stagesDialogEl);

        function stagesConfirm(message, onConfirm, title) {

            overlay.innerHTML =

                '<button type="button" id="stages-confirm-cancel" style="padding:8px 14px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">Cancel</button>' +
                '<button type="button" id="stages-confirm-ok" style="padding:8px 16px;border-radius:12px;border:none;background:#e11d48;color:#fff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">Confirm</button>' +

        function stagesAlert(message, title) {
            _stagesRemoveDialog();
            title = title || 'Notice';

            overlay.innerHTML =
                '<div role="dialog" aria-modal="true" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col" style="font-family:inherit;">' +
                '<div class="p-4 border-b border-slate-100">' +
                '<span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;color:#1e293b;">' + esc(title) + '</span>' +
                '</div>' +
                '<div class="p-4">' +
                '<p style="font-size:11px;font-weight:700;color:#64748b;line-height:1.5;margin:0 0 16px;">' + esc(message) + '</p>' +
                '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
                '<button type="button" id="stages-alert-ok" style="padding:8px 16px;border-radius:12px;border:none;background:#2563eb;color:#fff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">OK</button>' +
                '</div></div></div>';
