<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mooBudgetTool — Stages</title>
    <script src="../../lib/tailwind.min.js"></script>
    <script src="../../core/components/ToolBridge.js"></script>
    <script src="../../core/logic/BudgetSafety.js"></script>
    <script src="../../core/components/EmbeddedMode.js"></script>
    <script src="../../lib/Sortable.min.js"></script>
    <script src="../../lib/localforage.min.js"></script>
    <script src="../../scripts/engine/mbtle.js"></script>
    <script src="../../core/mBT.assets.js"></script>
    <script src="../../core/mBT.templates.js"></script>
    <script src="../../core/mBT.batch2.js"></script>
    <script src="../../lib/html2pdf.bundle.min.js"></script>
    <script src="../../core/finance.engine.js"></script>
    <script src="../../scripts/engine/publisher.js"></script>
    <script src="../../core/logic/DocumentProjection.js"></script>
    <script src="../../core/logic/ShootSchedule.js"></script>
    <script>
        /* Theme Bridge: Instant Inheritance */
        (function() {
            var activeTheme = localStorage.getItem('mbt_active_theme') || 'light';
            document.documentElement.className = 'mbt-theme-' + activeTheme;
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Theme Bridge: Bilateral Architecture */
        .mbt-theme-dark { background-color: #020617; color: white; }
        .mbt-theme-dark .stage-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(24px); border-color: rgba(255, 255, 255, 0.1); }
        .mbt-theme-dark .mbt-header { background-color: #0f172a; border-bottom-color: #1e293b; }
        .mbt-theme-dark #panel-setup { background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); }
        
        .stage-card { background: #fff; border-right: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; position: relative; z-index: 1; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-radius: 16px; }
        .burn-ring { transition: stroke-dashoffset 1s ease-out, stroke 0.5s ease; }
        .conflict-glow { box-shadow: 0 0 20px rgba(245,158,11,0.2); border-color: #f59e0b !important; animation: pulse-amber 2s infinite; }
        @keyframes pulse-amber {
            0%   { box-shadow: 0 0 0 0   rgba(245,158,11,0.4); }
            70%  { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
            100% { box-shadow: 0 0 0 0   rgba(245,158,11,0); }
        }
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }
        .sortable-drag  { cursor: grabbing; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        /* Phase 62: RBAC view-only state — applied via body[data-rbac-role="viewer"] */
        body[data-rbac-role="viewer"] .stage-remove-btn    { display: none !important; }
        body[data-rbac-role="viewer"] .stage-draggable     { cursor: default !important; }
        body[data-rbac-role="viewer"] input                { opacity: 0.45 !important; pointer-events: none !important; }
        body[data-rbac-role="viewer"] #stage-add-btn,
        body[data-rbac-role="viewer"] [onclick*="clearAll"],
        body[data-rbac-role="viewer"] [onclick*="autoFillAll"],
        body[data-rbac-role="viewer"] [onclick*="bulkAction"],
        body[data-rbac-role="viewer"] [onclick*="syncFromDb"] { opacity: 0.4 !important; pointer-events: none !important; }
        .sync-bounce { animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.2,1)} }
        /* Tab Navigation Bar */
        .tab-btn.active { color: #2563eb; background: #dbeafe; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #2563eb; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .tab-btn[data-tab="panel-setup"] { min-width: 70px; }
        .tab-btn[data-tab="panel-vitals"] { min-width: 70px; }
        .tab-btn[data-tab="panel-cashflow"] { min-width: 80px; }
        /* Add-item modal */
        #add-item-modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); }
        #add-item-modal.open { display:flex; }
        /* Responsive shell: fill iframe/viewport, avoid hard clip on narrow widths */
        html, body { width: 100%; height: 100%; min-width: 0; box-sizing: border-box; }
        body { max-width: 100vw; }
        .mbt-header { min-width: 0; width: 100%; }
        /* Tab bar overflow: visible thin scrollbar once 8 tabs exceeded fit */
        #stages-tab-bar-wrap { position: relative; }
        #stages-tab-bar { width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #94a3b8 #f1f5f9; padding-bottom: 1px; }
        #stages-tab-bar::-webkit-scrollbar { height: 5px; }
        #stages-tab-bar::-webkit-scrollbar-track { background: #f1f5f9; }
        #stages-tab-bar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
        #stages-tab-bar .tab-btn { flex-shrink: 0; }
        #stages-tab-bar-fade-r { position: absolute; top: 0; right: 0; bottom: 0; width: 32px; pointer-events: none; background: linear-gradient(to right, rgba(248,250,252,0) 0%, #f8fafc 75%); opacity: 0; transition: opacity 0.2s; z-index: 1; }
        #stages-tab-bar-fade-r.visible { opacity: 1; }
        #stages-header-right { min-width: 0; flex-shrink: 1; }
        #active-project-name { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #stages-layout, #stages-skeleton { width: 100%; min-width: 0; }
        /* End space lets the first and last cards reach the viewport center. */
        #stages-layout::before, #stages-layout::after { content: ''; flex-shrink: 0; }
        #stages-layout::before { flex-basis: var(--stage-leading, 0px); }
        #stages-layout::after { flex-basis: var(--stage-trailing, 0px); }
        #stages-layout .stage-card { scroll-snap-align: center; }
        /* Cashflow carousel card: wider than siblings so the week table breathes
           (reverted full-overlay per user feedback) */
        #panel-cashflow { min-height: 0; }
        @media (min-width: 720px) {
            #panel-setup { width: min(28vw, 380px) !important; min-width: 280px !important; }
            #panel-vitals { width: min(32vw, 420px) !important; min-width: 300px !important; }
            #panel-cashflow { width: min(72vw, 920px) !important; min-width: 560px !important; }
            #stage-cards-container .stage-card { width: min(26vw, 400px) !important; min-width: 260px !important; }
        }
        @media (max-width: 640px) {
            #stages-tab-bar .tab-btn { min-width: 40px !important; padding-left: 5px; padding-right: 5px; font-size: 8px; }
            #stages-tab-bar .tab-btn[data-tab="panel-setup"],
            #stages-tab-bar .tab-btn[data-tab="panel-vitals"],
            #stages-tab-bar .tab-btn[data-tab="panel-cashflow"] { min-width: 40px !important; }
        }
        @media (max-width: 520px) {
            #active-project-name { max-width: 72px; }
        }
        /* --- Tap targets: 44px minimum for all buttons and links --- */
        button, a { min-height: 44px; }
    </style>
</head>
<body class="bg-slate-50 h-screen w-full min-w-0 max-w-full overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <div class="mbt-header h-12 bg-slate-100 flex items-center justify-between px-4 border-b border-slate-200 shrink-0 z-50 min-w-0 w-full overflow-hidden relative">
        <div id="stages-watermark-wrap" class="absolute pointer-events-none select-none" style="left:176px;right:0;top:0;bottom:0;overflow:hidden;">
            <span id="stages-watermark" aria-hidden="true" class="absolute inset-0 flex items-center justify-start text-slate-300 font-black uppercase whitespace-nowrap" style="font-size:34px;line-height:1;letter-spacing:1px;">Stages</span>
        </div>
        <div id="stages-header-icons" class="flex items-center gap-2 min-w-0 shrink-0 relative z-10">
            <button id="btn-back" aria-label="Close" title="Close" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <button id="btn-stages-undo" disabled title="Undo (Ctrl+Z)" onclick="stagesUndo();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors disabled:opacity-30 disabled:pointer-events-none shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            </button>
            <button id="btn-stages-redo" disabled title="Redo (Ctrl+Y)" onclick="stagesRedo();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors disabled:opacity-30 disabled:pointer-events-none shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            </button>
            <button id="btn-stages-export-pdf" title="Export PDF" onclick="stagesExportPdf();" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-800 transition-colors shrink-0">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </button>
        </div>
        <div id="stages-header-right" class="flex items-center gap-3 min-w-0 shrink-0 relative z-10 ml-auto">
            <span id="active-project-name" class="text-slate-900 text-[13px] font-black uppercase tracking-tight truncate max-w-[160px] bg-slate-100/90 px-1 rounded relative z-10">—</span>
        </div>
    </div>

    <!-- Sticky Tab Navigation Bar -->
    <div id="stages-tab-bar-wrap" class="sticky top-0 z-40 shrink-0 min-w-0 w-full">
        <div id="stages-tab-bar" class="bg-slate-50 border-b border-slate-200 flex items-center px-4 min-w-0 w-full overflow-x-auto">
            <div class="flex items-center gap-1.5 flex-nowrap shrink-0">
                <button data-tab="panel-setup" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Setup</button>
                <button data-tab="panel-vitals" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Vitals</button>
                <button data-tab="panel-cashflow" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Cashflow</button>
                <button data-tab="dev" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dev</button>
                <button data-tab="pre" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Pre</button>
                <button data-tab="prod" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Prod</button>
                <button data-tab="post" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Post</button>
                <button data-tab="dist" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dist</button>
            </div>
        </div>
        <div id="stages-tab-bar-fade-r" aria-hidden="true"></div>
    </div>

    <!-- Skeleton loader — hidden once project data is rendered -->
    <div id="stages-skeleton" class="flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 gap-3 p-3">
        <div class="animate-pulse min-w-[320px] w-[320px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-2/3"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[340px] w-[340px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[300px] w-[300px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-3/4"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
        </div>
    </div>

    <!-- Main Layout -->
    <div id="stages-layout" class="hidden flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 snap-x snap-mandatory cursor-grab active:cursor-grabbing select-none">

        <!-- Setup Panel -->
        <div id="panel-setup" class="stage-card min-w-[320px] w-[320px] snap-start shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Configuration</span>
                <button onclick="mBTStages.syncFromDb()" aria-label="Sync from budget database" class="text-slate-500 hover:text-blue-400 transition-colors uppercase text-[8px] font-black tracking-widest flex items-center gap-1.5">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Sync
                </button>
            </div>
            <div class="p-6 space-y-8 overflow-y-auto no-scrollbar">
                <!-- Dates -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Start Date</label>
                        <input type="date" id="start-date" aria-label="Project start date" onchange="mBTStages.updateDate('start', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors">
                    </div>
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Delivery Target</label>
                        <input type="date" id="delivery-date" aria-label="Project delivery target date" onchange="mBTStages.updateDate('delivery', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors" id="delivery-date-input">
                    </div>
                </div>
                <!-- Cap -->
                <div>
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Total Cap Limit</label>
                    <div class="flex items-center gap-2 border-b-2 border-slate-700 pb-1">
                        <span class="text-slate-600 text-xl font-black">$</span>
                        <input type="number" id="total-cap" aria-label="Total cap limit" placeholder="0.00" onchange="mBTStages.updateCap(this.value)" class="w-full bg-transparent text-2xl font-black text-slate-900 outline-none placeholder-slate-400">
                    </div>
                </div>
                <!-- Sliders -->
                <div id="preset-sliders" class="space-y-6"></div>
                <!-- Industry Preset -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-2 block">Distribution Model</label>
                    <select id="stages-preset-select" aria-label="Distribution model preset" onchange="mBTStages.applyPreset(this.value); this.value=''" class="w-full bg-slate-800 text-white text-[10px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 cursor-pointer appearance-none">
                        <option value="" disabled selected>Load Industry Preset..</option>
                    </select>
                </div>
                <!-- Bulk Operations -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-3 block">Bulk Operations</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="mBTStages.bulkAction('lockAll')" aria-label="Lock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Lock All</button>
                        <button onclick="mBTStages.bulkAction('unlockAll')" aria-label="Unlock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Unlock All</button>
                        <button onclick="mBTStages.bulkAction('syncDays')" aria-label="Sync stage days to max item days" class="bg-slate-800 hover:bg-amber-600 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Sync Days</button>
                        <button onclick="mBTStages.bulkAction('dedupe')" aria-label="Remove duplicate items across stages" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Dedupe</button>
                        <button onclick="mBTStages.autoFillAll()" aria-label="Auto fill stage assignments" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            Auto Fill
                        </button>
                        <button onclick="mBTStages.clearAll()" aria-label="Clear all stage assignments" class="col-span-2 bg-slate-800 hover:bg-rose-800 text-slate-400 hover:text-rose-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Clear All Stages</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vitals Panel -->
        <div id="panel-vitals" class="stage-card min-w-[340px] w-[340px] snap-center shrink-0">
            <div class="p-4 border-b border-slate-100 shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Project Vital Signs</span>
            </div>
            <div class="p-8 flex flex-col items-center flex-grow overflow-y-auto no-scrollbar">
                <!-- SVG Burn Ring -->
                <div class="relative w-48 h-48 mb-8">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" stroke="#f1f5f9" stroke-width="12" fill="none"/>
                        <circle id="burn-meter" cx="50" cy="50" r="44" stroke="#2563eb" stroke-width="12" fill="none" stroke-dasharray="276.46" stroke-dashoffset="276.46" class="burn-ring" stroke-linecap="round"/>
                        <circle id="actual-burn-meter" cx="50" cy="50" r="36" stroke="#10b981" stroke-width="6" fill="none" stroke-dasharray="226.19" stroke-dashoffset="226.19" class="burn-ring" stroke-linecap="round" style="display:none"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
                        <span id="burn-pct" class="text-4xl font-black text-slate-900 leading-none tracking-tighter truncate w-full px-2 block">0%</span>
                        <span id="burn-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Burn</span>
                    </div>
                </div>
                <!-- Stats -->
                <div class="w-full space-y-2">
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Grand Total</span>
                        <span id="stat-grand-total" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cap Limit</span>
                        <span id="stat-total-cap" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Daily Burn</span>
                        <span id="stat-daily-burn" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Runway</span>

    <script>
        /* ========= mBT Stages v24 ========= */
        var dom = document.currentScript ? document.currentScript.getRootNode() : document;
        if (dom === document && window.shadowRoot) dom = window.shadowRoot;

        /* --- XSS Escape --- */
        function esc(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        var _stagesDialogEl = null;

        function stagesConfirm(message, onConfirm, title) {

                '<button type="button" id="stages-confirm-cancel" style="padding:8px 14px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">Cancel</button>' +
                '<button type="button" id="stages-confirm-ok" style="padding:8px 16px;border-radius:12px;border:none;background:#e11d48;color:#fff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">Confirm</button>' +

        function stagesAlert(message, title) {

                '<div role="dialog" aria-modal="true" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col" style="font-family:inherit;">' +
                '<div class="p-4 border-b border-slate-100">' +
                '<span style="font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;color:#1e293b;">' + esc(title) + '</span>' +
                '</div>' +
                '<div class="p-4">' +
                '<p style="font-size:11px;font-weight:700;color:#64748b;line-height:1.5;margin:0 0 16px;">' + esc(message) + '</p>' +
                '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
                '<button type="button" id="stages-alert-ok" style="padding:8px 16px;border-radius:12px;border:none;background:#2563eb;color:#fff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;font-family:inherit;min-height:44px;">OK</button>' +
                '</div></div></div>';

            _stagesDialogEl = overlay;
            var okBtn = overlay.querySelector('#stages-alert-ok');
            function dismiss() { _stagesRemoveDialog(); }
            okBtn.addEventListener('click', dismiss);
            overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') dismiss(); });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) dismiss(); });

        }

        function _stagesFormatExportDate(d) {
            var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function _stagesCountItems(b, stageKey) {
            var count = 0;
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (item.stageData && item.stageData[stageKey]) count++;
                });
            });
            return count;
        }

        function _stagesSanitizeFilename(name) {
            return String(name || 'document').replace(/[^a-z0-9_\-]/gi, '_');
        }

        function buildStagesExportHtml(b) {
            var metrics = calculateMetrics(b);
            var KEYS = mBTStages.state.KEYS;
            var TITLES = mBTStages.state.TITLES;
            var projectName = (b.projectName && String(b.projectName).trim()) ? String(b.projectName).trim() : 'UNTITLED';
            var today = _stagesFormatExportDate(new Date());
            var actualsCol = metrics.actualsMode
                ? '<th style="padding:8px 10px;text-align:right;border-bottom:2px solid #cbd5e1;">Actual Cost</th>'
                : '';
            var rows = KEYS.map(function(k) {
                var s = (b.targetLock && b.targetLock.stages && b.targetLock.stages[k]) ? b.targetLock.stages[k] : {};
                var days = parseFloat(s.days) || 0;
                var ratio = parseFloat(s.ratio) || 0;
                var stageCap = metrics.totalCap * (ratio / 100);
                var planned = metrics.stageTotals[k] || 0;
                var actual = metrics.stageActuals[k] || 0;
                var itemCount = _stagesCountItems(b, k);
                var actualCell = metrics.actualsMode
                    ? '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(actual)) + '</td>'
                    : '';
                return '<tr>' +
                    '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-weight:700;">' + esc(TITLES[k]) + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + days + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + ratio.toFixed(1) + '%</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(stageCap)) + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(planned)) + '</td>' +
                    actualCell +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + itemCount + '</td>' +
                '</tr>';
            }).join('');
            var actualTotalLine = metrics.actualsMode
                ? '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Actual Total</span><span style="font-weight:700;">' + esc(fmt(metrics.actualTotal)) + '</span></div>'
                : '';
            return '<style>' +
                '.stages-export-wrap{font-family:Helvetica,Arial,sans-serif;font-size:9pt;color:#1e293b;background:#fff;}' +
                '.stages-export-wrap h1{font-size:16pt;margin:0 0 4px;color:#0f172a;}' +
                '.stages-export-wrap .meta{font-size:8pt;color:#64748b;margin-bottom:16px;}' +
                '.stages-export-wrap table{width:100%;border-collapse:collapse;margin-bottom:16px;}' +
                '.stages-export-wrap th{font-size:7pt;text-transform:uppercase;letter-spacing:0.06em;color:#475569;text-align:left;}' +
                '.stages-export-wrap th.num{text-align:right;}' +
                '.stages-export-wrap .totals{border-top:2px solid #cbd5e1;padding-top:8px;}' +
                '</style>' +
                '<div class="stages-export-wrap">' +
                '<h1>' + esc(projectName) + '</h1>' +
                '<div class="meta">Stages Summary &middot; ' + esc(today) + '</div>' +
                '<table>' +
                '<thead><tr>' +
                    '<th>Stage</th>' +
                    '<th class="num">Days</th>' +
                    '<th class="num">Ratio</th>' +
                    '<th class="num">Cap</th>' +
                    '<th class="num">Planned</th>' +
                    actualsCol +
                    '<th class="num">Items</th>' +
                '</tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
                '</table>' +
                '<div class="totals">' +
                    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Total Cap Limit</span><span style="font-weight:700;">' + esc(fmt(metrics.totalCap)) + '</span></div>' +
                    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Grand Total</span><span style="font-weight:700;">' + esc(fmt(metrics.grandTotal)) + '</span></div>' +
                    actualTotalLine +
                '</div></div>';
        }

        function stagesExportPdf() {
            var b = mBTStages.state.project;
            if (!b) {
                stagesAlert('No project loaded.', 'Export PDF');
                return;
            }
            if (typeof window.html2pdf === 'undefined') {
                stagesAlert('PDF export engine (html2pdf) not loaded.', 'Export PDF');
                return;
            }
            var btn = dom.getElementById('btn-stages-export-pdf');
            var origTitle = btn ? btn.title : 'Export PDF';
            if (btn) {
                btn.disabled = true;
                btn.title = 'Exporting...';
            }
            var bodyHtml = buildStagesExportHtml(b);
            var container = document.createElement('div');
            container.setAttribute('data-mbt-pdf-export', '1');
            container.style.cssText = 'position:fixed;left:-10000px;top:0;width:7.2in;background:white;opacity:1;pointer-events:none;';
            container.innerHTML = bodyHtml;
            (dom.body || dom).appendChild(container);
            var fname = _stagesSanitizeFilename(b.projectName) + '-stages-summary.pdf';
            var opts = mBTPublisher.templates._html2pdfOptions(fname, container);
            var done = function() {
                if (btn) {
                    btn.disabled = false;
                    btn.title = origTitle;
                }
            };
            Promise.resolve().then(function() { return mBTPublisher.templates._runHtml2pdf(container, opts, 'save'); }).then(function() {
                if (container.parentNode) container.parentNode.removeChild(container);
                done();
            }).catch(function(err) {
                if (container.parentNode) container.parentNode.removeChild(container);
                console.error('[mBTStages export]', err);
                stagesAlert('PDF export failed: ' + (err.message || 'The renderer could not create this document.') + ' Close this notice and try again.', 'Export PDF');
                done();
            });
        }

        window.stagesExportPdf = stagesExportPdf;

        /* --- Currency Format (display currency from URL param / live mbt:displayCurrency).
           Amounts in the loaded budget are stored in its base currency — convert for display
           using the same live/locked rate table the parent uses (shared localStorage). --- */
        var _syncedRates = null; /* pushed by parent in mbt:displayCurrency payload */
        function fmt(n) {
            var code = (mBTStages && mBTStages.state && mBTStages.state._currency) ? mBTStages.state._currency : 'JMD';
            var base = (mBTStages && mBTStages.state && mBTStages.state.project && mBTStages.state.project.currency) ? mBTStages.state.project.currency : 'JMD';
            var v = parseFloat(n) || 0;
            if (base !== code) {
                var converted = window.mBT.le.convertCurrencyOrNull(v, base, code, mBTStages.state.project);
                if (converted !== null) v = converted;
                else return base + ' ' + v.toLocaleString('en-US') + ' (no exchange rate)';
            }
            try {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: code, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v);
            } catch(e) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v);
            }
        }

        /* STAGE_PRESETS: single source in ../../core/mBT.templates.js (global). */

        /* ========= Logic Engine (ported from mBT-Old.html L2233–L2421) ========= */

        /* Phase 195: Strip timezone offset so browser locale can't shift the day boundary */
        function _normalizeDate(d) {
            var date = new Date(d);
            return new Date(date.getTime() + date.getTimezoneOffset() * 60000);
        }

        /* Phase 195: IO helpers: debounced save only */
        var _mBTStagesSaveTimeout = null;
        var _mBTStagesFollowStageKeys = [];
        function _mBTStagesQueueFollow(stageKey) {
            var qi;
            if (!stageKey) return;
            for (qi = 0; qi < _mBTStagesFollowStageKeys.length; qi++) {
                if (_mBTStagesFollowStageKeys[qi] === stageKey) return;
            }
            _mBTStagesFollowStageKeys.push(stageKey);
        }
        function _mBTStagesDebouncedSave(stageKey) {
            if (stageKey) _mBTStagesQueueFollow(stageKey);
            if (_mBTStagesSaveTimeout) clearTimeout(_mBTStagesSaveTimeout);
            _mBTStagesSaveTimeout = setTimeout(function () {
                mBTStages.save();
            }, 500);
        }

        /* Stages undo/redo: immediate snapshot before discrete mutations; debounced burst for continuous edits */
        var stagesUndoStack = [];
        var stagesRedoStack = [];
        var STAGES_MAX_HISTORY = 50;
        var stagesUndoDebounceTimer = null;
        var stagesUndoBurstSnap = null;

        function stagesCaptureSnapshot() {
            if (!mBTStages || !mBTStages.state || !mBTStages.state.project) return null;
            return { projectKey: mBTStages.state._projectKey || '',
                before: JSON.parse(JSON.stringify(mBTStages.state.project)), after: null };
        }

        function stagesSealSnapshot(snapshot) {
            if (!snapshot) return;
            Promise.resolve().then(function () {
                if (snapshot.projectKey === (mBTStages.state._projectKey || '')) snapshot.after = JSON.parse(JSON.stringify(mBTStages.state.project));
            });
        }

        /* After save mints shoot-day ids, re-seal only the schedule on open undo snapshots.
           Z2: do not copy unrelated live fields (for example a delivery date merged by rebase). */
        function stagesResealAfterIdMint() {
            function touch(snap) {
                if (!snap || !snap.after) return;
                if (snap.projectKey !== (mBTStages.state._projectKey || '')) return;
                var live = mBTStages.state.project;
                if (Object.prototype.hasOwnProperty.call(live, 'shootSchedule')) {
                    snap.after.shootSchedule = JSON.parse(JSON.stringify(live.shootSchedule));
                } else {
                    delete snap.after.shootSchedule;
                }
            }
            stagesUndoStack.forEach(touch);
            if (stagesUndoBurstSnap) touch(stagesUndoBurstSnap);
        }

        function stagesUndoProjection(project, other) {
            var copy = JSON.parse(JSON.stringify(project));
            if (!copy.projectName) copy.projectName = copy.name || copy.id || mBTStages.state._projectKey || 'Stages';
            if (copy.settings) copy.settings = Object.prototype.hasOwnProperty.call(copy.settings, 'workWeek') ? { workWeek: copy.settings.workWeek } : {};
            Object.keys(copy.sections || {}).forEach(function (key) {
                if (!(other.sections && other.sections[key])) return;
                var items = copy.sections[key].items || [], matches = Object.create(null), seen = Object.create(null);
                ((other.sections[key] && other.sections[key].items) || []).forEach(function (item) { matches[item.id] = true; });
                items.forEach(function (item) {
                    if (item.id == null || item.id === '') throw new Error('Undo needs stable line item ids. No data was changed.');
                    if (Object.prototype.hasOwnProperty.call(seen, item.id)) throw new Error('Undo needs unique line item ids. No data was changed.');
                    seen[item.id] = true;
                    if (!matches[item.id]) return;
                    Object.keys(item).forEach(function (field) {
                        if (['id', 'stageData', 'rate', 'baseRate', 'quantity', 'multiplier', 'unit', 'rateType', 'rateSource'].indexOf(field) === -1) delete item[field];
                    });
                });
                copy.sections[key] = { items: items };
            });
            return copy;
        }

        /* After Undo or Redo restored the draft: a line that lost one stage and gained another was moved back or forward.
           Record that as a move (so the budget's live stage is copied, never the old entry) and drop the pending move it
           reverses. A line whose stages changed in any other way drops its pending moves and falls back to the plain diff. */
        function stagesNoteMovesAfterRestore(prev, next) {
            var moves = (mBTStages.state._moves || []).slice(), added = [];
            Object.keys(next.sections || {}).forEach(function (sk) {
                ((next.sections[sk] || {}).items || []).forEach(function (it) {
                    var hit = stagesFindItem(prev, it.id), pk, nk, lost, gained, baseHit, swap;
                    if (!hit) return;
                    pk = Object.keys(hit.item.stageData || {}); nk = Object.keys(it.stageData || {});
                    lost = pk.filter(function (k) { return nk.indexOf(k) < 0; });
                    gained = nk.filter(function (k) { return pk.indexOf(k) < 0; });
                    if (!lost.length && !gained.length) return;
                    swap = lost.length === 1 && gained.length === 1;
                    moves = moves.filter(function (m) {
                        if (m.id !== it.id) return true;
                        return swap ? !(m.from === gained[0] && m.to === lost[0]) : false;
                    });
                    if (swap) {
                        baseHit = mBTStages.state._base ? stagesFindItem(mBTStages.state._base, it.id) : null;
                        added.push({ id: it.id, from: lost[0], to: gained[0], destInBase: !!(baseHit && baseHit.item.stageData && baseHit.item.stageData[gained[0]]) });
                    }
                });
            });
            mBTStages.state._moves = moves.concat(added);
        }

        function stagesRestoreSnapshot(snapshot, destination) {
            if (!snapshot || !snapshot.after || snapshot.projectKey !== (mBTStages.state._projectKey || '')) {
                alert('Undo belongs to a different budget, or its operation is not complete. No data was changed.');
                return false;
            }
            try {
                var live = JSON.parse(JSON.stringify(mBTStages.state.project));
                var before = stagesUndoProjection(snapshot.before, snapshot.after);
                var after = stagesUndoProjection(snapshot.after, snapshot.before);
                var hadName = !!live.projectName;
                if (!hadName) live.projectName = live.name || live.id || mBTStages.state._projectKey || 'Stages';
                var undoRoots = ['sections', 'targetLock', 'settings', 'blackoutDays', 'startDate', 'deliveryDate', 'shootSchedule'];
                var record = mBTBudgetSafety.capture(before, after, undoRoots);
                /* If the seal ran before the mutation (empty sealed diff), rebuild from live so Undo still returns to before. */
                if (!record.fields.length) {
                    before = stagesUndoProjection(snapshot.before, live);
                    after = stagesUndoProjection(live, snapshot.before);
                    record = mBTBudgetSafety.capture(before, after, undoRoots);
                }
                var result = mBTBudgetSafety.restore(record, live);
                if (!result.ok) { alert(result.message); return false; }
                if (!hadName) delete live.projectName;
                var reverse = { projectKey: snapshot.projectKey,
                    before: JSON.parse(JSON.stringify(mBTStages.state.project)), after: JSON.parse(JSON.stringify(live)) };
                stagesNoteMovesAfterRestore(mBTStages.state.project, live);
                mBTStages.state.project = live;
                destination.push(reverse);
                return true;
            } catch (err) { alert(err.message || 'Undo was not applied. No data was changed.'); return false; }
        }

        function stagesPushUndo() {
            if (!stagesUndoDebounceTimer) {
                stagesUndoBurstSnap = stagesCaptureSnapshot();
            }
            clearTimeout(stagesUndoDebounceTimer);
            stagesSealSnapshot(stagesUndoBurstSnap);
            stagesUndoDebounceTimer = setTimeout(function() {
                if (stagesUndoBurstSnap) {
                    stagesUndoStack.push(stagesUndoBurstSnap);
                    stagesUndoBurstSnap = null;
                    if (stagesUndoStack.length > STAGES_MAX_HISTORY) stagesUndoStack.shift();
                    stagesRedoStack = [];
                }
                stagesUndoDebounceTimer = null;
                stagesUpdateUndoUI();
            }, 600);
        }

        function stagesPushUndoImmediate() {
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;
            var snap = stagesCaptureSnapshot();
            if (!snap) return;
            stagesUndoStack.push(snap);
            stagesSealSnapshot(snap);
            if (stagesUndoStack.length > STAGES_MAX_HISTORY) stagesUndoStack.shift();
            stagesRedoStack = [];
            stagesUpdateUndoUI();
        }

        function stagesUndo() {
            if (!stagesUndoStack.length) return;
            if (!stagesRestoreSnapshot(stagesUndoStack[stagesUndoStack.length - 1], stagesRedoStack)) return;
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;
            stagesUndoStack.pop();
            mBTStages.render();
            mBTStages.save();
            stagesUpdateUndoUI();
        }

        function stagesRedo() {
            if (!stagesRedoStack.length) return;
            if (!stagesRestoreSnapshot(stagesRedoStack[stagesRedoStack.length - 1], stagesUndoStack)) return;
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;

            mBTStages.save();

        function stagesUpdateUndoUI() {
            var undoBtn = document.getElementById('btn-stages-undo');
            var redoBtn = document.getElementById('btn-stages-redo');
            if (undoBtn) undoBtn.disabled = stagesUndoStack.length === 0;
            if (redoBtn) redoBtn.disabled = stagesRedoStack.length === 0;
        }

        /* Phase 195: Single source-of-truth cost formula (quantity + TZ-normalised days) */
        function _calculateItemCost(item, stageKey, b) {
            var sd = item.stageData && item.stageData[stageKey];
            if (!sd) return 0;
            var workWeek  = (b.settings && b.settings.workWeek) || 5;
            var blackouts = b.blackoutDays || [];
            var starts    = getStageStartDates(b);
            var grossDays = parseFloat(sd.days) || 0;
            var payable   = starts[stageKey]
                ? computeWorkingDays(grossDays, _normalizeDate(starts[stageKey]), workWeek, blackouts)
                : grossDays;
            var multiplier = (sd.multiplier === undefined || sd.multiplier === null || sd.multiplier === '')
                ? 1 : (parseFloat(sd.multiplier) || 0);
            var qty = parseFloat(item.quantity) || 1;
            return payable * (parseFloat(sd.rate || item.rate) || 0) * multiplier * qty;
        }

        /* Phase 195: Surgical refresh — updates one item's cost span + Vitals without card rebuild */
        function _mBTStagesSurgicalRefresh(itemId, stageKey) {
            var item = mBTStages._findItem(itemId);
            if (!item || !item.stageData || !item.stageData[stageKey]) return;
            var cost = _calculateItemCost(item, stageKey, mBTStages.state.project);
            var costSpan = document.querySelector('[data-cost-for="' + itemId + '"]');
            if (costSpan) costSpan.textContent = fmt(cost);
            if (typeof mBTStages.renderVitals === 'function') mBTStages.renderVitals();
        }

        /* --- Compute payable working days within a date range --- */
        function computeWorkingDays(grossDays, startDate, workWeek, blackouts) {
            if (!workWeek || workWeek >= 7) return grossDays;
            var working = 0;
            var cursor = new Date(startDate);
            for (var i = 0; i < grossDays; i++) {
                var dow = cursor.getDay();
                var dateStr = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0') + '-' + String(cursor.getDate()).padStart(2, '0');
                var isWeekend = (workWeek <= 5 && (dow === 0 || dow === 6)) ||
                                (workWeek === 6 && dow === 0);
                var isBlackout = blackouts && blackouts.indexOf(dateStr) > -1;
                if (!isWeekend && !isBlackout) working++;
                cursor.setDate(cursor.getDate() + 1);
            }
            return working;
        }

        /* --- Build stage start dates for payable-day calculation --- */
        function getStageStartDates(b) {
            var starts = {};
            if (!b || !b.startDate) return starts;
            var cursor = new Date(b.startDate);
            cursor = new Date(cursor.getTime() + cursor.getTimezoneOffset() * 60000);
            var prevStart = null;

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            KEYS.forEach(function(k) {
                var stageData = (b.targetLock && b.targetLock.stages[k]) || {};
                var days = parseFloat(stageData.days) || 0;
                var offset = stageData.offsetDays;
                if (typeof offset === 'number' && prevStart) {
                    cursor = new Date(prevStart);
                    cursor.setDate(cursor.getDate() + offset);
                }
                starts[k] = new Date(cursor);
                prevStart = new Date(cursor);
                cursor = new Date(cursor.getTime() + days * 86400000);
            });
            return starts;
        }

        /* --- calculateMetrics with payable working days --- */
        function calculateMetrics(b) {
            var tl = b.targetLock || { totalCap: 0, stages: {} };
            var workWeek = (b.settings && b.settings.workWeek) || 5;
            var blackouts = b.blackoutDays || [];
            var stageStarts = getStageStartDates(b);
            var result = {
                grandTotal: b.grandTotal || 0,
                stageTotals: { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 },
                stageActuals: { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 },
                actualTotal: b.actualTotal || 0,
                actualsMode: !!b.actualsMode,
                totalCap: tl.totalCap || 0,
                totalDays: 0,
                totalWorkingDays: 0,
                dailyBurn: 0,
                runwayDays: 0
            };

            /* Phase 195: Per-stage cost via source-of-truth formula (quantity + TZ-normalised) */
            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (!item.stageData) return;
                    KEYS.forEach(function(k) {
                        if (item.stageData[k]) {
                            result.stageTotals[k] += _calculateItemCost(item, k, b);
                            result.stageActuals[k] += parseFloat(item.actual) || 0;
                        }
                    });
                });
            });

            KEYS.forEach(function(k) {
                if (tl.stages && tl.stages[k]) {
                    var grossDays = parseFloat(tl.stages[k].days) || 0;
                    result.totalDays += grossDays;
                    result.totalWorkingDays += stageStarts[k] ? computeWorkingDays(grossDays, stageStarts[k], workWeek, blackouts) : grossDays;
                }
            });

            if (result.totalWorkingDays > 0) result.dailyBurn = result.grandTotal / result.totalWorkingDays;
            if (result.dailyBurn > 0) result.runwayDays = result.totalCap / result.dailyBurn;
            return result;
        }

        /* --- getBurnStatus --- */
        function getBurnStatus(current, cap) {
            var pct = cap > 0 ? (current / cap) * 100 : 0;
            if (pct > 100) return { color: 'text-rose-600',  ring: 'border-rose-500',  stroke: '#f43f5e', pct: pct };
            if (pct > 85)  return { color: 'text-amber-500', ring: 'border-amber-400', stroke: '#f59e0b', pct: pct };
            return             { color: 'text-slate-900',  ring: 'border-slate-200', stroke: '#2563eb', pct: pct };
        }

        /* --- validateTimeline --- */
        function validateTimeline(b, stageKey) {
            var maxItemDays = 0;
            var hasItems = false;
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (item.stageData && item.stageData[stageKey]) {
                        hasItems = true;
                        var d = parseFloat(item.stageData[stageKey].days) || 0;
                        if (d > maxItemDays) maxItemDays = d;
                    }
                });
            });
            var userDays = (b.targetLock && b.targetLock.stages[stageKey])
                ? (parseFloat(b.targetLock.stages[stageKey].days) || 0) : 0;
            return {
                isValid:    userDays >= maxItemDays,
                maxNeeded:  maxItemDays,
                current:    userDays,
                delta:      userDays - maxItemDays,
                isBankrupt: hasItems && userDays === 0
            };
        }

        /* ---- Set S0: the Stages tool sends the app only what it changed (stage data on lines, lines it added or removed,
           the stage plan fields, the start and delivery dates). Nothing here replaces the budget's sections. ---- */
        function stagesCopy(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

        function stagesFindItem(target, id) {
            var keys = Object.keys((target && target.sections) || {}), i, j, items;
            for (i = 0; i < keys.length; i++) {
                items = (target.sections[keys[i]] || {}).items || [];
                for (j = 0; j < items.length; j++) {
                    if (items[j] && items[j].id === id) return { key: keys[i], index: j, item: items[j] };
                }
            }
            return null;
        }

        /* A line's stage data is compared and applied one stage at a time and one field at a time (days, rate, multiplier,
           rateOverride, order, anything else in a stage entry). The grid writes into the same objects, so a whole block is
           never sent and never assigned. */
        function stagesLineDelta(baseSD, curSD) {
            var b = baseSD || {}, c = curSD || {}, out = { stages: {}, removedStages: [] }, any = false;
            Object.keys(c).forEach(function (sk) {
                var cb = b[sk], cc = c[sk], f = {}, del = [], ch = false;
                /* A stage new to the Stages base is sent only as a whole entry to be created. It is written only if the
                   budget does not have that stage; if the grid already has it, it is left untouched. */
                if (!cb) { out.stages[sk] = { isNew: true, fields: {}, deleted: [], full: stagesCopy(cc) }; any = true; return; }
                Object.keys(cc).forEach(function (fk) { if (JSON.stringify(cc[fk]) !== JSON.stringify(cb[fk])) { f[fk] = stagesCopy(cc[fk]); ch = true; } });
                Object.keys(cb).forEach(function (fk) { if (!Object.prototype.hasOwnProperty.call(cc, fk)) { del.push(fk); ch = true; } });
                /* A stage that existed in the base is sent as changed fields only, never as a whole entry. */
                if (ch) { out.stages[sk] = { fields: f, deleted: del }; any = true; }
            });
            Object.keys(b).forEach(function (sk) { if (!Object.prototype.hasOwnProperty.call(c, sk)) { out.removedStages.push(sk); any = true; } });
            return any ? out : null;
        }
        /* Apply one line's change onto a line object. Returns how many entries had nowhere to go (a stage the budget no
           longer has). A move builds the destination from the live source stage on the target, then removes the source.
           A move into a stage that was not in the Stages base is skipped if the target already has that stage (the grid
           added it): nothing is assigned, the source is kept, and the field changes for that stage are not written. */
        function stagesApplyLine(item, l) {
            var sk, f, skipped = 0, movedAway = {};
            if (!item.stageData || typeof item.stageData !== 'object') item.stageData = {};
            (l.moves || []).forEach(function (m) {
                var src = item.stageData[m.from];
                if (!src) { skipped++; movedAway[m.to] = true; return; }
                if (m.destInBase === false && item.stageData[m.to]) { skipped++; movedAway[m.to] = true; return; }
                item.stageData[m.to] = stagesCopy(src);
                delete item.stageData[m.from];
            });
            for (sk in l.stages) {
                if (!Object.prototype.hasOwnProperty.call(l.stages, sk)) continue;
                if (movedAway[sk]) continue;
                if (l.stages[sk].isNew) { if (!item.stageData[sk]) item.stageData[sk] = stagesCopy(l.stages[sk].full); continue; }
                if (!item.stageData[sk]) { skipped++; continue; }
                for (f in l.stages[sk].fields) { if (Object.prototype.hasOwnProperty.call(l.stages[sk].fields, f)) item.stageData[sk][f] = stagesCopy(l.stages[sk].fields[f]); }
                (l.stages[sk].deleted || []).forEach(function (df) { delete item.stageData[sk][df]; });
            }
            (l.removedStages || []).forEach(function (sk2) { delete item.stageData[sk2]; });
            return skipped;
        }

        /* What changed in cur since base. Lines are matched by id. Stage fields are compared one by one, so a field changed
           somewhere else (for example the calendar's days) is not sent back unless Stages itself changed it. */
        function stagesDelta(base, cur, followKeys, moves) {
            var d = { lines: [], added: [], removed: [], targetLock: null, follow: (followKeys || []).slice() };
            var baseItems = {}, seen = {}, movesById = {}, bt, ct, bs, cs, tl, changed = false;
            (moves || []).forEach(function (m) { (movesById[m.id] = movesById[m.id] || []).push(m); });
            base = base || {}; cur = cur || {};
            Object.keys(base.sections || {}).forEach(function (sk) {
                ((base.sections[sk] || {}).items || []).forEach(function (it) { if (it && it.id != null && it.id !== '') baseItems[it.id] = it; });
            });
            Object.keys(cur.sections || {}).forEach(function (sk) {
                ((cur.sections[sk] || {}).items || []).forEach(function (it) {
                    var b, ld, sim, applied;
                    if (!it || it.id == null || it.id === '') return;
                    seen[it.id] = true;
                    b = baseItems[it.id];
                    if (!b) d.added.push({ sectionKey: sk, sectionId: cur.sections[sk].id, item: stagesCopy(it) });
                    else {
                        /* A drag between stages is its own change: the destination is built from the live source stage on the budget. */
                        sim = stagesCopy(b.stageData || {}); applied = [];
                        (movesById[it.id] || []).forEach(function (m) {
                            if (sim[m.from]) { sim[m.to] = stagesCopy(sim[m.from]); delete sim[m.from]; applied.push({ from: m.from, to: m.to, destInBase: m.destInBase }); }
                        });
                        ld = stagesLineDelta(sim, it.stageData);
                        if (applied.length || ld) d.lines.push({ id: it.id, moves: applied, stages: ld ? ld.stages : {}, removedStages: ld ? ld.removedStages : [] });
                    }
                });
            });
            Object.keys(baseItems).forEach(function (id) { if (!seen[id]) d.removed.push(id); });
            bt = base.targetLock || {}; ct = cur.targetLock || {};
            tl = { fields: {}, deleted: [], stages: {} };
            Object.keys(ct).forEach(function (k) {
                if (k === 'stages') return;
                if (JSON.stringify(ct[k]) !== JSON.stringify(bt[k])) { tl.fields[k] = stagesCopy(ct[k]); changed = true; }
            });
            Object.keys(bt).forEach(function (k) { if (k !== 'stages' && !Object.prototype.hasOwnProperty.call(ct, k)) { tl.deleted.push(k); changed = true; } });
            bs = bt.stages || {}; cs = ct.stages || {};
            Object.keys(cs).forEach(function (sk) {
                var b = bs[sk], c = cs[sk], f = {}, del = [], ch = false;
                if (!b) { tl.stages[sk] = { fields: stagesCopy(c), deleted: [], full: stagesCopy(c) }; changed = true; return; }
                Object.keys(c).forEach(function (fk) { if (JSON.stringify(c[fk]) !== JSON.stringify(b[fk])) { f[fk] = stagesCopy(c[fk]); ch = true; } });
                Object.keys(b).forEach(function (fk) { if (!Object.prototype.hasOwnProperty.call(c, fk)) { del.push(fk); ch = true; } });
                if (ch) { tl.stages[sk] = { fields: f, deleted: del, full: stagesCopy(c) }; changed = true; }
            });

            if (cur.startDate !== base.startDate) d.startDate = cur.startDate;
            if (cur.deliveryDate !== base.deliveryDate) d.deliveryDate = cur.deliveryDate;

               days and the tool now holds none (explicit clear, including a missing key after Undo).

            (function () {

                var baseHas = Object.prototype.hasOwnProperty.call(base, 'shootSchedule');
                var curList = curHas && Array.isArray(cur.shootSchedule) ? cur.shootSchedule : null;
                var baseList = baseHas && Array.isArray(base.shootSchedule) ? base.shootSchedule : null;
                var baseHadDays = !!(baseList && baseList.length);
                var curDays = curList && curList.length ? curList : null;
                var curEmpty = curHas && Array.isArray(cur.shootSchedule) && cur.shootSchedule.length === 0;
                if (curDays) {

                Object.prototype.hasOwnProperty.call(d, 'startDate') || Object.prototype.hasOwnProperty.call(d, 'deliveryDate') ||
                Object.prototype.hasOwnProperty.call(d, 'shootSchedule'));
            return d;
        }

        /* Put a delta onto a budget object (the stored copy when standalone, the tool's own base after a save). Lines that
           are no longer there are counted in skipped, never recreated. */
        function applyStagesDelta(target, d) {
            var skipped = 0, k, t, f;
            if (!target.sections) target.sections = {};
            (d.lines || []).forEach(function (l) {
                var hit = stagesFindItem(target, l.id);
                if (hit) skipped += stagesApplyLine(hit.item, l); else skipped++;
            });
            (d.added || []).forEach(function (a) {
                var sec;
                if (!a.item || stagesFindItem(target, a.item.id)) return;
                sec = target.sections[a.sectionKey];
                if (!sec) sec = target.sections[a.sectionKey] = { id: a.sectionId || a.sectionKey, isOpen: true, items: [] };
                if (!sec.items) sec.items = [];
                sec.items.push(stagesCopy(a.item));
            });
            (d.removed || []).forEach(function (id) {
                var hit = stagesFindItem(target, id);
                if (hit) target.sections[hit.key].items.splice(hit.index, 1);
            });
            t = d.targetLock;
            if (t) {
                if (!target.targetLock) target.targetLock = { enabled: true, totalCap: 0, stages: {} };
                if (!target.targetLock.stages) target.targetLock.stages = {};
                for (k in t.fields) { if (Object.prototype.hasOwnProperty.call(t.fields, k)) target.targetLock[k] = stagesCopy(t.fields[k]); }
                (t.deleted || []).forEach(function (dk) { delete target.targetLock[dk]; });
                for (k in t.stages) {
                    if (!Object.prototype.hasOwnProperty.call(t.stages, k)) continue;
                    if (!target.targetLock.stages[k]) { target.targetLock.stages[k] = stagesCopy(t.stages[k].full); continue; }
                    for (f in t.stages[k].fields) { if (Object.prototype.hasOwnProperty.call(t.stages[k].fields, f)) target.targetLock.stages[k][f] = stagesCopy(t.stages[k].fields[f]); }
                    (t.stages[k].deleted || []).forEach(function (df) { delete target.targetLock.stages[k][df]; });
                }
            }

            if (Object.prototype.hasOwnProperty.call(d, 'deliveryDate')) target.deliveryDate = d.deliveryDate;
            if (Object.prototype.hasOwnProperty.call(d, 'shootSchedule') && Array.isArray(d.shootSchedule)) {
                if (window.mBTShootSchedule && typeof window.mBTShootSchedule.normalise === 'function') {

                    if (typeof window.mBTShootSchedule.ensureIds === 'function') window.mBTShootSchedule.ensureIds(target);
                } else {
                    target.shootSchedule = stagesCopy(d.shootSchedule);
                }
            }
            return { target: target, skipped: skipped };
        }

        /* A save that did not land is said out loud and the draft stays on screen. Text only. */
        function stagesShowNotice(message, kind) {
            var el = document.getElementById('stages-save-notice'), btn;
            if (!el) {
                el = document.createElement('div');
                el.id = 'stages-save-notice';
                el.setAttribute('role', 'alert');
                el.style.cssText = 'position:sticky;top:0;z-index:60;background:#fef3c7;color:#92400e;border-bottom:1px solid #fcd34d;padding:8px 12px;font-size:12px;font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;';
                el.appendChild(document.createElement('span'));

                btn.setAttribute('data-kind', 'failure');
                btn.style.cssText = 'background:#92400e;color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer;';

        /* After a good save only a failure banner goes away. A note the user has not closed stays until closed. */

        function stagesNextStamp(previous) {
            var now = new Date().toISOString();

        function _mBTStagesApplyFollowHeaders(project) {

                    }

        /* Phase 109.1: Weekend-skipping day counter — respects workWeek setting */
        function addWorkDays(startDate, days, workWeek) {
            var date = new Date(startDate);

            while (count < days) {

            return date;
        }

        /* --- calculateTimeline (Phase 3.3 overrun + TZ fix + Phase 50C offsetDays) --- */
        function calculateTimeline(b) {
            var timeline = {};
            var baseDate = new Date(b.startDate || new Date());
            /* Timezone offset fix — prevents "yesterday" bug on pure date strings */
            baseDate = new Date(baseDate.getTime() + baseDate.getTimezoneOffset() * 60000);

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            var prevStart = null;

            KEYS.forEach(function(k) {
                var days = (b.targetLock && b.targetLock.stages[k])
                    ? (parseFloat(b.targetLock.stages[k].days) || 0) : 0;
                var offsetDays = (b.targetLock && b.targetLock.stages[k] && b.targetLock.stages[k].offsetDays !== undefined)
                    ? parseFloat(b.targetLock.stages[k].offsetDays) : null;

                var start;
                if (k === 'dev' || offsetDays === null) {
                    /* Waterfall: first stage starts at baseDate, others start after previous end */
                    if (k === 'dev') {
                        start = new Date(baseDate);
                    } else if (prevStart !== null) {
                        var prevStage = timeline[KEYS[KEYS.indexOf(k) - 1]];
                        start = new Date((prevStage && prevStage.end) || baseDate);
                    } else {
                        start = new Date(baseDate);
                    }
                } else {
                    /* Overlap: start relative to previous stage's start + offsetDays */
                    start = new Date(prevStart);
                    start.setDate(start.getDate() + offsetDays);
                }

                var workWeek = (b.settings && b.settings.workWeek) || 7;
                var end = (days > 0 && workWeek < 7) ? addWorkDays(start, days, workWeek) : new Date(start.getTime() + days * 86400000);
                var fmtD  = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
                timeline[k] = { start: start, end: end, label: days > 0 ? (fmtD(start) + ' – ' + fmtD(end)) : 'SCHEDULE TBD' };

                prevStart = new Date(start);
            });

            /* Phase 200: Universal Projection & Ghost Target computation */
            var cursor = timeline.dist && timeline.dist.end ? timeline.dist.end : baseDate;
            var targetAdj;
            var isEstimated = false;
            if (b.deliveryDate) {
                var target    = new Date(b.deliveryDate);
                targetAdj = new Date(target.getTime() + target.getTimezoneOffset() * 60000);
            } else {
                targetAdj = new Date(cursor);
                isEstimated = true;
            }
            var diffDays  = b.deliveryDate ? Math.ceil((targetAdj - cursor) / 86400000) : 0;
            var status    = isEstimated ? 'ESTIMATED' : (diffDays < 0 ? 'OVERDUE' : (diffDays < 7 ? 'Tight' : 'On Track'));
            var color     = isEstimated ? 'text-slate-400 opacity-60 italic' : (diffDays < 0 ? 'text-rose-600' : (diffDays < 7 ? 'text-amber-500' : 'text-emerald-500'));
            var ring      = isEstimated ? 'border-dashed border-slate-300' : (diffDays < 0 ? 'border-rose-500' : (diffDays < 7 ? 'border-amber-400' : 'border-slate-100'));
            timeline._analysis = {
                projectedEnd: cursor,
                targetDate: targetAdj,
                variance: diffDays,
                status: status,
                color: color,
                ring: ring,
                isEstimated: isEstimated
            };
            return timeline;
        }

        /* --- calculateCashflow: week-relative draw schedule ---
         * Project Week 1 starts at the earliest stage start. Each stage's planned
         * cost is spread evenly per calendar day of its span, then bucketed into
         * 7-day weeks. Stages may overlap (offsetDays), so a week can sum daily
         * rates from multiple stages into the same byStage bucket. */
        function calculateCashflow(b) {
            var metrics = calculateMetrics(b);
            var timeline = calculateTimeline(b);
            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            var MS_DAY = 86400000;

            function emptyByStage() {
                return { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 };
            }

            var projectStart = null;
            var projectEnd = null;
            var active = [];
            var unscheduledTotal = 0;
            var unscheduledStages = [];
            var i, k, t, spanDays, planned, actual;

            for (i = 0; i < KEYS.length; i++) {
                k = KEYS[i];
                t = timeline[k];
                if (!t || !t.start || !t.end) continue;
                spanDays = Math.round((t.end.getTime() - t.start.getTime()) / MS_DAY);
                if (spanDays <= 0) {
                    planned = metrics.stageTotals[k] || 0;
                    if (planned > 0) {
                        unscheduledTotal += planned;
                        unscheduledStages.push(k);
                    }
                    continue;
                }
                planned = metrics.stageTotals[k] || 0;
                actual = metrics.stageActuals[k] || 0;
                active.push({
                    key: k,
                    start: t.start,
                    end: t.end,
                    spanDays: spanDays,
                    planned: planned,
                    actual: actual
                });
                if (!projectStart || t.start.getTime() < projectStart.getTime()) {
                    projectStart = new Date(t.start.getTime());
                }
                if (!projectEnd || t.end.getTime() > projectEnd.getTime()) {
                    projectEnd = new Date(t.end.getTime());
                }
            }

            if (!active.length) {
                return {
                    weeks: [],
                    grandTotal: 0,
                    actualGrandTotal: 0,
                    stageTotalsSum: 0,
                    actualsMode: metrics.actualsMode,
                    totalCap: metrics.totalCap,
                    projectStart: null,
                    projectEnd: null,
                    weekCount: 0,
                    unscheduledTotal: unscheduledTotal,
                    unscheduledStages: unscheduledStages
                };
            }

            var totalSpanDays = Math.round((projectEnd.getTime() - projectStart.getTime()) / MS_DAY);
            var weekCount = Math.max(1, Math.ceil(totalSpanDays / 7));
            var weeks = [];
            for (i = 0; i < weekCount; i++) {
                weeks.push({
                    weekNumber: i + 1,
                    total: 0,
                    byStage: emptyByStage(),
                    actualTotal: 0,
                    actualByStage: emptyByStage()
                });
            }

            var stageTotalsSum = 0;
            var si, d, dayMs, daysSince, weekIdx, dailyPlanned, dailyActual, remainderPlanned, remainderActual;

            for (si = 0; si < active.length; si++) {
                var stage = active[si];
                stageTotalsSum += stage.planned;
                dailyPlanned = stage.planned / stage.spanDays;
                dailyActual = stage.actual / stage.spanDays;
                /* Assign exact remainder on the last day so week sums stay conservative */
                remainderPlanned = stage.planned;
                remainderActual = stage.actual;
                for (d = 0; d < stage.spanDays; d++) {
                    dayMs = stage.start.getTime() + d * MS_DAY;
                    daysSince = Math.floor((dayMs - projectStart.getTime()) / MS_DAY);
                    if (daysSince < 0) daysSince = 0;
                    weekIdx = Math.floor(daysSince / 7);
                    while (weekIdx >= weeks.length) {
                        weeks.push({
                            weekNumber: weeks.length + 1,
                            total: 0,
                            byStage: emptyByStage(),
                            actualTotal: 0,
                            actualByStage: emptyByStage()
                        });
                    }
                    var addP, addA;
                    if (d === stage.spanDays - 1) {
                        addP = remainderPlanned;
                        addA = remainderActual;
                    } else {
                        addP = dailyPlanned;
                        addA = dailyActual;
                        remainderPlanned -= addP;
                        remainderActual -= addA;
                    }
                    weeks[weekIdx].byStage[stage.key] += addP;
                    weeks[weekIdx].total += addP;
                    if (metrics.actualsMode) {
                        weeks[weekIdx].actualByStage[stage.key] += addA;
                        weeks[weekIdx].actualTotal += addA;
                    }
                }
            }

            var grandTotal = 0;
            var actualGrandTotal = 0;
            for (i = 0; i < weeks.length; i++) {
                grandTotal += weeks[i].total;
                actualGrandTotal += weeks[i].actualTotal;
            }

            return {
                weeks: weeks,
                grandTotal: grandTotal,
                actualGrandTotal: actualGrandTotal,
                stageTotalsSum: stageTotalsSum,
                actualsMode: metrics.actualsMode,
                totalCap: metrics.totalCap,
                projectStart: projectStart,
                projectEnd: projectEnd,
                weekCount: weeks.length,
                unscheduledTotal: unscheduledTotal,
                unscheduledStages: unscheduledStages
            };
        }

        /* Dev-only test export: exposes pure calc functions for tests/stages-test-suite.js.
           No behavior change to the tool itself. */
        window.mBTStagesCalc = {
            calculateMetrics: calculateMetrics,
            calculateTimeline: calculateTimeline,

        };

        /* --- analyzeRisk --- */
        function analyzeRisk(metrics, timeline) {
            if (!timeline || !timeline._analysis) return null;
            var variance = timeline._analysis.variance;
            if (variance >= 0) return null;

            var daysLate      = Math.abs(variance);
            var delayCost     = metrics.dailyBurn * daysLate;
            var projectedTotal = metrics.grandTotal + delayCost;
            var cap           = metrics.totalCap || 0;
            var isCritical    = cap > 0 && projectedTotal > cap;

            return {
                status:         isCritical ? 'CRITICAL' : 'WARNING',
                daysLate:       daysLate,
                dailyBurn:      metrics.dailyBurn,
                cost:           delayCost,
                projectedTotal: projectedTotal,
                message:        isCritical ? 'INSOLVENCY RISK' : 'DELAY COST',
                subMessage:     isCritical
                    ? ('Projected ' + fmt(projectedTotal) + ' exceeds Cap')
                    : ('Est. Penalty: ' + fmt(delayCost))
            };
        }

                window.addEventListener('message', function(e) {

                    if (typeof mBTStages.renderSliders    === 'function') mBTStages.renderSliders();

                });

                /* Back button */
                dom.getElementById('btn-back').addEventListener('click', function() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'mbt:tool-action', action: 'close-tool' }, window.location.origin);
    } else {
