        function _stagesFormatExportDate(d) {
            var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function _stagesCountItems(b, stageKey) {
            var count = 0;
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (item.stageData && item.stageData[stageKey]) count++;
                });
            });
            return count;
        }

        function _stagesSanitizeFilename(name) {
            return String(name || 'document').replace(/[^a-z0-9_\-]/gi, '_');
        }

        function buildStagesExportHtml(b) {
            var metrics = calculateMetrics(b);
            var KEYS = mBTStages.state.KEYS;
            var TITLES = mBTStages.state.TITLES;
            var projectName = (b.projectName && String(b.projectName).trim()) ? String(b.projectName).trim() : 'UNTITLED';
            var today = _stagesFormatExportDate(new Date());
            var actualsCol = metrics.actualsMode
                ? '<th style="padding:8px 10px;text-align:right;border-bottom:2px solid #cbd5e1;">Actual Cost</th>'
                : '';
            var rows = KEYS.map(function(k) {
                var s = (b.targetLock && b.targetLock.stages && b.targetLock.stages[k]) ? b.targetLock.stages[k] : {};
                var days = parseFloat(s.days) || 0;
                var ratio = parseFloat(s.ratio) || 0;
                var stageCap = metrics.totalCap * (ratio / 100);
                var planned = metrics.stageTotals[k] || 0;
                var actual = metrics.stageActuals[k] || 0;
                var itemCount = _stagesCountItems(b, k);
                var actualCell = metrics.actualsMode
                    ? '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(actual)) + '</td>'
                    : '';
                return '<tr>' +
                    '<td style="padding:8px 10px;border-bottom:1px solid #e2e8f0;font-weight:700;">' + esc(TITLES[k]) + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + days + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + ratio.toFixed(1) + '%</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(stageCap)) + '</td>' +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + esc(fmt(planned)) + '</td>' +
                    actualCell +
                    '<td style="padding:8px 10px;text-align:right;border-bottom:1px solid #e2e8f0;">' + itemCount + '</td>' +
                '</tr>';
            }).join('');
            var actualTotalLine = metrics.actualsMode
                ? '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Actual Total</span><span style="font-weight:700;">' + esc(fmt(metrics.actualTotal)) + '</span></div>'
                : '';
            return '<style>' +
                '.stages-export-wrap{font-family:Helvetica,Arial,sans-serif;font-size:9pt;color:#1e293b;background:#fff;}' +
                '.stages-export-wrap h1{font-size:16pt;margin:0 0 4px;color:#0f172a;}' +
                '.stages-export-wrap .meta{font-size:8pt;color:#64748b;margin-bottom:16px;}' +
                '.stages-export-wrap table{width:100%;border-collapse:collapse;margin-bottom:16px;}' +
                '.stages-export-wrap th{font-size:7pt;text-transform:uppercase;letter-spacing:0.06em;color:#475569;text-align:left;}' +
                '.stages-export-wrap th.num{text-align:right;}' +
                '.stages-export-wrap .totals{border-top:2px solid #cbd5e1;padding-top:8px;}' +
                '</style>' +
                '<div class="stages-export-wrap">' +
                '<h1>' + esc(projectName) + '</h1>' +
                '<div class="meta">Stages Summary &middot; ' + esc(today) + '</div>' +
                '<table>' +
                '<thead><tr>' +
                    '<th>Stage</th>' +
                    '<th class="num">Days</th>' +
                    '<th class="num">Ratio</th>' +
                    '<th class="num">Cap</th>' +
                    '<th class="num">Planned</th>' +
                    actualsCol +
                    '<th class="num">Items</th>' +
                '</tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
                '</table>' +
                '<div class="totals">' +
                    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Total Cap Limit</span><span style="font-weight:700;">' + esc(fmt(metrics.totalCap)) + '</span></div>' +
                    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="font-weight:700;">Grand Total</span><span style="font-weight:700;">' + esc(fmt(metrics.grandTotal)) + '</span></div>' +
                    actualTotalLine +
                '</div></div>';
        }

        function stagesExportPdf() {
            var b = mBTStages.state.project;
            if (!b) {
                stagesAlert('No project loaded.', 'Export PDF');
                return;
            }
            if (typeof window.html2pdf === 'undefined') {
                stagesAlert('PDF export engine (html2pdf) not loaded.', 'Export PDF');
                return;
            }
            var btn = document.getElementById('btn-stages-export-pdf');
            var origTitle = btn ? btn.title : 'Export PDF';
            if (btn) {
                btn.disabled = true;
                btn.title = 'Exporting...';
            }
            var bodyHtml = buildStagesExportHtml(b);
            var container = document.createElement('div');
            container.style.cssText = 'position:fixed;left:0;top:0;width:8.5in;background:white;opacity:0;pointer-events:none;z-index:9999;';
            container.innerHTML = bodyHtml;
            document.body.appendChild(container);
            var fname = _stagesSanitizeFilename(b.projectName) + '-stages-summary.pdf';
            var opts = {
                margin: [0.65, 0.65, 0.65, 0.65],
                filename: fname,
                image: { type: 'jpeg', quality: 0.97 },
                html2canvas: { scale: 2, useCORS: false, logging: false },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            var done = function() {
                if (btn) {
                    btn.disabled = false;
                    btn.title = origTitle;
                }
            };
            html2pdf().set(opts).from(container).save().then(function() {
                if (document.body.contains(container)) document.body.removeChild(container);
                done();
            }).catch(function(err) {
                if (document.body.contains(container)) document.body.removeChild(container);
                console.error('[mBTStages export]', err);
                stagesAlert('Export failed. Please try again.', 'Export PDF');
                done();
            });
        }

        window.stagesExportPdf = stagesExportPdf;

        /* --- Currency Format (display currency from URL param / live mbt:displayCurrency).
           Amounts in the loaded budget are stored in its base currency — convert for display
           using the same live/locked rate table the parent uses (shared localStorage). --- */
        var _syncedRates = null; /* pushed by parent in mbt:displayCurrency payload */
        function _rateTable() {
            if (_syncedRates) return _syncedRates;
            /* Same-origin parent: ask its currency engine directly */
            try {
                if (window.parent && window.parent !== window && window.parent.mBT &&
                    window.parent.mBT.logic && window.parent.mBT.logic.currency) {
                    return window.parent.mBT.logic.currency._getRates();
                }
            } catch (e) { }
            try {
                if (localStorage.getItem('prodBudget_v5_ratesLocked') === 'true') {
                    var snap = localStorage.getItem('prodBudget_v5_ratesLockedSnap');
                    if (snap) return JSON.parse(snap);
                }
                var live = localStorage.getItem('prodBudget_v5_rates');
                if (live) return JSON.parse(live);
            } catch (e) { }
            return null;
        }
        function fmt(n) {
            var code = (mBTStages && mBTStages.state && mBTStages.state._currency) ? mBTStages.state._currency : 'JMD';
            var base = (mBTStages && mBTStages.state && mBTStages.state.project && mBTStages.state.project.currency) ? mBTStages.state.project.currency : 'JMD';
            var v = parseFloat(n) || 0;
            if (base !== code) {
                var rates = _rateTable();
                if (rates && rates[base] && rates[code]) v = v / rates[base] * rates[code];
            }
            try {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: code, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v);
            } catch(e) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v);
            }
        }

        /* STAGE_PRESETS: single source in ../../core/mBT.templates.js (global). */

        /* ========= Logic Engine (ported from mBT-Old.html L2233–L2421) ========= */

        /* Phase 195: Strip timezone offset so browser locale can't shift the day boundary */
        function _normalizeDate(d) {
            var date = new Date(d);
            return new Date(date.getTime() + date.getTimezoneOffset() * 60000);
        }

        /* Phase 195: IO helpers — debounced save + unsaved state indicator */
        var _mBTStagesSaveTimeout = null;
        function _mBTStagesDebouncedSave() {
            if (_mBTStagesSaveTimeout) clearTimeout(_mBTStagesSaveTimeout);
            var indicator = document.getElementById('unsaved-indicator');
            if (indicator) indicator.style.opacity = '1';
            _mBTStagesSaveTimeout = setTimeout(function () {
                mBTStages.save();
                var ind = document.getElementById('unsaved-indicator');
                if (ind) ind.style.opacity = '0';
            }, 500);
        }

        /* Stages undo/redo: immediate snapshot before discrete mutations; debounced burst for continuous edits */
        var stagesUndoStack = [];
        var stagesRedoStack = [];
        var STAGES_MAX_HISTORY = 50;
        var stagesUndoDebounceTimer = null;
        var stagesUndoBurstSnap = null;

        function stagesCaptureSnapshot() {
            if (!mBTStages || !mBTStages.state || !mBTStages.state.project) return null;
            return JSON.parse(JSON.stringify(mBTStages.state.project));
        }

        function stagesPushUndo() {
            if (!stagesUndoDebounceTimer) {
                stagesUndoBurstSnap = stagesCaptureSnapshot();
            }
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = setTimeout(function() {
                if (stagesUndoBurstSnap) {
                    stagesUndoStack.push(stagesUndoBurstSnap);
                    stagesUndoBurstSnap = null;
                    if (stagesUndoStack.length > STAGES_MAX_HISTORY) stagesUndoStack.shift();
                    stagesRedoStack = [];
                }
                stagesUndoDebounceTimer = null;
                stagesUpdateUndoUI();
            }, 600);
        }

        function stagesPushUndoImmediate() {
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;
            var snap = stagesCaptureSnapshot();
            if (!snap) return;
            stagesUndoStack.push(snap);
            if (stagesUndoStack.length > STAGES_MAX_HISTORY) stagesUndoStack.shift();
            stagesRedoStack = [];
            stagesUpdateUndoUI();
        }

        function stagesUndo() {
            if (!stagesUndoStack.length) return;
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;
            var snap = stagesCaptureSnapshot();
            if (snap) stagesRedoStack.push(snap);
            var prev = stagesUndoStack.pop();
            mBTStages.state.project = prev;
            mBTStages.render();
            mBTStages.save();
            stagesUpdateUndoUI();
        }

        function stagesRedo() {
            if (!stagesRedoStack.length) return;
            clearTimeout(stagesUndoDebounceTimer);
            stagesUndoDebounceTimer = null;
            stagesUndoBurstSnap = null;
            var snap = stagesCaptureSnapshot();
            if (snap) stagesUndoStack.push(snap);
            var next = stagesRedoStack.pop();
            mBTStages.state.project = next;
            mBTStages.render();
            mBTStages.save();
            stagesUpdateUndoUI();
        }

        window.stagesUndo = stagesUndo;
        window.stagesRedo = stagesRedo;

        function stagesUpdateUndoUI() {
            var undoBtn = document.getElementById('btn-stages-undo');
            var redoBtn = document.getElementById('btn-stages-redo');
            if (undoBtn) undoBtn.disabled = stagesUndoStack.length === 0;
            if (redoBtn) redoBtn.disabled = stagesRedoStack.length === 0;
        }

        /* Phase 195: Single source-of-truth cost formula (quantity + TZ-normalised days) */
        function _calculateItemCost(item, stageKey, b) {
            var sd = item.stageData && item.stageData[stageKey];
            if (!sd) return 0;
            var workWeek  = (b.settings && b.settings.workWeek) || 5;
            var blackouts = b.blackoutDays || [];
            var starts    = getStageStartDates(b);
            var grossDays = parseFloat(sd.days) || 0;
            var payable   = starts[stageKey]
                ? computeWorkingDays(grossDays, _normalizeDate(starts[stageKey]), workWeek, blackouts)
                : grossDays;
            var multiplier = (sd.multiplier === undefined || sd.multiplier === null || sd.multiplier === '')
                ? 1 : (parseFloat(sd.multiplier) || 0);
            var qty = parseFloat(item.quantity) || 1;
            return payable * (parseFloat(sd.rate || item.rate) || 0) * multiplier * qty;
        }

        /* Phase 195: Surgical refresh — updates one item's cost span + Vitals without card rebuild */
        function _mBTStagesSurgicalRefresh(itemId, stageKey) {
            var item = mBTStages._findItem(itemId);
            if (!item || !item.stageData || !item.stageData[stageKey]) return;
            var cost = _calculateItemCost(item, stageKey, mBTStages.state.project);
            var costSpan = document.querySelector('[data-cost-for="' + itemId + '"]');
            if (costSpan) costSpan.textContent = fmt(cost);
            if (typeof mBTStages.renderVitals === 'function') mBTStages.renderVitals();
        }

        /* --- Compute payable working days within a date range --- */
        function computeWorkingDays(grossDays, startDate, workWeek, blackouts) {
            if (!workWeek || workWeek >= 7) return grossDays;
            var working = 0;
            var cursor = new Date(startDate);
            for (var i = 0; i < grossDays; i++) {
                var dow = cursor.getDay();
                var dateStr = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0') + '-' + String(cursor.getDate()).padStart(2, '0');
                var isWeekend = (workWeek <= 5 && (dow === 0 || dow === 6)) ||
                                (workWeek === 6 && dow === 0);
                var isBlackout = blackouts && blackouts.indexOf(dateStr) > -1;
                if (!isWeekend && !isBlackout) working++;
                cursor.setDate(cursor.getDate() + 1);
            }
            return working;
        }

        /* --- Build stage start dates for payable-day calculation --- */
        function getStageStartDates(b) {
            var starts = {};
            if (!b || !b.startDate) return starts;
            var cursor = new Date(b.startDate);
            cursor = new Date(cursor.getTime() + cursor.getTimezoneOffset() * 60000);
            var prevStart = null;

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            KEYS.forEach(function(k) {
                var stageData = (b.targetLock && b.targetLock.stages[k]) || {};
                var days = parseFloat(stageData.days) || 0;
                var offset = stageData.offsetDays;
                if (typeof offset === 'number' && prevStart) {
                    cursor = new Date(prevStart);
                    cursor.setDate(cursor.getDate() + offset);
                }
                starts[k] = new Date(cursor);
                prevStart = new Date(cursor);
                cursor = new Date(cursor.getTime() + days * 86400000);
            });
            return starts;
        }

        /* --- calculateMetrics with payable working days --- */
        function calculateMetrics(b) {
            var tl = b.targetLock || { totalCap: 0, stages: {} };
            var workWeek = (b.settings && b.settings.workWeek) || 5;
            var blackouts = b.blackoutDays || [];
            var stageStarts = getStageStartDates(b);
            var result = {
                grandTotal: b.grandTotal || 0,
                stageTotals: { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 },
                stageActuals: { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 },
                actualTotal: b.actualTotal || 0,
                actualsMode: !!b.actualsMode,
                totalCap: tl.totalCap || 0,
                totalDays: 0,
                totalWorkingDays: 0,
                dailyBurn: 0,
                runwayDays: 0
            };

            /* Phase 195: Per-stage cost via source-of-truth formula (quantity + TZ-normalised) */
            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (!item.stageData) return;
                    KEYS.forEach(function(k) {
                        if (item.stageData[k]) {
                            result.stageTotals[k] += _calculateItemCost(item, k, b);
                            result.stageActuals[k] += parseFloat(item.actual) || 0;
                        }
                    });
                });
            });

            KEYS.forEach(function(k) {
                if (tl.stages && tl.stages[k]) {
                    var grossDays = parseFloat(tl.stages[k].days) || 0;
                    result.totalDays += grossDays;
                    result.totalWorkingDays += stageStarts[k] ? computeWorkingDays(grossDays, stageStarts[k], workWeek, blackouts) : grossDays;
                }
            });

            if (result.totalWorkingDays > 0) result.dailyBurn = result.grandTotal / result.totalWorkingDays;
            if (result.dailyBurn > 0) result.runwayDays = result.totalCap / result.dailyBurn;
            return result;
        }

        /* --- getBurnStatus --- */
        function getBurnStatus(current, cap) {
            var pct = cap > 0 ? (current / cap) * 100 : 0;
            if (pct > 100) return { color: 'text-rose-600',  ring: 'border-rose-500',  stroke: '#f43f5e', pct: pct };
            if (pct > 85)  return { color: 'text-amber-500', ring: 'border-amber-400', stroke: '#f59e0b', pct: pct };
            return             { color: 'text-slate-900',  ring: 'border-slate-200', stroke: '#2563eb', pct: pct };
        }

        /* --- validateTimeline --- */
        function validateTimeline(b, stageKey) {
            var maxItemDays = 0;
            var hasItems = false;
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (item.stageData && item.stageData[stageKey]) {
                        hasItems = true;
                        var d = parseFloat(item.stageData[stageKey].days) || 0;
                        if (d > maxItemDays) maxItemDays = d;
                    }
                });
            });
            var userDays = (b.targetLock && b.targetLock.stages[stageKey])
                ? (parseFloat(b.targetLock.stages[stageKey].days) || 0) : 0;
            return {
                isValid:    userDays >= maxItemDays,
                maxNeeded:  maxItemDays,
                current:    userDays,
                delta:      userDays - maxItemDays,
                isBankrupt: hasItems && userDays === 0
            };
        }

        /* Phase 109.1: Weekend-skipping day counter — respects workWeek setting */
        function addWorkDays(startDate, days, workWeek) {
            var date = new Date(startDate);
            var count = 0;
            while (count < days) {
                date.setDate(date.getDate() + 1);
                var dow = date.getDay();
                var isWeekend = (workWeek <= 5 && (dow === 0 || dow === 6)) || (workWeek === 6 && dow === 0);
                if (!isWeekend) count++;
            }
            return date;
        }

        /* --- calculateTimeline (Phase 3.3 overrun + TZ fix + Phase 50C offsetDays) --- */
        function calculateTimeline(b) {
            var timeline = {};
            var baseDate = new Date(b.startDate || new Date());
            /* Timezone offset fix — prevents "yesterday" bug on pure date strings */
            baseDate = new Date(baseDate.getTime() + baseDate.getTimezoneOffset() * 60000);

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            var prevStart = null;

            KEYS.forEach(function(k) {
                var days = (b.targetLock && b.targetLock.stages[k])
                    ? (parseFloat(b.targetLock.stages[k].days) || 0) : 0;
                var offsetDays = (b.targetLock && b.targetLock.stages[k] && b.targetLock.stages[k].offsetDays !== undefined)
                    ? parseFloat(b.targetLock.stages[k].offsetDays) : null;

                var start;
                if (k === 'dev' || offsetDays === null) {
                    /* Waterfall: first stage starts at baseDate, others start after previous end */
                    if (k === 'dev') {
                        start = new Date(baseDate);
                    } else if (prevStart !== null) {
                        var prevStage = timeline[KEYS[KEYS.indexOf(k) - 1]];
                        start = new Date((prevStage && prevStage.end) || baseDate);
                    } else {
                        start = new Date(baseDate);
                    }
                } else {
                    /* Overlap: start relative to previous stage's start + offsetDays */
                    start = new Date(prevStart);
                    start.setDate(start.getDate() + offsetDays);
                }

                var workWeek = (b.settings && b.settings.workWeek) || 7;
                var end = (days > 0 && workWeek < 7) ? addWorkDays(start, days, workWeek) : new Date(start.getTime() + days * 86400000);
                var fmtD  = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
                timeline[k] = { start: start, end: end, label: days > 0 ? (fmtD(start) + ' – ' + fmtD(end)) : 'SCHEDULE TBD' };

                prevStart = new Date(start);
            });

            /* Phase 200: Universal Projection & Ghost Target computation */
            var cursor = timeline.dist && timeline.dist.end ? timeline.dist.end : baseDate;
            var targetAdj;
            var isEstimated = false;
            if (b.deliveryDate) {
                var target    = new Date(b.deliveryDate);
                targetAdj = new Date(target.getTime() + target.getTimezoneOffset() * 60000);
            } else {
                targetAdj = new Date(cursor);
                isEstimated = true;
            }
            var diffDays  = b.deliveryDate ? Math.ceil((targetAdj - cursor) / 86400000) : 0;
            var status    = isEstimated ? 'ESTIMATED' : (diffDays < 0 ? 'OVERDUE' : (diffDays < 7 ? 'Tight' : 'On Track'));
            var color     = isEstimated ? 'text-slate-400 opacity-60 italic' : (diffDays < 0 ? 'text-rose-600' : (diffDays < 7 ? 'text-amber-500' : 'text-emerald-500'));
            var ring      = isEstimated ? 'border-dashed border-slate-300' : (diffDays < 0 ? 'border-rose-500' : (diffDays < 7 ? 'border-amber-400' : 'border-slate-100'));
            timeline._analysis = {
                projectedEnd: cursor,
                targetDate: targetAdj,
                variance: diffDays,
                status: status,
                color: color,
                ring: ring,
                isEstimated: isEstimated
            };
            return timeline;
        }

        /* --- calculateCashflow: week-relative draw schedule ---
         * Project Week 1 starts at the earliest stage start. Each stage's planned
         * cost is spread evenly per calendar day of its span, then bucketed into
         * 7-day weeks. Stages may overlap (offsetDays), so a week can sum daily
         * rates from multiple stages into the same byStage bucket. */
        function calculateCashflow(b) {
            var metrics = calculateMetrics(b);
            var timeline = calculateTimeline(b);
            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            var MS_DAY = 86400000;

            function emptyByStage() {
                return { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 };
            }

            var projectStart = null;
            var projectEnd = null;
            var active = [];
            var unscheduledTotal = 0;
            var unscheduledStages = [];
            var i, k, t, spanDays, planned, actual;

            for (i = 0; i < KEYS.length; i++) {
                k = KEYS[i];
                t = timeline[k];
                if (!t || !t.start || !t.end) continue;
                spanDays = Math.round((t.end.getTime() - t.start.getTime()) / MS_DAY);
                if (spanDays <= 0) {
                    planned = metrics.stageTotals[k] || 0;
                    if (planned > 0) {
                        unscheduledTotal += planned;
                        unscheduledStages.push(k);
                    }
                    continue;
                }
                planned = metrics.stageTotals[k] || 0;
                actual = metrics.stageActuals[k] || 0;
                active.push({
                    key: k,
                    start: t.start,
                    end: t.end,
                    spanDays: spanDays,
                    planned: planned,
                    actual: actual
                });
                if (!projectStart || t.start.getTime() < projectStart.getTime()) {
                    projectStart = new Date(t.start.getTime());
                }
                if (!projectEnd || t.end.getTime() > projectEnd.getTime()) {
                    projectEnd = new Date(t.end.getTime());
                }
            }

            if (!active.length) {
                return {
                    weeks: [],
                    grandTotal: 0,
                    actualGrandTotal: 0,
                    stageTotalsSum: 0,
                    actualsMode: metrics.actualsMode,
                    totalCap: metrics.totalCap,
                    projectStart: null,
                    projectEnd: null,
                    weekCount: 0,
                    unscheduledTotal: unscheduledTotal,
                    unscheduledStages: unscheduledStages
                };
            }

            var totalSpanDays = Math.round((projectEnd.getTime() - projectStart.getTime()) / MS_DAY);
            var weekCount = Math.max(1, Math.ceil(totalSpanDays / 7));
            var weeks = [];
            for (i = 0; i < weekCount; i++) {
                weeks.push({
                    weekNumber: i + 1,
                    total: 0,
                    byStage: emptyByStage(),
                    actualTotal: 0,
                    actualByStage: emptyByStage()
                });
            }

            var stageTotalsSum = 0;
            var si, d, dayMs, daysSince, weekIdx, dailyPlanned, dailyActual, remainderPlanned, remainderActual;

            for (si = 0; si < active.length; si++) {
                var stage = active[si];
                stageTotalsSum += stage.planned;
                dailyPlanned = stage.planned / stage.spanDays;
                dailyActual = stage.actual / stage.spanDays;
                /* Assign exact remainder on the last day so week sums stay conservative */
                remainderPlanned = stage.planned;
                remainderActual = stage.actual;
                for (d = 0; d < stage.spanDays; d++) {
                    dayMs = stage.start.getTime() + d * MS_DAY;
                    daysSince = Math.floor((dayMs - projectStart.getTime()) / MS_DAY);
                    if (daysSince < 0) daysSince = 0;
                    weekIdx = Math.floor(daysSince / 7);
                    while (weekIdx >= weeks.length) {
                        weeks.push({
                            weekNumber: weeks.length + 1,
                            total: 0,
                            byStage: emptyByStage(),
                            actualTotal: 0,
                            actualByStage: emptyByStage()
                        });
                    }
                    var addP, addA;
                    if (d === stage.spanDays - 1) {
                        addP = remainderPlanned;
                        addA = remainderActual;
                    } else {
                        addP = dailyPlanned;
                        addA = dailyActual;
                        remainderPlanned -= addP;
                        remainderActual -= addA;
                    }
                    weeks[weekIdx].byStage[stage.key] += addP;
                    weeks[weekIdx].total += addP;
                    if (metrics.actualsMode) {
                        weeks[weekIdx].actualByStage[stage.key] += addA;
                        weeks[weekIdx].actualTotal += addA;
                    }
                }
            }

            var grandTotal = 0;
            var actualGrandTotal = 0;
            for (i = 0; i < weeks.length; i++) {
                grandTotal += weeks[i].total;
                actualGrandTotal += weeks[i].actualTotal;
            }

            return {
                weeks: weeks,
                grandTotal: grandTotal,
                actualGrandTotal: actualGrandTotal,
                stageTotalsSum: stageTotalsSum,
                actualsMode: metrics.actualsMode,
                totalCap: metrics.totalCap,
                projectStart: projectStart,
                projectEnd: projectEnd,
                weekCount: weeks.length,
                unscheduledTotal: unscheduledTotal,
                unscheduledStages: unscheduledStages
            };
        }

        /* Dev-only test export: exposes pure calc functions for tests/stages-test-suite.js.
           No behavior change to the tool itself. */
        window.mBTStagesCalc = {
            calculateMetrics: calculateMetrics,
            calculateTimeline: calculateTimeline,
            calculateCashflow: calculateCashflow
        };

        /* --- analyzeRisk --- */
        function analyzeRisk(metrics, timeline) {
            if (!timeline || !timeline._analysis) return null;
            var variance = timeline._analysis.variance;
            if (variance >= 0) return null;

            var daysLate      = Math.abs(variance);
            var delayCost     = metrics.dailyBurn * daysLate;
            var projectedTotal = metrics.grandTotal + delayCost;
            var cap           = metrics.totalCap || 0;
            var isCritical    = cap > 0 && projectedTotal > cap;

            return {
                status:         isCritical ? 'CRITICAL' : 'WARNING',
                daysLate:       daysLate,
                dailyBurn:      metrics.dailyBurn,
                cost:           delayCost,
                projectedTotal: projectedTotal,
                message:        isCritical ? 'INSOLVENCY RISK' : 'DELAY COST',
                subMessage:     isCritical
                    ? ('Projected ' + fmt(projectedTotal) + ' exceeds Cap')
                    : ('Est. Penalty: ' + fmt(delayCost))
            };
        }

        /* ========= Controller ========= */
        var mBTStages = {

            state: {
                KEYS:   ['dev', 'pre', 'prod', 'post', 'dist'],
                TITLES: { dev: 'Development', pre: 'Pre-Production', prod: 'Production', post: 'Post-Production', dist: 'Distribution' },
                projectId:  null,
                project:    null,
                ogItems:    [],          /* OG rate database cache */
                _modalStage: null        /* which stage the add-item modal is targeting */
            },

            /* --- Boot --- */
            init: function() {
                var self = this;
                var params = new URLSearchParams(location.search);
                /* Prefer localforage key (shell bridge) over mBT_DB projectId */
                self.state._projectKey = params.get('projectKey') || null;
                self.state.projectId   = params.get('projectId') || null;
                self.state._currency   = params.get('currency') || 'JMD';

                /* Options from shared STAGE_PRESETS (mBT.templates.js); same order as Object.keys */
                var presetSelect = document.getElementById('stages-preset-select');
                if (presetSelect && typeof STAGE_PRESETS !== 'undefined') {
                    presetSelect.innerHTML = '<option value="" disabled selected>Load Industry Preset..</option>' +
                        Object.keys(STAGE_PRESETS).map(function (k) {
                            return '<option value="' + k + '">' + k + '</option>';
                        }).join('');
                }

                /* Phase 62: Stamp RBAC role on body for CSS-driven lockdown */
                try {
                    var rbacRole = localStorage.getItem('mbt_rbac_role') || 'editor';
                    document.body.setAttribute('data-rbac-role', rbacRole);
                } catch(_) {}

                /* Phase 50C.8: Dispatch tool focus to parent presence channel */
                function dispatchFocus() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'mbt:tool-action', action: 'user-focus-changed', payload: { tool: 'stages' } }, window.location.origin);
                    }
                }
                dispatchFocus();
                window.addEventListener('focus', dispatchFocus);

                /* Phase 73B: receive undo/redo routing from parent monolith */
                window.addEventListener('message', function(e) {
                    if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e)) return;
                    if (!e.data || e.data.type !== 'mbt:tool-action') return;
                    if (e.data.action === 'undo') stagesUndo();
                    if (e.data.action === 'redo') stagesRedo();
                });

                document.addEventListener('keydown', function(e) {
                    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                        e.preventDefault();
                        stagesUndo();
                    } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                        e.preventDefault();
                        stagesRedo();
                    }
                });

                /* Receive work-week changes from parent monolith settings */
                window.addEventListener('message', function(e) {
                    if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e)) return;
                    if (!e.data || e.data.type !== 'mbt:workWeek') return;
                    if (!mBTStages.state || !mBTStages.state.project) return;
                    if (!mBTStages.state.project.settings) mBTStages.state.project.settings = {};
                    mBTStages.state.project.settings.workWeek = parseInt(e.data.workWeek) || 5;
                    if (typeof mBTStages.renderVitals    === 'function') mBTStages.renderVitals();
                    if (typeof mBTStages.renderStageCards === 'function') mBTStages.renderStageCards();
                });

                /* Receive live display-currency switches from parent (mirrors mbt:workWeek) */
                window.addEventListener('message', function(e) {
                    if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e)) return;
                    if (!e.data || e.data.type !== 'mbt:displayCurrency') return;
                    if (!mBTStages.state) return;
                    mBTStages.state._currency = e.data.currency || 'JMD';
                    if (e.data.rates) _syncedRates = e.data.rates;
                    if (typeof mBTStages.renderVitals    === 'function') mBTStages.renderVitals();
                    if (typeof mBTStages.renderStageCards === 'function') mBTStages.renderStageCards();
                });

                /* Receive reconcile from parent — reload budget from localforage and re-render */
                window.addEventListener('message', function(e) {
                    if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e)) return;
                    if (!e.data || e.data.type !== 'mbt:tool-action' || e.data.action !== 'reconcile') return;
                    if (!mBTStages.state || !mBTStages.state._projectKey) return;
                    localforage.getItem(mBTStages.state._projectKey).then(function(budget) {
                        if (!budget) return;
                        mBTStages.state.project = budget;
                        if (typeof mBTStages.renderVitals    === 'function') mBTStages.renderVitals();
                        if (typeof mBTStages.renderStageCards === 'function') mBTStages.renderStageCards();
                    }).catch(function(e) { console.error('[STAGES] reconcile reload failed', e); });
                });

                /* Live cap sync from main budget -- refresh totalCap + vitals without reopen */
                window.addEventListener('message', function(e) {
                    if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e)) return;
                    if (!e.data || e.data.type !== 'mbt:totalCap') return;
                    if (!mBTStages.state || !mBTStages.state.project) return;
                    var nextCap = parseFloat(e.data.totalCap) || 0;
                    if (!mBTStages.state.project.targetLock) {
                        mBTStages.state.project.targetLock = { enabled: false, totalCap: 0, stages: {} };
                    }
                    mBTStages.state.project.targetLock.totalCap = nextCap;
                    var capInput = document.getElementById('total-cap');
                    if (capInput) capInput.value = nextCap || '';
                    if (typeof mBTStages.renderSliders    === 'function') mBTStages.renderSliders();
                    if (typeof mBTStages.renderVitals    === 'function') mBTStages.renderVitals();
                    if (typeof mBTStages.renderStageCards === 'function') mBTStages.renderStageCards();
                });

                /* Back button */
                dom.getElementById('btn-back').addEventListener('click', function() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'mbt:tool-action', action: 'close-tool' }, window.location.origin);
    } else {
      /* Fallback for standalone direct-launch */
      window.location.href = '/index.html';
    }
                });

                /* Carousel grab-scroll */
                self._initCarouselScroll();

                /* Tab Navigation Bar */
                self._initTabNavigation();
                self._initTabBarScrollHint();

                if (!self.state._projectKey && !self.state.projectId) {
                    self._showError('No project selected. Open a project from the dashboard first.');
                    return;
                }

                /* Load project via localforage (shell bridge) or mBT_DB (standalone) */
                var projectPromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    projectPromise = localforage.getItem(self.state._projectKey);
                } else if (self.state.projectId && window.mBT && window.mBT.storage) {
                    projectPromise = window.mBT.storage.getProject(self.state.projectId);
                } else {
                    self._showError('Storage engine not available. Reload the page.');
                    return;
                }

                /* OG items from mBT_DB if available, else empty */
                var ogPromise = (window.mBT && window.mBT.storage)
                    ? window.mBT.storage.getAllOGItems().catch(function() { return []; })
                    : Promise.resolve([]);

                Promise.all([projectPromise, ogPromise]).then(function(results) {
                    var project = results[0];
                    var ogItems = results[1];
                    if (!project) {
                        self._showError('Project not found. Make sure a project is open in the main tool.');
                        return;
                    }
                    self.state.project = project;
                    self.state.ogItems = ogItems || [];

                    /* Ensure targetLock structure */
                    if (!project.targetLock) project.targetLock = { enabled: true, totalCap: project.grandTotal || 0, stages: {} };
                    if (!project.targetLock.stages) project.targetLock.stages = {};
                    self.state.KEYS.forEach(function(k) {
                        if (!project.targetLock.stages[k]) {
                            project.targetLock.stages[k] = { label: k.toUpperCase(), ratio: 20, days: 0, locked: false };
                        } else {
                            /* Deep-default: repair partial stage objects from prior sessions */
                            var s = project.targetLock.stages[k];
                            if (s.ratio === undefined || s.ratio === null) s.ratio = 0;
                            if (s.days === undefined || s.days === null) s.days = 0;
                            if (s.locked === undefined || s.locked === null) s.locked = false;
                            if (!s.label) s.label = k.toUpperCase();
                        }
                    });

                    self.render();
                    self.initDragAndDrop();
                }).catch(function(err) {
                    self._showError('Failed to load project: ' + err.message);
                });
            },

            /* --- Full Render --- */
            render: function() {
                var b = this.state.project;
                if (!b) return;
                /* Dismiss skeleton, reveal layout */
                var sk = dom.getElementById('stages-skeleton');
                var sl = dom.getElementById('stages-layout');
                if (sk) sk.classList.add('hidden');
                if (sl) sl.classList.remove('hidden');

                /* Header */
                dom.getElementById('active-project-name').textContent = (b.projectName && String(b.projectName).trim()) ? String(b.projectName).trim() : 'UNTITLED';
                dom.getElementById('start-date').value    = b.startDate || '';
                // Phase 200: Handled dynamically by renderVitals to support ghost formatting
                if (b.deliveryDate) {
                    dom.getElementById('delivery-date').value = b.deliveryDate;
                }
                dom.getElementById('total-cap').value     = b.targetLock ? (b.targetLock.totalCap || '') : '';

                /* Panels */
                this.renderSliders();
                this.renderVitals();
                this.renderStageCards();
            },

            /* --- Sliders --- */
            renderSliders: function() {
                var b       = this.state.project;
                var self    = this;
                var metrics = calculateMetrics(b);
                var html = this.state.KEYS.map(function(k) {
                    var s = b.targetLock.stages[k];
                    var stageCap = metrics.totalCap * ((s.ratio || 0) / 100);
                    return '<div class="relative">' +
                        '<div class="flex justify-between items-center mb-1.5">' +
                            '<span class="text-[9px] font-black uppercase tracking-widest text-slate-400">' + esc(self.state.TITLES[k]) + '</span>' +
                            '<div class="text-right">' +
                                '<span class="text-[10px] font-black text-white">' + (s.ratio || 0).toFixed(1) + '%</span>' +
                                '<span class="text-[8px] font-bold text-slate-400 block">' + fmt(stageCap) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="h-2 bg-slate-800 rounded-full relative overflow-hidden">' +
                            '<div class="absolute top-0 left-0 h-full bg-blue-500 rounded-full pointer-events-none" style="width:' + s.ratio + '%"></div>' +
                            '<input type="range" min="0" max="100" step="0.5" value="' + s.ratio + '" ' +
                                'oninput="mBTStages.balanceSliders(\'' + k + '\', this.value)" ' +
                                'onchange="mBTStages.save()" ' +
                                (s.locked ? 'disabled ' : '') +
                                'class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">' +
                        '</div>' +
                    '</div>';
                }).join('');
                dom.getElementById('preset-sliders').innerHTML = html;
            },

            /* --- Vitals Panel (burn ring + stats + timeline) --- */
            renderVitals: function() {
                var b        = this.state.project;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var risk     = analyzeRisk(metrics, timeline);
                var burn     = getBurnStatus(metrics.grandTotal, metrics.totalCap);

                /* Risk overrides burn display */
                var ringText  = Math.round(burn.pct) + '%';
                var ringClass = 'text-4xl font-black leading-none tracking-tighter truncate w-full px-2 block ' + burn.color;
                var labelText = 'Burn';
                var labelClass = 'text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 truncate w-full px-1 block';

                if (risk) {
                    if (risk.status === 'CRITICAL') {
                        burn.stroke = '#f43f5e';
                        ringText   = 'CRITICAL';
                        ringClass  = 'text-xl font-black leading-none tracking-tight text-rose-600 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-rose-500 uppercase tracking-widest mt-1 animate-pulse truncate w-full px-1 block';
                    } else {
                        burn.stroke = '#f59e0b';
                        ringText   = 'DELAY';
                        ringClass  = 'text-2xl font-black leading-none tracking-tight text-amber-500 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-amber-500 uppercase tracking-widest mt-1 truncate w-full px-1 block';
                    }
                }

                /* Burn ring */
                var offset = 276.46 - (Math.min(burn.pct, 100) / 100 * 276.46);
                var meter  = dom.getElementById('burn-meter');
                meter.style.strokeDashoffset = offset;
                meter.setAttribute('stroke', burn.stroke);
                dom.getElementById('burn-pct').textContent  = ringText;
                dom.getElementById('burn-pct').className    = ringClass;
                dom.getElementById('burn-label').textContent = labelText;
                dom.getElementById('burn-label').className   = labelClass;

                /* Inner ring: actual burn vs cap (only when project tracks actuals) */
                var actualMeter = dom.getElementById('actual-burn-meter');
                if (metrics.actualsMode) {
                    var actualBurn = getBurnStatus(metrics.actualTotal, metrics.totalCap);
                    var actualOffset = 226.19 - (Math.min(actualBurn.pct, 100) / 100 * 226.19);
                    actualMeter.style.display = '';
                    actualMeter.style.strokeDashoffset = actualOffset;
                    actualMeter.setAttribute('stroke', actualBurn.stroke);
                } else {
                    actualMeter.style.display = 'none';
                }

                /* Stats */
                dom.getElementById('stat-grand-total').textContent = fmt(metrics.grandTotal);
                dom.getElementById('stat-total-cap').textContent   = fmt(metrics.totalCap);
                dom.getElementById('stat-daily-burn').textContent  = fmt(metrics.dailyBurn) + '/day';
                dom.getElementById('stat-runway').textContent      = Math.round(metrics.runwayDays) + ' Days';

                var riskEl = dom.getElementById('stat-risk');
                if (risk && risk.status === 'CRITICAL') {
                    riskEl.textContent = 'CRITICAL'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (risk && risk.status === 'WARNING') {
                    riskEl.textContent = 'DELAY'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else if (burn.pct > 100) {
                    riskEl.textContent = 'OVER CAP'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (burn.pct > 85) {
                    riskEl.textContent = 'HIGH'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else {
                    riskEl.textContent = 'MINIMAL'; riskEl.className = 'text-[10px] font-black text-emerald-500 uppercase tracking-widest';
                }

                /* Timeline audit */
                var tHtml = this.state.KEYS.map(function(k) {
                    var t = timeline[k];
                    var analysis = timeline._analysis;
                    var statusHtml = '';
                    if (analysis && k === 'dist') {
                        /* Show delivery status on the last stage */
                        statusHtml = ' <span class="' + analysis.color + ' font-black">[' + esc(analysis.status) + ']</span>';
                    }
                    return '<div class="flex justify-between items-center text-[10px] font-bold">' +
                        '<span class="text-slate-400 uppercase tracking-widest font-black text-[8px]">' + esc(k) + '</span>' +
                        '<span class="text-slate-800">' + esc(t.label) + statusHtml + '</span>' +
                    '</div>';
                }).join('');
                dom.getElementById('timeline-audit').innerHTML = tHtml;

                /* Phase 200: Delivery date input ghost styling */
                var deliveryInput = dom.getElementById('delivery-date');
                if (timeline._analysis) {
                    deliveryInput.classList.remove('border-slate-700', 'border-rose-500', 'border-amber-500', 'border-emerald-500', 'border-dashed');
                    if (timeline._analysis.isEstimated) {
                        deliveryInput.classList.add('border-dashed', 'border-slate-500');
                        deliveryInput.style.opacity = '0.45';
                        deliveryInput.style.fontStyle = 'italic';
                        var proj = timeline._analysis.projectedEnd;
                        var yyyy = proj.getFullYear();
                        var mm = ('0' + (proj.getMonth() + 1)).slice(-2);
                        var dd = ('0' + proj.getDate()).slice(-2);
                        deliveryInput.value = yyyy + '-' + mm + '-' + dd;
                    } else {
                        deliveryInput.style.opacity = '1';
                        deliveryInput.style.fontStyle = 'normal';
                        if (timeline._analysis.status === 'OVERDUE') deliveryInput.classList.add('border-rose-500');
                        else if (timeline._analysis.status === 'Tight')  deliveryInput.classList.add('border-amber-500');
                        else                                              deliveryInput.classList.add('border-emerald-500');
                    }
                }

                /* Keep cashflow panel in sync whenever vitals re-render */
                this.renderCashflow();
            },

            /* --- Cashflow Panel (week-relative draw schedule) --- */
            renderCashflow: function() {
                var b = this.state.project;
                if (!b) return;
                var cf = calculateCashflow(b);
                var metrics = calculateMetrics(b);
                var metaEl = dom.getElementById('cashflow-meta');
                var bodyEl = dom.getElementById('cashflow-body');
                if (!metaEl || !bodyEl) return;

                var fmtD = function(d) {
                    if (!d) return '';
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                };
                var KEYS = this.state.KEYS;
                var TITLES = this.state.TITLES;
                var shortLabel = { dev: 'Dev', pre: 'Pre', prod: 'Prod', post: 'Post', dist: 'Dist' };

                var buildUnschedNotice = function(cfData) {
                    if (!cfData.unscheduledTotal || cfData.unscheduledTotal <= 0) return '';
                    var names = [];
                    var ui, uk;
                    for (ui = 0; ui < cfData.unscheduledStages.length; ui++) {
                        uk = cfData.unscheduledStages[ui];
                        names.push(shortLabel[uk] || TITLES[uk] || uk);
                    }
                    return '<div class="mb-3 p-2.5 rounded-lg bg-amber-50 border border-amber-200">' +
                        '<p class="text-[8px] font-bold text-amber-700 leading-relaxed">' +

                        '</p></div>';
                };

                if (!cf.weeks.length) {
                    metaEl.innerHTML =
                        '<div class="flex justify-between items-end p-2 rounded-lg bg-slate-50 border border-slate-100">' +
                            '<span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Cap</span>' +
                            '<span class="text-[10px] font-black text-slate-800">' + fmt(metrics.totalCap) + '</span>' +
                        '</div>';
                    bodyEl.innerHTML =
                        buildUnschedNotice(cf) +
                        '<div class="flex flex-col items-center justify-center py-12 gap-3 px-4 text-center">' +
                            '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>' +
                            '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-relaxed">No schedule data yet -- assign days to stages to see a cashflow projection</p>' +

                    ? '<div class="flex justify-between items-end p-2 rounded-lg bg-emerald-50 border border-emerald-100">' +
                        '<span class="text-[8px] font-black text-emerald-600 uppercase tracking-widest">Actual</span>' +
                        '<span class="text-[10px] font-black text-emerald-700">' + fmt(cf.actualGrandTotal) + '</span>' +
                      '</div>'
                    : '';
                var plannedLabel = cf.unscheduledTotal > 0 ? 'Scheduled' : 'Planned';
                var plannedHint = cf.unscheduledTotal > 0
                    ? '<div class="text-[7px] font-bold text-amber-600 uppercase tracking-widest leading-tight mt-0.5">Excl. ' + fmt(cf.unscheduledTotal) + ' unscheduled</div>'
                    : '';
                metaEl.innerHTML =
                    '<p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">' +
                        cf.weekCount + ' week' + (cf.weekCount === 1 ? '' : 's') + ' &middot; ' + esc(dateRange) +
                    '</p>' +
                    '<div class="grid grid-cols-2 gap-1.5 mt-1">' +
                        '<div class="flex justify-between items-end p-2 rounded-lg bg-slate-50 border border-slate-100">' +
                            '<span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Cap</span>' +
                            '<span class="text-[10px] font-black text-slate-800">' + fmt(cf.totalCap) + '</span>' +
                        '</div>' +
                        '<div class="flex flex-col items-end p-2 rounded-lg bg-blue-50 border border-blue-100">' +
                            '<div class="flex justify-between items-end w-full">' +
                                '<span class="text-[8px] font-black text-blue-600 uppercase tracking-widest">' + plannedLabel + '</span>' +
                                '<span class="text-[10px] font-black text-blue-700">' + fmt(cf.grandTotal) + '</span>' +
                            '</div>' +
                            plannedHint +
                        '</div>' +
                        actualMeta +
                    '</div>';

                var thClass = 'px-1.5 py-2 text-[7px] font-black uppercase tracking-widest text-slate-400 text-right border-b border-slate-100 whitespace-nowrap';
                var thLeft = 'px-1.5 py-2 text-[7px] font-black uppercase tracking-widest text-slate-400 text-left border-b border-slate-100 whitespace-nowrap';
                var tdClass = 'px-1.5 py-1.5 text-[9px] font-bold text-slate-700 text-right border-b border-slate-50 whitespace-nowrap';
                var tdLeft = 'px-1.5 py-1.5 text-[9px] font-black text-slate-800 text-left border-b border-slate-50 whitespace-nowrap';
                var headCells = '<th class="' + thLeft + '">Week</th>';
                KEYS.forEach(function(k) {
                    headCells += '<th class="' + thClass + '" title="' + esc(TITLES[k] || k) + '">' + esc(shortLabel[k] || k) + '</th>';
                });
                headCells += '<th class="' + thClass + '">Total</th>';
                headCells += '<th class="' + thClass + '">Cumul</th>';

                var cumul = 0;
                var actualCumul = 0;
                var rows = cf.weeks.map(function(w) {
                    cumul += w.total;
                    actualCumul += w.actualTotal;
                    var cells = '<td class="' + tdLeft + '">Week ' + w.weekNumber + '</td>';
                    KEYS.forEach(function(k) {
                        var plannedVal = w.byStage[k] || 0;
                        var actualVal = w.actualByStage[k] || 0;
                        var showZero = plannedVal === 0 && (!cf.actualsMode || actualVal === 0);
                        var plannedHtml = showZero
                            ? '<span class="text-slate-300">-</span>'
                            : '<span class="text-slate-800">' + fmt(plannedVal) + '</span>';
                        var actualHtml = '';
                        if (cf.actualsMode && (plannedVal > 0 || actualVal > 0)) {
                            actualHtml = '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(actualVal) + '</div>';
                        }
                        cells += '<td class="' + tdClass + '">' + plannedHtml + actualHtml + '</td>';
                    });
                    var totalActualHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(w.actualTotal) + '</div>'
                        : '';
                    var cumulActualHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(actualCumul) + '</div>'
                        : '';
                    cells += '<td class="' + tdClass + ' font-black text-slate-900">' + fmt(w.total) + totalActualHtml + '</td>';
                    cells += '<td class="' + tdClass + ' font-black text-blue-600">' + fmt(cumul) + cumulActualHtml + '</td>';
                    return '<tr>' + cells + '</tr>';
                }).join('');

                /* Footer totals row */
                var footerCells = '<td class="' + tdLeft + ' text-slate-500">Total</td>';
                KEYS.forEach(function(k) {
                    var sumP = 0;
                    var sumA = 0;
                    cf.weeks.forEach(function(w) {
                        sumP += w.byStage[k] || 0;
                        sumA += w.actualByStage[k] || 0;
                    });
                    var aHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(sumA) + '</div>'
                        : '';
                    footerCells += '<td class="' + tdClass + ' border-t border-slate-200">' +
                        (sumP === 0 && (!cf.actualsMode || sumA === 0) ? '<span class="text-slate-300">-</span>' : fmt(sumP)) +
                        aHtml + '</td>';
                });
                var footActualTotal = cf.actualsMode
                    ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(cf.actualGrandTotal) + '</div>'
                    : '';
                footerCells += '<td class="' + tdClass + ' border-t border-slate-200 font-black">' + fmt(cf.grandTotal) + footActualTotal + '</td>';
                footerCells += '<td class="' + tdClass + ' border-t border-slate-200 font-black text-blue-600">' + fmt(cf.grandTotal) + footActualTotal + '</td>';

                var legend = cf.actualsMode
                    ? '<p class="text-[7px] font-bold text-slate-400 uppercase tracking-widest mt-2 px-1">' +
                        '<span class="text-slate-700">Planned</span> / <span class="text-emerald-600">Actual</span> per week' +
                      '</p>'
                    : '';

                bodyEl.innerHTML =
                    buildUnschedNotice(cf) +
                    '<div class="overflow-x-auto no-scrollbar">' +
                        '<table class="w-full border-collapse">' +
                            '<thead><tr>' + headCells + '</tr></thead>' +
                            '<tbody>' + rows + '</tbody>' +
                            '<tfoot><tr>' + footerCells + '</tr></tfoot>' +
                        '</table>' +
                    '</div>' +
                    legend;
            },

            /* --- Stage Cards --- */
            renderStageCards: function() {
                var b        = this.state.project;
                var self     = this;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var container = dom.getElementById('stage-cards-container');

                var html = this.state.KEYS.map(function(k) {
                    var s         = b.targetLock.stages[k];
                    var stageCost = metrics.stageTotals[k] || 0;
                    var stageActual = metrics.stageActuals[k] || 0;
                    var stageCap  = metrics.totalCap * ((s.ratio || 0) / 100);
                    var isOver    = stageCost > stageCap && stageCap > 0;
                    var isActualOver = metrics.actualsMode && stageActual > stageCost && stageCost > 0;
                    /* Actuals line only when project uses actuals tracking (actualsMode) */
                    var actualsLine = metrics.actualsMode
                        ? '<div class="text-center mt-1"><span class="text-[8px] font-bold uppercase tracking-widest ' + (isActualOver ? 'text-rose-600' : 'text-slate-400') + '">Actual: ' + fmt(stageActual) + ' (of ' + fmt(stageCost) + ' planned)</span></div>'
                        : '';
                    var val       = validateTimeline(b, k);
                    var conflict  = val.maxNeeded > val.current;
                    var dateLabel = timeline[k] ? esc(timeline[k].label) : '';

                    /* Sync Days button — amber bounce when items exceed stage duration */
                    var syncBtn = (val.maxNeeded > val.current)
                        ? '<button onclick="mBTStages.syncDays(\'' + k + '\')" title="Sync to ' + val.maxNeeded + ' days" class="absolute -right-2 -top-2 bg-amber-500 hover:bg-amber-600 text-white w-6 h-6 rounded-full shadow-lg z-50 flex items-center justify-center sync-bounce">' +
                          '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>' +
                          '</button>'
                        : '';

                    var dateDisplay = val.isBankrupt
                        ? '<span class="text-[8px] font-black text-rose-600 animate-pulse">UNSCHEDULED</span>'
                        : '<span class="text-[8px] font-bold text-slate-400 mt-0.5 tracking-tight">' + dateLabel + '</span>';

                    /* dev is always first stage; offsetDays has no effect there */
                    var offsetInput = (k !== 'dev')
                        ? '<div class="flex items-center gap-1 bg-slate-50 px-1 py-0.5 rounded-lg border border-slate-100">' +
                            '<input type="number" value="' + (s.offsetDays !== undefined ? s.offsetDays : '') + '" oninput="mBTStages.updateStageOffset(\'' + k + '\', this.value)" class="w-8 text-center bg-transparent text-[10px] font-bold text-slate-500 outline-none no-spinner" title="Starts N days into previous stage">' +
                            '<span class="text-[6px] font-black text-slate-400 uppercase tracking-widest mr-0.5">Overlap</span>' +
                          '</div>'
                        : '';

                    return '<div id="' + k + '" class="stage-card min-w-[340px] w-[340px] snap-center shrink-0' + (conflict ? ' conflict-glow' : '') + '">' +
                        '<div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-20 shrink-0">' +
                            '<div class="flex items-center justify-between mb-1 relative">' +
                                /* Lock button */
                                '<button onclick="mBTStages.toggleLock(\'' + k + '\')" class="w-6 h-6 flex items-center justify-center rounded-lg ' + (s.locked ? 'bg-amber-100 text-amber-600' : 'bg-slate-50 text-slate-300 hover:bg-slate-100') + ' transition-colors">' +
                                    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">' +
                                        (s.locked ? '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' : '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>') +
                                    '</svg>' +
                                '</button>' +
                                /* Title + date */
                                '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">' +
                                    '<span class="text-[10px] font-black uppercase tracking-widest text-slate-800">' + esc(self.state.TITLES[k]) + '</span>' +
                                    dateDisplay +
                                '</div>' +

                                '<div class="flex flex-col items-end gap-0.5">' +
                                    '<div class="relative flex items-center gap-1.5 bg-slate-50 p-1 rounded-xl border border-slate-100">' +
                                        syncBtn +
                                        '<input type="number" value="' + s.days + '" oninput="mBTStages.updateStageDays(\'' + k + '\', this.value)" class="w-10 text-center bg-transparent text-[11px] font-black ' + (conflict ? 'text-amber-600' : 'text-blue-600') + ' outline-none no-spinner">' +
                                        '<span class="text-[7px] font-black text-slate-400 uppercase tracking-widest mr-1">Days</span>' +
                                    '</div>' +
                                    offsetInput +
                                '</div>' +
                            '</div>' +
                            '<div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-1 mt-3">' +
                                '<div class="h-full ' + (isOver ? 'bg-rose-500' : 'bg-blue-500') + ' rounded-full transition-all duration-500" style="width:' + Math.min(stageCap > 0 ? (stageCost / stageCap) * 100 : 0, 100).toFixed(1) + '%"></div>' +
                            '</div>' +
                            '<div class="flex justify-between text-[8px] font-black uppercase tracking-widest">' +
                                '<span class="' + (isOver ? 'text-rose-600' : 'text-slate-400') + '">' + fmt(stageCost) + '</span>' +
                                '<span class="text-slate-400">Cap: ' + fmt(stageCap) + '</span>' +
                            '</div>' +
                            actualsLine +
                        '</div>' +
                        '<div class="flex-grow p-3 space-y-2 overflow-y-auto no-scrollbar bg-slate-50/50 stage-drop-zone" data-stage="' + k + '">' +
                            self.renderItems(k) +
                        '</div>' +
                        '<div class="p-4 border-t border-slate-100 bg-white shrink-0">' +
                            '<button onclick="mBTStages.openAddModal(\'' + k + '\')" class="w-full py-2 rounded-xl bg-slate-50 border border-slate-100 text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 hover:border-blue-100 hover:bg-white transition-all">+ Add Item</button>' +
                        '</div>' +
                    '</div>';
                }).join('');

                container.innerHTML = html;
                /* Re-attach drag and drop after DOM rebuild */
                this.initDragAndDrop();
                /* Re-attach scroll spy now that card elements exist in DOM */
                this._observeTabPanels();
            },

            /* --- Render Items in a Stage Card --- */
            renderItems: function(stageKey) {
                var b = this.state.project;
                var items = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[stageKey]) {
                            items.push({ item: item, secName: secName, order: item.stageData[stageKey].order || 0 });
                        }
                    });
                });
                items.sort(function(a, b) { return a.order - b.order; });

                if (!items.length) {
                    return '<div class="flex flex-col items-center justify-center py-8 gap-3">' +
                        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>' +
                        '<p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">No items assigned</p>' +
                        '<p class="text-[8px] font-bold text-slate-400">Add crew from the Setup tab</p>' +
                        '</div>';
                }

                /* Phase 90.RC: resolve temporal settings for payable-day cost display */
                var _workWeek   = (b.settings && b.settings.workWeek) || 5;
                var _blackouts  = b.blackoutDays || [];
                var _starts     = getStageStartDates(b);

                return items.map(function(entry) {
                    var item = entry.item;
                    var sd   = item.stageData[stageKey];
                    var _sdMult = (sd.multiplier === undefined || sd.multiplier === null || sd.multiplier === '') ? 1 : (parseFloat(sd.multiplier) || 0);
                    var _multActive = Math.abs(_sdMult - 1) > 0.0001;
                    /* Phase 195: Source-of-truth formula (quantity + TZ-normalised days) */
                    var cost = _calculateItemCost(item, stageKey, b);
                    return '<div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm stage-item group cursor-grab active:cursor-grabbing" data-id="' + esc(item.id) + '">' +
                        '<div class="flex justify-between items-start mb-2">' +
                            '<div class="min-w-0 flex-grow pr-2">' +
                                '<p class="text-[10px] font-black text-slate-800 leading-tight truncate uppercase tracking-tight">' + esc(item.description || 'UNTITLED') + '</p>' +
                                '<p class="text-[7px] font-black text-slate-400 uppercase tracking-widest truncate">' + esc(entry.secName) + '</p>' +
                            '</div>' +
                            '<button onclick="mBTStages.removeItem(\'' + esc(item.id) + '\', \'' + stageKey + '\')" class="stage-remove-btn text-slate-300 active:text-rose-500 transition-all shrink-0">' +
                                '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                            '</button>' +
                        '</div>' +
                        '<div class="flex items-center gap-2">' +
                            '<div>' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Days</label>' +
                                '<input type="number" value="' + (sd.days || 0) + '" oninput="mBTStages.updateItemDays(\'' + esc(item.id) + '\', \'' + stageKey + '\', this.value)" class="w-10 bg-slate-50 rounded text-center text-[10px] text-blue-600 font-bold outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div>' +

                                '<input type="number" value="' + (sd.rate || item.rate || 0) + '" oninput="mBTStages.updateItemRate(\'' + esc(item.id) + '\', \'' + stageKey + '\', this.value)" class="w-16 bg-slate-50 rounded text-center text-[10px] text-slate-600 font-bold outline-none no-spinner border border-slate-100">' +

                                '<input type="number" step="0.1" min="0" value="' + _sdMult + '" oninput="mBTStages.updateItemMultiplier(\'' + esc(item.id) + '\', \'' + stageKey + '\', this.value)" class="w-10 ' + (_multActive ? 'bg-indigo-50 text-indigo-700 font-black' : 'bg-slate-50 text-slate-500 font-bold') + ' rounded text-center text-[10px] outline-none no-spinner border border-slate-100">' +
                            '</div>' +
