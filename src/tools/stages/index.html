<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MooBudget — Stages Studio</title>
    <script src="../../lib/tailwind.min.js"></script>
    <script src="../../core/components/EmbeddedMode.js"></script>
    <script src="../../lib/Sortable.min.js"></script>
    <script src="../../lib/localforage.min.js"></script>
    <script>
        /* Theme Bridge: Instant Inheritance */
        (function() {
            var activeTheme = localStorage.getItem('mbt_active_theme') || 'light';
            document.documentElement.className = 'mbt-theme-' + activeTheme;
        })();
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Theme Bridge: Bilateral Architecture */
        .mbt-theme-dark { background-color: #020617; color: white; }
        .mbt-theme-dark .studio-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(24px); border-color: rgba(255, 255, 255, 0.1); }
        .mbt-theme-dark .mbt-header { background-color: #0f172a; border-bottom-color: #1e293b; }
        .mbt-theme-dark #panel-setup { background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(24px); }
        
        .studio-card { background: #fff; border-right: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; position: relative; z-index: 1; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border-radius: 16px; }
        .burn-ring { transition: stroke-dashoffset 1s ease-out, stroke 0.5s ease; }
        .conflict-glow { box-shadow: 0 0 20px rgba(245,158,11,0.2); border-color: #f59e0b !important; animation: pulse-amber 2s infinite; }
        @keyframes pulse-amber {
            0%   { box-shadow: 0 0 0 0   rgba(245,158,11,0.4); }
            70%  { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
            100% { box-shadow: 0 0 0 0   rgba(245,158,11,0); }
        }
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }
        .sortable-drag  { cursor: grabbing; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        /* Phase 62: RBAC view-only state — applied via body[data-rbac-role="viewer"] */
        body[data-rbac-role="viewer"] .stage-remove-btn    { display: none !important; }
        body[data-rbac-role="viewer"] .stage-draggable     { cursor: default !important; }
        body[data-rbac-role="viewer"] input                { opacity: 0.45 !important; pointer-events: none !important; }
        body[data-rbac-role="viewer"] #stage-add-btn,
        body[data-rbac-role="viewer"] [onclick*="clearAll"],
        body[data-rbac-role="viewer"] [onclick*="autoFillAll"],
        body[data-rbac-role="viewer"] [onclick*="bulkAction"],
        body[data-rbac-role="viewer"] [onclick*="syncFromDb"] { opacity: 0.4 !important; pointer-events: none !important; }
        .sync-bounce { animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.2,1)} }
        /* Tab Navigation Bar */
        .tab-btn.active { color: #2563eb; background: #dbeafe; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #2563eb; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .tab-btn[data-tab="panel-setup"] { min-width: 70px; }
        .tab-btn[data-tab="panel-vitals"] { min-width: 70px; }
        /* Add-item modal */
        #add-item-modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); }
        #add-item-modal.open { display:flex; }
        /* --- Tap targets: 44px minimum for all buttons and links --- */
        button, a { min-height: 44px; }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <div class="mbt-header h-12 bg-slate-100 flex items-center justify-between px-4 border-b border-slate-200 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <button id="btn-back" aria-label="Close" title="Close" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-white/60 hover:text-white transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <div class="h-4 w-px bg-slate-800"></div>
            <div class="flex items-center gap-2">
                <span class="text-white text-[11px] font-black uppercase tracking-tight">Project Stages</span>
                <span id="project-tag" class="bg-blue-600 text-[8px] font-black px-1.5 py-0.5 rounded text-white uppercase tracking-widest">Loading...</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex flex-col items-end">
                <span id="active-project-name" class="text-white text-[10px] font-black uppercase tracking-tight opacity-90">—</span>
                <span class="text-slate-500 text-[8px] font-bold uppercase tracking-widest">Stages Studio</span>
            </div>
        </div>
    </div>

    <!-- Sticky Tab Navigation Bar -->
    <div class="sticky top-0 z-40 bg-slate-50 border-b border-slate-200 flex items-center px-4 shrink-0">
        <div class="flex items-center gap-1.5">
            <button data-tab="panel-setup" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">Setup</button>
            <button data-tab="panel-vitals" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[60px] text-center">View</button>
            <button data-tab="dev" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dev</button>
            <button data-tab="pre" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Pre</button>
            <button data-tab="prod" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Prod</button>
            <button data-tab="post" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Post</button>
            <button data-tab="dist" class="tab-btn px-3 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-all min-w-[50px] text-center">Dist</button>
        </div>
    </div>

    <!-- Skeleton loader — hidden once project data is rendered -->
    <div id="stages-skeleton" class="flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 gap-3 p-3">
        <div class="animate-pulse min-w-[320px] w-[320px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-2/3"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
            <div class="h-10 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[340px] w-[340px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
            <div class="h-24 bg-slate-100 rounded-xl"></div>
        </div>
        <div class="animate-pulse min-w-[300px] w-[300px] shrink-0 bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-3">
            <div class="h-3 bg-slate-200 rounded w-3/4"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
            <div class="h-16 bg-slate-100 rounded-xl"></div>
        </div>
    </div>

    <!-- Main Layout -->
    <div id="studio-layout" class="hidden flex-grow flex overflow-x-auto no-scrollbar bg-slate-100 snap-x snap-mandatory cursor-grab active:cursor-grabbing select-none">

        <!-- Setup Panel -->
        <div id="panel-setup" class="studio-card min-w-[320px] w-[320px] snap-start shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Configuration</span>
                <button onclick="mBTStageStudio.syncFromDb()" aria-label="Sync from budget database" class="text-slate-500 hover:text-blue-400 transition-colors uppercase text-[8px] font-black tracking-widest flex items-center gap-1.5">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Sync
                </button>
            </div>
            <div class="p-6 space-y-8 overflow-y-auto no-scrollbar">
                <!-- Dates -->
                <div class="space-y-4">
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Start Date</label>
                        <input type="date" id="start-date" aria-label="Project start date" onchange="mBTStageStudio.updateDate('start', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors">
                    </div>
                    <div>
                        <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Delivery Target</label>
                        <input type="date" id="delivery-date" aria-label="Project delivery target date" onchange="mBTStageStudio.updateDate('delivery', this.value)" class="w-full bg-slate-800 text-white text-[11px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 transition-colors" id="delivery-date-input">
                    </div>
                </div>
                <!-- Cap -->
                <div>
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block">Total Cap Limit</label>
                    <div class="flex items-center gap-2 border-b-2 border-slate-700 pb-1">
                        <span class="text-slate-600 text-xl font-black">$</span>
                        <input type="number" id="total-cap" aria-label="Total cap limit" placeholder="0.00" oninput="mBTStageStudio.updateCap(this.value)" class="w-full bg-transparent text-2xl font-black text-white outline-none placeholder-slate-800">
                    </div>
                </div>
                <!-- Sliders -->
                <div id="preset-sliders" class="space-y-6"></div>
                <!-- Industry Preset -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-2 block">Distribution Model</label>
                    <select aria-label="Distribution model preset" onchange="mBTStageStudio.applyPreset(this.value); this.value=''" class="w-full bg-slate-800 text-white text-[10px] font-bold p-3 rounded-xl outline-none border border-slate-700 focus:border-blue-600 cursor-pointer appearance-none">
                        <option value="" disabled selected>Load Industry Preset...</option>
                        <option value="TVC">TVC</option>
                        <option value="Music Video">Music Video</option>
                        <option value="Documentary">Documentary</option>
                        <option value="Feature Film">Feature Film</option>
                    </select>
                </div>
                <!-- Bulk Operations -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-3 block">Bulk Operations</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="mBTStageStudio.bulkAction('lockAll')" aria-label="Lock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Lock All</button>
                        <button onclick="mBTStageStudio.bulkAction('unlockAll')" aria-label="Unlock all stage sliders" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Unlock All</button>
                        <button onclick="mBTStageStudio.bulkAction('syncDays')" aria-label="Sync stage days to max item days" class="bg-slate-800 hover:bg-amber-600 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Sync Days</button>
                        <button onclick="mBTStageStudio.bulkAction('dedupe')" aria-label="Remove duplicate items across stages" class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Dedupe</button>
                        <button onclick="mBTStageStudio.autoFillAll()" aria-label="Neural fill stage assignments" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            Neural Fill
                        </button>
                        <button onclick="mBTStageStudio.clearAll()" aria-label="Clear all stage assignments" class="col-span-2 bg-slate-800 hover:bg-rose-800 text-slate-400 hover:text-rose-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-all">Clear All Stages</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vitals Panel -->
        <div id="panel-vitals" class="studio-card min-w-[340px] w-[340px] snap-center shrink-0">
            <div class="p-4 border-b border-slate-100 shrink-0">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Project Vital Signs</span>
            </div>
            <div class="p-8 flex flex-col items-center flex-grow overflow-y-auto no-scrollbar">
                <!-- SVG Burn Ring -->
                <div class="relative w-48 h-48 mb-8">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="44" stroke="#f1f5f9" stroke-width="12" fill="none"/>
                        <circle id="burn-meter" cx="50" cy="50" r="44" stroke="#2563eb" stroke-width="12" fill="none" stroke-dasharray="276.46" stroke-dashoffset="276.46" class="burn-ring" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
                        <span id="burn-pct" class="text-4xl font-black text-slate-900 leading-none tracking-tighter truncate w-full px-2 block">0%</span>
                        <span id="burn-label" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Burn</span>
                    </div>
                </div>
                <!-- Stats -->
                <div class="w-full space-y-2">
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Grand Total</span>
                        <span id="stat-grand-total" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Cap Limit</span>
                        <span id="stat-total-cap" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Daily Burn</span>
                        <span id="stat-daily-burn" class="text-sm font-black text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Runway</span>
                        <span id="stat-runway" class="text-sm font-black text-slate-900">0 Days</span>
                    </div>
                    <div class="flex justify-between items-end p-3 rounded-xl" style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.08);">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Risk</span>
                        <span id="stat-risk" class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Minimal</span>
                    </div>
                </div>
                <!-- Timeline Projections -->
                <div class="w-full mt-8 space-y-3">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Timeline Projections</p>
                    <div id="timeline-audit" class="space-y-3"></div>
