            /* ========= Persistence ========= */

            save: function() {
                var self = this, cleanProject;
                if (!self.state.project) return;
                /* Inside the app: send only the Stages changes to the budget window, which applies them to its open budget
                   (with unsaved edits) and saves. This tool never writes the budget and never posts reconcile. */
                if (window.parent !== window) return self._saveThroughApp();
                if (self.state._projectKey && typeof localforage !== 'undefined') return self._saveStandalone();
                if (window.mBT && window.mBT.storage) {
                    cleanProject = JSON.parse(JSON.stringify(self.state.project));
                    cleanProject.updated_at = new Date().toISOString();
                    return window.mBT.storage.updateProject(cleanProject).catch(function (err) { console.error('[Stages] Save failed:', err); });
                }
            },

            _saveThroughApp: function () {
                var self = this, followKeys = _mBTStagesFollowStageKeys.slice(), step;
                _mBTStagesFollowStageKeys = [];
                self._pendingSaves = (self._pendingSaves || 0) + 1;
                step = (self._saveQueue || Promise.resolve()).catch(function () {}).then(function () {
                    self._prepareShootScheduleForSave();
                    var moves = (self.state._moves || []).slice();
                    var delta = stagesDelta(self.state._base, self.state.project, followKeys, moves);
                    if (delta.empty) return null;
                    return self._sendToApp(delta).then(function (message) {
                        /* The base moves by exactly what the budget confirmed. */
                        applyStagesDelta(self.state._base, delta);
                        self.state._moves = (self.state._moves || []).slice(moves.length);
                        if (message) stagesShowNotice(message, 'note'); else stagesClearFailure();
                    });
                });
                self._saveQueue = step;
                return step.then(function () { self._pendingSaves--; return true; }, function (err) {
                    self._pendingSaves--;
                    _mBTStagesFollowStageKeys = followKeys.concat(_mBTStagesFollowStageKeys);
                    console.error('[Stages] Save failed:', err);
                    stagesShowNotice('Stages changes were not saved: ' + ((err && err.message) || 'the budget could not save them') + ' Your changes are kept on this screen. Change anything or press Retry to save again.', 'failure');
                    return false;
                });
            },

            _sendToApp: function (delta) {
                var self = this;
                return new Promise(function (resolve, reject) {
                    var id, timer;
                    self._ackSeq = (self._ackSeq || 0) + 1;
                    id = self._ackSeq;
                    self._acks = self._acks || {};
                    timer = setTimeout(function () { delete self._acks[id]; reject(new Error('The budget did not confirm the save.')); }, 20000);
                    self._acks[id] = {
                        ok: function (message) { clearTimeout(timer); resolve(message || ''); },
                        fail: function (message) { clearTimeout(timer); reject(new Error(message || 'the budget could not save it.')); }
                    };
                    window.parent.postMessage({ type: 'mbt:tool-action', action: 'stages-update', payload: { requestId: id, projectKey: self.state._projectKey, delta: delta } }, window.location.origin);
                });
            },

            /* On its own (no budget window): write only the Stages changes onto the freshly read stored copy, advance
               updated_at, and refuse to write over a copy saved somewhere else after this one was read. The draft stays. */
            _saveStandalone: function () {
                var self = this, key = self.state._projectKey;
                self._pendingSaves = (self._pendingSaves || 0) + 1;
                self._saveQueue = (self._saveQueue || Promise.resolve()).catch(function () {}).then(function () {
                    self._prepareShootScheduleForSave();
                    var moves = (self.state._moves || []).slice();
                    var delta = stagesDelta(self.state._base, self.state.project, [], moves);
                    if (delta.empty) return null;
                    return localforage.getItem(key).then(function (stored) {
                        var stale;
                        if (!stored) throw new Error('The saved budget could not be found.');
                        if ((stored.updated_at || '') > (self.state._baseUpdatedAt || '')) { stale = new Error('stale'); stale.stale = true; throw stale; }
                        applyStagesDelta(stored, delta);
                        stored.updated_at = stagesNextStamp(stored.updated_at);
                        return localforage.setItem(key, stored).then(function () {
                            self.state._baseUpdatedAt = stored.updated_at;
                            applyStagesDelta(self.state._base, delta);
                            self.state._moves = (self.state._moves || []).slice(moves.length);
                            stagesClearFailure();
                        });
                    });
                });
                return self._saveQueue.then(function () { self._pendingSaves--; return true; }, function (err) {
                    self._pendingSaves--;
                    console.error('[Stages] Save failed:', err);
                    stagesShowNotice(err && err.stale
                        ? 'A newer copy of this budget was saved somewhere else. Your Stages changes are kept on this screen but were not saved. Reopen the budget to see the newer copy.'
                        : 'Stages changes were not saved: ' + ((err && err.message) || 'storage error') + ' Your changes are kept on this screen.', 'failure');
                    return false;
                });
            },

            /* A drag between stages is remembered so it is sent as a move, not as a copy of the old stage. */
            _recordMove: function (id, from, to) {
                this.state._moves = this.state._moves || [];
                var baseHit = this.state._base ? stagesFindItem(this.state._base, id) : null;
                /* Remember whether the destination was already in the Stages base: if it was not and the budget has it, the move is skipped. */
                this.state._moves.push({ id: id, from: from, to: to, destInBase: !!(baseHit && baseHit.item.stageData && baseHit.item.stageData[to]) });
            },

            /* Take a newer copy of the budget as the new base and put any unsaved Stages edits back on top of it. */
            _rebase: function (fresh) {
                var self = this, pending = null, next = JSON.parse(JSON.stringify(fresh));
                if (self.state._base && self.state.project) pending = stagesDelta(self.state._base, self.state.project, [], self.state._moves || []);
                if (pending && !pending.empty) applyStagesDelta(next, pending);
                self.state._base = JSON.parse(JSON.stringify(fresh));
                self.state._baseUpdatedAt = fresh.updated_at || self.state._baseUpdatedAt || '';
                self.state.project = next;
            },

            syncFromDb: function() {
                var self = this;
                var loadPromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    loadPromise = localforage.getItem(self.state._projectKey);
                } else if (self.state.projectId && window.mBT && window.mBT.storage) {
                    loadPromise = window.mBT.storage.getProject(self.state.projectId);
                } else { return; }
                loadPromise.then(function(project) {
                    if (project) { self._rebase(project); self.render(); }
                });
            },

            /* ========= Drag and Drop ========= */

            initDragAndDrop: function() {
                var self = this;
                /* Phase 62: read RBAC role from parent's localStorage — if viewer, mount static */
                var rbacRole = 'editor';
                try { rbacRole = localStorage.getItem('mbt_rbac_role') || 'editor'; } catch(_) {}
                var isViewOnly = (rbacRole === 'viewer');

                dom.querySelectorAll('.stage-drop-zone').forEach(function(zone) {
                    var instance = new Sortable(zone, {
                        group: 'stages',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        dragClass: 'sortable-drag',
                        disabled: isViewOnly,  /* Natively kills drag-and-drop for view-only users */
                        onEnd: function(evt) {
                            stagesPushUndoImmediate();
                            var itemId    = evt.item.dataset.id;
                            var fromStage = evt.from.dataset.stage;
                            var toStage   = evt.to.dataset.stage;

                            if (fromStage !== toStage) {
                                var item = self._findItem(itemId);
                                if (item && item.stageData && item.stageData[fromStage]) {
                                    item.stageData[toStage] = Object.assign({}, item.stageData[fromStage]);
                                    delete item.stageData[fromStage];
                                    self._recordMove(itemId, fromStage, toStage);
                                }
                                _mBTStagesQueueFollow(toStage);
                                _mBTStagesQueueFollow(fromStage);
                            }

                            /* Persist new order */
                            var itemsInStage = Array.from(evt.to.children).map(function(c) { return c.dataset.id; });
                            itemsInStage.forEach(function(id, idx) {
                                var item = self._findItem(id);
                                if (item && item.stageData && item.stageData[toStage]) item.stageData[toStage].order = idx;
                            });

                            self.renderVitals();
                            self.renderStageCards();
                            if (_mBTStagesFollowStageKeys.length) {
                                _mBTStagesApplyFollowHeaders(self.state.project);
                            }
                            self.save();
                        }
                    });
                });
            },

            /* ========= Carousel Grab-Scroll ========= */

            _initCarouselScroll: function() {
                var slider = dom.getElementById('stages-layout');
                var isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', function(e) {
                    if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
                    if (e.target.closest('.stage-item') || e.target.closest('.stage-drop-zone')) return;
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                    slider.style.cursor = 'grabbing';
                });
                slider.addEventListener('mouseleave', function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mouseup',    function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mousemove',  function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    slider.scrollLeft = scrollLeft - (e.pageX - slider.offsetLeft - startX) * 2;
                });
            },

            /* ========= Tab Navigation Bar ========= */

            _initTabBarScrollHint: function() {
                var bar = dom.getElementById('stages-tab-bar');
                var fadeR = dom.getElementById('stages-tab-bar-fade-r');
                if (!bar || !fadeR) return;
                var update = function() {
                    var overflow = bar.scrollWidth > bar.clientWidth + 1;
                    var atEnd = bar.scrollLeft >= bar.scrollWidth - bar.clientWidth - 1;
                    if (overflow && !atEnd) {
                        fadeR.classList.add('visible');
                    } else {
                        fadeR.classList.remove('visible');
                    }
                };
                bar.addEventListener('scroll', update);
                window.addEventListener('resize', update);
                if (typeof ResizeObserver !== 'undefined') {
                    try {
                        var ro = new ResizeObserver(update);
                        ro.observe(bar);
                    } catch (e) { /* ignore */ }
                }
                update();
            },

            _initTabNavigation: function() {
                var self = this;
                var tabs = dom.querySelectorAll('.tab-btn');
                var carousel = dom.getElementById('stages-layout');
                var scrollTimer, resizeTimer;
                self._tabBtns = tabs;

                function activate(panelId) {
                    self._activeTabPanelId = panelId;
                    tabs.forEach(function(tab) {
                        tab.classList.toggle('active', tab.dataset.tab === panelId);
                    });
                }

                /* Measure in carousel coordinates: stage cards live inside a nested flex container. */
                self._centerTabPanel = function(panelId, behavior) {
                    var panel = dom.getElementById(panelId);
                    if (!panel) return;
                    var first = dom.getElementById('panel-setup');
                    var last = dom.getElementById('dist');
                    if (first && last) {
                        carousel.style.setProperty('--stage-leading', Math.max(0, (carousel.clientWidth - first.getBoundingClientRect().width) / 2) + 'px');
                        carousel.style.setProperty('--stage-trailing', Math.max(0, (carousel.clientWidth - last.getBoundingClientRect().width) / 2) + 'px');
                    }
                    var bounds = carousel.getBoundingClientRect();
                    var rect = panel.getBoundingClientRect();
                    var left = carousel.scrollLeft + rect.left - bounds.left - carousel.clientLeft +
                        (rect.width - carousel.clientWidth) / 2;
                    left = Math.max(0, Math.min(left, carousel.scrollWidth - carousel.clientWidth));
                    self._selectedTabPanelId = panelId;
                    activate(panelId);
                    carousel.scrollTo({ left: left, behavior: behavior });
                };

                tabs.forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        self._centerTabPanel(this.dataset.tab, 'smooth');
                    });
                });

                /* Keep the clicked tab active throughout animation, even with several visible cards.
                   Manual scrolling hands selection back to the card nearest the carousel center. */
                function manualScroll() { self._selectedTabPanelId = null; }
                carousel.addEventListener('wheel', manualScroll);
                carousel.addEventListener('pointerdown', manualScroll);
                carousel.addEventListener('touchstart', manualScroll);
                carousel.addEventListener('keydown', function(e) {
                    if (['ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].indexOf(e.key) !== -1) manualScroll();
                });
                carousel.addEventListener('scroll', function() {
                    clearTimeout(scrollTimer);
                    scrollTimer = setTimeout(function() {
                        if (self._selectedTabPanelId) return;
                        var bounds = carousel.getBoundingClientRect();
                        var center = bounds.left + carousel.clientLeft + carousel.clientWidth / 2;
                        var nearest = null;
                        var distance = Infinity;
                        tabs.forEach(function(tab) {
                            var panel = dom.getElementById(tab.dataset.tab);
                            if (!panel) return;
                            var rect = panel.getBoundingClientRect();
                            var delta = Math.abs(rect.left + rect.width / 2 - center);
                            if (delta < distance) { distance = delta; nearest = tab.dataset.tab; }
                        });
                        if (nearest) activate(nearest);
                    }, 120);
                });
                window.addEventListener('resize', function() {
                    self._centerTabPanel(self._selectedTabPanelId || self._activeTabPanelId, 'auto');
                    /* Card widths transition for 300ms; measure their settled widths too. */
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        self._centerTabPanel(self._selectedTabPanelId || self._activeTabPanelId, 'auto');
                    }, 350);
                });
                /* Iframe and card sizes can settle after the window resize event. */
                if (typeof ResizeObserver !== 'undefined') {
                    var panelSizes = new ResizeObserver(function() {
                        self._centerTabPanel(self._selectedTabPanelId || self._activeTabPanelId || 'panel-setup', 'auto');
                    });
                    panelSizes.observe(carousel);
                    panelSizes.observe(dom.getElementById('panel-setup'));
                }
                activate('panel-setup');
            },

            /* Preserve the selected panel when budget updates replace the stage cards. */
            _observeTabPanels: function() {
                if (this._centerTabPanel) {
                    this._centerTabPanel(this._selectedTabPanelId || this._activeTabPanelId || 'panel-setup', 'auto');
                }
            },

            /* ========= Utilities ========= */

            _findItem: function(id) {
                var b = this.state.project;
                var found = null;
                Object.values(b.sections || {}).forEach(function(sec) {
                    if (found) return;
                    var item = (sec.items || []).find(function(i) { return i.id === id; });
                    if (item) found = item;
                });
                return found;
            },

            _showError: function(msg) {
                dom.getElementById('stages-layout').innerHTML =
                    '<div class="flex-grow flex items-center justify-center">' +
                        '<div class="text-center">' +
                            '<p class="text-4xl font-black text-slate-200 uppercase tracking-tighter mb-2">Not Connected</p>' +
                            '<p class="text-[11px] font-bold text-slate-400">' + esc(msg) + '</p>' +
                        '</div>' +
                    '</div>';
            }
        };

        window.onload = function() { mBTStages.init(); };
        window.addEventListener('message', function (e) {
            if (e.origin !== window.location.origin || e.source !== window.parent || !e.data || e.data.action !== 'owner-budget-update') return;
            mBTStages._rebase(e.data.payload);
            mBTStages.state._projectKey = 'prodBudget_v5_' + mBTStages.state.project.projectName;
            mBTStages.render();
        });
    </script>
</body>
</html>
