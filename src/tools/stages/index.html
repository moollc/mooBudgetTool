                    for (i = 0; i < contacts.length; i++) {
                        c = contacts[i] || {};
                        cName = c.name != null ? String(c.name).trim() : '';
                        if (cName && cName.toLowerCase() === needle) { hit = c; break; }
                    }
                }
                function writePhone(next) {
                    loc.siteContactPhone = next;
                    if (locEl && locEl.querySelector) {
                        phoneEl = locEl.querySelector('.sd-loc-site-phone');
                        if (phoneEl) phoneEl.value = next;
                    }
                }
                if (hit) {
                    loc.siteContactId = hit.id != null ? String(hit.id) : '';
                    loc.siteContactName = hit.name != null ? String(hit.name) : '';
                    phone = hit.phone != null ? String(hit.phone).trim() : '';
                    if (!prevPhone || prevPhone === prevMatchPhone) writePhone(phone);
                } else {
                    loc.siteContactId = '';
                    loc.siteContactName = typed == null ? '' : String(typed);
                    if (!prevPhone || prevPhone === prevMatchPhone) writePhone('');
                }
            },

            _blankLoc: function () {
                var loc = { id: '', name: '', address: '', parish: '', siteContactId: '', siteContactName: '', siteContactPhone: '', nearestHospital: '', tbc: false };
                /* Assign the location id at add time so leg/interview dropdowns hold a real value before save. */
                var api = this._shootScheduleApi();
                if (api && typeof api.ensureIds === 'function') {
                    var seen = { shootSchedule: [] };
                    var b = this.state && this.state.project;
                    if (b && Array.isArray(b.shootSchedule)) {
                        b.shootSchedule.forEach(function (d) {
                            if (!d) return;
                            var copy = { id: d.id || '', locations: [], legs: [], interviews: [] };
                            (d.locations || []).forEach(function (r) { copy.locations.push({ id: (r && r.id) || '' }); });
                            (d.legs || []).forEach(function (r) { copy.legs.push({ id: (r && r.id) || '' }); });
                            (d.interviews || []).forEach(function (r) { copy.interviews.push({ id: (r && r.id) || '' }); });
                            seen.shootSchedule.push(copy);
                        });
                    }
                    if (!seen.shootSchedule.length) {
                        seen.shootSchedule.push({ id: 'day_shell', locations: [], legs: [], interviews: [] });
                    }
                    seen.shootSchedule[0].locations.push(loc);
                    api.ensureIds(seen);
                }
                return loc;
            },

            _blankLeg: function () {
                return { id: '', kind: 'other', time: '', locationId: '', contactId: null, note: '', tbc: false };
            },

            _blankInterview: function () {
                return { id: '', contactId: null, name: '', role: '', time: '', locationId: '', releaseStatus: 'none' };
            },

            _kindLabel: function (kind) {
                var k = String(kind || '');
                if (!k) return '';
                return k.charAt(0).toUpperCase() + k.slice(1);
            },

            _locOptions: function (day, selected) {
                var locs = (day && day.locations) || [];
                var html = '<option value=""></option>';
                var i, loc, id;
                for (i = 0; i < locs.length; i++) {
                    loc = locs[i] || {};
                    id = loc.id != null ? String(loc.id) : '';
                    html += '<option value="' + esc(id) + '"' + (selected === id ? ' selected' : '') + '>' + esc(loc.name || id || ('Location ' + (i + 1))) + '</option>';
                }
                return html;
            },

            _kindOptions: function (selected) {
                var api = this._shootScheduleApi();
                var kinds = (api && api.KINDS) ? api.KINDS : ['pickup', 'depart', 'arrive', 'start', 'wrap', 'return', 'interview', 'other'];
                var html = '';
                var i, k;
                for (i = 0; i < kinds.length; i++) {
                    k = kinds[i];
                    html += '<option value="' + esc(k) + '"' + (selected === k ? ' selected' : '') + '>' + esc(this._kindLabel(k)) + '</option>';
                }
                return html;
            },

            _releaseOptions: function (selected) {
                var vals = ['none', 'pending', 'signed'];
                var html = '';
                var i, v;
                for (i = 0; i < vals.length; i++) {
                    v = vals[i];
                    html += '<option value="' + esc(v) + '"' + (selected === v ? ' selected' : '') + '>' + esc(v) + '</option>';
                }
                return html;
            },

            _prodDayCount: function () {
                var b = this.state.project;
                var s = b && b.targetLock && b.targetLock.stages && b.targetLock.stages.prod;
                var n = s ? parseFloat(s.days) : 0;
                return isFinite(n) ? n : 0;
            },

            _scheduleList: function () {
                var b = this.state.project;
                if (!b) return [];
                if (!Object.prototype.hasOwnProperty.call(b, 'shootSchedule')) return [];
                return Array.isArray(b.shootSchedule) ? b.shootSchedule : [];
            },

                            '<input type="date" class="sd-date border border-slate-200 rounded-lg px-2 py-1 text-[11px]" value="' + esc(day.date || '') + '" data-day-index="' + di + '">' +
                            '<input type="text" class="sd-label flex-1 border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Label" value="' + esc(day.label || '') + '" data-day-index="' + di + '">' +
                            '<label class="text-[9px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-1"><input type="checkbox" class="sd-tbc" data-day-index="' + di + '"' + (day.tbc ? ' checked' : '') + '> TBC</label>' +
                            '<button type="button" class="sd-remove-day text-[9px] font-black uppercase tracking-widest text-rose-600" data-day-index="' + di + '">Remove</button>' +
                        '</div>' +
                        '<div class="space-y-1">' +
                            '<div class="flex items-center justify-between"><span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Locations</span>' +
                            '<button type="button" class="sd-add-location text-[9px] font-black uppercase tracking-widest text-blue-600" data-day-index="' + di + '">Add location</button></div>';
                    for (li = 0; li < (day.locations || []).length; li++) {

                            '<input type="text" class="sd-loc-address border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Address" value="' + esc(loc.address || '') + '">' +
                            '<input type="text" class="sd-loc-parish border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Parish" value="' + esc(loc.parish || '') + '">' +
                            '<input type="text" class="sd-loc-hospital border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Hospital" value="' + esc(loc.nearestHospital || '') + '">' +
                            '<label class="text-[9px] font-bold text-slate-500 flex flex-col gap-0.5">Site contact' +
                            '<input type="text" class="sd-loc-site-contact border border-slate-200 rounded-lg px-2 py-1 text-[11px]" list="sd-site-contacts-' + di + '-' + li + '" value="' + esc(loc.siteContactName || '') + '"></label>' +
                            '<label class="text-[9px] font-bold text-slate-500 flex flex-col gap-0.5">Site phone' +
                            '<input type="text" class="sd-loc-site-phone border border-slate-200 rounded-lg px-2 py-1 text-[11px]" value="' + esc(loc.siteContactPhone || '') + '"></label>' +
                            self._stagesContactDatalistHtml('sd-site-contacts-' + di + '-' + li) +

                    for (lg = 0; lg < (day.legs || []).length; lg++) {
                        leg = day.legs[lg] || {};
                        html += '<div class="sd-leg grid grid-cols-2 gap-1" data-day-index="' + di + '" data-leg-index="' + lg + '">' +
                            '<select class="sd-leg-kind border border-slate-200 rounded-lg px-2 py-1 text-[11px]">' + self._kindOptions(leg.kind || 'other') + '</select>' +
                            '<input type="time" class="sd-leg-time border border-slate-200 rounded-lg px-2 py-1 text-[11px]" value="' + esc(leg.time || '') + '">' +
                            '<select class="sd-leg-location border border-slate-200 rounded-lg px-2 py-1 text-[11px]">' + self._locOptions(day, leg.locationId != null ? String(leg.locationId) : '') + '</select>' +
                            '<input type="text" class="sd-leg-note border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Note" value="' + esc(leg.note || '') + '">' +
                            '<label class="text-[9px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-1"><input type="checkbox" class="sd-leg-tbc"' + (leg.tbc ? ' checked' : '') + '> TBC</label>' +
                            '<button type="button" class="sd-remove text-[9px] font-black uppercase tracking-widest text-rose-600">Remove</button>' +
                        '</div>';
                    }
                    html += '</div><div class="space-y-1">' +
                        '<div class="flex items-center justify-between"><span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Interviews</span>' +
                        '<button type="button" class="sd-add-interview text-[9px] font-black uppercase tracking-widest text-blue-600" data-day-index="' + di + '">Add interview</button></div>';
                    for (ii = 0; ii < (day.interviews || []).length; ii++) {
                        row = day.interviews[ii] || {};
                        html += '<div class="sd-int grid grid-cols-2 gap-1" data-day-index="' + di + '" data-int-index="' + ii + '">' +
                            '<input type="text" class="sd-int-name border border-slate-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Name" value="' + esc(row.name || '') + '">' +
                            '<input type="time" class="sd-int-time border border-slate-200 rounded-lg px-2 py-1 text-[11px]" value="' + esc(row.time || '') + '">' +
                            '<select class="sd-int-location border border-slate-200 rounded-lg px-2 py-1 text-[11px]">' + self._locOptions(day, row.locationId != null ? String(row.locationId) : '') + '</select>' +
                            '<select class="sd-int-release border border-slate-200 rounded-lg px-2 py-1 text-[11px]">' + self._releaseOptions(row.releaseStatus || 'none') + '</select>' +

                        '</div>';

                var noteHidden = note.classList.contains('hidden') || note.style.display === 'none';

                    (noteHidden ? ' hidden' : '') + '"' +
                    (noteHidden ? ' style="display:none"' : '') + '></p>' + html;
                note = dom.getElementById('sd-days-note');
                if (note) {
                    note.textContent = noteText;
                    if (noteHidden) { note.classList.add('hidden'); note.style.display = 'none'; }
                    else { note.classList.remove('hidden'); note.style.display = ''; }
                }
                this._wireShootDaysOnce();
            },

            _wireShootDaysOnce: function () {
                var self = this;
                if (self._shootDaysWired) return;
                self._shootDaysWired = true;
                var addBtn = dom.getElementById('sd-add-day');
                if (addBtn) {
                    addBtn.addEventListener('click', function () {
                        stagesPushUndoImmediate();
                        var b = self.state.project;
                        if (!b) return;
                        if (!Array.isArray(b.shootSchedule)) b.shootSchedule = [];
                        b.shootSchedule.push(self._blankDay());
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                    });
                }
                var root = dom.getElementById('shoot-days');
                if (!root) return;
                root.addEventListener('click', function (e) {
                    var t = e.target;
                    if (!t || !t.classList) return;
                    var dayEl = t.closest ? t.closest('.sd-day') : null;
                    var dayIndex = dayEl ? parseInt(dayEl.getAttribute('data-day-index'), 10) : -1;
                    var b = self.state.project;
                    if (!b) return;
                    if (!Array.isArray(b.shootSchedule)) return;
                    if (t.classList.contains('sd-add-day') || t.id === 'sd-add-day') return;
                    if (t.classList.contains('sd-remove-day')) {
                        stagesPushUndoImmediate();
                        b.shootSchedule.splice(dayIndex, 1);
                        if (!b.shootSchedule.length && !Object.prototype.hasOwnProperty.call(self.state._base || {}, 'shootSchedule')) {
                            /* keep [] so a clear can be sent when base had days; if base never had one, delete */
                        }
                        if (!b.shootSchedule.length) {
                            var baseHad = self.state._base && Object.prototype.hasOwnProperty.call(self.state._base, 'shootSchedule') &&
                                Array.isArray(self.state._base.shootSchedule) && self.state._base.shootSchedule.length;
                            if (!baseHad) delete b.shootSchedule;
                        }
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                        return;
                    }
                    if (t.classList.contains('sd-add-location')) {
                        stagesPushUndoImmediate();
                        if (!b.shootSchedule[dayIndex].locations) b.shootSchedule[dayIndex].locations = [];
                        b.shootSchedule[dayIndex].locations.push(self._blankLoc());
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                        return;
                    }
                    if (t.classList.contains('sd-add-leg')) {
                        stagesPushUndoImmediate();
                        if (!b.shootSchedule[dayIndex].legs) b.shootSchedule[dayIndex].legs = [];
                        b.shootSchedule[dayIndex].legs.push(self._blankLeg());
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                        return;
                    }
                    if (t.classList.contains('sd-add-interview')) {
                        stagesPushUndoImmediate();
                        if (!b.shootSchedule[dayIndex].interviews) b.shootSchedule[dayIndex].interviews = [];
                        b.shootSchedule[dayIndex].interviews.push(self._blankInterview());
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                        return;
                    }
                    if (t.classList.contains('sd-remove')) {
                        stagesPushUndoImmediate();
                        var locEl = t.closest('.sd-loc');
                        var legEl = t.closest('.sd-leg');
                        var intEl = t.closest('.sd-int');
                        if (locEl) {
                            b.shootSchedule[dayIndex].locations.splice(parseInt(locEl.getAttribute('data-loc-index'), 10), 1);
                        } else if (legEl) {
                            b.shootSchedule[dayIndex].legs.splice(parseInt(legEl.getAttribute('data-leg-index'), 10), 1);
                        } else if (intEl) {
                            b.shootSchedule[dayIndex].interviews.splice(parseInt(intEl.getAttribute('data-int-index'), 10), 1);
                        }
                        self.renderShootDays();
                        _mBTStagesDebouncedSave();
                    }
                });
                root.addEventListener('input', function (e) { self._onShootDayField(e); });
                root.addEventListener('change', function (e) { self._onShootDayField(e); });
            },

            _onShootDayField: function (e) {
                var t = e.target;
                if (!t || !t.classList) return;
                var b = this.state.project;
                if (!b || !Array.isArray(b.shootSchedule)) return;
                var dayEl = t.closest ? t.closest('.sd-day') : null;
                if (!dayEl) return;
                var di = parseInt(dayEl.getAttribute('data-day-index'), 10);
                var day = b.shootSchedule[di];
                if (!day) return;
                stagesPushUndo();
                if (t.classList.contains('sd-date')) day.date = t.value || '';
                else if (t.classList.contains('sd-label')) day.label = t.value || '';
                else if (t.classList.contains('sd-tbc')) day.tbc = !!t.checked;
                else {
                    var locEl = t.closest('.sd-loc');
                    var legEl = t.closest('.sd-leg');
                    var intEl = t.closest('.sd-int');
                    if (locEl) {
                        var loc = day.locations[parseInt(locEl.getAttribute('data-loc-index'), 10)];
                        if (!loc) return;
                        if (t.classList.contains('sd-loc-name')) loc.name = t.value || '';
                        else if (t.classList.contains('sd-loc-address')) loc.address = t.value || '';
                        else if (t.classList.contains('sd-loc-parish')) loc.parish = t.value || '';
                        else if (t.classList.contains('sd-loc-hospital')) loc.nearestHospital = t.value || '';
                        else if (t.classList.contains('sd-loc-site-contact')) this._applySiteContactName(loc, t.value || '', locEl);
                        else if (t.classList.contains('sd-loc-site-phone')) loc.siteContactPhone = t.value || '';
                        else if (t.classList.contains('sd-loc-tbc')) loc.tbc = !!t.checked;
                    } else if (legEl) {
                        var leg = day.legs[parseInt(legEl.getAttribute('data-leg-index'), 10)];
                        if (!leg) return;
                        if (t.classList.contains('sd-leg-kind')) leg.kind = t.value || 'other';
                        else if (t.classList.contains('sd-leg-time')) leg.time = t.value || '';
                        else if (t.classList.contains('sd-leg-location')) leg.locationId = t.value || '';
                        else if (t.classList.contains('sd-leg-note')) leg.note = t.value || '';
                        else if (t.classList.contains('sd-leg-tbc')) leg.tbc = !!t.checked;
                    } else if (intEl) {
                        var row = day.interviews[parseInt(intEl.getAttribute('data-int-index'), 10)];
                        if (!row) return;
                        if (t.classList.contains('sd-int-name')) row.name = t.value || '';
                        else if (t.classList.contains('sd-int-time')) row.time = t.value || '';
                        else if (t.classList.contains('sd-int-location')) row.locationId = t.value || '';
                        else if (t.classList.contains('sd-int-release')) row.releaseStatus = t.value || 'none';
                    }
                }
                _mBTStagesDebouncedSave();
            },

            _prepareShootScheduleForSave: function () {
                var b = this.state.project;
                var api = this._shootScheduleApi();
                if (!b || !api) return;
                if (!Object.prototype.hasOwnProperty.call(b, 'shootSchedule')) return;
                if (!Array.isArray(b.shootSchedule)) return;
                b.shootSchedule = api.normalise({ shootSchedule: b.shootSchedule });
                api.ensureIds(b);
                if (typeof stagesResealAfterIdMint === 'function') stagesResealAfterIdMint();
            },

            /* --- Sliders --- */
            renderSliders: function() {
                var b       = this.state.project;
                var self    = this;
                var metrics = calculateMetrics(b);
                var html = this.state.KEYS.map(function(k) {
                    var s = b.targetLock.stages[k];
                    var stageCap = metrics.totalCap * ((s.ratio || 0) / 100);
                    return '<div class="relative">' +
                        '<div class="flex justify-between items-center mb-1.5">' +
                            '<span class="text-[9px] font-black uppercase tracking-widest text-slate-400">' + esc(self.state.TITLES[k]) + '</span>' +
                            '<div class="text-right">' +
                                '<span class="text-[10px] font-black text-white">' + (s.ratio || 0).toFixed(1) + '%</span>' +
                                '<span class="text-[8px] font-bold text-slate-400 block">' + fmt(stageCap) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="h-2 bg-slate-800 rounded-full relative overflow-hidden">' +
                            '<div class="absolute top-0 left-0 h-full bg-blue-500 rounded-full pointer-events-none" style="width:' + s.ratio + '%"></div>' +
                            '<input type="range" min="0" max="100" step="0.5" value="' + s.ratio + '" ' +
                                'oninput="mBTStages.balanceSliders(' + esc(JSON.stringify(String(k))) + ', this.value)" ' +
                                'onchange="mBTStages.save()" ' +
                                (s.locked ? 'disabled ' : '') +
                                'class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">' +
                        '</div>' +
                    '</div>';
                }).join('');
                dom.getElementById('preset-sliders').innerHTML = html;
            },

            /* --- Vitals Panel (burn ring + stats + timeline) --- */
            renderVitals: function() {
                var b        = this.state.project;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var risk     = analyzeRisk(metrics, timeline);
                var burn     = getBurnStatus(metrics.grandTotal, metrics.totalCap);

                /* Risk overrides burn display */
                var ringText  = Math.round(burn.pct) + '%';
                var ringClass = 'text-4xl font-black leading-none tracking-tighter truncate w-full px-2 block ' + burn.color;
                var labelText = 'Burn';
                var labelClass = 'text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 truncate w-full px-1 block';

                if (risk) {
                    if (risk.status === 'CRITICAL') {
                        burn.stroke = '#f43f5e';
                        ringText   = 'CRITICAL';
                        ringClass  = 'text-xl font-black leading-none tracking-tight text-rose-600 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-rose-500 uppercase tracking-widest mt-1 animate-pulse truncate w-full px-1 block';
                    } else {
                        burn.stroke = '#f59e0b';
                        ringText   = 'DELAY';
                        ringClass  = 'text-2xl font-black leading-none tracking-tight text-amber-500 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-amber-500 uppercase tracking-widest mt-1 truncate w-full px-1 block';
                    }
                }

                /* Burn ring */
                var offset = 276.46 - (Math.min(burn.pct, 100) / 100 * 276.46);
                var meter  = dom.getElementById('burn-meter');
                meter.style.strokeDashoffset = offset;
                meter.setAttribute('stroke', burn.stroke);
                dom.getElementById('burn-pct').textContent  = ringText;
                dom.getElementById('burn-pct').className    = ringClass;
                dom.getElementById('burn-label').textContent = labelText;
                dom.getElementById('burn-label').className   = labelClass;

                /* Inner ring: actual burn vs cap (only when project tracks actuals) */
                var actualMeter = dom.getElementById('actual-burn-meter');
                if (metrics.actualsMode) {
                    var actualBurn = getBurnStatus(metrics.actualTotal, metrics.totalCap);
                    var actualOffset = 226.19 - (Math.min(actualBurn.pct, 100) / 100 * 226.19);
                    actualMeter.style.display = '';
                    actualMeter.style.strokeDashoffset = actualOffset;
                    actualMeter.setAttribute('stroke', actualBurn.stroke);
                } else {
                    actualMeter.style.display = 'none';
                }

                /* Stats */
                dom.getElementById('stat-grand-total').textContent = fmt(metrics.grandTotal);
                dom.getElementById('stat-total-cap').textContent   = fmt(metrics.totalCap);
                dom.getElementById('stat-daily-burn').textContent  = fmt(metrics.dailyBurn) + '/day';
                dom.getElementById('stat-runway').textContent      = Math.round(metrics.runwayDays) + ' Days';

                var riskEl = dom.getElementById('stat-risk');
                if (risk && risk.status === 'CRITICAL') {
                    riskEl.textContent = 'CRITICAL'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (risk && risk.status === 'WARNING') {
                    riskEl.textContent = 'DELAY'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else if (burn.pct > 100) {
                    riskEl.textContent = 'OVER CAP'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (burn.pct > 85) {
                    riskEl.textContent = 'HIGH'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else {
                    riskEl.textContent = 'MINIMAL'; riskEl.className = 'text-[10px] font-black text-emerald-500 uppercase tracking-widest';
                }

                /* Timeline audit */
                var tHtml = this.state.KEYS.map(function(k) {
                    var t = timeline[k];
                    var analysis = timeline._analysis;
                    var statusHtml = '';
                    if (analysis && k === 'dist') {
                        /* Show delivery status on the last stage */
                        statusHtml = ' <span class="' + analysis.color + ' font-black">[' + esc(analysis.status) + ']</span>';
                    }
                    return '<div class="flex justify-between items-center text-[10px] font-bold">' +
                        '<span class="text-slate-400 uppercase tracking-widest font-black text-[8px]">' + esc(k) + '</span>' +
                        '<span class="text-slate-800">' + esc(t.label) + statusHtml + '</span>' +
                    '</div>';
                }).join('');
                dom.getElementById('timeline-audit').innerHTML = tHtml;

                /* Phase 200: Delivery date input ghost styling */
                var deliveryInput = dom.getElementById('delivery-date');
                if (timeline._analysis) {
                    deliveryInput.classList.remove('border-slate-700', 'border-rose-500', 'border-amber-500', 'border-emerald-500', 'border-dashed');
                    if (timeline._analysis.isEstimated) {
                        deliveryInput.classList.add('border-dashed', 'border-slate-500');
                        deliveryInput.style.opacity = '0.45';
                        deliveryInput.style.fontStyle = 'italic';
                        var proj = timeline._analysis.projectedEnd;
                        var yyyy = proj.getFullYear();
                        var mm = ('0' + (proj.getMonth() + 1)).slice(-2);
                        var dd = ('0' + proj.getDate()).slice(-2);
                        deliveryInput.value = yyyy + '-' + mm + '-' + dd;
                    } else {
                        deliveryInput.style.opacity = '1';
                        deliveryInput.style.fontStyle = 'normal';
                        if (timeline._analysis.status === 'OVERDUE') deliveryInput.classList.add('border-rose-500');
                        else if (timeline._analysis.status === 'Tight')  deliveryInput.classList.add('border-amber-500');
                        else                                              deliveryInput.classList.add('border-emerald-500');
                    }
                }

                /* Keep cashflow panel in sync whenever vitals re-render */
                this.renderCashflow();
            },

            /* --- Cashflow Panel (week-relative draw schedule) --- */
            renderCashflow: function() {
                var b = this.state.project;
                if (!b) return;
                var cf = calculateCashflow(b);
                var metrics = calculateMetrics(b);
                var metaEl = dom.getElementById('cashflow-meta');
                var bodyEl = dom.getElementById('cashflow-body');
                if (!metaEl || !bodyEl) return;

                var fmtD = function(d) {
                    if (!d) return '';
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                };
                var KEYS = this.state.KEYS;
                var TITLES = this.state.TITLES;
                var shortLabel = { dev: 'Dev', pre: 'Pre', prod: 'Prod', post: 'Post', dist: 'Dist' };

                var buildUnschedNotice = function(cfData) {
                    if (!cfData.unscheduledTotal || cfData.unscheduledTotal <= 0) return '';
                    var names = [];
                    var ui, uk;
                    for (ui = 0; ui < cfData.unscheduledStages.length; ui++) {
                        uk = cfData.unscheduledStages[ui];
                        names.push(shortLabel[uk] || TITLES[uk] || uk);
                    }
                    return '<div class="mb-3 p-2.5 rounded-lg bg-amber-50 border border-amber-200">' +
                        '<p class="text-[8px] font-bold text-amber-700 leading-relaxed">' +
                        'Note: ' + fmt(cfData.unscheduledTotal) + ' in assigned costs (' + esc(names.join(', ')) + ') is not included above -- these stages have no days scheduled yet.' +
                        '</p></div>';
                };

                if (!cf.weeks.length) {
                    metaEl.innerHTML =
                        '<div class="flex justify-between items-end p-2 rounded-lg bg-slate-50 border border-slate-100">' +
                            '<span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Cap</span>' +
                            '<span class="text-[10px] font-black text-slate-800">' + fmt(metrics.totalCap) + '</span>' +
                        '</div>';
                    bodyEl.innerHTML =
                        buildUnschedNotice(cf) +
                        '<div class="flex flex-col items-center justify-center py-12 gap-3 px-4 text-center">' +
                            '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>' +
                            '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-relaxed">No schedule data yet -- assign days to stages to see a cashflow projection</p>' +
                        '</div>';
                    return;
                }

                var dateRange = fmtD(cf.projectStart) + ' - ' + fmtD(cf.projectEnd);
                var actualMeta = cf.actualsMode
                    ? '<div class="flex justify-between items-end p-2 rounded-lg bg-emerald-50 border border-emerald-100">' +
                        '<span class="text-[8px] font-black text-emerald-600 uppercase tracking-widest">Actual</span>' +
                        '<span class="text-[10px] font-black text-emerald-700">' + fmt(cf.actualGrandTotal) + '</span>' +
                      '</div>'
                    : '';
                var plannedLabel = cf.unscheduledTotal > 0 ? 'Scheduled' : 'Planned';
                var plannedHint = cf.unscheduledTotal > 0
                    ? '<div class="text-[7px] font-bold text-amber-600 uppercase tracking-widest leading-tight mt-0.5">Excl. ' + fmt(cf.unscheduledTotal) + ' unscheduled</div>'
                    : '';
                metaEl.innerHTML =
                    '<p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">' +
                        cf.weekCount + ' week' + (cf.weekCount === 1 ? '' : 's') + ' &middot; ' + esc(dateRange) +
                    '</p>' +
                    '<div class="grid grid-cols-2 gap-1.5 mt-1">' +
                        '<div class="flex justify-between items-end p-2 rounded-lg bg-slate-50 border border-slate-100">' +
                            '<span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Cap</span>' +
                            '<span class="text-[10px] font-black text-slate-800">' + fmt(cf.totalCap) + '</span>' +
                        '</div>' +
                        '<div class="flex flex-col items-end p-2 rounded-lg bg-blue-50 border border-blue-100">' +
                            '<div class="flex justify-between items-end w-full">' +
                                '<span class="text-[8px] font-black text-blue-600 uppercase tracking-widest">' + plannedLabel + '</span>' +
                                '<span class="text-[10px] font-black text-blue-700">' + fmt(cf.grandTotal) + '</span>' +
                            '</div>' +
                            plannedHint +
                        '</div>' +
                        actualMeta +
                    '</div>';

                var thClass = 'px-1.5 py-2 text-[7px] font-black uppercase tracking-widest text-slate-400 text-right border-b border-slate-100 whitespace-nowrap';
                var thLeft = 'px-1.5 py-2 text-[7px] font-black uppercase tracking-widest text-slate-400 text-left border-b border-slate-100 whitespace-nowrap';
                var tdClass = 'px-1.5 py-1.5 text-[9px] font-bold text-slate-700 text-right border-b border-slate-50 whitespace-nowrap';
                var tdLeft = 'px-1.5 py-1.5 text-[9px] font-black text-slate-800 text-left border-b border-slate-50 whitespace-nowrap';
                var headCells = '<th class="' + thLeft + '">Week</th>';
                KEYS.forEach(function(k) {
                    headCells += '<th class="' + thClass + '" title="' + esc(TITLES[k] || k) + '">' + esc(shortLabel[k] || k) + '</th>';
                });
                headCells += '<th class="' + thClass + '">Total</th>';
                headCells += '<th class="' + thClass + '">Cumul</th>';

                var cumul = 0;
                var actualCumul = 0;
                var rows = cf.weeks.map(function(w) {
                    cumul += w.total;
                    actualCumul += w.actualTotal;
                    var cells = '<td class="' + tdLeft + '">Week ' + w.weekNumber + '</td>';
                    KEYS.forEach(function(k) {
                        var plannedVal = w.byStage[k] || 0;
                        var actualVal = w.actualByStage[k] || 0;
                        var showZero = plannedVal === 0 && (!cf.actualsMode || actualVal === 0);
                        var plannedHtml = showZero
                            ? '<span class="text-slate-300">-</span>'
                            : '<span class="text-slate-800">' + fmt(plannedVal) + '</span>';
                        var actualHtml = '';
                        if (cf.actualsMode && (plannedVal > 0 || actualVal > 0)) {
                            actualHtml = '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(actualVal) + '</div>';
                        }
                        cells += '<td class="' + tdClass + '">' + plannedHtml + actualHtml + '</td>';
                    });
                    var totalActualHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(w.actualTotal) + '</div>'
                        : '';
                    var cumulActualHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(actualCumul) + '</div>'
                        : '';
                    cells += '<td class="' + tdClass + ' font-black text-slate-900">' + fmt(w.total) + totalActualHtml + '</td>';
                    cells += '<td class="' + tdClass + ' font-black text-blue-600">' + fmt(cumul) + cumulActualHtml + '</td>';
                    return '<tr>' + cells + '</tr>';
                }).join('');

                /* Footer totals row */
                var footerCells = '<td class="' + tdLeft + ' text-slate-500">Total</td>';
                KEYS.forEach(function(k) {
                    var sumP = 0;
                    var sumA = 0;
                    cf.weeks.forEach(function(w) {
                        sumP += w.byStage[k] || 0;
                        sumA += w.actualByStage[k] || 0;
                    });
                    var aHtml = cf.actualsMode
                        ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(sumA) + '</div>'
                        : '';
                    footerCells += '<td class="' + tdClass + ' border-t border-slate-200">' +
                        (sumP === 0 && (!cf.actualsMode || sumA === 0) ? '<span class="text-slate-300">-</span>' : fmt(sumP)) +
                        aHtml + '</td>';
                });
                var footActualTotal = cf.actualsMode
                    ? '<div class="text-[7px] font-bold text-emerald-600 leading-tight">' + fmt(cf.actualGrandTotal) + '</div>'
                    : '';
                footerCells += '<td class="' + tdClass + ' border-t border-slate-200 font-black">' + fmt(cf.grandTotal) + footActualTotal + '</td>';
                footerCells += '<td class="' + tdClass + ' border-t border-slate-200 font-black text-blue-600">' + fmt(cf.grandTotal) + footActualTotal + '</td>';

                var legend = cf.actualsMode
                    ? '<p class="text-[7px] font-bold text-slate-400 uppercase tracking-widest mt-2 px-1">' +
                        '<span class="text-slate-700">Planned</span> / <span class="text-emerald-600">Actual</span> per week' +
                      '</p>'
                    : '';

                bodyEl.innerHTML =
                    buildUnschedNotice(cf) +
                    '<div class="overflow-x-auto no-scrollbar">' +
                        '<table class="w-full border-collapse">' +
                            '<thead><tr>' + headCells + '</tr></thead>' +
                            '<tbody>' + rows + '</tbody>' +
                            '<tfoot><tr>' + footerCells + '</tr></tfoot>' +
                        '</table>' +
                    '</div>' +
                    legend;
            },

            /* --- Stage Cards --- */
            renderStageCards: function() {
                var b        = this.state.project;
                var self     = this;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var container = dom.getElementById('stage-cards-container');

                var html = this.state.KEYS.map(function(k) {
                    var s         = b.targetLock.stages[k];
                    var stageCost = metrics.stageTotals[k] || 0;
                    var stageActual = metrics.stageActuals[k] || 0;
                    var stageCap  = metrics.totalCap * ((s.ratio || 0) / 100);
                    var isOver    = stageCost > stageCap && stageCap > 0;
                    var isActualOver = metrics.actualsMode && stageActual > stageCost && stageCost > 0;
                    /* Actuals line only when project uses actuals tracking (actualsMode) */
                    var actualsLine = metrics.actualsMode
                        ? '<div class="text-center mt-1"><span class="text-[8px] font-bold uppercase tracking-widest ' + (isActualOver ? 'text-rose-600' : 'text-slate-400') + '">Actual: ' + fmt(stageActual) + ' (of ' + fmt(stageCost) + ' planned)</span></div>'
                        : '';
                    var val       = validateTimeline(b, k);
                    var conflict  = val.maxNeeded > val.current;
                    var dateLabel = timeline[k] ? esc(timeline[k].label) : '';

                    /* Sync Days button — amber bounce when items exceed stage duration */
                    var syncBtn = (val.maxNeeded > val.current)
                        ? '<button onclick="mBTStages.syncDays(' + esc(JSON.stringify(String(k))) + ')" title="Sync to ' + val.maxNeeded + ' days" class="absolute -right-2 -top-2 bg-amber-500 hover:bg-amber-600 text-white w-6 h-6 rounded-full shadow-lg z-50 flex items-center justify-center sync-bounce">' +
                          '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>' +
                          '</button>'
                        : '';

                    var dateDisplay = val.isBankrupt
                        ? '<span class="text-[8px] font-black text-rose-600 animate-pulse">UNSCHEDULED</span>'
                        : '<span class="text-[8px] font-bold text-slate-400 mt-0.5 tracking-tight">' + dateLabel + '</span>';

                    /* dev is always first stage; offsetDays has no effect there */
                    var offsetInput = (k !== 'dev')
                        ? '<div class="flex items-center gap-1 bg-slate-50 px-1 py-0.5 rounded-lg border border-slate-100">' +
                            '<input type="number" value="' + (s.offsetDays !== undefined ? s.offsetDays : '') + '" oninput="mBTStages.updateStageOffset(' + esc(JSON.stringify(String(k))) + ', this.value)" class="w-8 text-center bg-transparent text-[10px] font-bold text-slate-500 outline-none no-spinner" title="Starts N days into previous stage">' +
                            '<span class="text-[6px] font-black text-slate-400 uppercase tracking-widest mr-0.5">Overlap</span>' +
                          '</div>'
                        : '';

                    return '<div id="' + k + '" class="stage-card min-w-[340px] w-[340px] snap-center shrink-0' + (conflict ? ' conflict-glow' : '') + '">' +
                        '<div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-20 shrink-0">' +
                            '<div class="flex items-center justify-between mb-1 relative">' +
                                /* Lock button */
                                '<button onclick="mBTStages.toggleLock(' + esc(JSON.stringify(String(k))) + ')" class="w-6 h-6 flex items-center justify-center rounded-lg ' + (s.locked ? 'bg-amber-100 text-amber-600' : 'bg-slate-50 text-slate-300 hover:bg-slate-100') + ' transition-colors">' +
                                    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">' +
                                        (s.locked ? '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' : '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>') +
                                    '</svg>' +
                                '</button>' +
                                /* Title + date */
                                '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">' +
                                    '<span class="text-[10px] font-black uppercase tracking-widest text-slate-800">' + esc(self.state.TITLES[k]) + '</span>' +
                                    dateDisplay +
                                '</div>' +
                                /* Days input + sync button; overlap offset for non-dev stages */
                                '<div class="flex flex-col items-end gap-0.5">' +
                                    '<div class="relative flex items-center gap-1.5 bg-slate-50 p-1 rounded-xl border border-slate-100">' +
                                        syncBtn +
                                        '<input type="text" inputmode="decimal" value="' + s.days + '" oninput="mBTStages.updateStageDays(' + esc(JSON.stringify(String(k))) + ', this.value)" class="w-10 text-center bg-transparent text-[11px] font-black ' + (conflict ? 'text-amber-600' : 'text-blue-600') + ' outline-none no-spinner">' +
                                        '<span class="text-[7px] font-black text-slate-400 uppercase tracking-widest mr-1">Days</span>' +
                                    '</div>' +
                                    offsetInput +
                                '</div>' +
                            '</div>' +
                            '<div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-1 mt-3">' +
                                '<div class="h-full ' + (isOver ? 'bg-rose-500' : 'bg-blue-500') + ' rounded-full transition-all duration-500" style="width:' + Math.min(stageCap > 0 ? (stageCost / stageCap) * 100 : 0, 100).toFixed(1) + '%"></div>' +
                            '</div>' +
                            '<div class="flex justify-between text-[8px] font-black uppercase tracking-widest">' +
                                '<span class="' + (isOver ? 'text-rose-600' : 'text-slate-400') + '">' + fmt(stageCost) + '</span>' +
                                '<span class="text-slate-400">Cap: ' + fmt(stageCap) + '</span>' +
                            '</div>' +
                            actualsLine +
                        '</div>' +
                        '<div class="flex-grow p-3 space-y-2 overflow-y-auto no-scrollbar bg-slate-50/50 stage-drop-zone" data-stage="' + k + '">' +
                            self.renderItems(k) +
                        '</div>' +
                        '<div class="p-4 border-t border-slate-100 bg-white shrink-0">' +
                            '<button onclick="mBTStages.openAddModal(' + esc(JSON.stringify(String(k))) + ')" class="w-full py-2 rounded-xl bg-slate-50 border border-slate-100 text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 hover:border-blue-100 hover:bg-white transition-all">+ Add Item</button>' +
                        '</div>' +
                    '</div>';
                }).join('');

                container.innerHTML = html;
                /* Re-attach drag and drop after DOM rebuild */
                this.initDragAndDrop();
                /* Re-attach scroll spy now that card elements exist in DOM */
                this._observeTabPanels();
            },

            /* --- Render Items in a Stage Card --- */
            renderItems: function(stageKey) {
                var b = this.state.project;
                var items = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[stageKey]) {
                            items.push({ item: item, secName: secName, order: item.stageData[stageKey].order || 0 });
                        }
                    });
                });
                items.sort(function(a, b) { return a.order - b.order; });

                if (!items.length) {
                    return '<div class="flex flex-col items-center justify-center py-8 gap-3">' +
                        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>' +
                        '<p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">No items assigned</p>' +
                        '<p class="text-[8px] font-bold text-slate-400">Add crew from the Setup tab</p>' +
                        '</div>';
                }

                /* Phase 90.RC: resolve temporal settings for payable-day cost display */
                var _workWeek   = (b.settings && b.settings.workWeek) || 5;
                var _blackouts  = b.blackoutDays || [];
                var _starts     = getStageStartDates(b);

                return items.map(function(entry) {
                    var item = entry.item;
                    var sd   = item.stageData[stageKey];
                    var _sdMult = (sd.multiplier === undefined || sd.multiplier === null || sd.multiplier === '') ? 1 : (parseFloat(sd.multiplier) || 0);
                    var _multActive = Math.abs(_sdMult - 1) > 0.0001;
                    /* Phase 195: Source-of-truth formula (quantity + TZ-normalised days) */
                    var cost = _calculateItemCost(item, stageKey, b);
                    return '<div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm stage-item group cursor-grab active:cursor-grabbing" data-id="' + esc(item.id) + '">' +
                        '<div class="flex justify-between items-start mb-2">' +
                            '<div class="min-w-0 flex-grow pr-2">' +
                                '<p class="text-[10px] font-black text-slate-800 leading-tight truncate uppercase tracking-tight">' + esc(item.description || 'UNTITLED') + '</p>' +
                                '<p class="text-[7px] font-black text-slate-400 uppercase tracking-widest truncate">' + esc(entry.secName) + '</p>' +
                            '</div>' +
                            '<button onclick="mBTStages.removeItem(' + esc(JSON.stringify(String(item.id))) + ', ' + esc(JSON.stringify(String(stageKey))) + ')" class="stage-remove-btn text-slate-300 active:text-rose-500 transition-all shrink-0">' +
                                '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                            '</button>' +
                        '</div>' +
                        '<div class="flex items-center gap-2">' +
                            '<div>' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Days</label>' +
                                '<input type="text" inputmode="decimal" value="' + (sd.days || 0) + '" oninput="mBTStages.updateItemDays(' + esc(JSON.stringify(String(item.id))) + ', ' + esc(JSON.stringify(String(stageKey))) + ', this.value)" class="w-10 bg-slate-50 rounded text-center text-[10px] text-blue-600 font-bold outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div>' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Rate</label>' +
                                '<input type="text" inputmode="decimal" value="' + (sd.rate || item.rate || 0) + '" oninput="mBTStages.updateItemRate(' + esc(JSON.stringify(String(item.id))) + ', ' + esc(JSON.stringify(String(stageKey))) + ', this.value)" class="w-16 bg-slate-50 rounded text-center text-[10px] text-slate-600 font-bold outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div>' +
                                '<label class="block text-[7px] font-black ' + (_multActive ? 'text-indigo-500' : 'text-slate-400') + ' uppercase mb-0.5" title="Rate multiplier (1=full, 0.5=half)">x</label>' +
                                '<input type="text" inputmode="decimal" step="0.1" min="0" value="' + _sdMult + '" oninput="mBTStages.updateItemMultiplier(' + esc(JSON.stringify(String(item.id))) + ', ' + esc(JSON.stringify(String(stageKey))) + ', this.value)" class="w-10 ' + (_multActive ? 'bg-indigo-50 text-indigo-700 font-black' : 'bg-slate-50 text-slate-500 font-bold') + ' rounded text-center text-[10px] outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div class="ml-auto text-right">' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Cost</label>' +
                                '<span class="text-[10px] font-black text-slate-800 font-mono" data-cost-for="' + esc(item.id) + '">' + fmt(cost) + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
            },

            /* ========= Interaction Handlers ========= */

            balanceSliders: function(changedKey, value) {
                stagesPushUndo();
                var b      = this.state.project;
                var stages = b.targetLock.stages;
                var KEYS   = this.state.KEYS;
                var newVal = parseFloat(value);
                if (isNaN(newVal)) newVal = 0;

                var lockedKeys    = KEYS.filter(function(k) { return k !== changedKey && stages[k].locked; });
                var unlockedKeys  = KEYS.filter(function(k) { return k !== changedKey && !stages[k].locked; });
                var lockedTotal   = lockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                var maxAvail      = 100 - lockedTotal;

                if (newVal > maxAvail) newVal = maxAvail;
                if (newVal < 0)        newVal = 0;
                /* When all siblings are locked, slack cannot move elsewhere; pin to remaining share */
                if (unlockedKeys.length === 0) newVal = maxAvail;
                stages[changedKey].ratio = newVal;

                var remaining          = Math.max(0, 100 - newVal - lockedTotal);
                var currentUnlockedSum = unlockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                unlockedKeys.forEach(function(k) {
                    stages[k].ratio = currentUnlockedSum <= 0.01
                        ? remaining / unlockedKeys.length
                        : remaining * (stages[k].ratio / currentUnlockedSum);
                });

                var total = KEYS.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                var drift = 100 - total;
                if (Math.abs(drift) > 0.01) {
                    var snapKey = changedKey;
                    if (unlockedKeys.length > 0) {
                        var bestVal = stages[unlockedKeys[0]].ratio || 0;
                        snapKey = unlockedKeys[0];
                        unlockedKeys.forEach(function(k) {
                            if ((stages[k].ratio || 0) > bestVal) {
                                bestVal = stages[k].ratio || 0;
                                snapKey = k;
                            }
                        });
                    }
                    stages[snapKey].ratio = (stages[snapKey].ratio || 0) + drift;
                }

                this.render();
            },

            applyPreset: function(name) {
                var ratios = STAGE_PRESETS[name];
                if (!ratios) return;
                stagesPushUndoImmediate();
                var stages = this.state.project.targetLock.stages;
                Object.keys(ratios).forEach(function(k) {
                    if (stages[k]) { stages[k].ratio = ratios[k]; stages[k].locked = false; }
                });
                this.render();
                this.save();
            },

            toggleLock: function(key) {
                stagesPushUndoImmediate();
                var s = this.state.project.targetLock.stages[key];
                s.locked = !s.locked;
                this.render();
                this.save();
            },

            updateStageDays: function(key, val) {
                stagesPushUndo();
                this.state.project.targetLock.stages[key].days = parseFloat(val) || 0;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            updateStageOffset: function(key, val) {
                stagesPushUndo();
                this.state.project.targetLock.stages[key].offsetDays = parseFloat(val) || 0;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            syncDays: function(key) {
                var val = validateTimeline(this.state.project, key);
                if (val.maxNeeded > 0) {
                    stagesPushUndoImmediate();
                    this.state.project.targetLock.stages[key].days = val.maxNeeded;
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            /* Phase 195: Surgical refresh + debounced save — preserves mobile input focus */
            updateItemDays: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    stagesPushUndo();
                    item.stageData[stageKey].days = parseFloat(val) || 0;
                    _mBTStagesSurgicalRefresh(itemId, stageKey);
                    _mBTStagesDebouncedSave(stageKey);
                }
            },

            updateItemRate: function(itemId, stageKey, val) {
                if (String(val).trim() === '' || !isFinite(Number(val)) || Number(val) < 0) return;
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    stagesPushUndo();
                    item.stageData[stageKey].rate = parseFloat(val) || 0;
                    item.stageData[stageKey].rateOverride = true;
                    mBTBatch2.manual(item.stageData[stageKey]);
                    _mBTStagesSurgicalRefresh(itemId, stageKey);
                    _mBTStagesDebouncedSave();
                }
            },

            /* Multiplier saves immediately — rare input, high persistence value */
            updateItemMultiplier: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    stagesPushUndoImmediate();
                    var _raw = (val === '' || val === null || val === undefined) ? 1 : parseFloat(val);
                    item.stageData[stageKey].multiplier = isNaN(_raw) ? 1 : _raw;
                    _mBTStagesSurgicalRefresh(itemId, stageKey);
                    this.save();
                }
            },

            removeItem: function(itemId, stageKey) {
                var item = this._findItem(itemId);
                if (item && item.stageData) {
                    stagesPushUndoImmediate();
                    delete item.stageData[stageKey];
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            updateCap: function(val) {
                var self = this;
                var next = parseFloat(val) || 0;
                var prev = this.state.project.targetLock.totalCap || 0;
                var applyCap = function() {
                    stagesPushUndo();
                    self.state.project.targetLock.totalCap = next;
                    self.renderSliders();
                    self.renderVitals();
                    self.save();
                };
                /* Warn when replacing an existing cap -- change cascades to every stage segment cap in the main budget */
                if (prev > 0 && next !== prev) {
                    stagesConfirm(
                        'Changing the Budget Cap will update every stage cap in the main budget. Continue?',
                        applyCap,
                        'Budget Cap'
                    );
                    var overlay = document.getElementById('stages-confirm-overlay');
                    if (overlay) {
                        var revertCap = function() {

                        };
                        var cancelBtn = overlay.querySelector('#stages-confirm-cancel');
                        if (cancelBtn) cancelBtn.addEventListener('click', revertCap);
                        overlay.addEventListener('click', function(e) {
                            if (e.target === overlay) revertCap();
                        });
                    }
                    return;
                }
                applyCap();
            },

            updateDate: function(type, val) {
                stagesPushUndoImmediate();
                if (type === 'start')    this.state.project.startDate    = val;
                else                     this.state.project.deliveryDate = val;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            bulkAction: function(action) {
                stagesPushUndoImmediate();
                var b    = this.state.project;
                var KEYS = this.state.KEYS;
                if (action === 'lockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = true; });
                    this.render(); this.save();
                } else if (action === 'unlockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = false; });
                    this.render(); this.save();
                } else if (action === 'syncDays') {
                    KEYS.forEach(function(k) {
                        var val = validateTimeline(b, k);
                        if (val.maxNeeded > 0) b.targetLock.stages[k].days = val.maxNeeded;
                    });
                    this.render(); this.save();
                } else if (action === 'dedupe') {
                    /* Remove items assigned to multiple stages that share same description */
                    var seen = {};
                    Object.values(b.sections || {}).forEach(function(sec) {
                        (sec.items || []).forEach(function(item) {
                            var desc = (item.description || '').toLowerCase().trim();
                            if (!item.stageData) return;
                            KEYS.forEach(function(k) {
                                if (!item.stageData[k]) return;
                                var key = desc + '|' + k;
                                if (seen[key]) delete item.stageData[k];
                                else seen[key] = true;
                            });
                        });
                    });
                    this.render(); this.save();
                }
            },

            autoFillAll: function() {
                stagesPushUndoImmediate();
                var b    = this.state.project;
                var tl   = b.targetLock;
                var KEYS = this.state.KEYS;
                Object.values(b.sections || {}).forEach(function(sec) {
                    (sec.items || []).forEach(function(item) {
                        if (!item.stageData) item.stageData = {};
                        var desc   = (item.description || '').toLowerCase();
                        var target = 'prod';
                        if (desc.includes('post') || desc.includes('edit') || desc.includes('vfx') || desc.includes('grade') || desc.includes('color')) target = 'post';
                        else if (desc.includes('pre') || desc.includes('scout') || desc.includes('cast') || desc.includes('rehearsal')) target = 'pre';
                        else if (desc.includes('dev') || desc.includes('script') || desc.includes('option') || desc.includes('treatment')) target = 'dev';
                        else if (desc.includes('dist') || desc.includes('deliver') || desc.includes('master') || desc.includes('dcp')) target = 'dist';
                        if (!item.stageData[target]) {
                            item.stageData[target] = { days: tl.stages[target].days || 1, rate: item.rate || 0, order: 0 };
                        }
                    });
                });
                this.render(); this.save();
            },

            clearAll: function() {
                var self = this;
                stagesConfirm('Clear all stage assignments?', function() {

                        (sec.items || []).forEach(function(item) { item.stageData = {}; });

            },

            /* ========= Add Item Modal ========= */

            openAddModal: function(stageKey) {
                this.state._modalStage = stageKey;

                dom.getElementById('modal-title').textContent = 'Add to ' + stageTitle;

                this._refreshDept = mBTBatch2.bindBox(dom, function() { return deptState.project; }, function() {
                    var form = dom.getElementById('custom-form');
                    return form && !form.classList.contains('hidden') ? dom.getElementById('custom-desc').value : '';
                }, function() {
                    var sk = deptState._modalStage;
                    var sections = (deptState.project && deptState.project.sections) || {};
                    var names = Object.keys(sections);
                    if (!sk) return names[0];
                    if (sk === 'post') return names.filter(function(s) { return /post|edit/i.test(s); })[0] || names[0];
                    if (sk === 'dev') return names.filter(function(s) { return /dev|creative|travel/i.test(s); })[0] || names[0];
                    return names.filter(function(s) { return /prod/i.test(s); })[0] || names[0];

            _buildModalList: function(term) {
                var b      = this.state.project;
                var sk     = this.state._modalStage;
                var q      = (term || '').toLowerCase();
                var self   = this;

                /* Existing budget items not yet in this stage */
                var existing = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[sk]) return;
                        if (q && !(item.description || '').toLowerCase().includes(q)) return;
                        existing.push({ id: item.id, description: item.description, rate: item.rate, isExisting: true, secName: secName });
                    });
                });

                /* OG rate database */
                var ogFiltered = (this.state.ogItems || []).filter(function(i) {
                    return !q || (i.description || '').toLowerCase().includes(q);
                }).slice(0, 20);

                var all = existing.slice(0, 15).concat(ogFiltered);

                if (!all.length) {
                    dom.getElementById('modal-list').innerHTML = '<div class="p-6 text-center text-[9px] font-black text-slate-300 uppercase tracking-widest">No matches</div>';
                    return;

                var modalList = dom.getElementById('modal-list');
                modalList.innerHTML = all.map(function(item) {
                    var badge = item.isExisting
                        ? '<span class="text-[7px] font-black text-emerald-600 uppercase tracking-widest">From Budget · ' + esc(item.secName) + '</span>'
                        : '<span class="text-[7px] font-black text-blue-400 uppercase tracking-widest">Rate DB</span>';
                    if (!item.isExisting) {
                        var deptKey = mBTBatch2.pick(dom) || mBTBatch2.classify(item);
                        badge += deptKey
                            ? '<span class="mbt-dept-chip text-[7px] font-black text-slate-400 uppercase tracking-widest"> · ' + esc(mBTBatch2.groups[deptKey][0]) + '</span>'
                            : '<span class="mbt-dept-chip text-[7px] font-black text-red-600"> Needs classification · choose a department</span>';
                    }
                    return '<div data-stage-action="' + (item.isExisting ? 'existing' : 'og') + '" data-item-id="' + esc(item.id) + '" class="p-3 border-b border-slate-50 bg-white hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors">' +
                        '<div>' +
                            '<div class="text-[11px] font-bold text-slate-700">' + esc(item.description) + '</div>' +
                            badge +
                        '</div>' +
                        '<div class="text-[10px] font-mono font-bold text-slate-500 ml-4 shrink-0">' + (!item.isExisting && item.currency && item.currency !== (b.currency || 'JMD') ? esc(item.currency) + ' ' + esc(item.rate) + ' (no exchange rate)' : fmt(item.rate)) + '</div>' +
                    '</div>';
                }).join('');
                var actionRows = modalList.querySelectorAll('[data-stage-action]');
                for (var actionIdx = 0; actionIdx < actionRows.length; actionIdx++) {
                    actionRows[actionIdx].addEventListener('click', function() {
                        var itemId = this.getAttribute('data-item-id');
                        if (this.getAttribute('data-stage-action') === 'existing') {
                            mBTStages._assignExisting(itemId);

            _assignExisting: function(itemId) {
                var sk   = this.state._modalStage;
                var item = this._findItem(itemId);
                if (!item) return;
                stagesPushUndoImmediate();
                if (!item.stageData) item.stageData = {};

            },

            _assignFromOG: function(ogId) {
                var sk       = this.state._modalStage;
                var b        = this.state.project;
                var ogItem   = (this.state.ogItems || []).find(function(i) { return i.id === ogId; });
                if (!ogItem) return;
                stagesPushUndoImmediate();

                var targetSec;
                /* Classify a copy: a department picked for this one line must not stick to the catalog row. */
                var probe = {}, probeKeys = Object.keys(ogItem), probeIdx;
                for (probeIdx = 0; probeIdx < probeKeys.length; probeIdx++) probe[probeKeys[probeIdx]] = ogItem[probeKeys[probeIdx]];
                try { targetSec = mBTBatch2.section(b, probe, sk, mBTBatch2.pick(dom)); }
                catch (err) {
                    this._buildModalList(dom.getElementById('modal-search').value);
                    var notice = dom.getElementById('classification-notice');
                    if (!notice) { notice = document.createElement('p'); notice.id = 'classification-notice'; notice.setAttribute('role', 'alert'); dom.getElementById('modal-list').insertBefore(notice, dom.getElementById('modal-list').firstChild); }
                    notice.textContent = err.message;

                }

                var sourceRate = Number(ogItem.rate) || 0;
                var sourceCurrency = ogItem.currency || b.currency || 'JMD';
                var rateEngine = window.mBT && mBT.le;
                try { if (window.parent !== window && window.parent.mBT) rateEngine = window.parent.mBT.le; } catch (currencyError) {}
                var budgetRate = sourceRate;
                if (sourceCurrency !== (b.currency || 'JMD')) {
                    budgetRate = rateEngine && rateEngine.convertCurrencyOrNull ? rateEngine.convertCurrencyOrNull(sourceRate, sourceCurrency, b.currency || 'JMD', b) : null;
                    if (budgetRate === null) { stagesAlert('No exchange rate for ' + sourceCurrency + '. No rate was added; the source keeps its own currency.', 'Add Item'); return; }
                }
                var newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),

                    department: probe.department, rateSource: 'opengate',

                    quantity: 1, unit: ogItem.unit || 'Day', multiplier: 1,

                };
                newItem.stageData[sk] = { days: 1, rate: budgetRate, order: 0 };
                if (ogItem.source === 'override' || ogItem.rateSource === 'custom') mBTBatch2.manual(newItem);
                b.sections[targetSec].items.push(newItem);

                this.closeAddModal();

            addCustomItem: function() {
