        </div>

        <!-- Stage Cards (injected by render) -->
        <div id="stage-cards-container" class="flex"></div>

    </div>

    <!-- Add Item Modal (sandboxed — no window.parent) -->
    <div id="add-item-modal" class="items-end justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col" style="max-height:85vh">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between shrink-0">
                <span id="modal-title" class="text-[10px] font-black uppercase tracking-widest text-slate-800">Add to Stage</span>
                <button onclick="mBTStageStudio.closeAddModal()" aria-label="Close add item modal" class="text-slate-300 hover:text-slate-600 transition-colors">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-4 border-b border-slate-50 shrink-0">
                <input type="text" id="modal-search" aria-label="Search items" placeholder="Search items..." oninput="mBTStageStudio.filterModalList(this.value)" class="w-full p-3 border border-slate-200 rounded-xl text-[11px] font-bold outline-none focus:border-blue-400 transition-colors">
            </div>
            <div id="modal-list" class="flex-grow overflow-y-auto"></div>
            <!-- Custom Item Form -->
            <div class="p-4 border-t border-slate-100 shrink-0">
                <button onclick="mBTStageStudio.toggleCustomForm()" class="text-[9px] font-black text-blue-600 uppercase tracking-widest hover:underline mb-3 block">+ Create Custom Item</button>
                <div id="custom-form" class="hidden space-y-3">
                    <input type="text" id="custom-desc" placeholder="Item name" class="w-full p-2 border border-slate-200 rounded-lg text-[11px] font-bold outline-none">
                    <div class="flex gap-2">
                        <input type="number" id="custom-rate" placeholder="Rate" class="flex-1 p-2 border border-slate-200 rounded-lg text-[11px] font-bold outline-none">
                        <select id="custom-unit" class="w-1/3 p-2 border border-slate-200 rounded-lg text-[11px] font-bold outline-none">
                            <option>Day</option>
                            <option>Flat</option>
                            <option>Week</option>
                        </select>
                    </div>
                    <button onclick="mBTStageStudio.addCustomItem()" class="w-full py-2 bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest rounded-xl hover:bg-blue-700 transition-colors">Add Item</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ========= Stages Studio v24 ========= */
        var dom = document.currentScript ? document.currentScript.getRootNode() : document;
        if (dom === document && window.shadowRoot) dom = window.shadowRoot;

        /* --- XSS Escape --- */
        function esc(str) {
            var d = document.createElement('div');
            d.textContent = String(str || '');
            return d.innerHTML;
        }

        /* --- Currency Format (reads currency from URL param passed by parent budget) --- */
        function fmt(n) {
            var code = (mBTStageStudio && mBTStageStudio.state && mBTStageStudio.state._currency) ? mBTStageStudio.state._currency : 'JMD';
            try {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: code, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n || 0);
            } catch(e) {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n || 0);
            }
        }

        /* ========= STAGE_PRESETS (from mBT-Old.html L739) ========= */
        var STAGE_PRESETS = {
            'TVC':          { dev: 10, pre: 15, prod: 45, post: 20, dist: 10 },
            'Music Video':  { dev:  5, pre: 15, prod: 50, post: 25, dist:  5 },
            'Documentary':  { dev: 15, pre: 10, prod: 40, post: 25, dist: 10 },
            'Feature Film': { dev: 10, pre: 20, prod: 35, post: 25, dist: 10 }
        };

        /* ========= Logic Engine (ported from mBT-Old.html L2233–L2421) ========= */

        /* --- Compute payable working days within a date range --- */
        function computeWorkingDays(grossDays, startDate, workWeek, blackouts) {
            if (!workWeek || workWeek >= 7) return grossDays;
            var working = 0;
            var cursor = new Date(startDate);
            for (var i = 0; i < grossDays; i++) {
                var dow = cursor.getDay();
                var dateStr = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0') + '-' + String(cursor.getDate()).padStart(2, '0');
                var isWeekend = (workWeek <= 5 && (dow === 0 || dow === 6)) ||
                                (workWeek === 6 && dow === 0);
                var isBlackout = blackouts && blackouts.indexOf(dateStr) > -1;
                if (!isWeekend && !isBlackout) working++;
                cursor.setDate(cursor.getDate() + 1);
            }
            return working;
        }

        /* --- Build stage start dates for payable-day calculation --- */
        function getStageStartDates(b) {
            var starts = {};
            if (!b || !b.startDate) return starts;
            var cursor = new Date(b.startDate);
            cursor = new Date(cursor.getTime() + cursor.getTimezoneOffset() * 60000);
            var prevStart = null;

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            KEYS.forEach(function(k) {
                var stageData = (b.targetLock && b.targetLock.stages[k]) || {};
                var days = parseFloat(stageData.days) || 0;
                var offset = stageData.offsetDays;
                if (typeof offset === 'number' && prevStart) {
                    cursor = new Date(prevStart);
                    cursor.setDate(cursor.getDate() + offset);
                }
                starts[k] = new Date(cursor);
                prevStart = new Date(cursor);
                cursor = new Date(cursor.getTime() + days * 86400000);
            });
            return starts;
        }

        /* --- calculateMetrics with payable working days --- */
        function calculateMetrics(b) {
            var tl = b.targetLock || { totalCap: 0, stages: {} };
            var workWeek = (b.settings && b.settings.workWeek) || 5;
            var blackouts = b.blackoutDays || [];
            var stageStarts = getStageStartDates(b);
            var result = {
                grandTotal: b.grandTotal || 0,
                stageTotals: { dev: 0, pre: 0, prod: 0, post: 0, dist: 0 },
                totalCap: tl.totalCap || 0,
                totalDays: 0,
                totalWorkingDays: 0,
                dailyBurn: 0,
                runwayDays: 0
            };

            /* Per-stage cost sums from stageData — uses payable working days */
            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (!item.stageData) return;
                    KEYS.forEach(function(k) {
                        var sd = item.stageData[k];
                        if (sd) {
                            var grossDays = parseFloat(sd.days) || 0;
                            var payable = stageStarts[k] ? computeWorkingDays(grossDays, stageStarts[k], workWeek, blackouts) : grossDays;
                            result.stageTotals[k] += payable * (parseFloat(sd.rate || item.rate) || 0);
                        }
                    });
                });
            });

            KEYS.forEach(function(k) {
                if (tl.stages && tl.stages[k]) {
                    var grossDays = parseFloat(tl.stages[k].days) || 0;
                    result.totalDays += grossDays;
                    result.totalWorkingDays += stageStarts[k] ? computeWorkingDays(grossDays, stageStarts[k], workWeek, blackouts) : grossDays;
                }
            });

            if (result.totalWorkingDays > 0) result.dailyBurn = result.grandTotal / result.totalWorkingDays;
            if (result.dailyBurn > 0) result.runwayDays = result.totalCap / result.dailyBurn;
            return result;
        }

        /* --- getBurnStatus --- */
        function getBurnStatus(current, cap) {
            var pct = cap > 0 ? (current / cap) * 100 : 0;
            if (pct > 100) return { color: 'text-rose-600',  ring: 'border-rose-500',  stroke: '#f43f5e', pct: pct };
            if (pct > 85)  return { color: 'text-amber-500', ring: 'border-amber-400', stroke: '#f59e0b', pct: pct };
            return             { color: 'text-slate-900',  ring: 'border-slate-200', stroke: '#2563eb', pct: pct };
        }

        /* --- validateTimeline --- */
        function validateTimeline(b, stageKey) {
            var maxItemDays = 0;
            var hasItems = false;
            Object.values(b.sections || {}).forEach(function(sec) {
                (sec.items || []).forEach(function(item) {
                    if (item.stageData && item.stageData[stageKey]) {
                        hasItems = true;
                        var d = parseFloat(item.stageData[stageKey].days) || 0;
                        if (d > maxItemDays) maxItemDays = d;
                    }
                });
            });
            var userDays = (b.targetLock && b.targetLock.stages[stageKey])
                ? (parseFloat(b.targetLock.stages[stageKey].days) || 0) : 0;
            return {
                isValid:    userDays >= maxItemDays,
                maxNeeded:  maxItemDays,
                current:    userDays,
                delta:      userDays - maxItemDays,
                isBankrupt: hasItems && userDays === 0
            };
        }

        /* Phase 109.1: Weekend-skipping day counter — respects workWeek setting */
        function addWorkDays(startDate, days, workWeek) {
            var date = new Date(startDate);
            var count = 0;
            while (count < days) {
                date.setDate(date.getDate() + 1);
                var dow = date.getDay();
                var isWeekend = (workWeek <= 5 && (dow === 0 || dow === 6)) || (workWeek === 6 && dow === 0);
                if (!isWeekend) count++;
            }
            return date;
        }

        /* --- calculateTimeline (Phase 3.3 overrun + TZ fix + Phase 50C offsetDays) --- */
        function calculateTimeline(b) {
            var timeline = {};
            var baseDate = new Date(b.startDate || new Date());
            /* Timezone offset fix — prevents "yesterday" bug on pure date strings */
            baseDate = new Date(baseDate.getTime() + baseDate.getTimezoneOffset() * 60000);

            var KEYS = ['dev', 'pre', 'prod', 'post', 'dist'];
            var prevStart = null;

            KEYS.forEach(function(k) {
                var days = (b.targetLock && b.targetLock.stages[k])
                    ? (parseFloat(b.targetLock.stages[k].days) || 0) : 0;
                var offsetDays = (b.targetLock && b.targetLock.stages[k] && b.targetLock.stages[k].offsetDays !== undefined)
                    ? parseFloat(b.targetLock.stages[k].offsetDays) : null;

                var start;
                if (k === 'dev' || offsetDays === null) {
                    /* Waterfall: first stage starts at baseDate, others start after previous end */
                    if (k === 'dev') {
                        start = new Date(baseDate);
                    } else if (prevStart !== null) {
                        var prevStage = timeline[KEYS[KEYS.indexOf(k) - 1]];
                        start = new Date((prevStage && prevStage.end) || baseDate);
                    } else {
                        start = new Date(baseDate);
                    }
                } else {
                    /* Overlap: start relative to previous stage's start + offsetDays */
                    start = new Date(prevStart);
                    start.setDate(start.getDate() + offsetDays);
                }

                var workWeek = (b.settings && b.settings.workWeek) || 7;
                var end = (days > 0 && workWeek < 7) ? addWorkDays(start, days, workWeek) : new Date(start.getTime() + days * 86400000);
                var fmtD  = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
                timeline[k] = { start: start, end: end, label: days > 0 ? (fmtD(start) + ' – ' + fmtD(end)) : 'SCHEDULE TBD' };

                prevStart = new Date(start);
            });

            /* Phase 3.3: Overrun */
            var cursor = timeline.dist && timeline.dist.end ? timeline.dist.end : baseDate;
            if (b.deliveryDate) {
                var target    = new Date(b.deliveryDate);
                var targetAdj = new Date(target.getTime() + target.getTimezoneOffset() * 60000);
                var diffDays  = Math.ceil((targetAdj - cursor) / 86400000);
                var status    = diffDays < 0 ? 'OVERDUE' : (diffDays < 7 ? 'Tight' : 'On Track');
                var color     = diffDays < 0 ? 'text-rose-600' : (diffDays < 7 ? 'text-amber-500' : 'text-emerald-500');
                var ring      = diffDays < 0 ? 'border-rose-500' : (diffDays < 7 ? 'border-amber-400' : 'border-slate-100');
                timeline._analysis = { projectedEnd: cursor, targetDate: targetAdj, variance: diffDays, status: status, color: color, ring: ring };
            }
            return timeline;
        }

        /* --- analyzeRisk --- */
        function analyzeRisk(metrics, timeline) {
            if (!timeline || !timeline._analysis) return null;
            var variance = timeline._analysis.variance;
            if (variance >= 0) return null;

            var daysLate      = Math.abs(variance);
            var delayCost     = metrics.dailyBurn * daysLate;
            var projectedTotal = metrics.grandTotal + delayCost;
            var cap           = metrics.totalCap || 0;
            var isCritical    = cap > 0 && projectedTotal > cap;

            return {
                status:         isCritical ? 'CRITICAL' : 'WARNING',
                daysLate:       daysLate,
                dailyBurn:      metrics.dailyBurn,
                cost:           delayCost,
                projectedTotal: projectedTotal,
                message:        isCritical ? 'INSOLVENCY RISK' : 'DELAY COST',
                subMessage:     isCritical
                    ? ('Projected ' + fmt(projectedTotal) + ' exceeds Cap')
                    : ('Est. Penalty: ' + fmt(delayCost))
            };
        }

        /* ========= Studio Controller ========= */
        var mBTStageStudio = {

            state: {
                KEYS:   ['dev', 'pre', 'prod', 'post', 'dist'],
                TITLES: { dev: 'Development', pre: 'Pre-Production', prod: 'Production', post: 'Post-Production', dist: 'Distribution' },
                projectId:  null,
                project:    null,
                ogItems:    [],          /* OG rate database cache */
                _modalStage: null        /* which stage the add-item modal is targeting */
            },

            /* --- Boot --- */
            init: function() {
                var self = this;
                var params = new URLSearchParams(location.search);
                /* Prefer localforage key (shell bridge) over mBT_DB projectId */
                self.state._projectKey = params.get('projectKey') || null;
                self.state.projectId   = params.get('projectId') || null;
                self.state._currency   = params.get('currency') || 'JMD';

                /* Phase 62: Stamp RBAC role on body for CSS-driven lockdown */
                try {
                    var rbacRole = localStorage.getItem('mbt_rbac_role') || 'editor';
                    document.body.setAttribute('data-rbac-role', rbacRole);
                } catch(_) {}

                /* Phase 50C.8: Dispatch tool focus to parent presence channel */
                function dispatchFocus() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'mbt:tool-action', action: 'user-focus-changed', payload: { tool: 'stages' } }, '*');
                    }
                }
                dispatchFocus();
                window.addEventListener('focus', dispatchFocus);

                /* Phase 73B: receive undo/redo routing from parent monolith */
                window.addEventListener('message', function(e) {
                    if (!e.data || e.data.type !== 'mbt:tool-action') return;
                });

                /* Back button */
                dom.getElementById('btn-back').addEventListener('click', function() {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'mbt:tool-action', action: 'close-tool' }, '*');
    } else {
      /* Fallback for standalone direct-launch */
      window.location.href = '/index.html';
    }
                });

                /* Carousel grab-scroll */
                self._initCarouselScroll();

                /* Tab Navigation Bar */
                self._initTabNavigation();

                if (!self.state._projectKey && !self.state.projectId) {
                    self._showError('No project selected. Open a project from the dashboard first.');
                    return;
                }

                /* Load project via localforage (shell bridge) or mBT_DB (standalone) */
                var projectPromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    projectPromise = localforage.getItem(self.state._projectKey);
                } else if (self.state.projectId && window.mBT && window.mBT.storage) {
                    projectPromise = window.mBT.storage.getProject(self.state.projectId);
                } else {
                    self._showError('Storage engine not available. Reload the page.');
                    return;
                }

                /* OG items from mBT_DB if available, else empty */
                var ogPromise = (window.mBT && window.mBT.storage)
                    ? window.mBT.storage.getAllOGItems().catch(function() { return []; })
                    : Promise.resolve([]);

                Promise.all([projectPromise, ogPromise]).then(function(results) {
                    var project = results[0];
                    var ogItems = results[1];
                    if (!project) {
                        self._showError('Project not found. Make sure a project is open in the main tool.');
                        return;
                    }
                    self.state.project = project;
                    self.state.ogItems = ogItems || [];

                    /* Ensure targetLock structure */
                    if (!project.targetLock) project.targetLock = { enabled: true, totalCap: project.grandTotal || 0, stages: {} };
                    if (!project.targetLock.stages) project.targetLock.stages = {};
                    self.state.KEYS.forEach(function(k) {
                        if (!project.targetLock.stages[k]) {
                            project.targetLock.stages[k] = { label: k.toUpperCase(), ratio: 20, days: 0, locked: false };
                        } else {
                            /* Deep-default: repair partial stage objects from prior sessions */
                            var s = project.targetLock.stages[k];
                            if (s.ratio === undefined || s.ratio === null) s.ratio = 0;
                            if (s.days === undefined || s.days === null) s.days = 0;
                            if (s.locked === undefined || s.locked === null) s.locked = false;
                            if (!s.label) s.label = k.toUpperCase();
                        }
                    });

                    self.render();
                    self.initDragAndDrop();
                }).catch(function(err) {
                    self._showError('Failed to load project: ' + err.message);
                });
            },

            /* --- Full Render --- */
            render: function() {
                var b = this.state.project;
                if (!b) return;
                /* Dismiss skeleton, reveal layout */
                var sk = dom.getElementById('stages-skeleton');
                var sl = dom.getElementById('studio-layout');
                if (sk) sk.classList.add('hidden');
                if (sl) sl.classList.remove('hidden');

                /* Header */
                dom.getElementById('active-project-name').textContent = (b.company && b.company.productionTitle) ? b.company.productionTitle : 'UNTITLED';
                dom.getElementById('project-tag').textContent = b.id ? b.id.slice(-6).toUpperCase() : 'PROJECT';
                dom.getElementById('start-date').value    = b.startDate || '';
                dom.getElementById('delivery-date').value = b.deliveryDate || '';
                dom.getElementById('total-cap').value     = b.targetLock ? (b.targetLock.totalCap || '') : '';

                /* Panels */
                this.renderSliders();
                this.renderVitals();
                this.renderStageCards();
            },

            /* --- Sliders --- */
            renderSliders: function() {
                var b    = this.state.project;
                var self = this;
                var html = this.state.KEYS.map(function(k) {
                    var s = b.targetLock.stages[k];
                    return '<div class="relative">' +
                        '<div class="flex justify-between items-center mb-1.5">' +
                            '<span class="text-[9px] font-black uppercase tracking-widest text-slate-400">' + esc(self.state.TITLES[k]) + '</span>' +
                            '<span class="text-[10px] font-black text-white">' + (s.ratio || 0).toFixed(1) + '%</span>' +
                        '</div>' +
                        '<div class="h-2 bg-slate-800 rounded-full relative overflow-hidden">' +
                            '<div class="absolute top-0 left-0 h-full bg-blue-500 rounded-full pointer-events-none" style="width:' + s.ratio + '%"></div>' +
                            '<input type="range" min="0" max="100" step="0.5" value="' + s.ratio + '" ' +
                                'oninput="mBTStageStudio.balanceSliders(\'' + k + '\', this.value)" ' +
                                'onchange="mBTStageStudio.save()" ' +
                                (s.locked ? 'disabled ' : '') +
                                'class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">' +
                        '</div>' +
                    '</div>';
                }).join('');
                dom.getElementById('preset-sliders').innerHTML = html;
            },

            /* --- Vitals Panel (burn ring + stats + timeline) --- */
            renderVitals: function() {
                var b        = this.state.project;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var risk     = analyzeRisk(metrics, timeline);
                var burn     = getBurnStatus(metrics.grandTotal, metrics.totalCap);

                /* Risk overrides burn display */
                var ringText  = Math.round(burn.pct) + '%';
                var ringClass = 'text-4xl font-black leading-none tracking-tighter truncate w-full px-2 block ' + burn.color;
                var labelText = 'Burn';
                var labelClass = 'text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 truncate w-full px-1 block';

                if (risk) {
                    if (risk.status === 'CRITICAL') {
                        burn.stroke = '#f43f5e';
                        ringText   = 'CRITICAL';
                        ringClass  = 'text-xl font-black leading-none tracking-tight text-rose-600 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-rose-500 uppercase tracking-widest mt-1 animate-pulse truncate w-full px-1 block';
                    } else {
                        burn.stroke = '#f59e0b';
                        ringText   = 'DELAY';
                        ringClass  = 'text-2xl font-black leading-none tracking-tight text-amber-500 truncate w-full px-2 block';
                        labelText  = risk.subMessage;
                        labelClass = 'text-[8px] font-black text-amber-500 uppercase tracking-widest mt-1 truncate w-full px-1 block';
                    }
                }

                /* Burn ring */
                var offset = 276.46 - (Math.min(burn.pct, 100) / 100 * 276.46);
                var meter  = dom.getElementById('burn-meter');
                meter.style.strokeDashoffset = offset;
                meter.setAttribute('stroke', burn.stroke);
                dom.getElementById('burn-pct').textContent  = ringText;
                dom.getElementById('burn-pct').className    = ringClass;
                dom.getElementById('burn-label').textContent = labelText;
                dom.getElementById('burn-label').className   = labelClass;

                /* Stats */
                dom.getElementById('stat-grand-total').textContent = fmt(metrics.grandTotal);
                dom.getElementById('stat-total-cap').textContent   = fmt(metrics.totalCap);
                dom.getElementById('stat-daily-burn').textContent  = fmt(metrics.dailyBurn) + '/day';
                dom.getElementById('stat-runway').textContent      = Math.round(metrics.runwayDays) + ' Days';

                var riskEl = dom.getElementById('stat-risk');
                if (risk && risk.status === 'CRITICAL') {
                    riskEl.textContent = 'CRITICAL'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (risk && risk.status === 'WARNING') {
                    riskEl.textContent = 'DELAY'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else if (burn.pct > 100) {
                    riskEl.textContent = 'OVER CAP'; riskEl.className = 'text-[10px] font-black text-rose-600 uppercase tracking-widest';
                } else if (burn.pct > 85) {
                    riskEl.textContent = 'HIGH'; riskEl.className = 'text-[10px] font-black text-amber-500 uppercase tracking-widest';
                } else {
                    riskEl.textContent = 'MINIMAL'; riskEl.className = 'text-[10px] font-black text-emerald-500 uppercase tracking-widest';
                }

                /* Timeline audit */
                var tHtml = this.state.KEYS.map(function(k) {
                    var t = timeline[k];
                    var analysis = timeline._analysis;
                    var statusHtml = '';
                    if (analysis && k === 'dist') {
                        /* Show delivery status on the last stage */
                        statusHtml = ' <span class="' + analysis.color + ' font-black">[' + esc(analysis.status) + ']</span>';
                    }
                    return '<div class="flex justify-between items-center text-[10px] font-bold">' +
                        '<span class="text-slate-400 uppercase tracking-widest font-black text-[8px]">' + esc(k) + '</span>' +
                        '<span class="text-slate-800">' + esc(t.label) + statusHtml + '</span>' +
                    '</div>';
                }).join('');
                dom.getElementById('timeline-audit').innerHTML = tHtml;

                /* Delivery date input border color */
                var deliveryInput = dom.getElementById('delivery-date');
                if (timeline._analysis) {
                    deliveryInput.classList.remove('border-slate-700', 'border-rose-500', 'border-amber-500', 'border-emerald-500');
                    if (timeline._analysis.status === 'OVERDUE') deliveryInput.classList.add('border-rose-500');
                    else if (timeline._analysis.status === 'Tight')  deliveryInput.classList.add('border-amber-500');
                    else                                              deliveryInput.classList.add('border-emerald-500');
                }
            },

            /* --- Stage Cards --- */
            renderStageCards: function() {
                var b        = this.state.project;
                var self     = this;
                var metrics  = calculateMetrics(b);
                var timeline = calculateTimeline(b);
                var container = dom.getElementById('stage-cards-container');

                var html = this.state.KEYS.map(function(k) {
                    var s         = b.targetLock.stages[k];
                    var stageCost = metrics.stageTotals[k] || 0;
                    var stageCap  = metrics.totalCap * ((s.ratio || 0) / 100);
                    var isOver    = stageCost > stageCap && stageCap > 0;
                    var val       = validateTimeline(b, k);
                    var conflict  = val.maxNeeded > val.current;
                    var dateLabel = timeline[k] ? esc(timeline[k].label) : '';

                    /* Sync Days button — amber bounce when items exceed stage duration */
                    var syncBtn = (val.maxNeeded > val.current)
                        ? '<button onclick="mBTStageStudio.syncDays(\'' + k + '\')" title="Sync to ' + val.maxNeeded + ' days" class="absolute -right-2 -top-2 bg-amber-500 hover:bg-amber-600 text-white w-6 h-6 rounded-full shadow-lg z-50 flex items-center justify-center sync-bounce">' +
                          '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>' +
                          '</button>'
                        : '';

                    /* TIME BANKRUPTCY warning */
                    var dateDisplay = val.isBankrupt
                        ? '<span class="text-[8px] font-black text-rose-600 animate-pulse">TIME BANKRUPTCY</span>'
                        : '<span class="text-[8px] font-bold text-slate-400 mt-0.5 tracking-tight">' + dateLabel + '</span>';

                    return '<div id="' + k + '" class="studio-card min-w-[340px] w-[340px] snap-center shrink-0' + (conflict ? ' conflict-glow' : '') + '">' +
                        '<div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-20 shrink-0">' +
                            '<div class="flex items-center justify-between mb-1 relative">' +
                                /* Lock button */
                                '<button onclick="mBTStageStudio.toggleLock(\'' + k + '\')" class="w-6 h-6 flex items-center justify-center rounded-lg ' + (s.locked ? 'bg-amber-100 text-amber-600' : 'bg-slate-50 text-slate-300 hover:bg-slate-100') + ' transition-colors">' +
                                    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">' +
                                        (s.locked ? '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' : '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>') +
                                    '</svg>' +
                                '</button>' +
                                /* Title + date */
                                '<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">' +
                                    '<span class="text-[10px] font-black uppercase tracking-widest text-slate-800">' + esc(self.state.TITLES[k]) + '</span>' +
                                    dateDisplay +
                                '</div>' +
                                /* Days input + sync button */
                                '<div class="relative flex items-center gap-1.5 bg-slate-50 p-1 rounded-xl border border-slate-100">' +
                                    syncBtn +
                                    '<input type="number" value="' + s.days + '" oninput="mBTStageStudio.updateStageDays(\'' + k + '\', this.value)" class="w-10 text-center bg-transparent text-[11px] font-black ' + (conflict ? 'text-amber-600' : 'text-blue-600') + ' outline-none no-spinner">' +
                                    '<span class="text-[7px] font-black text-slate-400 uppercase tracking-widest mr-1">Days</span>' +
                                '</div>' +
                            '</div>' +
                            '<div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-1 mt-3">' +
                                '<div class="h-full ' + (isOver ? 'bg-rose-500' : 'bg-blue-500') + ' rounded-full transition-all duration-500" style="width:' + Math.min(stageCap > 0 ? (stageCost / stageCap) * 100 : 0, 100).toFixed(1) + '%"></div>' +
                            '</div>' +
                            '<div class="flex justify-between text-[8px] font-black uppercase tracking-widest">' +
                                '<span class="' + (isOver ? 'text-rose-600' : 'text-slate-400') + '">' + fmt(stageCost) + '</span>' +
                                '<span class="text-slate-400">Cap: ' + fmt(stageCap) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex-grow p-3 space-y-2 overflow-y-auto no-scrollbar bg-slate-50/50 stage-drop-zone" data-stage="' + k + '">' +
                            self.renderItems(k) +
                        '</div>' +
                        '<div class="p-4 border-t border-slate-100 bg-white shrink-0">' +
                            '<button onclick="mBTStageStudio.openAddModal(\'' + k + '\')" class="w-full py-2 rounded-xl bg-slate-50 border border-slate-100 text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-blue-600 hover:border-blue-100 hover:bg-white transition-all">+ Add Item</button>' +
                        '</div>' +
                    '</div>';
                }).join('');

                container.innerHTML = html;
                /* Re-attach drag and drop after DOM rebuild */
                this.initDragAndDrop();
                /* Re-attach scroll spy now that card elements exist in DOM */
                this._observeTabPanels();
            },

            /* --- Render Items in a Stage Card --- */
            renderItems: function(stageKey) {
                var b = this.state.project;
                var items = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[stageKey]) {
                            items.push({ item: item, secName: secName, order: item.stageData[stageKey].order || 0 });
                        }
                    });
                });
                items.sort(function(a, b) { return a.order - b.order; });

                if (!items.length) {
                    return '<div class="flex flex-col items-center justify-center py-8 gap-3">' +
                        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>' +
                        '<p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">No items assigned</p>' +
                        '<p class="text-[8px] font-bold text-slate-400">Add crew from the Setup tab</p>' +
                        '</div>';
                }

                /* Phase 90.RC: resolve temporal settings for payable-day cost display */
                var _workWeek   = (b.settings && b.settings.workWeek) || 5;
                var _blackouts  = b.blackoutDays || [];
                var _starts     = getStageStartDates(b);

                return items.map(function(entry) {
                    var item = entry.item;
                    var sd   = item.stageData[stageKey];
                    var grossDays   = parseFloat(sd.days) || 0;
                    var payableDays = _starts[stageKey]
                        ? computeWorkingDays(grossDays, _starts[stageKey], _workWeek, _blackouts)
                        : grossDays;
                    var cost = payableDays * (parseFloat(sd.rate || item.rate) || 0);
                    return '<div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm stage-item group cursor-grab active:cursor-grabbing" data-id="' + esc(item.id) + '">' +
                        '<div class="flex justify-between items-start mb-2">' +
                            '<div class="min-w-0 flex-grow pr-2">' +
                                '<p class="text-[10px] font-black text-slate-800 leading-tight truncate uppercase tracking-tight">' + esc(item.description || 'UNTITLED') + '</p>' +
                                '<p class="text-[7px] font-black text-slate-400 uppercase tracking-widest truncate">' + esc(entry.secName) + '</p>' +
                            '</div>' +
                            '<button onclick="mBTStageStudio.removeItem(\'' + esc(item.id) + '\', \'' + stageKey + '\')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition-all shrink-0">' +
                                '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                            '</button>' +
                        '</div>' +
                        '<div class="flex items-center gap-2">' +
                            '<div>' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Days</label>' +
                                '<input type="number" value="' + (sd.days || 0) + '" oninput="mBTStageStudio.updateItemDays(\'' + esc(item.id) + '\', \'' + stageKey + '\', this.value)" class="w-10 bg-slate-50 rounded text-center text-[10px] text-blue-600 font-bold outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div>' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Rate</label>' +
                                '<input type="number" value="' + (sd.rate || item.rate || 0) + '" oninput="mBTStageStudio.updateItemRate(\'' + esc(item.id) + '\', \'' + stageKey + '\', this.value)" class="w-20 bg-slate-50 rounded text-center text-[10px] text-slate-600 font-bold outline-none no-spinner border border-slate-100">' +
                            '</div>' +
                            '<div class="ml-auto text-right">' +
                                '<label class="block text-[7px] font-black text-slate-400 uppercase mb-0.5">Cost</label>' +
                                '<span class="text-[10px] font-black text-slate-800 font-mono">' + fmt(cost) + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('');
            },

            /* ========= Interaction Handlers ========= */

            balanceSliders: function(changedKey, value) {
                var b      = this.state.project;
                var stages = b.targetLock.stages;
                var KEYS   = this.state.KEYS;
                var newVal = parseFloat(value);
                if (isNaN(newVal)) newVal = 0;

                var lockedKeys    = KEYS.filter(function(k) { return k !== changedKey && stages[k].locked; });
                var unlockedKeys  = KEYS.filter(function(k) { return k !== changedKey && !stages[k].locked; });
                var lockedTotal   = lockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                var maxAvail      = 100 - lockedTotal;

                if (newVal > maxAvail) newVal = maxAvail;
                if (newVal < 0)        newVal = 0;
                stages[changedKey].ratio = newVal;

                var remaining          = Math.max(0, 100 - newVal - lockedTotal);
                var currentUnlockedSum = unlockedKeys.reduce(function(s, k) { return s + (stages[k].ratio || 0); }, 0);
                unlockedKeys.forEach(function(k) {
                    stages[k].ratio = currentUnlockedSum <= 0.01
                        ? remaining / unlockedKeys.length
                        : remaining * (stages[k].ratio / currentUnlockedSum);
                });

                this.render();
            },

            applyPreset: function(name) {
                var ratios = STAGE_PRESETS[name];
                if (!ratios) return;
                var stages = this.state.project.targetLock.stages;
                Object.keys(ratios).forEach(function(k) {
                    if (stages[k]) { stages[k].ratio = ratios[k]; stages[k].locked = false; }
                });
                this.render();
                this.save();
            },

            toggleLock: function(key) {
                var s = this.state.project.targetLock.stages[key];
                s.locked = !s.locked;
                this.render();
                this.save();
            },

            updateStageDays: function(key, val) {
                this.state.project.targetLock.stages[key].days = parseFloat(val) || 0;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            syncDays: function(key) {
                var val = validateTimeline(this.state.project, key);
                if (val.maxNeeded > 0) {
                    this.state.project.targetLock.stages[key].days = val.maxNeeded;
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            updateItemDays: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    item.stageData[stageKey].days = parseFloat(val) || 0;
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            updateItemRate: function(itemId, stageKey, val) {
                var item = this._findItem(itemId);
                if (item && item.stageData && item.stageData[stageKey]) {
                    item.stageData[stageKey].rate = parseFloat(val) || 0;
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            removeItem: function(itemId, stageKey) {
                var item = this._findItem(itemId);
                if (item && item.stageData) {
                    delete item.stageData[stageKey];
                    this.renderVitals();
                    this.renderStageCards();
                    this.save();
                }
            },

            updateCap: function(val) {
                this.state.project.targetLock.totalCap = parseFloat(val) || 0;
                this.renderVitals();
                this.save();
            },

            updateDate: function(type, val) {
                if (type === 'start')    this.state.project.startDate    = val;
                else                     this.state.project.deliveryDate = val;
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            bulkAction: function(action) {
                var b    = this.state.project;
                var KEYS = this.state.KEYS;
                if (action === 'lockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = true; });
                    this.render(); this.save();
                } else if (action === 'unlockAll') {
                    KEYS.forEach(function(k) { b.targetLock.stages[k].locked = false; });
                    this.render(); this.save();
                } else if (action === 'syncDays') {
                    KEYS.forEach(function(k) {
                        var val = validateTimeline(b, k);
                        if (val.maxNeeded > 0) b.targetLock.stages[k].days = val.maxNeeded;
                    });
                    this.render(); this.save();
                } else if (action === 'dedupe') {
                    /* Remove items assigned to multiple stages that share same description */
                    var seen = {};
                    Object.values(b.sections || {}).forEach(function(sec) {
                        (sec.items || []).forEach(function(item) {
                            var desc = (item.description || '').toLowerCase().trim();
                            if (!item.stageData) return;
                            KEYS.forEach(function(k) {
                                if (!item.stageData[k]) return;
                                var key = desc + '|' + k;
                                if (seen[key]) delete item.stageData[k];
                                else seen[key] = true;
                            });
                        });
                    });
                    this.render(); this.save();
                }
            },

            autoFillAll: function() {
                var b    = this.state.project;
                var tl   = b.targetLock;
                var KEYS = this.state.KEYS;
                Object.values(b.sections || {}).forEach(function(sec) {
                    (sec.items || []).forEach(function(item) {
                        if (!item.stageData) item.stageData = {};
                        var desc   = (item.description || '').toLowerCase();
                        var target = 'prod';
                        if (desc.includes('post') || desc.includes('edit') || desc.includes('vfx') || desc.includes('grade') || desc.includes('color')) target = 'post';
                        else if (desc.includes('pre') || desc.includes('scout') || desc.includes('cast') || desc.includes('rehearsal')) target = 'pre';
                        else if (desc.includes('dev') || desc.includes('script') || desc.includes('option') || desc.includes('treatment')) target = 'dev';
                        else if (desc.includes('dist') || desc.includes('deliver') || desc.includes('master') || desc.includes('dcp')) target = 'dist';
                        if (!item.stageData[target]) {
                            item.stageData[target] = { days: tl.stages[target].days || 1, rate: item.rate || 0, order: 0 };
                        }
                    });
                });
                this.render(); this.save();
            },

            clearAll: function() {
                if (!confirm('Clear all stage assignments? This cannot be undone.')) return;
                Object.values(this.state.project.sections || {}).forEach(function(sec) {
                    (sec.items || []).forEach(function(item) { item.stageData = {}; });
                });
                this.render(); this.save();
            },

            /* ========= Add Item Modal ========= */

            openAddModal: function(stageKey) {
                this.state._modalStage = stageKey;
                var stageTitle = this.state.TITLES[stageKey] || stageKey.toUpperCase();
                dom.getElementById('modal-title').textContent = 'Add to ' + stageTitle;
                dom.getElementById('modal-search').value = '';
                dom.getElementById('custom-form').classList.add('hidden');
                this._buildModalList('');
                dom.getElementById('add-item-modal').classList.add('open');
            },

            closeAddModal: function() {
                dom.getElementById('add-item-modal').classList.remove('open');
                this.state._modalStage = null;
            },

            filterModalList: function(term) {
                this._buildModalList(term);
            },

            toggleCustomForm: function() {
                dom.getElementById('custom-form').classList.toggle('hidden');
            },

            _buildModalList: function(term) {
                var b      = this.state.project;
                var sk     = this.state._modalStage;
                var q      = (term || '').toLowerCase();
                var self   = this;

                /* Existing budget items not yet in this stage */
                var existing = [];
                Object.entries(b.sections || {}).forEach(function(entry) {
                    var secName = entry[0];
                    var sec     = entry[1];
                    (sec.items || []).forEach(function(item) {
                        if (item.stageData && item.stageData[sk]) return;
                        if (q && !(item.description || '').toLowerCase().includes(q)) return;
                        existing.push({ id: item.id, description: item.description, rate: item.rate, isExisting: true, secName: secName });
                    });
                });

                /* OG rate database */
                var ogFiltered = (this.state.ogItems || []).filter(function(i) {
                    return !q || (i.description || '').toLowerCase().includes(q);
                }).slice(0, 20);

                var all = existing.slice(0, 15).concat(ogFiltered);

                if (!all.length) {
                    dom.getElementById('modal-list').innerHTML = '<div class="p-6 text-center text-[9px] font-black text-slate-300 uppercase tracking-widest">No matches</div>';
                    return;
                }

                dom.getElementById('modal-list').innerHTML = all.map(function(item) {
                    var badge = item.isExisting
                        ? '<span class="text-[7px] font-black text-emerald-600 uppercase tracking-widest">From Budget · ' + esc(item.secName) + '</span>'
                        : '<span class="text-[7px] font-black text-blue-400 uppercase tracking-widest">Rate DB</span>';
                    var action = item.isExisting
                        ? 'mBTStageStudio._assignExisting(\'' + esc(item.id) + '\')'
                        : 'mBTStageStudio._assignFromOG(\'' + esc(item.id) + '\')';
                    return '<div onclick="' + action + '" class="p-3 border-b border-slate-50 bg-white hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors">' +
                        '<div>' +
                            '<div class="text-[11px] font-bold text-slate-700">' + esc(item.description) + '</div>' +
                            badge +
                        '</div>' +
                        '<div class="text-[10px] font-mono font-bold text-slate-500 ml-4 shrink-0">' + fmt(item.rate) + '</div>' +
                    '</div>';
                }).join('');
            },

            _assignExisting: function(itemId) {
                var sk   = this.state._modalStage;
                var item = this._findItem(itemId);
                if (!item) return;
                if (!item.stageData) item.stageData = {};
                item.stageData[sk] = { days: 1, rate: item.rate || 0, order: 0 };
                this.closeAddModal();
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            _assignFromOG: function(ogId) {
                var sk       = this.state._modalStage;
                var b        = this.state.project;
                var ogItem   = (this.state.ogItems || []).find(function(i) { return i.id === ogId; });
                if (!ogItem) return;

                /* Guess target section */
                var secNames = Object.keys(b.sections || {});
                var targetSec = secNames.find(function(s) { return /production/i.test(s); }) || secNames[0];
                if (sk === 'post') targetSec = secNames.find(function(s) { return /post|edit/i.test(s); }) || targetSec;
                if (sk === 'dev')  targetSec = secNames.find(function(s) { return /dev|creative/i.test(s); }) || targetSec;
                if (!targetSec || !b.sections[targetSec]) return;

                var newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                    description: ogItem.description,
                    quantity: 1, unit: ogItem.unit || 'Day', multiplier: 1,
                    rate: ogItem.rate || 0, actual: 0, rateType: 'negotiable',
                    stageData: {}
                };
                newItem.stageData[sk] = { days: 1, rate: ogItem.rate || 0, order: 0 };
                b.sections[targetSec].items.push(newItem);

                this.closeAddModal();
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            addCustomItem: function() {
                var sk   = this.state._modalStage;
                var b    = this.state.project;
                var desc = (dom.getElementById('custom-desc').value || '').trim();
                var rate = parseFloat(dom.getElementById('custom-rate').value) || 0;
                var unit = dom.getElementById('custom-unit').value;
                if (!desc) { dom.getElementById('custom-desc').focus(); return; }

                var secNames  = Object.keys(b.sections || {});
                var targetSec = secNames.find(function(s) { return /production/i.test(s); }) || secNames[0];
                if (sk === 'post') targetSec = secNames.find(function(s) { return /post|edit/i.test(s); }) || targetSec;
                if (sk === 'dev')  targetSec = secNames.find(function(s) { return /dev|creative/i.test(s); }) || targetSec;
                if (!targetSec || !b.sections[targetSec]) return;

                var newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                    description: desc, quantity: 1, unit: unit, multiplier: 1,
                    rate: rate, actual: 0, rateType: 'negotiable', stageData: {}
                };
                newItem.stageData[sk] = { days: 1, rate: rate, order: 0 };
                b.sections[targetSec].items.push(newItem);

                /* Reset form */
                dom.getElementById('custom-desc').value = '';
                dom.getElementById('custom-rate').value = '';
                this.closeAddModal();
                this.renderVitals();
                this.renderStageCards();
                this.save();
            },

            /* ========= Persistence ========= */

            save: function() {
                var self = this;
                if (!self.state.project) return;
                var cleanProject = JSON.parse(JSON.stringify(self.state.project));

                var savePromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    /* Shell bridge: write back to localforage so the shell sees changes */
                    savePromise = localforage.setItem(self.state._projectKey, cleanProject);
                } else if (window.mBT && window.mBT.storage) {
                    savePromise = window.mBT.storage.updateProject(cleanProject);
                } else {
                    return;
                }

                savePromise.then(function() {
                    /* Notify shell to reload budget from storage */
                    var stages = cleanProject.targetLock ? cleanProject.targetLock.stages : {};
                    var msg = { type: 'mbt:tool-action', action: 'reconcile', payload: { stages: stages } };
                    if (window.mBTBridge) window.mBTBridge.send('reconcile', { stages: stages });
                    else if (window.parent !== window) window.parent.postMessage(msg, '*');
                }).catch(function(err) {
                    console.error('[Stages] Save failed:', err);
                });
            },

            syncFromDb: function() {
                var self = this;
                var loadPromise;
                if (self.state._projectKey && typeof localforage !== 'undefined') {
                    loadPromise = localforage.getItem(self.state._projectKey);
                } else if (self.state.projectId && window.mBT && window.mBT.storage) {
                    loadPromise = window.mBT.storage.getProject(self.state.projectId);
                } else { return; }
                loadPromise.then(function(project) {
                    if (project) { self.state.project = project; self.render(); }
                });
            },

            /* ========= Drag and Drop ========= */

            initDragAndDrop: function() {
                var self = this;
                /* Phase 62: read RBAC role from parent's localStorage — if viewer, mount static */
                var rbacRole = 'editor';
                try { rbacRole = localStorage.getItem('mbt_rbac_role') || 'editor'; } catch(_) {}
                var isViewOnly = (rbacRole === 'viewer');

                dom.querySelectorAll('.stage-drop-zone').forEach(function(zone) {
                    var instance = new Sortable(zone, {
                        group: 'stages',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        dragClass: 'sortable-drag',
                        disabled: isViewOnly,  /* Natively kills drag-and-drop for view-only users */
                        onEnd: function(evt) {
                            var itemId    = evt.item.dataset.id;
                            var fromStage = evt.from.dataset.stage;
                            var toStage   = evt.to.dataset.stage;

                            if (fromStage !== toStage) {
                                var item = self._findItem(itemId);
                                if (item && item.stageData && item.stageData[fromStage]) {
                                    item.stageData[toStage] = Object.assign({}, item.stageData[fromStage]);
                                    delete item.stageData[fromStage];
                                }
                            }

                            /* Persist new order */
                            var itemsInStage = Array.from(evt.to.children).map(function(c) { return c.dataset.id; });
                            itemsInStage.forEach(function(id, idx) {
                                var item = self._findItem(id);
                                if (item && item.stageData && item.stageData[toStage]) item.stageData[toStage].order = idx;
                            });

                            self.renderVitals();
                            self.renderStageCards();
                            self.save();
                        }
                    });
                });
            },

            /* ========= Carousel Grab-Scroll ========= */

            _initCarouselScroll: function() {
                var slider = dom.getElementById('studio-layout');
                var isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', function(e) {
                    if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
                    if (e.target.closest('.stage-item') || e.target.closest('.stage-drop-zone')) return;
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                    slider.style.cursor = 'grabbing';
                });
                slider.addEventListener('mouseleave', function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mouseup',    function() { isDown = false; slider.style.cursor = 'grab'; });
                slider.addEventListener('mousemove',  function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    slider.scrollLeft = scrollLeft - (e.pageX - slider.offsetLeft - startX) * 2;
                });
            },

            /* ========= Tab Navigation Bar ========= */

            _initTabNavigation: function() {
                var self = this;
                var tabs = dom.querySelectorAll('.tab-btn');
                self._tabBtns = tabs;

                /* Tab click handler — looks up panel lazily at click time */
                tabs.forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        var targetPanelId = this.dataset.tab;
                        var targetPanel = dom.getElementById(targetPanelId);
                        if (!targetPanel) return;
                        targetPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        tabs.forEach(function(t) { t.classList.remove('active'); });
                        this.classList.add('active');
                    });
                });

                /* Create IntersectionObserver once — panels attached after cards render via _observeTabPanels() */
                self._tabObserver = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (!entry.isIntersecting) return;
                        var panelId = entry.target.id;
                        if (!panelId) return;
                        self._tabBtns.forEach(function(t) { t.classList.remove('active'); });
                        var tab = dom.querySelector('.tab-btn[data-tab="' + panelId + '"]');
                        if (tab) tab.classList.add('active');
                    });
                }, {
                    root: dom.getElementById('studio-layout'),
                    rootMargin: '0px',
                    threshold: 0.4
                });
            },

            /* Re-attach scroll spy after every renderStageCards call */
            _observeTabPanels: function() {
                if (!this._tabObserver) return;
                var panels = ['panel-setup', 'panel-vitals', 'dev', 'pre', 'prod', 'post', 'dist'];
                this._tabObserver.disconnect();
                var obs = this._tabObserver;
                panels.forEach(function(id) {
                    var el = dom.getElementById(id);
                    if (el) obs.observe(el);
                });
            },

            /* ========= Utilities ========= */

            _findItem: function(id) {
                var b = this.state.project;
                var found = null;
                Object.values(b.sections || {}).forEach(function(sec) {
                    if (found) return;
                    var item = (sec.items || []).find(function(i) { return i.id === id; });
                    if (item) found = item;
                });
                return found;
            },

            _showError: function(msg) {
                dom.getElementById('studio-layout').innerHTML =
                    '<div class="flex-grow flex items-center justify-center">' +
                        '<div class="text-center">' +
                            '<p class="text-4xl font-black text-slate-200 uppercase tracking-tighter mb-2">Not Connected</p>' +
                            '<p class="text-[11px] font-bold text-slate-400">' + esc(msg) + '</p>' +
                        '</div>' +
                    '</div>';
            }
        };

        window.onload = function() { mBTStageStudio.init(); };
    </script>
