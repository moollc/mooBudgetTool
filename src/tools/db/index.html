        defaults.shootingLocations = siteDefaults.shootingLocations;
      } else if (Array.isArray(d.shootingLocations) && Array.isArray(siteDefaults.shootingLocations)) {
        d.shootingLocations.forEach(function (loc, i) {
          var src = siteDefaults.shootingLocations[i];
          if (!loc || !src) return;
          if (!(loc.contactName || loc.contact) && (src.contactName || src.contact)) {
            loc.contactName = src.contactName || src.contact || '';
            loc.contact = loc.contactName;
          }
          if (!loc.contactPhone && src.contactPhone) loc.contactPhone = src.contactPhone;
        });
      }
    }
    var overrides = (d._autofill && d._autofill.overrides) || {};
    if (d.dayId == null) d.dayId = '';

    ['productionTitle', 'director', 'producers', 'dp', 'upm', 'firstAd', 'secondAd', 'productionOffice', 'date'].forEach(function (k) {
      if ((d[k] == null || d[k] === '') && !overrides[k] && defaults[k]) {
        d[k] = defaults[k];
      }
    });
    var generated = (d._autofill && d._autofill.generated) || {};
    if (defaults.dayOf || typeof generated.dayOf === 'string') applyCallSheetDayTitle(d, defaults.dayOf || '');
    if (!d.crewCall && d.generalCall != null) d.crewCall = d.generalCall;
    delete d.generalCall;
    if (String(d.productionOffice || '').trim().toLowerCase() === 'independent') d.productionOffice = '';

    /* Migrate legacy scenes and merge with schedule without losing either */
    var mergedSched = csTmpl && csTmpl._mergeScheduleAndScenes
      ? csTmpl._mergeScheduleAndScenes(d.schedule, d.scenes)
      : (Array.isArray(d.schedule) && d.schedule.length ? d.schedule : (d.scenes || []));
    if (mergedSched.length > 0) {
      d.schedule = mergedSched;
      d.scenes = JSON.parse(JSON.stringify(mergedSched));
    } else if (!d._keepEmptySchedule) {
      var blankSched = [{ time: '', activity: '', location: '', people: '', notes: '', sceneNum: '', intExt: '', dayNight: '', description: '', cast: '', pages: '', tbc: false }];
      d.schedule = blankSched;
      d.scenes = JSON.parse(JSON.stringify(blankSched));
    } else {
      d.schedule = [];
      d.scenes = [];
    }

    /* Crew table from linked contacts */
    if ((!Array.isArray(d.crew) || d.crew.length === 0) && !d._keepEmptyCrew) {
      if (defaults.crew && defaults.crew.length > 0) {
        d.crew = JSON.parse(JSON.stringify(defaults.crew));
      } else {
        d.crew = [{ role: '', name: '', phone: '', call: '', notes: '', tbc: false }];
      }
    }

    /* Interviewees table */
    if ((!Array.isArray(d.interviewees) || d.interviewees.length === 0) && !d._keepEmptyInterviewees) {
      if (defaults.interviewees && defaults.interviewees.length > 0) {
        d.interviewees = JSON.parse(JSON.stringify(defaults.interviewees));
      } else {
        d.interviewees = [{ name: '', role: '', time: '', location: '', releaseStatus: '', notes: '', tbc: false }];
      }
    }

    /* Contacts block (client, locations, hospitals, other) */
    if (!d.contactsBlock || typeof d.contactsBlock !== 'object' || Array.isArray(d.contactsBlock)) {
      d.contactsBlock = { client: [], locations: [], hospitals: [], other: [] };
    }
    ['client', 'locations', 'hospitals', 'other'].forEach(function (cat) {
      if (!Array.isArray(d.contactsBlock[cat])) d.contactsBlock[cat] = [];
    });
    if (Array.isArray(d.contacts) && d.contacts.length > 0 && d.contactsBlock.other.length === 0 && !d._keepEmptyContactsBlock) {
      d.contacts.forEach(function (c) {
        if (c && (c.name || c.role || c.phone)) d.contactsBlock.other.push(JSON.parse(JSON.stringify(c)));
      });
    }
    var cbEmpty = !d.contactsBlock.client.length && !d.contactsBlock.locations.length && !d.contactsBlock.hospitals.length && !d.contactsBlock.other.length;
    if (cbEmpty && !d._keepEmptyContactsBlock && defaults.contactsBlock) {
      ['client', 'locations', 'hospitals', 'other'].forEach(function (cat) {
        if (Array.isArray(defaults.contactsBlock[cat]) && defaults.contactsBlock[cat].length > 0) {
          d.contactsBlock[cat] = JSON.parse(JSON.stringify(defaults.contactsBlock[cat]));
        }
      });
    }

    /* Shooting locations */
    if ((!Array.isArray(d.shootingLocations) || d.shootingLocations.length === 0) && !d._keepEmptyLocations) {
      d.shootingLocations = (defaults.shootingLocations && defaults.shootingLocations.length > 0)
        ? JSON.parse(JSON.stringify(defaults.shootingLocations))
        : [{ address: '', eta: '', notes: '', tbc: false }];
    }

    /* Meals & Lodging */
    var defMeals = defaults.meals || { breakfast: '', lunch: '', dinner: '', waterAndSnacks: '', lodging: '', checklist: [] };
    if (!d.meals || typeof d.meals !== 'object' || Array.isArray(d.meals)) {
      d.meals = {
        breakfast: typeof d.meals === 'string' ? d.meals : (d.breakfast || ''),
        lunch: d.lunch || '',
        dinner: d.dinner || '',
        waterAndSnacks: d.waterAndSnacks || d.waterNotes || '',
        lodging: d.lodging || '',
        checklist: Array.isArray(d.meals) ? d.meals : JSON.parse(JSON.stringify(defMeals.checklist || []))
      };
    } else {
      if (d.meals.breakfast == null) d.meals.breakfast = d.breakfast || '';
      if (d.meals.lunch == null) d.meals.lunch = d.lunch || '';
      if (d.meals.dinner == null) d.meals.dinner = d.dinner || '';
      if (d.meals.waterAndSnacks == null) d.meals.waterAndSnacks = d.waterAndSnacks || d.waterNotes || '';
      if (d.meals.lodging == null) d.meals.lodging = d.lodging || '';
      if (!Array.isArray(d.meals.checklist)) {
        d.meals.checklist = JSON.parse(JSON.stringify(defMeals.checklist || []));
      }
    }

    /* Route & Location Pin */
    var defRoute = defaults.route || { directions: '', locationPin: '', meetingSpot: '', fuelNotes: '', checklist: [] };
    if (!d.route || typeof d.route !== 'object' || Array.isArray(d.route)) {
      d.route = {
        directions: typeof d.route === 'string' ? d.route : (d.routeNotes || d.directions || defRoute.directions || ''),
        locationPin: d.locationPin || d.mapPin || defRoute.locationPin || '',
        meetingSpot: d.meetingSpot || defRoute.meetingSpot || '',
        fuelNotes: d.fuelNotes || defRoute.fuelNotes || '',
        checklist: Array.isArray(d.route) ? d.route : JSON.parse(JSON.stringify(defRoute.checklist || []))
      };
    } else {
      if (d.route.directions == null) d.route.directions = d.routeNotes || d.directions || '';
      if (d.route.locationPin == null) d.route.locationPin = d.locationPin || d.mapPin || '';
      if (d.route.meetingSpot == null) d.route.meetingSpot = d.meetingSpot || '';
      if (d.route.fuelNotes == null) d.route.fuelNotes = d.fuelNotes || '';
      if (!Array.isArray(d.route.checklist)) {
        d.route.checklist = JSON.parse(JSON.stringify(defRoute.checklist || []));
      }
    }

    /* Checklists: kit, paperwork, wrap (unticked by default) */
    ['kit', 'paperwork', 'wrap'].forEach(function (sec) {
      if (!Array.isArray(d[sec]) && !d['_keepEmpty_' + sec]) {
        d[sec] = Array.isArray(defaults[sec]) ? JSON.parse(JSON.stringify(defaults[sec])) : [];
      }
    });

    if (!d.deptNotes || typeof d.deptNotes !== 'object') {
      d.deptNotes = { camera: '', ge: '', artProps: '', wardrobeFx: '' };
    }

    /* hideEmpty is a document option: default false (write-in blanks print as before). */
    if (d.hideEmpty == null) d.hideEmpty = false;
    else d.hideEmpty = !!d.hideEmpty;

    /* Z10: old documents with hospital fields but no source load as typed. */
    function migrateHospitalSource(target, nameKey) {
      if (!target) return;
      var has = [target[nameKey], target.hospitalPhone, target.hospitalAddress, target.hospitalDistance]
        .some(function (v) { return String(v || '').trim() !== ''; });
      if (!has) {
        target.hospitalSource = '';
        target.hospitalRetrievedAt = '';
        return;
      }
      if (!String(target.hospitalSource || '').trim()) target.hospitalSource = 'typed';
    }
    migrateHospitalSource(d, 'hospitalName');
    (d.shootingLocations || []).forEach(function (loc) { migrateHospitalSource(loc, 'hospital'); });
  }

  /* ======== Build Editor (dispatcher) ======== */
  function buildEditor(templateId) {
    if (templateId === 'storyboard') refreshStoryboardChoices();
    var panel = dom.getElementById('editor-panel');
    var d = editorData;
    var html;
    if (templateId === 'callSheet') {
      normalizeCallSheetEditorData(d);
      html = buildCallSheetHtml(d);
    } else if (templateId === 'purchaseOrder') {
      html = buildPurchaseOrderHtml(d);
    } else if (templateId === 'pettyCash') {
      html = buildPettyCashHtml(d);
    } else if (templateId === 'crewDealMemo') {
      html = buildCrewDealMemoHtml(d);
    } else if (templateId === 'crewList') {
      html = buildCrewListHtml(d);
    } else if (templateId === 'productionReport') {
      html = buildProductionReportHtml(d);
    } else if (templateId === 'talentAgreement') {
      normalizeReleaseEditorData('talentAgreement', d);
      html = buildTalentAgreementHtml(d);
    } else if (templateId === 'sitePermission') {
      normalizeReleaseEditorData('sitePermission', d);
      html = buildSitePermissionHtml(d);
    } else if (templateId === 'locationAgreement') {
      normalizeReleaseEditorData('locationAgreement', d);
      html = buildLocationAgreementHtml(d);
    } else if (templateId === 'kitRentalAgreement') {
      html = buildKitRentalAgreementHtml(d);
    } else if (templateId === 'dood') {
      html = buildDoodHtml(d);
    } else if (templateId === 'fundingPackage') {
      html = buildFundingPackageHtml(d);
    } else if (templateId === 'fundingStrategy') {
      html = '<div class="ed-section"><div class="ed-section-hdr">Funding Strategy</div>' +
        fld('productionTitle', 'Production Title') + fld('contactName', 'Contact Name') + fld('contactEmail', 'Email');
      ['execSummary', 'sourcingApproach', 'investorProfile', 'fundingTimeline', 'askDetails', 'riskMitigation'].forEach(function (key) {
        html += fld(key, key.replace(/([A-Z])/g, ' $1'), 'textarea', true);
      });
      html += '</div>';
    } else if (templateId === 'budgetComparison') {
      html = buildBudgetComparisonHtml(d);
    } else if (templateId === 'scriptBreakdown') {
      html = buildScriptBreakdownHtml(d);
    } else if (templateId === 'shootingSchedule') {
      html = buildShootingScheduleHtml(d);
    } else if (templateId === 'continuityLog') {
      html = buildContinuityLogHtml(d);
    } else if (templateId === 'movementOrder') {
      html = buildMovementOrderHtml(d);
    } else if (templateId === 'pitchDeck') {
      html = buildPitchDeckHtml(d);
    } else if (templateId === 'storyboard') {
      html = buildStoryboardHtml(d);
    } else if (templateId === 'appearanceRelease') {
      normalizeReleaseEditorData('appearanceRelease', d);
      html = buildAppearanceReleaseHtml(d);
    } else if (templateId === 'vendorInvoice') {
      html = buildVendorInvoiceHtml(d);
    } else if (templateId === 'incidentReport') {
      html = buildIncidentReportHtml(d);
    } else if (templateId === 'nda') {
      html = buildNdaHtml(d);
    } else if (templateId === 'wrapReport') {
      html = buildWrapReportHtml(d);
    } else if (templateId === 'extrasVoucher') {
      html = buildExtrasVoucherHtml(d);
    } else if (templateId === 'weeklyCostReport') {
      html = buildWeeklyCostReportHtml(d);
    } else if (templateId === 'cashPaymentVoucher') {
      html = buildCashPaymentVoucherHtml(d);
    } else if (templateId === 'groupMinorConsent') {
      html = buildGroupMinorConsentHtml(d);
    } else if (templateId === 'interviewQuestions') {
      normalizeInterviewQuestionsEditorData(d);
      html = buildInterviewQuestionsHtml(d);
    } else if (templateId === 'equipmentChecklist') {
      html = buildEquipmentChecklistHtml(d);
    } else {
      panel.innerHTML = '<p style="padding:20px;color:var(--muted);">This template has no editor.</p>';
      return;
    }

    html = '<button id="af-refresh" type="button" class="ed-add-btn">Sources and refresh</button>' + html;
    html += '<button id="reset-btn" type="button">Reset to Defaults</button>';

    /* Replace panel node to strip accumulated event listeners from previous buildEditor calls */
    var lastScroll = panel.scrollTop;
    var fresh = panel.cloneNode(false);
    fresh.innerHTML = html;
    panel.parentNode.replaceChild(fresh, panel);
    fresh.scrollTop = lastScroll;
    wireEditor(fresh);
    Array.prototype.forEach.call(fresh.querySelectorAll('[data-arr][data-f]'), function (input) {
      var root = input.getAttribute('data-arr'), path = root + '.' + input.getAttribute('data-i') + '.' + input.getAttribute('data-f');
      var sources = editorData._autofill && editorData._autofill.sources || {}, source = sources[path] || sources[root];
      input.title = source ? source.ref : 'Document value. Use Sources and refresh to review mapped facts.';
      if (editorData._autofill && editorData._autofill.overrides[root]) input.title += '; this row group includes document edits';
    });
    fresh.querySelector('#af-refresh').onclick = function () { afRefresh(true); };
    if (templateId === 'pitchDeck' && editorData._autofill && editorData._autofill.overrides.askAmount) {
      var ask = fresh.querySelector('[data-key="askAmount"]');
      if (ask) ask.previousElementSibling.textContent = 'Seeking (recipient amount entered in this document)';
    }

    /* Wire callSheet-specific smart buttons */
    var loadBtn = fresh.querySelector('#btn-load-budget');
    if (loadBtn) loadBtn.addEventListener('click', autoPopulateFromBudget);
    var dmLoadBtn = fresh.querySelector('#btn-dm-load-budget');
    if (dmLoadBtn) dmLoadBtn.addEventListener('click', loadDealMemoFromBudget);
    var weatherBtn = fresh.querySelector('#btn-fetch-weather');
    if (weatherBtn) weatherBtn.addEventListener('click', fetchWeatherAndHospitals);
    var weatherLocBtn = fresh.querySelector('#btn-fetch-weather-loc');
    if (weatherLocBtn) weatherLocBtn.addEventListener('click', fetchWeatherAndHospitals);
    /* Wire fundingPackage Autofill (budget -> AI cascade) */
    var fpAutofillBtn = fresh.querySelector('#btn-fp-autofill');
    if (fpAutofillBtn) fpAutofillBtn.addEventListener('click', function () { autoPopulateFromBudget(); });
    
    /* Phase 160: Storyboard Image Paste Handler */
    if (templateId === 'storyboard') {
       var table = fresh.querySelector('table');
       if (table) {
           table.addEventListener('paste', function(e) {
               var items = (e.clipboardData || e.originalEvent.clipboardData).items;
               var blob = null;
               for (var i = 0; i < items.length; i++) {
                   if (items[i].type.indexOf("image") === 0) {
                       blob = items[i].getAsFile();
                       break;
                   }
               }
               if (blob) {
                   var target = e.target;
                   var tr = target.closest('tr');
                   if (tr) {
                       var input = tr.querySelector('[data-i]');
                       if (input) {
                           var idx = parseInt(input.getAttribute('data-i'), 10);
                           var reader = new FileReader();
                           reader.onload = function(evt) {
                               downscaleImage(evt.target.result, 512, 288, 0.8, function(scaled) {
                                   if (editorData.frames && editorData.frames[idx]) {
                                       dbPushUndoImmediate();
                                       editorData.frames[idx].image = scaled;
                                       saveEditorData();
                                       buildEditor('storyboard');
                                       if (activeTab === 'preview') renderPreview();
                                   }
                               });
                           };
                           reader.readAsDataURL(blob);
                       }
                   }
               }
           });
       }
    }

    /* Phase 70: auto-fetch weather on open if location is set but forecasts not yet loaded.
       Hospital lookup is skipped here: it runs only on address commit or the weather button (Z3). */
    if (editorData && editorData.shootingLocations && editorData.shootingLocations.length &&
        editorData.shootingLocations[0].address && !editorData.locationForecasts) {
        try {
          setTimeout(function () {
            if (typeof fetchWeatherOnlyOnOpen === 'function') fetchWeatherOnlyOnOpen();
          }, 400);
        } catch(e) { console.warn('[mBTDB] Auto-weather fetch failed:', e); }
    }

    /* Phase 71: crewDealMemo status change — inject/remove ghost item in budget */
    if (templateId === 'crewDealMemo') {
      var statusSel = fresh.querySelector('[data-key="status"]');
      if (statusSel) statusSel.addEventListener('change', function() {
        dbPushUndoImmediate();
        if (!editorData.memoId) {
          editorData.memoId = 'memo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }
        editorData.status = this.value;
        saveEditorData();
        if (this.value === 'Sent') injectGhostItem();
        else removeGhostItem();
      });
    }

    /* DOOD: rebuilds grid when shoot day count changes */
    var doodDaysInput = fresh.querySelector('[data-key="shootDays"]');
    if (doodDaysInput) doodDaysInput.addEventListener('change', function () {
      saveEditorData();
      buildEditor('dood');
    });

    /* Budget Comparison: load snapshot into slot A or B */
    var loadSnapA = fresh.querySelector('#btn-load-snap-a');
    if (loadSnapA) loadSnapA.addEventListener('click', function () {
      var sel = fresh.querySelector('#snap-a-select');
      var name = sel ? sel.value : '';
      if (!name) return;
      loadSnapshot(name, function (b) {
        if (!b) { dbAlert('Snapshot "' + name + '" not found.', 'Error'); return; }
        dbPushUndoImmediate();
        editorData.snapshotA = { name: name, sections: b.sections || {} };
        saveEditorData();
        buildEditor('budgetComparison');
        if (activeTab === 'preview') renderPreview();
      });
    });
    var loadSnapB = fresh.querySelector('#btn-load-snap-b');
    if (loadSnapB) loadSnapB.addEventListener('click', function () {
      var sel = fresh.querySelector('#snap-b-select');
      var name = sel ? sel.value : '';
      if (!name) return;
      loadSnapshot(name, function (b) {
        if (!b) { dbAlert('Snapshot "' + name + '" not found.', 'Error'); return; }
        dbPushUndoImmediate();
        editorData.snapshotB = { name: name, sections: b.sections || {} };
        saveEditorData();
        buildEditor('budgetComparison');
        if (activeTab === 'preview') renderPreview();
      });
    });

    var resetBtn = fresh.querySelector('#reset-btn');
    if (resetBtn) resetBtn.addEventListener('click', function () {
      var resetMessage = activeTemplateId === 'fundingPackage'
        ? 'Reset all fields to defaults? The budget funding list stays. This cannot be undone.'
        : 'Reset all fields to defaults? This cannot be undone.';
      dbConfirm(resetMessage, function () { resetActiveDocument(); });
    });
  }

  function buildCallSheetHtml(d) {
    var html = '';
    function rowTbcChecked(r) {
      if (!r || typeof r !== 'object') return false;
      if (r.tbc) return true;
      var keys = Object.keys(r);
      for (var k = 0; k < keys.length; k++) {
        var key = keys[k];
        if ((/Tbc$|_tbc$/i.test(key) && r[key]) || (typeof r[key] === 'string' && /\bTBC\b/i.test(r[key]))) return true;
      }
      return false;
    }
    function tbcCell(arrName, idx, rowObj) {
      return '<td style="width:42px;text-align:center;"><input type="checkbox" data-arr="' + esc(arrName) + '" data-i="' + idx + '" data-f="tbc"' + (rowTbcChecked(rowObj) ? ' checked' : '') + ' title="Mark item TBC" style="width:auto;"></td>';
    }

    /* Section 1: Production Info & Key Crew */
    html += '<div class="ed-section"><div class="ed-section-hdr" style="display:flex;justify-content:space-between;align-items:center;">Production Info' +
      '<button class="smart-btn" id="btn-load-budget" type="button">' +
      '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>' +
      ' Load from Budget</button></div>' +
      callSheetDayPickerHtml(d) +
      '<div class="ed-row">' + fldCs('productionTitle', 'Production Title', null, true) + '</div>' +
      '<div class="ed-row ed-3">' + fldCs('date', 'Date', 'date') + fldCs('dayOf', 'Day Of') + fldCs('productionOffice', 'Production Office') + '</div>' +
      '<div class="ed-row ed-3">' + fldCs('director', 'Director') + fldCs('producers', 'Producers') + fldCs('dp', 'DP') + '</div>' +
      '<div class="ed-row ed-3">' + fldCs('firstAd', '1st AD') + fldCs('secondAd', '2nd AD') + fldCs('upm', 'UPM') + '</div>' +
      '</div>';

    /* Section 2: Call Times & Per-Person Crew Overrides */
    html += '<div class="ed-section"><div class="ed-section-hdr">Crew Call Times &amp; Per-Person Overrides</div>' +
      '<div class="ed-row ed-4">' + fldCs('crewCall', 'Crew Call', 'time') + fldCs('shootingCall', 'Shooting Call', 'time') + fldCs('estimatedLunch', 'Est. Lunch', 'time') + fldCs('estimatedWrap', 'Est. Wrap', 'time') + '</div>' +
      '<div class="ed-tbl-wrap"><table class="ed-tbl" id="tbl-cs-crew"><thead><tr><th>Role</th><th>Name</th><th>Phone</th><th style="width:90px;">Call</th><th>Notes</th><th style="width:42px;text-align:center;">TBC</th><th></th></tr></thead><tbody>';
    (d.crew || []).forEach(function (m, i) {
      html += '<tr>' +
        '<td><input data-arr="crew" data-i="' + i + '" data-f="role" value="' + esc(m.role || '') + '" placeholder="Role"></td>' +
        '<td><input data-arr="crew" data-i="' + i + '" data-f="name" value="' + esc(m.name || '') + '" placeholder="Crew member"></td>' +
        '<td><input data-arr="crew" data-i="' + i + '" data-f="phone" value="' + esc(m.phone || '') + '" placeholder="Phone"></td>' +
        '<td><input data-arr="crew" data-i="' + i + '" data-f="call" value="' + esc(m.call || '') + '" placeholder="Call time"></td>' +
        '<td><input data-arr="crew" data-i="' + i + '" data-f="notes" value="' + esc(m.notes || '') + '"></td>' +
        tbcCell('crew', i, m) +
        '<td><button class="ed-del" data-arr="crew" data-del="' + i + '">&times;</button></td></tr>';
    });
    html += '</tbody></table></div><button class="ed-add-btn" data-add="crew">+ Add Crew Override</button></div>';

    /* Section 3: Contacts Block (Client, Locations, Hospitals, Other) */
    var cb = d.contactsBlock || { client: [], locations: [], hospitals: [], other: [] };
    var contactCats = [
      { key: 'client', label: 'Client Contacts', btn: '+ Add Client Contact' },
      { key: 'locations', label: 'Location Contacts', btn: '+ Add Location Contact' },
      { key: 'hospitals', label: 'Hospital / Emergency Contacts', btn: '+ Add Hospital Contact' },
      { key: 'other', label: 'Other Contacts', btn: '+ Add Other Contact' }
    ];
    html += '<div class="ed-section"><div class="ed-section-hdr">Contacts Block (Client, Locations, Hospitals, Other)</div>';
    contactCats.forEach(function (cat) {
      var arrPath = 'contactsBlock.' + cat.key;
      var rows = cb[cat.key] || [];
      html += '<div style="padding:6px 10px 2px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;">' + esc(cat.label) + '</div>' +
        '<div class="ed-tbl-wrap"><table class="ed-tbl"><thead><tr><th>Name</th><th>Role / Site</th><th>Phone / Address</th><th style="width:42px;text-align:center;">TBC</th><th></th></tr></thead><tbody>';

          '<td><input data-arr="' + arrPath + '" data-i="' + i + '" data-f="phone" value="' + esc(c.phone || '') + '" placeholder="Phone / contact info"></td>' +

      html += '</tbody></table></div><button class="ed-add-btn" data-add="' + arrPath + '">' + esc(cat.btn) + '</button>';

  /* Shared: process a File/Blob into a downscaled base64 and save to frame */
  window._sbApplyImageFile = function(file, index) {
    var frames = editorData.frames || [];
    var f = frames[index];
    if (!f) return;
    dbPushUndoImmediate();
    var reader = new FileReader();
    reader.onload = function(evt) {
      downscaleImage(evt.target.result, 1024, 576, 0.85, function(scaled) {
        f.image = scaled;
        saveEditorData();
        buildEditor(activeTemplateId);
        if (activeTab === 'preview') renderPreview();
        _sbCloseFrameModal();
      });
    };
    reader.readAsDataURL(file);
  }

  /* Close and remove the frame editor overlay */
  window._sbCloseFrameModal = function() {
    var overlay = document.getElementById('sb-frame-modal-overlay');
    if (overlay) overlay.parentNode.removeChild(overlay);
  };

  /* Run the existing AI generation logic, now called from within the modal */
  window._sbRunGenerate = function(index, promptText) {
    var frames = editorData.frames || [];
    var f = frames[index];
    if (!f || !promptText) return;

    dbPushUndoImmediate();
    /* Write prompt back as description if frame had none (two-way sync) */
    if (!f.description) {
      f.description = promptText;
      saveEditorData();
    }

    var genBtn = document.getElementById('sb-gen-btn');
    var genStatus = document.getElementById('sb-gen-status');
    if (genBtn) { genBtn.disabled = true; genBtn.textContent = 'Generating…'; }
    if (genStatus) genStatus.textContent = 'Contacting AI…';

    /* Read selected model and active form factor */
    var selectedModel  = (document.getElementById('sb-gen-model') || {}).value || '';
    var activeFormFactor = f.formFactor || '16:9';

    /* Provider/key are read by mBTAssistant internally — no direct localStorage access needed.
       Phase 173: dropped legacy localStorage reads here; the delegate path below handles auth. */

    function onSuccess(scaled) {
      f.image = scaled;
      saveEditorData();
      buildEditor(activeTemplateId);
      if (activeTab === 'preview') renderPreview();
      _sbCloseFrameModal();
      window.promptStoryboardImage(index);
    }
    function onError(msg) {
      if (genBtn) { genBtn.disabled = false; genBtn.textContent = 'Generate'; }
      var _pa = (window.parent && window.parent.mBTAssistant) || window.mBTAssistant || null;
      if (genStatus) genStatus.textContent = (_pa && _pa.plainError) ? _pa.plainError(msg) : 'The image could not be made. Try again.';
    }

    /* Delegate to mBTAssistant (loaded in parent monolith) — single source of truth for all image gen.
       Falls back to Pollinations if the service is unavailable (standalone/offline). */
    var _assistant = (window.parent && window.parent.mBTAssistant) || window.mBTAssistant || null;
    if (_assistant && typeof _assistant.callImageGen === 'function') {
      var _ffDims = { '16:9': [1024,576], '2.39:1': [1024,428], '4:3': [1024,768], '1:1': [1024,1024], '9:16': [576,1024] };
      var _ffWH   = _ffDims[activeFormFactor] || _ffDims['16:9'];
      _assistant.callImageGen({ prompt: promptText, model: selectedModel || '', aspectRatio: activeFormFactor })
        .then(function(dataUrl) { downscaleImage(dataUrl, _ffWH[0], _ffWH[1], 0.85, onSuccess); })
        .catch(function(err) { onError(err.message); });
    } else {
      /* Pollinations fallback — no key required */
      var _fbDims = { '16:9': [1024,576], '2.39:1': [1024,428], '4:3': [1024,768], '1:1': [1024,1024], '9:16': [576,1024] };
      var _fbWH   = _fbDims[activeFormFactor] || _fbDims['16:9'];
      var _fbModel = (selectedModel && selectedModel !== 'pollinations') ? '&model=' + encodeURIComponent(selectedModel) : '';
      var imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(promptText) + '?width=' + _fbWH[0] + '&height=' + _fbWH[1] + '&nologo=true&seed=' + Date.now() + _fbModel;
      fetch(imgUrl).then(function(r) {
        if (!r.ok) throw new Error('Pollinations ' + r.status + ': blocked on localhost. Test from a deployed URL or switch to Gemini/OpenAI.');
        return r.blob();
      }).then(function(blob) {
        var rd = new FileReader();
        rd.onload = function(evt) { downscaleImage(evt.target.result, _fbWH[0], _fbWH[1], 0.85, onSuccess); };
        rd.readAsDataURL(blob);
      }).catch(function(e) { onError(e.message || 'Network or CORS error. Check connection and try again.'); });
    }
  }

  /* Frame editor modal — replaces the old prompt() dialog */
  window.promptStoryboardImage = function(index) {
    var frames = editorData.frames || [];
    var f = frames[index];
    if (!f) return;

    _sbCloseFrameModal(); /* remove any stale overlay */

    var FORM_FACTORS = [
      { id: '16:9', label: '16:9', css: '16/9', desc: '1080p / HD' },
      { id: '2.39:1', label: 'Scope', css: '2.39/1', desc: 'Anamorphic' },
      { id: '4:3', label: '4:3', css: '4/3', desc: 'Academy' },
      { id: '1:1', label: '1:1', css: '1/1', desc: 'Square' },
      { id: '9:16', label: '9:16', css: '9/16', desc: 'Vertical' }
    ];
    var activeFactor = (f.formFactor || '16:9');
    var activeFF = FORM_FACTORS.filter(function(ff) { return ff.id === activeFactor; })[0] || FORM_FACTORS[0];

    /* Compact aspect ratio tabs — label only, no sub-desc */
    var ffTabsHtml = FORM_FACTORS.map(function(ff) {
      var isActive = ff.id === activeFactor;
      return '<button onclick="_sbSetFormFactor(' + index + ',' + esc(JSON.stringify(String(ff.id))) + ')" ' +
        'style="padding:3px 8px;border-radius:5px;border:none;cursor:pointer;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;' +
        (isActive ? 'background:#2563eb;color:#fff;' : 'background:#334155;color:#64748b;') + '">' +
        ff.label + '</button>';

  /* Form factor switch — update tab highlight + preview aspect ratio */
  window._sbSetFormFactor = function(index, factorId) {
    var frames = editorData.frames || [];
    var f = frames[index];
    if (!f) return;
    dbPushUndoImmediate();
    f.formFactor = factorId;
    saveEditorData();
    var FACTORS = { '16:9':'16/9', '2.39:1':'2.39/1', '4:3':'4/3', '1:1':'1/1', '9:16':'9/16' };
    var wrap = document.getElementById('sb-frame-preview-wrap');
    if (wrap) wrap.style.aspectRatio = FACTORS[factorId] || '16/9';
    /* Rebuild modal to refresh tab highlights */
    _sbCloseFrameModal();
    window.promptStoryboardImage(index);
  };

  window._sbZoomFrame = function(index, delta) {
    var f = (editorData.frames || [])[index];
    if (!f) return;
    dbPushUndoImmediate();
    if (!f.panZoom) f.panZoom = { scale: 1, ox: 0, oy: 0 };
    f.panZoom.scale = Math.max(0.3, Math.min(5, (f.panZoom.scale || 1) + delta));
    saveEditorData();
    var img = document.getElementById('sb-frame-preview-img');
    if (img) img.style.transform = 'scale(' + f.panZoom.scale + ') translate(' + (f.panZoom.ox||0) + 'px,' + (f.panZoom.oy||0) + 'px)';
  };

  window._sbResetZoom = function(index) {
    var f = (editorData.frames || [])[index];
    if (!f) return;
    dbPushUndoImmediate();
    f.panZoom = { scale: 1, ox: 0, oy: 0 };
    saveEditorData();
    var img = document.getElementById('sb-frame-preview-img');
    if (img) img.style.transform = 'scale(1) translate(0px,0px)';
  };

  window._sbClearFrameImage = function(index) {
    var f = (editorData.frames || [])[index];
    if (!f) return;
    dbConfirm('Remove the image from Frame ' + (f.num || index + 1) + '?', function () {
      dbPushUndoImmediate();
      f.image = '';
      f.panZoom = null;
      saveEditorData();
      buildEditor(activeTemplateId);
      if (activeTab === 'preview') renderPreview();
      _sbCloseFrameModal();
      window.promptStoryboardImage(index);
    });
  };

  window._sbPasteImage = function(index) {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      dbAlert('Use Ctrl+V / Cmd+V with your cursor in the preview area, or use Attach to select a file.');
      return;
    }
    navigator.clipboard.read().then(function(items) {
      for (var i = 0; i < items.length; i++) {
        for (var t = 0; t < items[i].types.length; t++) {
          if (items[i].types[t].indexOf('image/') === 0) {
            items[i].getType(items[i].types[t]).then(function(blob) { _sbApplyImageFile(blob, index); });
            return;
          }
        }
      }
      dbAlert('No image found on clipboard. Copy an image first then try again.');
    }).catch(function() { dbAlert('Clipboard access denied. Use Attach to select a file.'); });
  };

  /* ======== Wire Editor Events ======== */
  function wireEditor(panel) {

    function applyControlChange(el) {
      if (!el || !el.getAttribute) return;
      var key = el.getAttribute('data-key');
      var arr = el.getAttribute('data-arr');
      var val = el.type === 'checkbox' ? Boolean(el.checked) : el.value;

      if (key) {
        afTyped(key.split('.')[0]);
        setEditorKeyVal(key, val);
        if (RELEASE_TEMPLATES.indexOf(activeTemplateId) > -1 && ['producerName', 'clientName', 'client'].indexOf(key) > -1) {
          normalizeReleaseEditorData(activeTemplateId, editorData, _docContacts);
          ['granteeLine', 'terms'].forEach(function (generatedKey) {
            var control = panel.querySelector('[data-key="' + generatedKey + '"]');
            if (control) control.value = editorData[generatedKey] || '';
          });
        }
        if (key === 'durationLine' && Array.isArray(editorData.howWeFilm) && editorData.howWeFilm.length >= 7) {
          editorData.howWeFilm[6] = val;
        }
        if (key === 'dayId' && activeTemplateId === 'callSheet') {
          applyCallSheetDaySelection(val);
          saveEditorData();
          buildEditor('callSheet');
          return;
        }
        if (key === 'dayId' && activeTemplateId === 'sitePermission') {
          var defaults = pub.templates.sitePermission.getDefaultData(budget || {}, { contacts: _docContacts, dayId: val });
          ['placeName', 'address', 'parish', 'filmingDates', 'ownerName'].forEach(function (field) {
            editorData[field] = defaults[field];
          });
          saveEditorData();
          buildEditor(activeTemplateId);
          return;
        }
        saveEditorData();
        return;
      }

      if (arr) {
        afTyped(arr.split('.')[0]);
        var idx = parseInt(el.getAttribute('data-i'), 10);
        var field = el.getAttribute('data-f');
        var list = getEditorArr(arr, false);
        if (list && list[idx] !== undefined) {
          if (typeof list[idx] === 'string') {
            list[idx] = arr === 'whoElse' ? { text: list[idx], writeIn: 'Name' } : { item: list[idx], checked: false };
          }
          if (field.indexOf('.') > -1) {
            var fp = field.split('.');
            if (!list[idx][fp[0]]) list[idx][fp[0]] = {};
            list[idx][fp[0]][fp[1]] = val;
          } else {
            list[idx][field] = val;
            if (arr === 'schedule' && field === 'activity') list[idx].description = val;
            if (arr === 'schedule' && field === 'people') list[idx].cast = val;
            if (arr === 'vouchers' && field === 'paidMethod') {
              list[idx].paidByUser = true;
              if (val !== 'transfer') list[idx].paidRef = '';
              saveEditorData();
              var scrollYMethod = panel.scrollTop;
              buildEditor(activeTemplateId);
              var freshMethod = dom.getElementById('editor-panel');
              if (freshMethod) freshMethod.scrollTop = scrollYMethod;
              return;
            }
            if (arr === 'vouchers' && field === 'paidRef') {
              list[idx].paidByUser = true;
              list[idx].paidRef = String(val == null ? '' : val).trim().slice(0, 60);
            }
          }
          if (arr === 'schedule') editorData.scenes = JSON.parse(JSON.stringify(list));
          if (arr === 'scenes' && activeTemplateId === 'callSheet') editorData.schedule = JSON.parse(JSON.stringify(list));
          if (arr === 'whoElse') delete editorData.whoElsePrompts;
          saveEditorData();
        }
      }
    }

    /* Simple and array field inputs (data-key, data-arr). Hospital lookup and phone fill run on commit, not each keystroke. */
    panel.addEventListener('input', function (e) {
      applyControlChange(e.target);
      var el = e.target;
      if (!el) return;
      if (el.getAttribute('data-key') === 'hospitalName') {
        hospitalNameDirty = true;
        clearAutoHospitalPhoneOnNameEdit();
        markHospitalTyped(editorData);
      }
      if (el.getAttribute('data-arr') === 'shootingLocations' && el.getAttribute('data-f') === 'address') {
        locationAddressDirty[String(el.getAttribute('data-i') || '0')] = true;
      }
      if (el.getAttribute('data-key') === 'hospitalPhone') {
        if (String(el.value || '').trim()) editorData.hospitalPhoneSource = 'typed';
        markHospitalTyped(editorData);
      }
      if (el.getAttribute('data-key') === 'hospitalAddress' || el.getAttribute('data-key') === 'hospitalDistance') {
        markHospitalTyped(editorData);

    function commitHospitalNameOrAddress(el, via) {
      if (!el) return;
      if (el.getAttribute('data-arr') === 'shootingLocations' && el.getAttribute('data-f') === 'address') {
        var locIdx = String(el.getAttribute('data-i') || '0');
        /* W1: Tab or blur with an unchanged address must not re-run the lookup. */
        if (!locationAddressDirty[locIdx]) return;
        locationAddressDirty[locIdx] = false;
        invalidateHospitalLookups(currentHospitalDocIdentity());
        scheduleHospitalLookupFromAddresses();
      }
      if (el.getAttribute('data-key') === 'hospitalName') {
        /* W1: Z1c clearing runs only on input. Name phone fill runs on change (browsers fire
           change on blur when the value changed since focus). A blur alone, or Tab through
           with no edit, never clears, refills or flips the source. */
        if (via === 'blur') {
          hospitalNameDirty = false;
          return;
        }
        if (!hospitalNameDirty) return;
        hospitalNameDirty = false;
        fillHospitalPhoneFromName(el.value, true).then(function () {
          saveEditorData();
        });
      }
    }

    /* Handle select and checkbox changes */
    panel.addEventListener('change', function (e) {
      var el = e.target;
      if (!el) return;
      commitHospitalNameOrAddress(el, 'change');
      if (el.tagName !== 'SELECT' && el.type !== 'checkbox') return;

    panel.addEventListener('blur', function (e) {

        var arrName = addBtn.getAttribute('data-add');

        dbPushUndoImmediate();
        var listAdd = getEditorArr(arrName, true);
        listAdd.push(newItem);
        if (arrName === 'schedule') editorData.scenes = JSON.parse(JSON.stringify(listAdd));
        if (arrName === 'whoElse') delete editorData.whoElsePrompts;
        delete editorData['_keepEmpty_' + arrName];
        saveEditorData();
        var scrollY = panel.scrollTop;
        buildEditor(activeTemplateId);
        var freshPanel = dom.getElementById('editor-panel');
        if (freshPanel) freshPanel.scrollTop = scrollY;
        return;
      }

      if (delBtn) {
        var arrN = delBtn.getAttribute('data-arr');
        var delIdx = parseInt(delBtn.getAttribute('data-del'), 10);
        var listDel = getEditorArr(arrN, false);
        if (listDel) {
          dbPushUndoImmediate();
          if (arrN === 'sources' && activeTemplateId === 'fundingPackage') {
            var removedSource = editorData.sources[delIdx];
            if (removedSource && removedSource.id && fundingDeletes.indexOf(removedSource.id) < 0) fundingDeletes.push(removedSource.id);
          }
          listDel.splice(delIdx, 1);
          if (arrN === 'whoElse') delete editorData.whoElsePrompts;
          if (arrN === 'schedule') {
            editorData.scenes = JSON.parse(JSON.stringify(listDel));
            if (listDel.length === 0) editorData._keepEmptySchedule = true;
          }
          if (arrN === 'shootingLocations' && listDel.length === 0) editorData._keepEmptyLocations = true;
          if (arrN === 'crew' && listDel.length === 0) editorData._keepEmptyCrew = true;
          if (arrN === 'interviewees' && listDel.length === 0) editorData._keepEmptyInterviewees = true;
          if (arrN.indexOf('contactsBlock.') === 0) editorData._keepEmptyContactsBlock = true;
          if (['kit', 'paperwork', 'wrap', 'questionGroups', 'whoElse', 'vouchers', 'gear'].indexOf(arrN) > -1 && listDel.length === 0) editorData['_keepEmpty_' + arrN] = true;
          saveEditorData();
          var scrollYDel = panel.scrollTop;
          buildEditor(activeTemplateId);
          var freshPanelDel = dom.getElementById('editor-panel');
          if (freshPanelDel) freshPanelDel.scrollTop = scrollYDel;
        }
      }
    });
  }

  /* ======== Call Sheet Smart Features ======== */

  /* Phase 71: a "Sent" deal memo puts a ghost line in the budget; Draft or Executed takes it out.
     Set D0: this tool never writes the budget. Inside the app it sends the line to the budget window, which applies it to
     its open budget (with unsaved edits), saves, and answers. On its own it writes only that line onto the freshly read
     stored copy, advances updated_at, and refuses to write over a copy saved somewhere else after this one was read.
     The deal memo document itself is saved under its own key either way. */
  var memoAckSeq = 0, memoAcks = {}, memoChain = Promise.resolve();

  window.addEventListener('message', function (e) {
    var a;
    if (e.origin !== window.location.origin || e.source !== window.parent || !e.data || e.data.type !== 'mbt:tool-ack' || e.data.action !== 'docs-memo-line') return;
    a = memoAcks[e.data.requestId];
    if (!a) return;
    delete memoAcks[e.data.requestId];
    if (e.data.status === 'success') a.ok(); else a.fail(e.data.message);
  });

  function memoLineFailed(op, message) {
    dbAlert('The deal memo line was not ' + (op === 'insert' ? 'added to' : 'removed from') + ' the budget: ' + message + ' The deal memo itself is saved. Change its status again to retry.', 'Deal memo');
  }

  function memoLineThroughApp(op, ghost, department) {
    return new Promise(function (resolve, reject) {
      var id, timer;
      memoAckSeq += 1;
      id = memoAckSeq;
      timer = setTimeout(function () { delete memoAcks[id]; reject(new Error('The budget did not confirm the change.')); }, 20000);
      memoAcks[id] = {
        ok: function () { clearTimeout(timer); resolve(); },
        fail: function (message) { clearTimeout(timer); reject(new Error(message || 'the budget could not save it.')); }
      };
      window.parent.postMessage({ type: 'mbt:tool-action', action: 'docs-memo-line', payload: { requestId: id, projectKey: projectKey, op: op, memoId: editorData.memoId, ghost: ghost || null, department: department || '' } }, window.location.origin);
    });
  }

  function memoGhostSection(bgt, department) {
    var dept = (department || '').toLowerCase(), keys = Object.keys(bgt.sections), match = keys[0], i;
    for (i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase().indexOf(dept) > -1) { match = keys[i]; break; }
    }
    return match;
  }

  function memoLineStandalone(op, ghost, department) {
    memoChain = memoChain.catch(function () {}).then(function () {
      /* Read after the earlier queued write finished, so Docs' own write is not taken for a newer copy. */
      var base = (budget && budget.updated_at) || '';
      return localforage.getItem(projectKey).then(function (bgt) {
        var stale, changed = false, sec, j, existing;
        if (!bgt || !bgt.sections) throw new Error('The saved budget could not be found.');
        if ((bgt.updated_at || '') > base) { stale = new Error('A newer copy of this budget was saved somewhere else, so nothing was written. Reopen the budget to see the newer copy.'); throw stale; }
        if (op === 'insert') {
          sec = bgt.sections[memoGhostSection(bgt, department)];
          if (!sec.items) sec.items = [];
          existing = -1;
          for (j = 0; j < sec.items.length; j++) { if (sec.items[j].memoId === ghost.memoId) { existing = j; break; } }
          if (existing > -1) sec.items[existing] = ghost; else sec.items.push(ghost);
          changed = true;
        } else {
          Object.keys(bgt.sections).forEach(function (k) {
            var s = bgt.sections[k], before;
            if (!s.items) return;
            before = s.items.length;
            s.items = s.items.filter(function (item) { return item.memoId !== editorData.memoId; });
            if (s.items.length !== before) changed = true;
          });
        }
        if (!changed) return;
        bgt.updated_at = (function (prev) { var now = new Date().toISOString(); return prev && now <= prev ? new Date(new Date(prev).getTime() + 1).toISOString() : now; })(bgt.updated_at);
        return localforage.setItem(projectKey, bgt).then(function () { if (budget) budget.updated_at = bgt.updated_at; });
      });
    });
    return memoChain;
  }

  function memoLine(op, ghost, department) {
    var run = (window.parent && window.parent !== window) ? memoLineThroughApp(op, ghost, department) : memoLineStandalone(op, ghost, department);
    run.catch(function (err) { memoLineFailed(op, (err && err.message) || 'the budget could not save it.'); });
  }

     with the active template's blank eligible fields. Context is pulled from the Context
     Ledger automatically on the parent side (treatment, script, receipts, snapshot). */
  var _aiFillPending = false;
  /* v23.57: non-blocking toast (alert replacement for async flows) */
  var _dbToastTimer = null;
  function dbToast(msg, isError) {
    var el = dom.getElementById('db-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'db-toast';
      (dom.body || document.body).appendChild(el);
