  /* ======== Call Sheet Smart Features ======== */

  /* Auto-populate Production Info fields from budget ATL crew items */
  function autoPopulateFromBudget() {
    if (!budget || !budget.sections) return;
    var sections = budget.sections;
    var found = { director: '', producers: '', upm: '', firstAd: '', secondAd: '' };

    Object.keys(sections).forEach(function (k) {
      var sec = sections[k];
      (sec.items || []).forEach(function (item) {
        var d = (item.description || '').toLowerCase();
        var personName = (item.crew && item.crew.name) || ''; // Pull actual contact name
        if (!personName) return; 

        // Director
        if (!found.director && d.indexOf('director') > -1 && d.indexOf('art') < 0 && d.indexOf('photography') < 0) {
            found.director = personName;
        }
        // Producers
        else if ((d.indexOf('producer') > -1 && d.indexOf('line') < 0) || d === 'prod') {
            if (found.producers) {
                if (found.producers.indexOf(personName) < 0) found.producers += ', ' + personName;
            } else {
                found.producers = personName;
            }
        }
        // UPM / Line Producer
        else if (!found.upm && (d.indexOf('upm') > -1 || d.indexOf('unit production') > -1 || d.indexOf('line producer') > -1)) {
            found.upm = personName;
        }
        // 1st AD
        else if (!found.firstAd && (d.indexOf('1st ad') > -1 || d.indexOf('first ad') > -1 || d.indexOf('1ad') > -1 || d.indexOf('first assistant') > -1)) {
            found.firstAd = personName;
        }
        // 2nd AD
        else if (!found.secondAd && (d.indexOf('2nd ad') > -1 || d.indexOf('second ad') > -1 || d.indexOf('2ad') > -1 || d.indexOf('second assistant') > -1)) {
            found.secondAd = personName;
        }
      });
    });

    var changed = false;
    ['director','producers','upm','firstAd','secondAd'].forEach(function (k) {
      if (found[k] && !editorData[k]) { editorData[k] = found[k]; changed = true; }
    });
    if (!editorData.productionTitle && budget.projectName) { editorData.productionTitle = budget.projectName; changed = true; }
    
    if (changed) { 
        saveEditorData(); 
        buildEditor('callSheet'); 
    } else {
        alert("No additional crew contacts found to populate or fields already filled.");
    }
  }

  /* Fetch weather (3-day, all shooting locations) + nearest hospitals (first location) */
  function fetchWeatherAndHospitals() {
    /* Gather all shooting location addresses */
    var locations = (editorData && editorData.shootingLocations || [])
      .map(function (loc) { return (loc.address || '').trim(); }).filter(Boolean);
    if (locations.length === 0) {
      var locInput = document.querySelector('[data-arr="shootingLocations"][data-f="address"]');
      var fallback = locInput ? locInput.value.trim() : '';
      if (fallback) locations = [fallback];
    }
    if (locations.length === 0) { alert('Enter a shooting location address first.'); return; }

    var statusEl = document.getElementById('weather-status');
    var hospPicker = document.getElementById('hospital-picker');
    statusEl.textContent = 'Geocoding ' + locations.length + ' location(s)\u2026';
    hospPicker.style.display = 'none';

    if (weatherFetchController) { weatherFetchController.abort(); }
    weatherFetchController = new AbortController();
    var signal = weatherFetchController.signal;

    /* Geocode all locations in parallel */
    Promise.all(locations.map(function (address) {
      return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address), {
        headers: { 'Accept': 'application/json' }, signal: signal
      }).then(function (r) { return r.json(); }).then(function (geo) {
        if (!geo || geo.length === 0) return null;
        return { address: address, lat: parseFloat(geo[0].lat), lon: parseFloat(geo[0].lon) };
      });
    })).then(function (geoResults) {
      var validGeo = geoResults.filter(Boolean);
      if (validGeo.length === 0) { statusEl.textContent = 'Location not found.'; return; }

      statusEl.textContent = 'Fetching weather for ' + validGeo.length + ' location(s)\u2026';

      /* Fetch 3-day forecast for each location */
      var weatherFetches = validGeo.map(function (g) {
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + g.lat + '&longitude=' + g.lon +
          '&daily=temperature_2m_max,temperature_2m_min,weathercode,sunrise,sunset&timezone=auto&forecast_days=3';
        return fetch(url, { signal: signal }).then(function (r) { return r.json(); })
          .then(function (w) { return { geo: g, weather: w }; });
      });

      /* Hospitals for the first location only */
      var firstGeo = validGeo[0];
      var overpassQuery = '[out:json][timeout:25];(node["amenity"="hospital"](around:20000,' + firstGeo.lat + ',' + firstGeo.lon + ');way["amenity"="hospital"](around:20000,' + firstGeo.lat + ',' + firstGeo.lon + '););out center 5;';
      var overpassFetch = fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(overpassQuery), { signal: signal })
        .then(function (r) { return r.json(); });

      Promise.all(weatherFetches.concat([overpassFetch])).then(function (results) {
        var hospitalData = results[results.length - 1];
        var weatherResults = results.slice(0, -1);

        /* Build locationForecasts: [{address, days:[{date,high,low,conditions,sunrise,sunset}]}] */
        editorData.locationForecasts = weatherResults.map(function (wr) {
          var d = wr.weather.daily || {};
          var days = (d.time || []).map(function (date, i) {
            return {
              date: date,
              high: d.temperature_2m_max[i] !== undefined ? Math.round(d.temperature_2m_max[i]) + '\u00b0C' : '',
              low:  d.temperature_2m_min[i] !== undefined ? Math.round(d.temperature_2m_min[i]) + '\u00b0C' : '',
              conditions: WMO_DESC[d.weathercode[i]] || ('Code ' + d.weathercode[i]),
              sunrise: (d.sunrise && d.sunrise[i]) ? (d.sunrise[i].indexOf('T') > -1 ? d.sunrise[i].split('T')[1].slice(0,5) : d.sunrise[i]) : '',
              sunset:  (d.sunset  && d.sunset[i])  ? (d.sunset[i].indexOf('T')  > -1 ? d.sunset[i].split('T')[1].slice(0,5)  : d.sunset[i])  : ''
            };
          });
          return { address: wr.geo.address, days: days };
        });

        /* Backward compat: single-day fields from first location day 0 */
        if (editorData.locationForecasts.length > 0 && editorData.locationForecasts[0].days.length > 0) {
          var first = editorData.locationForecasts[0].days[0];
          editorData.weatherHigh       = first.high;
          editorData.weatherLow        = first.low;
          editorData.weatherConditions = first.conditions;
          if (first.sunrise) editorData.sunrise = first.sunrise;
          if (first.sunset)  editorData.sunset  = first.sunset;
        }

        /* Hospital picker (first location) */
        var hosps = (hospitalData.elements || []).filter(function (el) {
          return el.tags && el.tags.name;
        }).slice(0, 5);
        if (hosps.length > 0) {
          var pickerHtml = '<p>Select nearest hospital:</p>';
          hosps.forEach(function (h, i) {
            var name  = h.tags.name || 'Hospital';
            var phone = h.tags.phone || h.tags['contact:phone'] || '';
            var addrParts = [h.tags['addr:street'], h.tags['addr:city'] || h.tags['addr:town']].filter(Boolean);
            var addr = addrParts.join(', ');
            pickerHtml += '<div class="hosp-item" data-hi="' + i + '" data-name="' + esc(name) + '" data-addr="' + esc(addr) + '" data-phone="' + esc(phone) + '">' +
              '<div><div class="hosp-item-name">' + esc(name) + '</div>' +
              (addr ? '<div style="font-size:9px;color:#64748b;">' + esc(addr) + '</div>' : '') + '</div>' +
              '<div class="hosp-item-phone">' + esc(phone) + '</div></div>';
          });
          hospPicker.innerHTML = pickerHtml;
          hospPicker.style.display = 'block';
          hospPicker.onclick = function (e) {
            var item = e.target.closest('.hosp-item');
            if (!item) return;
            editorData.hospitalName    = item.getAttribute('data-name');
            editorData.hospitalAddress = item.getAttribute('data-addr');
            editorData.hospitalPhone   = item.getAttribute('data-phone');
            hospPicker.style.display = 'none';
            hospPicker.onclick = null;
            statusEl.textContent = 'Hospital selected.';
            setTimeout(function () { statusEl.textContent = ''; }, 2000);
            saveEditorData();
            buildEditor('callSheet');
          };
        }

        saveEditorData();
        buildEditor('callSheet');
        statusEl.textContent = 'Weather loaded for ' + editorData.locationForecasts.length + ' location(s)' +
          (hosps.length > 0 ? ' — select a hospital above.' : '.');
        setTimeout(function () { if (statusEl.textContent.indexOf('select') < 0) statusEl.textContent = ''; }, 3000);
      }).catch(function (err) {
        if (err.name === 'AbortError') return;
        statusEl.textContent = 'Network error — check connection.';
        console.error('[mBTDB weather]', err);
      });
    }).catch(function (err) {
      if (err.name === 'AbortError') return;
      statusEl.textContent = 'Geocoding failed — check connection.';
      console.error('[mBTDB geocode]', err);
    });
  }

  /* ======== Init ======== */
  /* Picker builds immediately (no budget needed). Budget loads async after. */
  buildTemplatePicker();
  loadBudget();
})();
