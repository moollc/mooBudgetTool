  /* Plain sentence for a failed AI reply. The parent already sends plain words; anything else is mapped here. */
  function afAiText(err) {
    var a = (window.parent && window.parent.mBTAssistant) || window.mBTAssistant || null;
    var s = String(err == null ? '' : err);
    if (/^[A-Za-z][^:]*\s\d{3}\b|^no-api-key$|^ai_rate_limited$|failed to fetch/i.test(s) && a && typeof a.plainError === 'function') return a.plainError(s);
    return s || 'AI Fill did not work. Try again.';
  }
  /* Improvement: with no AI key, say so before the review window opens instead of after it. */
  function afAiReady() {
    try {
      var m = window.parent && window.parent.mBTAIModule;
      if (!m || typeof m.getSelectedProvider !== 'function') return true;
      var prov = m.getSelectedProvider();
      if (prov === 'lmstudio' || m.getStoredApiKey(prov)) return true;
      afNotice(window.parent.mBTAssistant.plainError('no-api-key'), 'AI Fill');
      return false;
    } catch (e) { return true; }
  }

  function runAiFillForActiveTemplate() {
    if (_afBusy || !budget || !editorData) return;
    if (!afAiReady()) return;
    _afBusy = true;
    var initial = afTarget();
    function release() { if (initial.epoch === _afEpoch) _afBusy = false; }
    afRefresh(true).then(function (accepted) {
      if (!accepted || !afCurrent(initial)) { release(); return; }
      var target = afTarget(), p = _afProjection;
      var typedAtStart = JSON.parse(JSON.stringify(afMeta().overrides));
      var blanks = p.prose.filter(function (key) { return afBlank(editorData[key]); });
      if (!blanks.length) { _afBusy = false; afNotice('No eligible blank prose fields remain. Facts and agreed terms are not generated by AI.'); return; }
      if (window.parent === window) { _afBusy = false; afNotice('AI Fill requires this document tool to be opened from the budget editor.'); return; }
      var button = dom.getElementById('btn-ai-fill');
      if (button) button.disabled = true;
      var requestId = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      var timer = setTimeout(function () { cleanup(); afNotice('AI Fill timed out after 120 seconds. Accepted fact changes remain saved.'); }, mBTDocumentProjection.timeout);
      function cleanup() { clearTimeout(timer); window.removeEventListener('message', reply); release(); if (button && target.epoch === _afEpoch) button.disabled = false; }
      function reply(e) {
        if (!window.mBTToolBridge || !window.mBTToolBridge.originOk(e) || !e.data || e.data.type !== 'mbt:tool-reply' || e.data.requestId !== requestId) return;
        cleanup();
        if (!afCurrent(target)) { afNotice('The AI reply belongs to a document that is no longer open. No document fields were changed.'); return; }
        var response = e.data.payload || {};
        if (response._error) { afNotice(afAiText(response._error), 'AI Fill'); return; }
        var keys = blanks.filter(function (key) { return afBlank(editorData[key]) && afMeta().overrides[key] === typedAtStart[key] && typeof response[key] === 'string' && response[key].trim(); });
        if (!keys.length) { afNotice('AI returned no usable prose. Nothing was changed.'); return; }
        dbPushUndoImmediate();
        keys.forEach(function (key) {
          editorData[key] = response[key];
          afMeta().sources[key] = { ref: 'AI draft from this document projection and current project sources; review before use', value: response[key] };
        });
        saveEditorData(); buildEditor(activeTemplateId);
        afNotice('AI drafted ' + keys.length + ' prose fields. Review the wording before use.');
      }
      window.addEventListener('message', reply);
      var documentContext = JSON.parse(JSON.stringify(editorData));
      delete documentContext._autofill;
      window.parent.postMessage({ type: 'mbt:tool-action', action: 'ai-doc-fill', requestId: requestId, payload: {
        templateId: target.template, projectName: budget.projectName, fields: blanks,
        context: documentContext, selections: afMeta().selections, maxTokens: 6000
      } }, window.location.origin);
    }).catch(function (err) { release(); afNotice(err.message || 'AI Fill failed.'); });
  }

  /* Collect weather addresses: shooting locations → Basecamp → projectLocation (read-only fallback) */
  function collectWeatherAddresses() {
    var seen = {};
    var locations = [];
    var source = 'shooting';

    function pushAddr(addr) {
      var t = (addr || '').trim();
      if (!t) return;
      var key = t.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      locations.push(t);
    }

    /* 1. Shooting locations from editorData */
    (editorData && editorData.shootingLocations || []).forEach(function (loc) {
      pushAddr(loc.address);
    });
    /* Live DOM inputs if editorData stale */
    var locInputs = dom.querySelectorAll('[data-arr="shootingLocations"][data-f="address"]');
    var li;
    for (li = 0; li < locInputs.length; li++) {
      pushAddr(locInputs[li].value);
    }

    /* 2. Basecamp if no shooting addresses */
    if (locations.length === 0) {
      var basecamp = (editorData && editorData.basecamp) ? String(editorData.basecamp).trim() : '';
      var baseInput = dom.querySelector('[data-key="basecamp"]');
      if (baseInput && baseInput.value && baseInput.value.trim()) {
        basecamp = baseInput.value.trim();
      }
      if (basecamp) {
        pushAddr(basecamp);
        source = 'basecamp';
      }
    }

    /* 3. Budget project location if still empty */
    if (locations.length === 0 && budget && budget.projectLocation) {
      pushAddr(budget.projectLocation);
      source = 'project';
    }

    return { locations: locations, source: source };
  }

  /* Nominatim query cascade for one address (serial fallbacks, limit=1 each) */
  function geocodeAddressCascade(address, signal) {
    var queries = [];
    var full = (address || '').trim();
    if (!full) return Promise.resolve(null);

    queries.push(full);

    /* Strip leading house number: "21 East Road Kingston 10, Jamaica" → "East Road…" */
    var noHouse = full.replace(/^\d+\s+/, '');
    if (noHouse && noHouse.toLowerCase() !== full.toLowerCase()) {
      queries.push(noHouse);
    }

    /* Last two comma segments (city/region, country-ish) */
    var parts = full.split(',').map(function (p) { return p.trim(); }).filter(Boolean);
    if (parts.length >= 2) {
      var tail = parts.slice(-2).join(', ');
      if (tail && tail.toLowerCase() !== full.toLowerCase()) {
        queries.push(tail);
      }
    }

    /* Jamaica-style street strings that Nominatim often rejects */
    var lower = full.toLowerCase();
    var kingstonPostal = full.match(/\bKingston\s+\d+\b/i);
    if (kingstonPostal) {
      queries.push(kingstonPostal[0] + ', Jamaica');
    }
    if (lower.indexOf('kingston') >= 0 || lower.indexOf('jamaica') >= 0) {
      queries.push('Kingston, Jamaica');
    }

    /* Dedupe queries case-insensitively while preserving order */
    var seenQ = {};
    var unique = [];
    queries.forEach(function (q) {
      var k = q.toLowerCase();
      if (!seenQ[k]) { seenQ[k] = true; unique.push(q); }
    });

    function enqueueNominatim(startRequest) {
      var run = nominatimQueue.then(function () {
        var now = Date.now();
        var wait = Math.max(0, 1000 - (now - lastNominatimAt));
        function start() {
          lastNominatimAt = Date.now();
          return startRequest();
        }
        if (!wait) return start();
        return new Promise(function (resolve, reject) {
          var timer = setTimeout(function () {
            resolve(start());
          }, wait);
          if (signal) {
            signal.addEventListener('abort', function () {
              clearTimeout(timer);
              var err = new Error('Aborted');
              err.name = 'AbortError';
              reject(err);
            });
          }
        });
      });
      /* W2: release the serial queue on timeout, failure or abort so later geocodes start. */
      nominatimQueue = run.catch(function () { /* keep queue moving */ });
      return run;
    }

    /* W2: Nominatim fetch and body read share a local AbortController aborted by a real setTimeout at 12s. */
    function nominatimFetchWithTimeout(fetchFn, url, opts, ms) {
      var localCtrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var outer = opts && opts.signal;
      var onOuterAbort = null;
      if (localCtrl && outer) {
        if (outer.aborted) localCtrl.abort();
        else {
          onOuterAbort = function () { try { localCtrl.abort(); } catch (eNom) {} };
          outer.addEventListener('abort', onOuterAbort);
        }
      }
      var nomSignal = outer;
      if (localCtrl) nomSignal = localCtrl.signal;
      var timer = null;
      function releaseNominatimTimeout() {
        if (timer) clearTimeout(timer);
        if (outer && onOuterAbort) {
          try { outer.removeEventListener('abort', onOuterAbort); } catch (eRel) {}
        }
      }
      var p = fetchFn(url, Object.assign({}, opts || {}, nomSignal ? { signal: nomSignal } : {}));
      var body = p.then(function (res) {
        if (!res || !res.ok) {
          var httpErr = new Error('Nominatim HTTP ' + (res && res.status));
          httpErr.isHttp = true;
          throw httpErr;
        }
        return res.json();
      });
      return Promise.race([
        body,
        new Promise(function (_, reject) {
          timer = setTimeout(function () {
            if (localCtrl) {
              try { localCtrl.abort(); } catch (eAb) {}
            }
            var err = new Error('timeout');
            err.name = 'TimeoutError';
            reject(err);
          }, ms);
        })
      ]).finally(releaseNominatimTimeout);
    }

    function tryNext(idx) {
      if (idx >= unique.length) return Promise.resolve(null);
      var q = unique[idx];
      return enqueueNominatim(function () {
        var root = (typeof window !== 'undefined') ? window : (typeof self !== 'undefined' ? self : null);
        var fetchFn = root && root.fetch ? root.fetch.bind(root) : null;
        if (!fetchFn) return Promise.reject(new Error('No fetch'));
        return nominatimFetchWithTimeout(
          fetchFn,
          'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q),
          { headers: { 'Accept': 'application/json', 'Accept-Language': 'en' }, signal: signal },
          12000
        );
      }).then(function (geo) {
        if (geo && geo.length > 0) {
          return {
            address: address,
            lat: parseFloat(geo[0].lat),
            lon: parseFloat(geo[0].lon),
            matchedQuery: q
          };
        }
        return tryNext(idx + 1);
      }).catch(function (err) {
        /* Outer cancellation still aborts the whole cascade. A local 12s timeout (AbortError or
           TimeoutError from nominatimFetchWithTimeout) fails this address and releases the queue. */
        if (err.name === 'AbortError' && signal && signal.aborted) throw err;
        if (err.name === 'TimeoutError' || err.name === 'AbortError') {
          console.warn('[mBTDB geocode] timed out: ' + q);
          return null;
        }
        if (err.isHttp) throw err; /* surface HTTP failure to outer status */
        console.warn('[mBTDB geocode] query failed: ' + q, err);
        return tryNext(idx + 1);
      });
    }

    return tryNext(0);
  }

  var hospitalLookupTimer = null;
  var hospitalLookupController = null;
  var hospitalLookupToken = 0;
  var hospitalLookupDocToken = 0;
  var hospitalLookupDocId = hospitalLookupDocId || '';
  var lastNominatimAt = 0;
  var nominatimQueue = nominatimQueue || Promise.resolve();
  var weatherFetchController = typeof weatherFetchController !== 'undefined' ? weatherFetchController : null;
  var hospitalNameDirty = false;
  var locationAddressDirty = locationAddressDirty || Object.create(null);
  var AUTO_HOSPITAL_SOURCES = { live: 1, opengate: 1, fallback: 1 };

  function hospitalLookupApi() {
    return (typeof window !== 'undefined' && window.mBTHospitalLookup) ? window.mBTHospitalLookup : null;
  }

  function currentHospitalDocIdentity() {
    return String(hospitalLookupDocId || activeTemplateId || 'sheet');
  }

  function invalidateHospitalLookups(docId) {
    hospitalLookupToken += 1;
    hospitalLookupDocToken += 1;
    if (docId != null) hospitalLookupDocId = String(docId);
    if (hospitalLookupController) {
      try { hospitalLookupController.abort(); } catch (eInv) {}
      hospitalLookupController = null;
    }
    /* W5: drop in-flight weather-on-open for a document that is no longer active. */
    if (weatherFetchController) {
      try { weatherFetchController.abort(); } catch (eWxInv) {}
      weatherFetchController = null;
    }
  }

  function makeHospitalLookupToken(locationId) {
    hospitalLookupToken += 1;
    return {
      counter: hospitalLookupToken,
      docToken: hospitalLookupDocToken,
      docId: currentHospitalDocIdentity(),
      locationId: String(locationId || '')
    };
  }

  function hospitalLookupTokenValid(token) {
    if (!token) return false;
    return token.counter === hospitalLookupToken
      && token.docToken === hospitalLookupDocToken
      && token.docId === currentHospitalDocIdentity();
  }

  function hospitalUnitEmpty(target) {
    if (!target) return true;
    var isTop = (target === editorData) || Object.prototype.hasOwnProperty.call(target, 'hospitalName');
    var name = isTop ? target.hospitalName : target.hospital;
    return !String(name || '').trim()
      && !String(target.hospitalPhone || '').trim()
      && !String(target.hospitalAddress || '').trim()
      && !String(target.hospitalDistance || '').trim();
  }

  function markHospitalTyped(target) {
    if (!target) return;
    if (hospitalUnitEmpty(target)) {
      target.hospitalSource = '';
      target.hospitalRetrievedAt = '';
      target.hospitalPhoneSource = '';
      return;
    }
    target.hospitalSource = 'typed';
  }

  function clearHospitalUnit(target) {
    if (!target) return;
    var isTop = (target === editorData) || Object.prototype.hasOwnProperty.call(target, 'hospitalName');
    if (isTop) target.hospitalName = '';
    else target.hospital = '';
    target.hospitalPhone = '';
    target.hospitalAddress = '';
    target.hospitalDistance = '';
    target.hospitalSource = '';
    target.hospitalRetrievedAt = '';
    target.hospitalPhoneSource = '';
  }

  function writeHospitalUnit(target, hospital, source) {
    if (!target || !hospital) return;
    var isTop = (target === editorData) || Object.prototype.hasOwnProperty.call(target, 'hospitalName');
    var nameKey = isTop ? 'hospitalName' : 'hospital';
    target[nameKey] = hospital.name || '';
    target.hospitalAddress = hospital.address || '';
    target.hospitalPhone = hospital.phone || '';
    target.hospitalDistance = hospital.distance || '';
    target.hospitalSource = source || hospital.source || 'live';
    target.hospitalRetrievedAt = hospital.retrievedAt || new Date().toISOString();
    if (hospital.phone) {
      target.hospitalPhoneSource = hospital.phoneSource || source || 'live';
    } else {
      target.hospitalPhoneSource = '';
    }
    if (isTop) hospitalNameDirty = false;
  }

  function sharedContactsGetter() {
    return function () {
      try {
        var parentOg = (typeof window !== 'undefined' && window.parent && window.parent !== window)
          ? window.parent.mBTOG : null;
        if (parentOg && typeof parentOg.getSharedContacts === 'function') {
          return parentOg.getSharedContacts();
        }
      } catch (eParent) { /* cross-frame access blocked */ }
      try {
        if (typeof window !== 'undefined' && window.mBTOG && typeof window.mBTOG.getSharedContacts === 'function') {
          return window.mBTOG.getSharedContacts();
        }
      } catch (eOwn) { /* ignore */ }
      return Promise.resolve([]);
    };
  }

  function clearAutoHospitalFields(target) {
    if (!target) return;
    var src = String(target.hospitalSource || '');
    if (!AUTO_HOSPITAL_SOURCES[src] && !hospitalUnitEmpty(target)) return;
    if (AUTO_HOSPITAL_SOURCES[src] || hospitalUnitEmpty(target)) clearHospitalUnit(target);
  }

  function clearAutoHospitalPhoneOnNameEdit() {
    var src = String(editorData.hospitalSource || '');
    /* Z1(c): editing the name of an automatic hospital clears auto-filled address, phone and distance. */
    if (AUTO_HOSPITAL_SOURCES[src]) {
      editorData.hospitalAddress = '';
      editorData.hospitalPhone = '';
      editorData.hospitalDistance = '';
      editorData.hospitalPhoneSource = '';
      editorData.hospitalRetrievedAt = '';
      editorData.hospitalSource = 'typed';
      return;
    }
    var phoneSrc = String(editorData.hospitalPhoneSource || '');
    if (AUTO_HOSPITAL_SOURCES[phoneSrc] || phoneSrc === 'opengate' || phoneSrc === 'fallback') {
      editorData.hospitalPhone = '';
      editorData.hospitalPhoneSource = '';
    }
    markHospitalTyped(editorData);
  }

  function applyHospitalFields(target, hospital, asTyped) {
    if (!target || !hospital) return;
    var source = asTyped ? 'typed' : (hospital.source || 'live');
    var curSource = String(target.hospitalSource || '');

    if (asTyped) {
      writeHospitalUnit(target, hospital, 'typed');
      target.hospitalPhoneSource = 'typed';
      return;
    }

    /* Z1: automatic fill only when empty or already automatic. Typed hospitals never change. */
    if (curSource === 'typed') return;
    if (!hospitalUnitEmpty(target) && !AUTO_HOSPITAL_SOURCES[curSource]) return;

    writeHospitalUnit(target, hospital, source);
  }

  function renderHospitalPicker(hospitals, statusEl) {
    var hospPicker = dom.getElementById('hospital-picker');
    if (!hospPicker) return;
    var top = (hospitals || []).slice(0, 5);
    if (!top.length) {
      hospPicker.style.display = 'none';
      hospPicker.innerHTML = '';
      hospPicker.onclick = null;
      return;
    }
    var pickerHtml = '<p>Select nearest hospital:</p>';
    top.forEach(function (h, hi) {
      pickerHtml += '<div class="hosp-item" data-hi="' + hi + '" data-name="' + esc(h.name) + '" data-addr="' + esc(h.address || '') +
        '" data-phone="' + esc(h.phone || '') + '" data-distance="' + esc(h.distance || '') + '">' +
        '<div><div class="hosp-item-name">' + esc(h.name) + '</div>' +
        (h.address ? '<div style="font-size:9px;color:#64748b;">' + esc(h.address) + '</div>' : '') +
        (h.distance ? '<div style="font-size:9px;color:#64748b;">' + esc(h.distance) + '</div>' : '') +
        '</div><div class="hosp-item-phone">' + esc(h.phone || 'phone to confirm') + '</div></div>';
    });
    hospPicker.innerHTML = pickerHtml;
    hospPicker.style.display = 'block';
    hospPicker.onclick = function (e) {
      var item = e.target.closest('.hosp-item');
      if (!item) return;
      dbPushUndoImmediate();
      var picked = {
        name: item.getAttribute('data-name'),
        address: item.getAttribute('data-addr'),
        phone: item.getAttribute('data-phone'),
        distance: item.getAttribute('data-distance'),
        source: 'typed',
        retrievedAt: new Date().toISOString()
      };
      applyHospitalFields(editorData, picked, true);
      var locs = editorData.shootingLocations || [];
      if (locs[0]) applyHospitalFields(locs[0], picked, true);
      fillHospitalPhoneFromName(picked.name, true);
      hospPicker.style.display = 'none';
      hospPicker.onclick = null;
      if (statusEl) {
        statusEl.textContent = 'Hospital selected.';
        setTimeout(function () { if (statusEl.textContent === 'Hospital selected.') statusEl.textContent = ''; }, 2000);
      }
      saveEditorData();
      buildEditor('callSheet');
    };
  }

  function fillHospitalPhoneFromName(name, allowOverwriteEmptyOnly) {
    var api = hospitalLookupApi();
    if (!api || !name) return Promise.resolve();
    var phoneNow = String(editorData.hospitalPhone || '').trim();
    var addrNow = String(editorData.hospitalAddress || '').trim();
    var distNow = String(editorData.hospitalDistance || '').trim();
    var src = String(editorData.hospitalSource || '');
    /* Z1(e) / Z0: exact-name commit fills only when phone is empty and the unit is name-only
       (or still automatic). Typed hospitals with other fields never receive a lookup phone. */
    if (phoneNow) return Promise.resolve();
    if (src === 'typed' && (addrNow || distNow)) return Promise.resolve();
    if (src === 'typed' && !addrNow && !distNow) {
      /* name-only typed: exact match exception writes name + phone + blank address/distance as one auto unit */
    } else if (src && !AUTO_HOSPITAL_SOURCES[src] && src !== 'typed') {
      return Promise.resolve();
    }
    return api.resolveHospitalPhone({
      livePhone: '',
      hospitalName: name,
      getSharedContacts: sharedContactsGetter()
    }).then(function (got) {
      /* W4: re-test at WRITE time that the hospital is still name only (address, phone, distance empty)
         and the name unchanged; otherwise write nothing so typed address and distance stay. */
      if (String(editorData.hospitalName || '').trim() !== String(name || '').trim()) return;
      if (String(editorData.hospitalPhone || '').trim()) return;
      if (String(editorData.hospitalAddress || '').trim()) return;
      if (String(editorData.hospitalDistance || '').trim()) return;
      if (got && got.phone) {
        writeHospitalUnit(editorData, {
          name: String(name || '').trim(),
          address: '',
          phone: got.phone,
          distance: '',
          phoneSource: got.source || 'fallback',
          retrievedAt: got.retrievedAt || new Date().toISOString()
        }, got.source || 'fallback');
      }
      saveEditorData();
    }).catch(function () {});
  }

  function maybeOfferFacilityConsent() {
    try {
      var host = (window.parent && window.parent !== window) ? window.parent : window;
      var api = host.mBTBackupConsent || window.mBTBackupConsent;
      if (!api || typeof api.offerFacilityConsent !== 'function') return;
      api.offerFacilityConsent({
        localStorage: host.localStorage || localStorage,
        sessionStorage: host.sessionStorage || sessionStorage,
        modal: host.mBTME || window.mBTME,
        document: host.document || document
      });
    } catch (eConsent) { /* never block lookup */ }
  }

  function lookupHospitalsForLocations(geoList, signal, statusEl, requestToken) {
    maybeOfferFacilityConsent();
    var api = hospitalLookupApi();
    if (!api) return Promise.resolve({ hospitalsByAddress: {}, firstRanked: [], error: 'Hospital lookup unavailable' });
    var online = typeof navigator === 'undefined' || navigator.onLine !== false;
    if (!online) return Promise.resolve({ hospitalsByAddress: {}, firstRanked: [], error: 'offline' });
    var token = requestToken && typeof requestToken === 'object'
      ? requestToken
      : { counter: requestToken != null ? requestToken : hospitalLookupToken, docToken: hospitalLookupDocToken, docId: currentHospitalDocIdentity() };

    var tasks = (geoList || []).map(function (g) {
      return api.fetchOverpassHospitals(g.lat, g.lon, fetch, signal).then(function (ranked) {
        var within = ranked.filter(function (h) { return h.distanceKm <= 30; });
        return { geo: g, ranked: within, error: within.length ? null : 'nothing within 30 km' };
      }).catch(function (err) {
        if (err && err.name === 'AbortError') throw err;
        return { geo: g, ranked: [], error: (err && err.message) || 'lookup failed' };
      });
    });

    return Promise.all(tasks).then(function (results) {
      if (!hospitalLookupTokenValid(token)) {
        return { hospitalsByAddress: {}, firstRanked: [], error: '', stale: true };
      }
      var hospitalsByAddress = {};
      var firstRanked = [];
      var errors = [];
      var phoneJobs = results.map(function (r, idx) {
        hospitalsByAddress[r.geo.address] = r.ranked;
        if (idx === 0) firstRanked = r.ranked;
        if (r.error) errors.push(r.error);
        var nearest = r.ranked[0];
        if (!nearest) {
          var missLocs = editorData.shootingLocations || [];
          for (var mi = 0; mi < missLocs.length; mi++) {
            if (String(missLocs[mi].address || '').trim() === String(r.geo.address || '').trim()) {
              clearAutoHospitalFields(missLocs[mi]);
            }
          }
          if (idx === 0) clearAutoHospitalFields(editorData);
          return Promise.resolve(null);
        }
        var livePhone = nearest.phone || '';
        var retrievedAt = new Date().toISOString();
        return api.resolveHospitalPhone({
          livePhone: livePhone,
          hospitalName: nearest.name,
          retrievedAt: retrievedAt,
          getSharedContacts: sharedContactsGetter()
        }).then(function (phoneGot) {
          if (!hospitalLookupTokenValid(token)) return null;
          nearest.phone = (phoneGot && phoneGot.phone) || '';
          nearest.phoneSource = (phoneGot && phoneGot.source) || '';
          nearest.source = 'live';
          nearest.retrievedAt = retrievedAt;
          var locs = editorData.shootingLocations || [];
          for (var li = 0; li < locs.length; li++) {
            if (String(locs[li].address || '').trim() === String(r.geo.address || '').trim()) {
              applyHospitalFields(locs[li], nearest, false);
            }
          }
          if (idx === 0) {
            var topAddr = String((editorData.shootingLocations && editorData.shootingLocations[0]
              && editorData.shootingLocations[0].address) || '').trim();
            if (!topAddr || topAddr === String(r.geo.address || '').trim()) {
              applyHospitalFields(editorData, nearest, false);
            }
          }
          return nearest;
        });
      });
      return Promise.all(phoneJobs).then(function () {
        if (!hospitalLookupTokenValid(token)) {
          return { hospitalsByAddress: {}, firstRanked: [], error: '', stale: true };
        }
        var errMsg = '';
        if (!firstRanked.length && errors.length) errMsg = errors[0];
        return { hospitalsByAddress: hospitalsByAddress, firstRanked: firstRanked, error: errMsg };
      });
    });
  }

  function scheduleHospitalLookupFromAddresses() {
    if (hospitalLookupTimer) clearTimeout(hospitalLookupTimer);
    hospitalLookupTimer = setTimeout(function () {
      hospitalLookupTimer = null;
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        /* W6: an automatic hospital of the old address cannot be right; a typed hospital stays. */
        (editorData.shootingLocations || []).forEach(clearAutoHospitalFields);
        clearAutoHospitalFields(editorData);
        var offlineStatus = dom.getElementById('weather-status');
        if (offlineStatus) {
          offlineStatus.textContent = 'Offline: type a hospital, or look one up when you are online.';
        }
        saveEditorData();
        return;
      }
      var collected = collectWeatherAddresses();
      if (!collected.locations.length) {
        (editorData.shootingLocations || []).forEach(clearAutoHospitalFields);
        clearAutoHospitalFields(editorData);
        saveEditorData();
        return;
      }
      if (hospitalLookupController) hospitalLookupController.abort();
      hospitalLookupController = new AbortController();
      var token = makeHospitalLookupToken('addresses');
      var signal = hospitalLookupController.signal;
      var statusEl = dom.getElementById('weather-status');
      Promise.all(collected.locations.map(function (address) {
        return geocodeAddressCascade(address, signal).catch(function (err) {
          if (err && err.name === 'AbortError') throw err;
          return null;
        });
      })).then(function (geos) {
        if (!hospitalLookupTokenValid(token)) return;
        var valid = geos.filter(Boolean);
        var validAddrs = {};
        valid.forEach(function (g) { validAddrs[String(g.address || '').trim()] = true; });
        (editorData.shootingLocations || []).forEach(function (loc, locIdx) {
          var addr = String(loc.address || '').trim();
          if (addr && !validAddrs[addr]) {
            clearAutoHospitalFields(loc);
            if (locIdx === 0) clearAutoHospitalFields(editorData);
          }
        });
        if (!valid.length) {
          if (statusEl) statusEl.textContent = 'Could not look up a hospital: address not found. Type one in.';
          clearAutoHospitalFields(editorData);
          saveEditorData();
          return;
        }
        return lookupHospitalsForLocations(valid, signal, statusEl, token).then(function (res) {
          if (!res || res.stale) return;
          if (!hospitalLookupTokenValid(token)) return;
          if (res.error && statusEl) {
            statusEl.textContent = 'Could not look up a hospital: ' + res.error + '. Type one in.';
          }
          renderHospitalPicker(res.firstRanked, statusEl);
          saveEditorData();
          buildEditor('callSheet');
        });
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        if (statusEl) statusEl.textContent = 'Could not look up a hospital: ' + ((err && err.message) || 'error') + '. Type one in.';
      });
    }, 0);
  }

  /* Fetch weather (3-day, all shooting locations) + nearest hospitals (every location) */
  function fetchWeatherAndHospitals() {
    var collected = collectWeatherAddresses();
    var locations = collected.locations;
    var addrSource = collected.source;

    if (locations.length === 0) {
      dbAlert('Enter a shooting location or Basecamp address first.');
      return;
    }

    var statusEl = dom.getElementById('weather-status');
    var hospPicker = dom.getElementById('hospital-picker');
    var sourceNote = '';
    if (addrSource === 'basecamp') sourceNote = 'Using Basecamp address\u2026 ';
    else if (addrSource === 'project') sourceNote = 'Using project location\u2026 ';
    statusEl.textContent = sourceNote + 'Geocoding ' + locations.length + ' location(s)\u2026';
    if (hospPicker) hospPicker.style.display = 'none';

    if (weatherFetchController) { weatherFetchController.abort(); }
    weatherFetchController = new AbortController();
    if (hospitalLookupController) {
      try { hospitalLookupController.abort(); } catch (eAbortWx) {}
    }
    hospitalLookupController = weatherFetchController;
    var lookupToken = makeHospitalLookupToken('weather-button');
    var signal = weatherFetchController.signal;

    Promise.all(locations.map(function (address) {
      return geocodeAddressCascade(address, signal).catch(function (err) {
        if (err.name === 'AbortError') throw err;
        if (err.isHttp) {
          console.warn('[mBTDB geocode] HTTP error for: ' + address, err);
          return { __httpFail: true, address: address };
        }
        console.warn('[mBTDB geocode] Could not locate: ' + address, err);
        return null;
      });
    })).then(function (geoResults) {
      var httpFails = 0;
      var validGeo = [];
      geoResults.forEach(function (g) {
        if (!g) return;
        if (g.__httpFail) { httpFails++; return; }
        validGeo.push(g);
      });

      if (validGeo.length === 0) {
        if (httpFails > 0 && httpFails === geoResults.length) {
          statusEl.textContent = 'Geocode request failed. Check connection and try again.';
        } else {
          statusEl.textContent = 'Could not geocode address(es). Try City, Country (e.g. Kingston, Jamaica).';
        }
        statusEl.textContent = (statusEl.textContent.indexOf('Could not geocode') === 0)
          ? 'Could not look up a hospital: geocode miss. Type one in.'
          : statusEl.textContent;
        (editorData.shootingLocations || []).forEach(clearAutoHospitalFields);
        clearAutoHospitalFields(editorData);
        saveEditorData();
        return;
      }
      if (validGeo.length < locations.length) {
        statusEl.textContent = 'Fetching weather (' + validGeo.length + ' of ' + locations.length + ' found)\u2026';
      } else {
        statusEl.textContent = (sourceNote || '') + 'Fetching weather for ' + validGeo.length + ' location(s)\u2026';
      }

      var weatherFetches = validGeo.map(function (g) {
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + g.lat + '&longitude=' + g.lon +
          '&daily=temperature_2m_max,temperature_2m_min,weathercode,sunrise,sunset&timezone=auto&forecast_days=3';
        return fetch(url, { signal: signal })
          .then(function (r) { return r.json(); })
          .then(function (w) { return { geo: g, weather: w }; })
          .catch(function (err) {
            if (err.name === 'AbortError') throw err;
            console.warn('[mBTDB weather] Forecast failed for: ' + g.address, err);
            return null;
          });
      });

      var hospitalPromise = lookupHospitalsForLocations(validGeo, signal, statusEl, lookupToken).catch(function (err) {
        if (err && err.name === 'AbortError') throw err;
        return { hospitalsByAddress: {}, firstRanked: [], error: (err && err.message) || 'lookup failed' };
      });

      Promise.all([Promise.all(weatherFetches), hospitalPromise]).then(function (pair) {
        var weatherResults = (pair[0] || []).filter(Boolean);
        var hospitalRes = pair[1] || { firstRanked: [], error: '' };
        if (!hospitalLookupTokenValid(lookupToken)) {
          hospitalRes = { firstRanked: [], error: '', stale: true };
        }

        if (weatherResults.length === 0 && hospitalRes.error && !hospitalRes.stale) {
          statusEl.textContent = 'Weather fetch failed. Could not look up a hospital: ' + hospitalRes.error + '. Type one in.';
          return;
        }

        dbPushUndoImmediate();
        if (weatherResults.length > 0) {
          editorData.locationForecasts = weatherResults.map(function (wr) {
            var d = wr.weather.daily || {};
            var days = (d.time || []).map(function (date, i) {
              return {
                date: date,
                high: d.temperature_2m_max[i] !== undefined ? Math.round(d.temperature_2m_max[i]) + '\u00b0C' : '',
                low:  d.temperature_2m_min[i] !== undefined ? Math.round(d.temperature_2m_min[i]) + '\u00b0C' : '',
                conditions: WMO_DESC[d.weathercode[i]] || ('Code ' + d.weathercode[i]),
                sunrise: (d.sunrise && d.sunrise[i]) ? (d.sunrise[i].indexOf('T') > -1 ? d.sunrise[i].split('T')[1].slice(0,5) : d.sunrise[i]) : '',
                sunset:  (d.sunset  && d.sunset[i])  ? (d.sunset[i].indexOf('T')  > -1 ? d.sunset[i].split('T')[1].slice(0,5)  : d.sunset[i])  : ''
              };
            });
            return { address: wr.geo.address, days: days };
          });
          if (editorData.locationForecasts.length > 0 && editorData.locationForecasts[0].days.length > 0) {
            var first = editorData.locationForecasts[0].days[0];
            editorData.weatherHigh = first.high;
            editorData.weatherLow = first.low;
            editorData.weatherConditions = first.conditions;
            if (first.sunrise) editorData.sunrise = first.sunrise;
            if (first.sunset) editorData.sunset = first.sunset;
          }
        }

        if (!hospitalRes.stale) renderHospitalPicker(hospitalRes.firstRanked || [], statusEl);

        saveEditorData();
        buildEditor('callSheet');
        var doneNote = '';
        if (addrSource === 'basecamp') doneNote = ' (via Basecamp)';
        else if (addrSource === 'project') doneNote = ' (via project location)';
        var parts = [];
        if (weatherResults.length > 0) parts.push('Weather loaded for ' + editorData.locationForecasts.length + ' location(s)' + doneNote);
        else parts.push('Weather fetch failed');
        if (!hospitalRes.stale) {
          if (hospitalRes.error) parts.push('Could not look up a hospital: ' + hospitalRes.error + '. Type one in.');
          else if ((hospitalRes.firstRanked || []).length) parts.push('nearest hospital filled (pick another above if needed)');
        }
        statusEl.textContent = parts.join('. ') + '.';
        setTimeout(function () {
          if (statusEl.textContent.indexOf('Type one in') >= 0) return;
          if (statusEl.textContent.indexOf('pick another') >= 0) return;
          statusEl.textContent = '';
        }, 4000);
      }).catch(function (err) {
        if (err.name === 'AbortError') return;
        statusEl.textContent = 'Network error. Check connection.';
        console.error('[mBTDB weather]', err);
      });
    }).catch(function (err) {
      if (err.name === 'AbortError') return;
      statusEl.textContent = 'Geocoding failed. Check connection.';
      console.error('[mBTDB geocode]', err);
    });
  }

  /* Weather-only open path: no hospital lookup (Z3). */
  function fetchWeatherOnlyOnOpen() {
    var collected = collectWeatherAddresses();
    var locations = collected.locations;
    if (!locations.length) return;
    var statusEl = dom.getElementById('weather-status');
    if (weatherFetchController) { try { weatherFetchController.abort(); } catch (eWx) {} }
    var signal = null;
    if (typeof AbortController !== 'undefined') {
      weatherFetchController = new AbortController();
      signal = weatherFetchController.signal;
    } else {
      weatherFetchController = null;
    }
    /* W5: same document token as lookups; invalidateHospitalLookups aborts this controller. */
    var openToken = makeHospitalLookupToken('weather-open');
    Promise.all(locations.map(function (address) {
      return geocodeAddressCascade(address, signal).catch(function () { return null; });
    })).then(function (geoResults) {
      if (!hospitalLookupTokenValid(openToken)) return;
      var validGeo = (geoResults || []).filter(Boolean);
      if (!validGeo.length) return;
      return Promise.all(validGeo.map(function (g) {
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + g.lat + '&longitude=' + g.lon +
          '&daily=temperature_2m_max,temperature_2m_min,weathercode,sunrise,sunset&timezone=auto&forecast_days=3';
        return fetch(url, { signal: signal })
          .then(function (r) { return r.json(); })
          .then(function (w) { return { geo: g, weather: w }; })
          .catch(function () { return null; });
      })).then(function (weatherResults) {
        if (!hospitalLookupTokenValid(openToken)) return;
        weatherResults = (weatherResults || []).filter(Boolean);
        if (!weatherResults.length) return;
        editorData.locationForecasts = weatherResults.map(function (wr) {
          var d = wr.weather.daily || {};
          var days = (d.time || []).map(function (date, i) {
            return {
              date: date,
              high: d.temperature_2m_max[i] !== undefined ? Math.round(d.temperature_2m_max[i]) + '\u00b0C' : '',
              low: d.temperature_2m_min[i] !== undefined ? Math.round(d.temperature_2m_min[i]) + '\u00b0C' : '',
              conditions: WMO_DESC[d.weathercode[i]] || ('Code ' + d.weathercode[i]),
              sunrise: (d.sunrise && d.sunrise[i]) ? (d.sunrise[i].indexOf('T') > -1 ? d.sunrise[i].split('T')[1].slice(0, 5) : d.sunrise[i]) : '',
              sunset: (d.sunset && d.sunset[i]) ? (d.sunset[i].indexOf('T') > -1 ? d.sunset[i].split('T')[1].slice(0, 5) : d.sunset[i]) : ''
            };
          });
          return { address: wr.geo.address, days: days };
        });
        if (editorData.locationForecasts[0] && editorData.locationForecasts[0].days[0]) {
          var first = editorData.locationForecasts[0].days[0];
          editorData.weatherHigh = first.high;
          editorData.weatherLow = first.low;
          editorData.weatherConditions = first.conditions;
          if (first.sunrise) editorData.sunrise = first.sunrise;
          if (first.sunset) editorData.sunset = first.sunset;
        }
        saveEditorData();
        if (statusEl) statusEl.textContent = 'Weather loaded for ' + editorData.locationForecasts.length + ' location(s).';
      });
    }).catch(function () {});
  }

  /* ======== Init ======== */
  /* Picker builds immediately (no budget needed). Budget loads async after. */
  applyCompactMode();
  buildTemplatePicker();
  loadBudget();
})();
</script>
