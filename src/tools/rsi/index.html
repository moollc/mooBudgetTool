<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBT RSI - Technical Debt Dashboard</title>
  <script src="../../scripts/storage.js"></script>
  <script src="../../scripts/engine/mbtle.js"></script>
  <script src="../../lib/tailwind.min.js"></script>
  <script src="../../core/components/EmbeddedMode.js"></script>
  <style type="text/tailwindcss">
    /* mBT RSI Technical Debt Dashboard */
:root {
  --mBT-theme-primary: #1e88e5;
  --mBT-theme-danger: #e53935;
}

.debt-item {
  @apply bg-yellow-50 border border-yellow-200 rounded-lg p-4;
}

.debt-item.critical {
  @apply bg-red-50 border border-red-200;
}

.debt-item.performance {
  @apply bg-purple-50 border border-purple-200;
}

.debt-item.security {
  @apply bg-orange-50 border border-orange-200;
}
</style>
</head>

<body class="bg-gray-50 font-sans">

  <div class="min-h-screen pb-8">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4">
      <h1 class="text-xl font-bold text-gray-800">RSI - Technical Debt Dashboard</h1>
      <p class="text-sm text-gray-500 mt-1">Optimization Priorities & Health Tracking</p>
    </header>

    <!-- Main Layout -->
    <main class="px-6 py-6">

      <!-- Stats Summary -->
      <section class="mb-6">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Health Summary</h2>
        <div class="grid grid-cols-4 gap-4">
          <div class="bg-white rounded-lg shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-gray-800" id="total-debt">0</p>
            <p class="text-xs text-gray-500">Total Items</p>
          </div>
          <div class="bg-red-50 rounded-lg shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-red-600" id="critical-debt">0</p>
            <p class="text-xs text-gray-500">Critical</p>
          </div>
          <div class="bg-yellow-50 rounded-lg shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-yellow-600" id="warning-debt">0</p>
            <p class="text-xs text-gray-500">Warning</p>
          </div>
          <div class="bg-green-50 rounded-lg shadow-sm p-4 text-center">
            <p class="text-3xl font-bold text-green-600" id="resolved-debt">0</p>
            <p class="text-xs text-gray-500">Resolved</p>
          </div>
        </div>
      </section>

      <!-- Filter Tabs -->
      <section class="mb-6">
        <div class="flex flex-wrap gap-2">
          <button class="dept-tab px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium"
            data-type="all">All</button>
          <button class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm"
            data-type="critical">Critical</button>
          <button class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm"
            data-type="warning">Warning</button>
          <button class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm"
            data-type="performance">Performance</button>
          <button class="dept-tab px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm"
            data-type="security">Security</button>
          <button class="dept-tab px-4 py-2 bg-green-100 hover:bg-green-200 rounded-lg text-sm text-green-700"
            data-type="resolved">Resolved</button>
        </div>
      </section>

      <!-- Debt Items List -->
      <section>
        <div id="debt-list" class="space-y-3">
          <!-- Debt items will be inserted here by JavaScript -->
        </div>
        <div id="empty-state" class="hidden text-center py-12">
          <p class="text-gray-500">No technical debt items found.</p>
        </div>
      </section>

      <!-- Add Item Button -->
      <section class="mt-6">
        <button class="btn-new-debt px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm"
          id="btn-new-debt">
          ➕ Add Debt Item
        </button>
      </section>

    </main>

  </div>

  <!-- Add Debt Modal -->
  <div class="new-debt-modal hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    id="new-debt-modal">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
      <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h2 class="text-lg font-semibold">Add Technical Debt Item</h2>
        <button class="close text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
          <input type="text" id="new-debt-title" class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="e.g., Update dependencies">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
          <select id="new-debt-category" class="w-full px-3 py-2 border border-gray-300 rounded">
            <option value="performance">Performance</option>
            <option value="security">Security</option>
            <option value="code-quality">Code Quality</option>
            <option value="architecture">Architecture</option>
            <option value="docs">Documentation</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priority *</label>
          <select id="new-debt-priority" class="w-full px-3 py-2 border border-gray-300 rounded">
            <option value="critical">Critical</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="new-debt-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="Describe the issue..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Hours</label>
          <input type="number" step="0.5" id="new-debt-hours" class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="4">
        </div>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
        <button class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded">Cancel</button>
        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded" id="btn-create-debt">Add</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var DEFAULT_DEBT_FILE = './DEBT.json';
      var DEBT_STORE = 'rsi_debt';

      const STORAGE = window.mBT.storage;
      let allDebtData = []; // Outer scope for search
      let currentFilter = '';
      let currentDebt = null;

      /* --- Debt initialization: load from storage, seed defaults only on first run --- */
      function initDebt() {
        STORAGE.getItem(DEBT_STORE).then(function (existing) {
          if (!existing || existing.length === 0) {
            loadDefaultDebt();
          } else {
            allDebtData = existing;
            renderDebt(allDebtData, currentFilter);
            updateStats(allDebtData);
          }
        }).catch(function () {
          loadDefaultDebt();
        });
      }

      /* --- Seed default debt items from DEBT.json on first run --- */
      function loadDefaultDebt() {
        fetch(DEFAULT_DEBT_FILE)
          .then(function (res) { return res.json(); })
          .then(function (defaultDebt) {
            var seeded = Array.isArray(defaultDebt) ? defaultDebt : [];
            return STORAGE.setItem(DEBT_STORE, seeded).then(function () {
              allDebtData = seeded;
              renderDebt(allDebtData, currentFilter);
              updateStats(allDebtData);
              console.log('[RSI] Debt seeded from DEBT.json');
            });
          })
          .catch(function (err) {
            console.warn('[RSI] DEBT.json not available, starting empty:', err);
            allDebtData = [];
            renderDebt([], currentFilter);
          });
      }

      // Load from storage
      function loadDebtFromStorage() {
        STORAGE.getItem(DEBT_STORE).then(debt => {
          allDebtData = debt || [];
          renderDebt(allDebtData, currentFilter);
          updateStats(allDebtData);
        }).catch(err => {
          console.error('[RSI] Load error:', err);
          renderDebt([], '');
        });
      }

      // Render debt items
      function renderDebt(debt, filter = '') {
        const list = document.getElementById('debt-list');
        const empty = document.getElementById('empty-state');
        list.innerHTML = '';

        let filtered = debt || [];
        if (filter) {
          filtered = filtered.filter(d => d.category === filter || d.priority === filter);
        }

        if (filtered.length === 0) {
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');

        filtered.forEach(item => {
          const el = document.createElement('div');
          el.className = 'debt-item ' + (item.priority === 'critical' ? 'critical ' : '') + (item.category === 'performance' ? 'performance ' : '') + (item.category === 'security' ? 'security ' : '');

          el.innerHTML = `
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-sm font-semibold text-gray-800">${escapeHtml(item.title)}</span>
              <span class="priority-badge text-xs px-2 py-0.5 rounded-full 
                ${item.priority === 'critical' ? 'bg-red-100 text-red-800' :
              item.priority === 'warning' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'}">
                ${item.priority}
              </span>
              <span class="category-badge text-xs px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800">
                ${item.category}
              </span>
            </div>
            <p class="text-sm text-gray-600">${escapeHtml(item.description || '')}</p>
            ${item.estimatedHours ? `<p class="text-xs text-gray-500 mt-1">Est. ${item.estimatedHours} hours</p>` : ''}
            <p class="text-xs text-gray-400 mt-1">${item.created || new Date(item.createdAt).toLocaleDateString()}</p>
          </div>
          <div class="flex items-center gap-2">
            <button class="btn-resolve px-3 py-1.5 text-sm bg-green-50 hover:bg-green-100 text-green-700 rounded" data-id="${item.id}">Resolve</button>
            <button class="btn-edit px-3 py-1.5 text-sm bg-blue-50 hover:bg-blue-100 text-blue-700 rounded" data-id="${item.id}">Edit</button>
            <button class="btn-delete px-3 py-1.5 text-sm bg-red-50 hover:bg-red-100 text-red-700 rounded" data-id="${item.id}">Delete</button>
          </div>
        </div>
      `;

          el.querySelector('.btn-resolve').addEventListener('click', () => confirmResolve(item.id));
          el.querySelector('.btn-edit').addEventListener('click', () => openEditor(item));
          el.querySelector('.btn-delete').addEventListener('click', () => confirmDelete(item.id));
          list.appendChild(el);
        });

        updateStats(allDebtData);
      }

      // Update stats
      function updateStats(debtList) {
        const total = debtList || [];
        const critical = total.filter(d => d.priority === 'critical').length;
        const warning = total.filter(d => d.priority === 'warning').length;
        const resolved = total.filter(d => d.status === 'resolved').length;

        document.getElementById('total-debt').textContent = total.length;
        document.getElementById('critical-debt').textContent = critical;
        document.getElementById('warning-debt').textContent = warning;
        document.getElementById('resolved-debt').textContent = resolved;
      }

      // Filter tabs
      document.querySelectorAll('.dept-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.dept-tab').forEach(t => {
            t.classList.remove('bg-blue-600', 'text-white');
            t.classList.add('bg-gray-200', 'text-gray-700');
          });
          tab.classList.remove('bg-gray-200', 'text-gray-700');
          tab.classList.add('bg-blue-600', 'text-white');

          currentFilter = tab.dataset.type === 'all' ? '' : tab.dataset.type;
          renderDebt(allDebtData, currentFilter);
        });
      });

      // Add debt button
      document.getElementById('btn-new-debt').addEventListener('click', () => {
        document.getElementById('new-debt-modal').classList.remove('hidden');
      });

      // Close modal
      document.querySelector('#new-debt-modal button.close').addEventListener('click', () => {
        document.getElementById('new-debt-modal').classList.add('hidden');
      });

      document.querySelector('#new-debt-modal .px-4.py-2.bg-gray-200').addEventListener('click', () => {
        document.getElementById('new-debt-modal').classList.add('hidden');
      });

      // Create new debt item
      document.getElementById('btn-create-debt').addEventListener('click', createNewDebt);

      // === NEW DEBT CREATION ===
      function createNewDebt() {
        const title = document.getElementById('new-debt-title').value;
        const category = document.getElementById('new-debt-category').value;
        const priority = document.getElementById('new-debt-priority').value;
        const description = document.getElementById('new-debt-description').value;
        const estimatedHours = document.getElementById('new-debt-hours').value;

        if (!title || !category || !priority) {
          alert('Title, category, and priority are required');
          return;
        }

        const debtItem = {
          id: 'debt_' + Date.now(),
          title,
          category,
          priority,
          description,
          estimatedHours,
          status: 'open',
          createdAt: new Date().toISOString()
        };

        STORAGE.getItem(DEBT_STORE).then(function (debt) {
          var updated = (debt || []).concat([debtItem]);
          STORAGE.setItem(DEBT_STORE, updated).then(function () {
            document.getElementById('new-debt-modal').classList.add('hidden');
            document.getElementById('new-debt-title').value = '';
            document.getElementById('new-debt-description').value = '';
            document.getElementById('new-debt-hours').value = '';
            allDebtData = updated;
            renderDebt(updated, currentFilter);
            updateStats(updated);
          });
        });
      }

      // Open editor modal
      function openEditor(item) {
        currentDebt = item;

        const modal = document.createElement('div');
        modal.id = 'edit-debt-modal';
        modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
        modal.innerHTML = `
      <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
          <h2 class="text-lg font-semibold">Edit Debt Item</h2>
          <button class="close text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" id="edit-debt-title" class="w-full px-3 py-2 border border-gray-300 rounded" value="${escapeHtml(currentDebt.title || '')}">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select id="edit-debt-category" class="w-full px-3 py-2 border border-gray-300 rounded">
              <option value="performance" ${currentDebt.category === 'performance' ? 'selected' : ''}>Performance</option>
              <option value="security" ${currentDebt.category === 'security' ? 'selected' : ''}>Security</option>
              <option value="code-quality" ${currentDebt.category === 'code-quality' ? 'selected' : ''}>Code Quality</option>
              <option value="architecture" ${currentDebt.category === 'architecture' ? 'selected' : ''}>Architecture</option>
              <option value="docs" ${currentDebt.category === 'docs' ? 'selected' : ''}>Documentation</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
            <select id="edit-debt-priority" class="w-full px-3 py-2 border border-gray-300 rounded">
              <option value="critical" ${currentDebt.priority === 'critical' ? 'selected' : ''}>Critical</option>
              <option value="warning" ${currentDebt.priority === 'warning' ? 'selected' : ''}>Warning</option>
              <option value="info" ${currentDebt.priority === 'info' ? 'selected' : ''}>Info</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="edit-debt-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded">${escapeHtml(currentDebt.description || '')}</textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Hours</label>
            <input type="number" step="0.5" id="edit-debt-hours" class="w-full px-3 py-2 border border-gray-300 rounded" value="${currentDebt.estimatedHours || ''}">
          </div>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
          <button id="cancel" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded">Cancel</button>
          <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded" id="edit-save-btn">Save</button>
        </div>
      </div>
    `;

        document.body.appendChild(modal);

        modal.querySelector('#cancel').addEventListener('click', closeEditorModal);
        modal.querySelector('button.close').addEventListener('click', closeEditorModal);
        modal.querySelector('#edit-save-btn').addEventListener('click', saveDebtEditor);

        modal.querySelector('#cancel').style.display = 'inline-block';
      }

      function closeEditorModal() {
        const modal = document.getElementById('edit-debt-modal');
        if (modal) modal.remove();
        currentDebt = null;
      }

      function saveDebtEditor() {
        if (!currentDebt) return;

        const title = document.getElementById('edit-debt-title').value;
        const category = document.getElementById('edit-debt-category').value;
        const priority = document.getElementById('edit-debt-priority').value;
        const description = document.getElementById('edit-debt-description').value;
        const estimatedHours = document.getElementById('edit-debt-hours').value;

        const updated = {
          ...currentDebt,
          title,
          category,
          priority,
          description,
          estimatedHours,
          lastModified: new Date().toISOString()
        };

        STORAGE.getItem(DEBT_STORE).then(function (debt) {
          var updatedDebt = (debt || []).map(function (d) {
            return d.id === currentDebt.id ? updated : d;
          });
          STORAGE.setItem(DEBT_STORE, updatedDebt).then(function () {
            allDebtData = updatedDebt;
            closeEditorModal();
            renderDebt(updatedDebt, currentFilter);
            updateStats(updatedDebt);
          });
        });
      }

      // Confirm resolve
      function confirmResolve(id) {
        if (!confirm('Mark this debt item as resolved?')) return;

        STORAGE.getItem(DEBT_STORE).then(function (debt) {
          var updated = (debt || []).map(function (d) {
            if (d.id !== id) return d;
            return Object.assign({}, d, { status: 'resolved', resolvedAt: new Date().toISOString() });
          });
          STORAGE.setItem(DEBT_STORE, updated).then(function () {
            allDebtData = updated;
            renderDebt(updated, currentFilter);
            updateStats(updated);
          });
        });
      }

      // Confirm delete
      function confirmDelete(id) {
        if (!confirm('Delete this debt item?')) return;

        STORAGE.getItem(DEBT_STORE).then(debt => {
          const filtered = debt.filter(d => d.id !== id);
          STORAGE.setItem(DEBT_STORE, filtered).then(function () {
            allDebtData = filtered;
            renderDebt(filtered, currentFilter);
            updateStats(filtered);
          });
        });
      }

      // Escape for HTML
      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Initialize
      initDebt();
    })();
  </script>
</body>

</html>
