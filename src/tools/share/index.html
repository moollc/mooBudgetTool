<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mBT — Share Hub</title>
  <script src="../../lib/tailwind.min.js"></script>
  <script src="../../core/components/EmbeddedMode.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { opacity:0; transform: translateY(20px) translateX(-50%); } to { opacity:1; transform: translateY(0) translateX(-50%); } }
    .snack-in { animation: slideUp 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex flex-col">

  <!-- Header -->
  <div class="h-12 bg-white flex items-center justify-between px-4 border-b border-slate-200 shrink-0">
    <div class="flex items-center gap-4">
      <button id="btn-back" class="flex items-center gap-2 text-slate-600 hover:text-slate-800 text-[10px] font-black uppercase tracking-widest transition-colors">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <div class="h-4 w-px bg-slate-200"></div>
      <span class="text-slate-800 text-xl font-bold">Multiplayer Hub</span>
    </div>
  </div>

  <!-- Split-pane content grid -->
  <div class="flex-1 overflow-hidden grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200">

    <!-- LEFT PANE: Invite + Peers -->
    <div class="overflow-y-auto no-scrollbar p-6 flex flex-col gap-6">

      <!-- Invite link row -->
      <div class="flex flex-col gap-3">
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Invite Link</span>
        <div class="flex items-center gap-2">
          <input id="invite-link-input" type="text" readonly value="Generating..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[11px] text-slate-500 font-mono outline-none min-w-0" />
          <button id="btn-copy" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-black uppercase tracking-widest px-4 py-2.5 rounded-xl transition-colors shrink-0">Copy</button>
        </div>
        <button id="btn-regenerate" class="flex items-center gap-1.5 text-rose-600 hover:text-rose-700 text-[9px] font-black uppercase tracking-widest transition-colors self-start">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
          Burn &amp; Regenerate Link (Revokes old link)
        </button>
      </div>

      <!-- Peers table -->
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Active Collaborators</span>
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
              <th class="px-4 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-400">User</th>
              <th class="px-4 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-400">Status</th>
              <th class="px-4 py-1.5 text-[9px] font-black uppercase tracking-widest text-slate-400 text-right">Access Role</th>
            </tr>
          </thead>
          <tbody id="peers-tbody" class="divide-y divide-slate-100/60 text-[11px] font-medium text-slate-700">
            <tr><td colspan="3" class="px-4 py-4 text-center text-slate-400 text-[10px] uppercase tracking-widest">Loading peers...</td></tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- RIGHT PANE: Proposal Queue -->
    <div class="overflow-y-auto no-scrollbar p-6 flex flex-col gap-4">
      <div class="flex items-center justify-between shrink-0">
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Pending Proposals</span>
        <button id="btn-refresh-proposals" class="text-slate-400 hover:text-slate-700 transition-colors p-1" title="Refresh proposals">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
      <ul id="proposals-list" class="flex flex-col gap-3">
        <li class="text-slate-400 text-[10px] uppercase tracking-widest text-center py-8">Loading proposals...</li>
      </ul>
    </div>

  </div>

  <!-- Snackbar -->
  <div id="snackbar" class="hidden fixed bottom-6 left-1/2 z-50 bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest px-5 py-3 rounded-lg shadow-2xl snack-in"></div>

  <script>
    /* ========= mBTShareHub ========= */
    var mBTShareHub = (function() {
        var state = { projectKey: null, activeToken: null, peers: [], myUserId: '', proposals: [] };

        function snack(msg) {
            var el = document.getElementById('snackbar');
            if(!el) return;
            el.textContent = msg;
            el.classList.remove('hidden'); el.classList.add('snack-in');
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.classList.add('hidden'); }, 3000);
        }

        /* Generate random 16-char token */
        function createToken() {
            return Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
        }

        function getSupabaseHeaders() {
            var token = localStorage.getItem('mbt_supabase_auth_token') || '';
            var anon = localStorage.getItem('mbt_supabase_anon_key') || '';
            return {
                'Content-Type': 'application/json',
                'apikey': anon,
                'Authorization': 'Bearer ' + (token ? token : anon)
            };
        }

        function getBaseUrl() {
            var url = localStorage.getItem('mbt_supabase_url');
            if(!url) return null;
            return url + '/rest/v1';
        }

        /* Fetch existing invite token from mbt_generic or create one */
        function initInviteToken() {
            var baseUrl = getBaseUrl();
            if(!baseUrl) {
                document.getElementById('invite-link-input').value = 'Supabase offline or unconfigured.';
                return;
            }
            if(!state.projectKey) {
                document.getElementById('invite-link-input').value = 'No project loaded.';
                return;
            }
            var rowKey = 'invite_' + state.projectKey.replace('prodBudget_v5_', '');

            fetch(baseUrl + '/mbt_generic?key=eq.' + encodeURIComponent(rowKey), { headers: getSupabaseHeaders() })
            .then(function(res) { return res.json(); })
            .then(function(rows) {
                if (rows && rows.length > 0) {
                    state.activeToken = rows[0].value.token;
                    renderLink();
                } else {
                    generateNewToken(rowKey);
                }
            })
            .catch(function(e) {
                console.error(e);
                snack('Failed to fetch invite token');
                document.getElementById('invite-link-input').value = 'Network Error';
            });
        }

        function generateNewToken(rowKey) {
            var token = createToken();
            var baseUrl = getBaseUrl();
            var payload = {
                key: rowKey,
                value: { token: token, created_at: new Date().toISOString() },
                user_id: state.myUserId || localStorage.getItem('mbt_supabase_user_id') || 'anon'
            };

            fetch(baseUrl + '/mbt_generic', {
                method: 'POST',
                headers: Object.assign({ 'Prefer': 'resolution=merge-duplicates' }, getSupabaseHeaders()),
                body: JSON.stringify(payload)
            })
            .then(function(res) {
                if(res.ok) {
                    state.activeToken = token;
                    renderLink();
                } else {
                    snack('Failed to generate token (Auth rules?)');
                    document.getElementById('invite-link-input').value = 'Permission Denied';
                }
            }).catch(function(e) { console.error(e); });
        }

        function renderLink() {
            var invitePath = window.location.origin + window.location.pathname.replace('/src/tools/share/index.html', '/index.html');
            invitePath += '?projectKey=' + encodeURIComponent(state.projectKey) + '&invite=' + state.activeToken;
            document.getElementById('invite-link-input').value = invitePath;
        }

        function burnToken() {
            if(!confirm('Are you sure? Old links will break instantly, and active viewers will be kicked.')) return;
            var baseUrl = getBaseUrl();
            if(!baseUrl) return;
            if(!state.projectKey) return;
            var rowKey = 'invite_' + state.projectKey.replace('prodBudget_v5_', '');
            
            // Generate immediately overwrites
            generateNewToken(rowKey);
            
            // Broadcast revoke to monolith
            if(window.mBTBridge) window.mBTBridge.send('revoke-link', {});
            snack('Link burned & regenerated');
        }

        function requestPeers() {
            if(window.mBTBridge) window.mBTBridge.send('get-peers');
        }

        function getRoleColor(role) {
            if(role === 'admin') return 'text-violet-600 bg-violet-50 border-violet-200';
            if(role === 'editor') return 'text-emerald-600 bg-emerald-50 border-emerald-200';
            return 'text-slate-500 bg-slate-50 border-slate-200';
        }

        function renderPeers() {
            var tbody = document.getElementById('peers-tbody');
            if(!state.peers || state.peers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400 text-[10px] uppercase tracking-widest">No active collaborators</td></tr>';
                return;
            }

            var html = '';
            var myDisplay = localStorage.getItem('mbt_profile_display_name') || 'Me';

            // Also inject myself actively doing this
            var hasMe = false;
            var augmentedPeers = state.peers.map(function(p) { if(p.userId === state.myUserId) hasMe = true; return p; });
            if(!hasMe && state.myUserId) augmentedPeers.unshift({ userId: state.myUserId, displayName: myDisplay + ' (You)', role: 'admin' });

            augmentedPeers.forEach(function(p) {
                var isMe = p.userId === state.myUserId;
                html += '<tr>' +
                    '<td class="px-4 py-1.5 flex items-center gap-3">' +
                        '<div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-[9px] font-black text-slate-500 shrink-0">' + (p.displayName || 'G')[0].toUpperCase() + '</div>' +
                        '<div class="font-bold flex flex-col">' +
                            '<span>' + (p.displayName || 'Collaborator') + (isMe ? ' (You)' : '') + '</span>' +
                        '</div>' +
                    '</td>' +
                    '<td class="px-4 py-1.5">' +
                        '<span class="inline-flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest text-emerald-600"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online</span>' +
                    '</td>' +
                    '<td class="px-4 py-1.5 text-right">' +
                        '<select data-user="' + (p.userId) + '" ' + (isMe ? 'disabled ' : '') + 'class="ml-auto block w-24 text-[9px] font-black uppercase tracking-widest p-1.5 outline-none rounded-md border ' + getRoleColor(p.role || 'viewer') + '">' +
                            '<option value="viewer" ' + ((p.role === 'viewer' || !p.role) ? 'selected' : '') + '>Viewer</option>' +
                            '<option value="editor" ' + (p.role === 'editor' ? 'selected' : '') + '>Editor</option>' +
                            '<option value="admin" ' + (p.role === 'admin' ? 'selected' : '') + '>Admin</option>' +
                        '</select>' +
                    '</td>' +
                '</tr>';
            });
            tbody.innerHTML = html;
        }

        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function fetchProposals() {
            var baseUrl = getBaseUrl();
            var projectId = state.projectKey ? state.projectKey.replace('prodBudget_v5_', '') : '';
            if (!baseUrl || !projectId) { renderProposals(); return; }

            fetch(baseUrl + '/mbt_pending_edits?project_id=eq.' + encodeURIComponent(projectId) + '&status=eq.pending&order=created_at.desc', {
                headers: getSupabaseHeaders()
            })
            .then(function(res) { return res.json(); })
            .then(function(rows) {
                state.proposals = Array.isArray(rows) ? rows : [];
                renderProposals();
            })
            .catch(function(e) {
                console.error('[mBTShareHub] fetchProposals error:', e);
                state.proposals = [];
                renderProposals();
            });
        }

        function renderProposals() {
            var list = document.getElementById('proposals-list');
            if (!list) return;
            if (!state.proposals || state.proposals.length === 0) {
                list.innerHTML = '<li class="text-slate-400 text-[10px] uppercase tracking-widest text-center py-8">No pending proposals</li>';
                return;
            }
            var html = '';
            state.proposals.forEach(function(p) {
                var diffs = Array.isArray(p.diff_log) ? p.diff_log : [];
                var diffRows = diffs.slice(0, 20).map(function(d) {
                    var diff = d.diff || {};
                    return '<tr class="border-b border-slate-100">' +
                        '<td class="px-2 py-1 text-slate-500 text-[10px] max-w-[80px] truncate">' + esc(d.section || '\u2014') + '</td>' +
                        '<td class="px-2 py-1 text-slate-600 text-[10px] max-w-[80px] truncate">' + esc(diff.field || d.target || '\u2014') + '</td>' +
                        '<td class="px-2 py-1 text-rose-500 text-[10px] max-w-[80px] truncate line-through">' + esc(String(diff.oldValue !== undefined ? diff.oldValue : '\u2014')) + '</td>' +
                        '<td class="px-2 py-1 text-emerald-600 text-[10px] max-w-[80px] truncate font-bold">' + esc(String(diff.newValue !== undefined ? diff.newValue : '\u2014')) + '</td>' +
                    '</tr>';
                }).join('');
                if (diffs.length > 20) {
                    diffRows += '<tr><td colspan="4" class="px-2 py-1 text-slate-400 text-[9px] text-center">+ ' + (diffs.length - 20) + ' more changes</td></tr>';
                }

                html += '<li class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">' +
                    '<div class="px-4 py-3 flex items-center justify-between border-b border-slate-100">' +
                        '<div class="flex flex-col gap-0.5">' +
                            '<span class="text-[12px] font-bold text-slate-800">' + esc(p.requested_by || 'Editor') + '</span>' +
                            '<span class="text-[10px] text-slate-400 font-medium">' + new Date(p.created_at).toLocaleString() + '</span>' +
                            (p.message ? '<span class="text-[10px] text-slate-500 italic mt-0.5">' + esc(p.message) + '</span>' : '') +
                        '</div>' +
                        '<div class="flex items-center gap-2 shrink-0">' +
                            '<button class="btn-reject text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg border border-rose-200 text-rose-500 hover:bg-rose-50 transition-colors"' +
                                ' data-id="' + esc(p.id) + '" data-editor="' + esc(p.user_id) + '" data-project="' + esc(p.project_id) + '">Reject</button>' +
                            '<button class="btn-approve text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white transition-colors"' +
                                ' data-id="' + esc(p.id) + '" data-editor="' + esc(p.user_id) + '" data-project="' + esc(p.project_id) + '" data-snapkey="' + esc(p.id) + '">Approve</button>' +
                        '</div>' +
                    '</div>' +
                    (diffs.length > 0
                        ? '<div class="overflow-x-auto"><table class="w-full text-left">' +
                            '<thead><tr class="bg-slate-50">' +
                                '<th class="px-2 py-1 text-[9px] font-black uppercase tracking-widest text-slate-400">Section</th>' +
                                '<th class="px-2 py-1 text-[9px] font-black uppercase tracking-widest text-slate-400">Field</th>' +
                                '<th class="px-2 py-1 text-[9px] font-black uppercase tracking-widest text-slate-400">Before</th>' +
                                '<th class="px-2 py-1 text-[9px] font-black uppercase tracking-widest text-slate-400">After</th>' +
                            '</tr></thead>' +
                            '<tbody>' + diffRows + '</tbody>' +
                          '</table></div>'
                        : '<p class="px-4 py-3 text-slate-400 text-[10px]">No field-level diff available.</p>'
                    ) +
                '</li>';
            });
            list.innerHTML = html;
        }

        function wireEvents() {
            document.getElementById('btn-back').addEventListener('click', function() {
                if(window.mBTBridge) window.mBTBridge.send('close-tool');
            });
            document.getElementById('btn-copy').addEventListener('click', function() {
                var input = document.getElementById('invite-link-input');
                input.select();
                document.execCommand('copy');
                snack('Link copied to clipboard');
            });
            document.getElementById('btn-regenerate').addEventListener('click', burnToken);

            document.getElementById('peers-tbody').addEventListener('change', function(e) {
                if(e.target.tagName.toLowerCase() === 'select') {
                    if (e.target.value === 'revoke') {
                        if(!confirm('Revoke access for this user?')) { e.target.value = 'viewer'; return; }
                        if(window.mBTBridge) window.mBTBridge.send('revoke-user', { userId: e.target.dataset.user });
                        return;
                    }
                    var userId = e.target.dataset.user;
                    var role = e.target.value;
                    e.target.className = 'ml-auto block w-24 text-[9px] font-black uppercase tracking-widest p-1.5 outline-none rounded-md border ' + getRoleColor(role);
                    if(window.mBTBridge) window.mBTBridge.send('role-change', { targetUserId: userId, newRole: role });
                    snack('Role updated to ' + role);
                }
            });

            // Listen to PostMessage responses from monolith (peers list)
            window.addEventListener('message', function(e) {
                var d = e.data;
                if(!d) return;
                if(d.type === 'mbt-tools-response' && d.action === 'peers-list') {
                    state.peers = d.payload || [];
                    renderPeers();
                }
            });

            // Poll peers every 5s
            setInterval(requestPeers, 5000);

            document.getElementById('btn-refresh-proposals').addEventListener('click', fetchProposals);

            document.getElementById('proposals-list').addEventListener('click', function(e) {
                var approveBtn = e.target.closest('.btn-approve');
                var rejectBtn  = e.target.closest('.btn-reject');

                if (approveBtn) {
                    if (!confirm('Approve this proposal? The snapshot will become the master budget.')) return;
                    var snapKey = approveBtn.dataset.snapkey;
                    var proposal = state.proposals.filter(function(p) { return p.id === snapKey; })[0];
                    var snapshot = proposal ? proposal.budget_snapshot : null;
                    if (window.mBTBridge) window.mBTBridge.send('approve-pending-edit', {
                        editId:         approveBtn.dataset.id,
                        projectId:      approveBtn.dataset.project,
                        editorUserId:   approveBtn.dataset.editor,
                        budgetSnapshot: snapshot
                    });
                    approveBtn.textContent = 'Approved';
                    approveBtn.disabled = true;
                    snack('Proposal approved and merged');
                    setTimeout(function() {
                        var id = approveBtn.dataset.id;
                        state.proposals = state.proposals.filter(function(p) { return p.id !== id; });
                        renderProposals();
                    }, 800);
                    return;
                }

                if (rejectBtn) {
                    if (!confirm('Reject this proposal?')) return;
                    if (window.mBTBridge) window.mBTBridge.send('reject-pending-edit', {
                        editId:       rejectBtn.dataset.id,
                        projectId:    rejectBtn.dataset.project,
                        editorUserId: rejectBtn.dataset.editor
                    });
                    snack('Proposal rejected');
                    var rejId = rejectBtn.dataset.id;
                    state.proposals = state.proposals.filter(function(p) { return p.id !== rejId; });
                    renderProposals();
                }
            });
        }

        function init() {
            var params = new URLSearchParams(window.location.search);
            state.projectKey = params.get('projectKey') || '';
            state.myUserId = localStorage.getItem('mbt_supabase_user_id') || '';

            wireEvents();
            initInviteToken();
            requestPeers();
            fetchProposals();
        }

        return { init: init };
    })();

    window.addEventListener('DOMContentLoaded', mBTShareHub.init);
  </script>
</body>
</html>
