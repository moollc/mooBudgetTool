<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mBT — Contacts CRM</title>
  <script src="../../lib/tailwind.min.js"></script>
  <script src="../../lib/localforage.min.js"></script>
  <script>window.mBT = window.mBT || { services: {} };</script>
  <script src="../../core/mBT.assets.js"></script>
  <script src="../../core/mBT.templates.js"></script>
  <script src="../../scripts/storage.js"></script>
  <script src="../../core/services/Contacts.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Phase 87D: Shared Responsive Utility (.mbt-mobile-safe) */
        .mbt-mobile-safe {
            flex-wrap: wrap;
        }
        .mbt-mobile-safe > * {
            min-height: 44px;
            min-width: 44px;
        }
        .mbt-mobile-safe .mbt-truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mbt-mobile-safe .mbt-touch-btn {
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 640px) {
            .mbt-mobile-safe {
                gap: 4px;
            }
            .mbt-mobile-safe > * {
                min-height: 40px;
                min-width: 40px;
            }
        }
        .glass-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 24px rgba(15,23,42,0.08), 0 1px 4px rgba(15,23,42,0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .glass-card:hover {
      box-shadow: 0 8px 32px rgba(15,23,42,0.13), 0 2px 8px rgba(15,23,42,0.08);
      transform: translateY(-1px);
    }
    .dept-pill { background: rgba(241,245,249,0.9); color: #64748b; transition: background 0.15s; }
    .dept-pill:hover { background: #e2e8f0; }
    .dept-pill.active { background: #2563eb; color: #fff; }
    @keyframes slideUp { from { opacity:0; transform: translateY(20px) translateX(-50%); } to { opacity:1; transform: translateY(0) translateX(-50%); } }
    .snack-in { animation: slideUp 0.25s ease-out forwards; }
    @media print {
      body { background: #fff !important; }
      #header-bar, #tab-bar, #search-bar, .card-footer { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden flex flex-col">

  <!-- Header -->
  <div id="header-bar" class="h-12 bg-slate-900 flex items-center justify-between px-4 border-b border-slate-800 shrink-0">
    <div class="flex items-center gap-4">
      <button id="btn-back" class="flex items-center gap-2 text-white/60 hover:text-white text-[10px] font-black uppercase tracking-widest transition-colors">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <div class="h-4 w-px bg-slate-700"></div>
      <span class="text-white text-[11px] font-black uppercase tracking-tight">Contacts CRM</span>
      <span id="project-tag" class="bg-blue-600 text-[8px] font-black px-1.5 py-0.5 rounded text-white uppercase tracking-widest hidden">—</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-catering" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        Catering
      </button>
      <button id="btn-print" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Directory
      </button>
      <button id="btn-save-all" class="hidden items-center gap-1.5 bg-teal-600 hover:bg-teal-700 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save All
      </button>
      <button id="btn-import-device" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Device Select
      </button>
      <button id="btn-import-contacts" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        File Import
      </button>
      <button id="btn-add-contact" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-colors">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Contact
      </button>
    </div>
  </div>

  <div class="px-4 py-1.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
      <div class="text-[8px] text-slate-500 font-medium uppercase tracking-tight">
          <span class="text-blue-400">Desktop Tip:</span> Export from Google Contacts as <span class="text-white">CSV</span> for best results on PC/Mac.
      </div>
      <div class="text-[8px] text-slate-500 font-medium uppercase tracking-tight">
          <span class="text-blue-400">Mobile:</span> Use Device Select for native phonebook access.
      </div>
  </div>

  <!-- Phase 127.B: Hidden Import Bridge -->
  <input type="file" id="contact-import-input" accept=".vcf,.json,.csv" class="hidden">

  <!-- View Tabs: DB vs Budget Crew -->
  <div id="tab-bar" class="shrink-0 bg-slate-900 border-b border-slate-800 px-4 flex items-end">
    <button id="tab-db" onclick="mBTContacts.setTab('db')" class="text-[9px] font-black uppercase tracking-widest px-4 py-2.5 border-b-2 border-blue-500 text-white transition-colors">
      DB Contacts
    </button>
    <button id="tab-budget" onclick="mBTContacts.setTab('budget')" class="text-[9px] font-black uppercase tracking-widest px-4 py-2.5 border-b-2 border-transparent text-white/40 hover:text-white/70 transition-colors">
      Budget Crew
    </button>
  </div>

  <!-- Search + Dept filter bar -->
  <div id="search-bar" class="shrink-0 bg-white border-b border-slate-200 px-4 py-3 space-y-2">
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="contact-search" placeholder="Search contacts…"
        class="w-full pl-9 pr-4 py-2 text-[11px] bg-slate-50 border border-slate-200 rounded-lg outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors">
    </div>
    <div id="dept-bar" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
  </div>

  <!-- Body -->
  <div class="flex-1 overflow-y-auto no-scrollbar p-4 sm:p-6">

    <!-- Skeleton loader -->
    <div id="skeleton" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="animate-pulse bg-white rounded-2xl border border-slate-100 h-44"></div>
      <div class="animate-pulse bg-white rounded-2xl border border-slate-100 h-44 hidden sm:block"></div>
      <div class="animate-pulse bg-white rounded-2xl border border-slate-100 h-44 hidden lg:block"></div>
    </div>

    <!-- Contact card grid -->
    <div id="contacts-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" class="mb-4 opacity-25">
        <circle cx="32" cy="22" r="12" stroke="#94a3b8" stroke-width="3"/>
        <path d="M10 54c0-12.15 9.85-22 22-22s22 9.85 22 22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <line x1="44" y1="12" x2="56" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="6" x2="50" y2="18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <p class="text-[13px] font-black text-slate-400 uppercase tracking-widest mb-1">No Contacts Found</p>
      <p id="empty-hint" class="text-[11px] text-slate-400 mb-5">Add your first contact to the database.</p>
      <button onclick="mBTContacts.showAddContactModal()" class="flex items-center gap-1.5 text-[9px] font-black uppercase tracking-widest bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Contact
      </button>
    </div>

  </div>

  <!-- Wallet feedback snackbar -->
  <div id="wallet-snack" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 bg-emerald-900 text-white text-[10px] font-black uppercase tracking-widest px-5 py-3 rounded-xl shadow-2xl z-50 whitespace-nowrap"></div>

  <!-- Undo snackbar -->
  <div id="snackbar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[11px] font-bold px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 whitespace-nowrap">
    <span>Contact deleted</span>
    <button id="snackbar-undo" class="text-blue-400 hover:text-blue-300 font-black uppercase tracking-widest text-[9px] transition-colors">Undo</button>
  </div>

<script>
var dom = (document && document.currentScript && document.currentScript.getRootNode) ? document.currentScript.getRootNode() : document;
if (dom === document && window.shadowRoot) dom = window.shadowRoot;

/* ========= mBTContacts — Phase 56: Premium CRM ========= */
var mBTContacts = (function () {

    /* --- State --- */
    var state = {
        projectKey: null,
        currentTab: 'db',
        currentDept: '',
        dbContacts: [],
        budgetCrew: [],
        budget: null,
        editingId: null,
        pendingDelete: null,
        highlightId: null,
        expandedId: null,
        pos: [],
        currency: 'JMD'
    };

    var DEPTS = ['All', 'Production', 'Art', 'Camera', 'Sound', 'Electrical', 'Editing', 'Post', 'Transport', 'Craft Services', 'Miscellaneous'];

    var STANDARD_RATES = {
        'Production': 450, 'Art': 350, 'Camera': 400, 'Sound': 380,
        'Electrical': 370, 'Editing': 420, 'Post': 400, 'Transport': 300,
        'Craft Services': 200, 'Miscellaneous': 150
    };

    var DEPT_COLORS = {
        'Production': '#6366f1', 'Camera': '#3b82f6', 'Sound': '#10b981',
        'Art': '#f59e0b', 'Electrical': '#ec4899', 'Editing': '#8b5cf6',
        'Post': '#06b6d4', 'Transport': '#84cc16', 'Craft Services': '#f97316',
        'Miscellaneous': '#94a3b8'
    };

    var STORAGE = window.mBTStorage;

    /* --- Helpers --- */
    function esc(s) {
        return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmt(n) {
        return '$' + (parseFloat(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function fmtCurrency(n) {
        return state.currency + ' ' + (parseFloat(n) || 0).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function walletSnack(msg) {
        var el = document.getElementById('wallet-snack');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        el.classList.add('flex', 'snack-in');
        clearTimeout(el._t);
        el._t = setTimeout(function() { el.classList.add('hidden'); el.classList.remove('flex', 'snack-in'); }, 3000);
    }

    /* --- Department pill bar --- */
    function renderDeptBar() {
        var bar = dom.getElementById('dept-bar');
        var html = '';
        DEPTS.forEach(function (d) {
            var isActive = (d === 'All' && state.currentDept === '') || d === state.currentDept;
            html += '<button onclick="mBTContacts.setDept(\'' + esc(d) + '\')" class="dept-pill' + (isActive ? ' active' : '') + ' shrink-0 text-[9px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full">' + esc(d) + '</button>';
        });
        bar.innerHTML = html;
    }

    /* --- Tab switching --- */
    function setTab(tab) {
        state.currentTab = tab;
        dom.getElementById('tab-db').className = 'text-[9px] font-black uppercase tracking-widest px-4 py-2.5 border-b-2 ' +
            (tab === 'db' ? 'border-blue-500 text-white' : 'border-transparent text-white/40 hover:text-white/70') + ' transition-colors';
        dom.getElementById('tab-budget').className = 'text-[9px] font-black uppercase tracking-widest px-4 py-2.5 border-b-2 ' +
            (tab === 'budget' ? 'border-blue-500 text-white' : 'border-transparent text-white/40 hover:text-white/70') + ' transition-colors';
        dom.getElementById('empty-hint').textContent = tab === 'db'
            ? 'Add your first contact to the database.'
            : 'No crew found in the active budget.';
        render();
    }

    function setDept(d) {
        state.currentDept = (d === 'All') ? '' : d;
        renderDeptBar();
        render();
    }

    /* --- Data load --- */
    function load() {
        var params = new URLSearchParams(window.location.search);
        state.projectKey = params.get('projectKey') || null;
        state.highlightId = params.get('highlightId') || null;

        if (state.projectKey) {
            var label = decodeURIComponent(state.projectKey).replace('prodBudget_v5_', '');
            dom.getElementById('project-tag').textContent = label;
            dom.getElementById('project-tag').classList.remove('hidden');
        }

        renderDeptBar();

        var budgetPromise = state.projectKey
            ? localforage.getItem(state.projectKey)
            : (STORAGE.getMonolithBudget ? STORAGE.getMonolithBudget() : Promise.resolve(null));

        var sharedContactsPromise = localforage.getItem('moo_og_shared_contacts').then(function (d) { return d || []; }).catch(function () { return []; });

        Promise.all([STORAGE.getAllContacts(), budgetPromise, sharedContactsPromise]).then(function (results) {
            state.dbContacts = results[0] || [];
            state.budget = results[1] || null;
            state.budgetCrew = extractBudgetCrew(state.budget);
            state.pos = (state.budget && state.budget.ledgers && Array.isArray(state.budget.ledgers.pos)) ? state.budget.ledgers.pos : [];
            state.currency = params.get('currency') || (state.budget && state.budget.displayCurrency) || 'JMD';

            /* Merge shared contacts (read-only, marked with sharedFrom) */
            var shared = results[2] || [];
            var dbIds = {};
            state.dbContacts.forEach(function (c) { dbIds[c.id] = true; });
            shared.forEach(function (sc) {
                if (!dbIds[sc.id]) {
                    state.dbContacts.push({
                        id:         sc.id,
                        name:       sc.name,
                        department: sc.department || sc.role || '',
                        role:       sc.role || sc.department || '',
                        email:      sc.email || null,
                        phone:      sc.phone || null,
                        rate:       sc.rate || null,
                        portfolio:  sc.portfolio || [],
                        sharedFrom: sc.owner_name || 'OpenGate',
                        readOnly:   true
                    });
                }
            });

            dom.getElementById('skeleton').classList.add('hidden');
            dom.getElementById('contacts-grid').classList.remove('hidden');
            updateSaveAllBtn();
            render();

            if (state.highlightId) {
                setTimeout(function () {
                    var el = dom.getElementById('card-' + state.highlightId);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.style.outline = '2px solid #3b82f6';
                        setTimeout(function () { el.style.outline = ''; }, 2500);
                    }
                }, 300);
            }
        }).catch(function (e) {
            console.error('[mBTContacts] Load error:', e);
            dom.getElementById('skeleton').classList.add('hidden');
        });
    }

    /* --- Extract crew from monolith budget --- */
    function extractBudgetCrew(budget) {
        if (!budget) return [];
        var crew = [];
        var patterns = ['director', 'producer', 'writer', 'd.p.', 'camera', 'sound', 'electrical', 'grip', 'art', 'set', 'wardrobe', 'makeup', 'cast', 'stunt', 'editor', 'post', 'composer', 'ad', 'pa', 'production assistant', 'coordinator'];
        var addedIds = {};

        function checkItem(item) {
            var desc = (item.description || '').toLowerCase();
            if (!desc) return;
            var isCrew = false;
            var dept = 'Production';
            for (var i = 0; i < patterns.length; i++) {
                if (desc.indexOf(patterns[i]) > -1) {
                    isCrew = true;
                    if (patterns[i] === 'camera' || patterns[i] === 'd.p.') dept = 'Camera';
                    else if (patterns[i] === 'sound') dept = 'Sound';
                    else if (patterns[i] === 'electrical' || patterns[i] === 'grip') dept = 'Electrical';
                    else if (patterns[i] === 'art' || patterns[i] === 'set' || patterns[i] === 'wardrobe' || patterns[i] === 'makeup') dept = 'Art';
                    else if (patterns[i] === 'editor' || patterns[i] === 'post' || patterns[i] === 'composer') dept = 'Post';
                    else if (patterns[i] === 'transport') dept = 'Transport';
                    break;
                }
            }
            if (!isCrew && item.contact_id) isCrew = true;
            var cid = item.id || desc;
            if (isCrew && !addedIds[cid]) {
                addedIds[cid] = true;
                crew.push({
                    id: 'budget_' + cid,
                    name: item.description,
                    department: dept,
                    rate: item.rate || STANDARD_RATES[dept],
                    projectName: budget.projectName || 'Active Budget',
                    isBudgetExtraction: true
                });
            }
        }

        if (budget.globalItems) budget.globalItems.forEach(checkItem);
        if (budget.sections) {
            Object.values(budget.sections).forEach(function (sec) {
                (sec.items || []).forEach(checkItem);
            });
        }
        return crew;
    }

    /* --- Save All button visibility --- */
    function updateSaveAllBtn() {
        var btn = dom.getElementById('btn-save-all');
        var dbNames = {};
        state.dbContacts.forEach(function (c) { dbNames[(c.name || '').toLowerCase()] = true; });
        var unsaved = state.budgetCrew.filter(function (c) { return !dbNames[(c.name || '').toLowerCase()]; });
        if (unsaved.length > 0) {
            btn.classList.remove('hidden');
            btn.classList.add('flex');
        } else {
            btn.classList.add('hidden');
            btn.classList.remove('flex');
        }
    }

    /* --- Render grid --- */
    function render() {
        var grid = dom.getElementById('contacts-grid');
        var empty = dom.getElementById('empty-state');
        var query = (dom.getElementById('contact-search').value || '').toLowerCase().trim();

        /* Source is scoped to active tab — search doesn't bleed across tabs */
        var source = state.currentTab === 'db' ? state.dbContacts : state.budgetCrew;

        var filtered = state.currentDept
            ? source.filter(function (c) { return c.department === state.currentDept; })
            : source;

        if (query) {
            filtered = filtered.filter(function (c) {
                return (c.name || '').toLowerCase().indexOf(query) > -1 ||
                    (c.email || '').toLowerCase().indexOf(query) > -1 ||
                    (c.department || '').toLowerCase().indexOf(query) > -1;
            });
        }

        if (filtered.length === 0) {
            grid.classList.add('hidden');
            empty.classList.remove('hidden');
            empty.classList.add('flex');
            return;
        }

        empty.classList.add('hidden');
        empty.classList.remove('flex');
        grid.classList.remove('hidden');
        grid.innerHTML = '';
        filtered.forEach(function (c) { grid.appendChild(buildCard(c)); });
    }

    /* --- Build glassmorphic card --- */
    function buildCard(c) {
        var card = document.createElement('div');
        card.id = 'card-' + (c.id || '');
        card.className = 'glass-card rounded-2xl p-5 flex flex-col gap-3';

        var name = c.name || 'Unnamed';
        var dept = c.department || 'General';
        var rate = c.rate || STANDARD_RATES[dept] || 0;
        var isBudget = c.isBudgetExtraction;
        var accent = DEPT_COLORS[dept] || '#64748b';

        var html =
            '<div class="flex items-start justify-between gap-3">' +
                '<div class="min-w-0 flex-1">' +
                    '<div class="flex items-center gap-2 flex-wrap mb-2">' +
                        '<span class="text-[13px] font-black text-slate-900 truncate">' + esc(name) + '</span>' +
                        (isBudget ? '<span class="text-[7px] font-black px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 uppercase tracking-widest">Budget</span>' : '') +

            if (c.allergies) details += '<span class="text-[7px] font-black px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 uppercase tracking-widest">Allergy: ' + esc(c.allergies) + '</span>';

        var walletBg = isExpanded ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100';

            return (po.status === 'Committed' || po.status === 'Invoiced') &&
                   ((po.contactId && c.id && po.contactId === c.id) || (po.vendor && c.name && po.vendor.toLowerCase() === c.name.toLowerCase()));
        }).length;
        var poBadge = linkedPosCount > 0 ? '<span class="ml-1 px-1.5 py-0.5 bg-emerald-200 text-emerald-800 rounded font-black text-[7px] leading-none">' + linkedPosCount + '</span>' : '';

        html += '<div id="wallet-panel-' + esc(c.id) + '" class="' + (state.expandedId === c.id ? '' : 'hidden') + ' mt-2 pt-2 border-t border-slate-100">' +

    /* --- Toggle wallet detail panel --- */
    function toggleWalletPanel(c) {
        if (state.expandedId === c.id) {
            state.expandedId = null;
        } else {
            state.expandedId = c.id;
        }
        render();

    /* --- Build wallet detail panel HTML --- */

            html += '<div class="flex items-center gap-2 p-2 bg-emerald-50 rounded-xl">' +

                    '</div>' +

        /* Section 3: Payment history (SSoT from pos[]) */

                    var isPdf   = p.mimeType === 'application/pdf';
                    if (p.data) {
                        if (isImage) {
                            html += '<div class="mb-1">' +

                                '<span class="text-[9px] font-bold text-slate-600 truncate">' + esc(p.label || p.name) + '</span>' +
                                '<span class="text-[8px] text-slate-400 ml-auto shrink-0">' + (p.size ? Math.round(p.size / 1024) + 'KB' : '') + '</span>' +

                        }

                }

        }
        html += '</div>';

        return html;

                serviceOpts += '<option value="' + esc(s.id) + '"' + sel + '>' + esc(s.label) + '</option>';
            });

        var modal = document.createElement('div');

            '<div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm flex flex-col">' +

                    '<span class="text-[11px] font-black uppercase tracking-widest text-white">Issue Payment</span>' +

                    '</button>' +
                '</div>' +
                '<div class="px-6 py-5 space-y-4">' +
                    /* PO header */
                    '<div class="p-3 bg-slate-800 rounded-xl">' +
                        '<div class="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-0.5">Purchase Order</div>' +
                        '<div class="text-[11px] font-black text-white">' + esc(po.poNumber) + ' &mdash; ' + esc(po.vendor) + '</div>' +
                        '<div class="text-[9px] text-slate-400">' + esc(po.description || '') + ' &bull; ' + esc(fmtCurrency(po.amount)) + '</div>' +

    /* --- Process and persist payment --- */
    function submitPayment(poId, contact) {
        var amount = parseFloat((document.getElementById('pay-amount') || {}).value) || 0;
        var service = (document.getElementById('pay-service') || {}).value || '';
        var ref = ((document.getElementById('pay-ref') || {}).value || '').trim();
        var date = (document.getElementById('pay-date') || {}).value || new Date().toISOString().split('T')[0];

        function showError(msg) {
            var errEl = document.getElementById('pay-error');
            if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
            else { walletSnack(msg); }
        }

        if (amount <= 0) { showError('Enter a valid amount'); return; }
        if (!ref) { showError('Reference # is required'); return; }
        if (!state.projectKey) { showError('No project loaded'); return; }

        /* Close modal immediately */
        var m = document.getElementById('payment-modal');
        if (m) m.remove();

        /* Mutate PO in local state */
        for (var i = 0; i < state.pos.length; i++) {
            if (state.pos[i].id === poId) {
                state.pos[i].status = 'Paid';
                state.pos[i].paidDate = date;
                state.pos[i].paidRef = ref;
                state.pos[i].paidMethod = service;
                state.pos[i].paidAmount = amount;
                break;
            }
        }

        /* Write back to localforage then notify monolith */
        localforage.getItem(state.projectKey).then(function(data) {
            if (!data) return;
            if (!data.ledgers) data.ledgers = { poCounter: 1, pos: [], pettyCash: [] };
            data.ledgers.pos = state.pos;
            return localforage.setItem(state.projectKey, data).then(function() {
                /* Notify monolith to sync in-memory budget (reuses existing update-ledgers handler) */
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'mbt:tool-action',
                        action: 'update-ledgers',
                        payload: {
                            pos: data.ledgers.pos,
                            pettyCash: data.ledgers.pettyCash,
                            poCounter: data.ledgers.poCounter
                        }
                    }, '*');
                }
            });
        }).then(function() {
            walletSnack('Payment logged against ' + (state.pos.find(function(p) { return p.id === poId; }) || {}).poNumber);
            render();
        }).catch(function(e) {
            walletSnack('Save failed — try again');
            console.error('[mBTContacts] Payment save error:', e);
        });
    }

    /* --- Soft delete with undo snackbar --- */
    function initiateDelete(contact) {
        /* Commit any previous pending delete before starting a new one */
        if (state.pendingDelete) {
            clearTimeout(state.pendingDelete.timer);
            commitDelete(state.pendingDelete.contact);
            state.pendingDelete = null;
        }

        state.dbContacts = state.dbContacts.filter(function (c) { return c.id !== contact.id; });
        render();

        var snack = dom.getElementById('snackbar');
        snack.classList.remove('hidden');
        snack.classList.add('flex', 'snack-in');

        var timer = setTimeout(function () {
            commitDelete(contact);
            state.pendingDelete = null;
            hideSnackbar();
        }, 5000);

        state.pendingDelete = { contact: contact, timer: timer };
    }

    function commitDelete(contact) {
        STORAGE.deleteContact(contact.id).then(function () {
            updateSaveAllBtn();
        }).catch(function (e) { console.error('[mBTContacts] Delete error:', e); });
    }

    function undoDelete() {
        if (!state.pendingDelete) return;
        clearTimeout(state.pendingDelete.timer);
        state.dbContacts.push(state.pendingDelete.contact);
        state.pendingDelete = null;
        hideSnackbar();
        render();
    }

    function hideSnackbar() {
        var snack = dom.getElementById('snackbar');
        snack.classList.add('hidden');
        snack.classList.remove('flex', 'snack-in');

    /* --- Save all unsaved budget contacts --- */
    function saveAllBudgetContacts() {
        var dbNames = {};
        state.dbContacts.forEach(function (c) { dbNames[(c.name || '').toLowerCase()] = true; });
        var unsaved = state.budgetCrew.filter(function (c) { return !dbNames[(c.name || '').toLowerCase()]; });
        if (unsaved.length === 0) return;
        var chain = Promise.resolve();
        unsaved.forEach(function (c) {
            chain = chain.then(function () {
                return STORAGE.saveContact({
                    name: c.name, department: c.department, email: c.email || null,
                    phone: c.phone || null, rate: c.rate || null, role: c.department,
                    category: c.department, projectId: c.projectId || null, projectName: c.projectName || null
                });
            });
        });
        chain.then(function () { return STORAGE.getAllContacts(); }).then(function (all) {
            state.dbContacts = all || [];
            updateSaveAllBtn();
            render();
        });
    }

            fileInput.addEventListener('change', function () {

                if (!file) return;
                var MAX = 5 * 1024 * 1024;
                if (file.size > MAX) { alert('File too large. Max 5MB per attachment.'); fileInput.value = ''; return; }
                var reader = new FileReader();
                reader.onload = function (ev) {
                    _modalPortfolio.push({
                        type: 'file',
                        label: file.name,
                        name: file.name,
                        mimeType: file.type,
                        size: file.size,
                        data: ev.target.result,
                        addedAt: new Date().toISOString()
                    });
                    fileInput.value = '';
                    refreshPortfolioRows();
                };
                reader.readAsDataURL(file);
            });
            /* Make the label click trigger the file input */
            var fileLabel = fileInput.nextElementSibling;
            if (fileLabel) {
                fileLabel.addEventListener('click', function () { fileInput.click(); });
            }
        }

    function saveContact() {
        var name = document.getElementById('m-name').value.trim();
        var dept = document.getElementById('m-dept').value;
        var rateStr = document.getElementById('m-rate').value;
        var rate = rateStr ? parseFloat(rateStr) : STANDARD_RATES[dept];
        var email = document.getElementById('m-email').value.trim();
        var phone = document.getElementById('m-phone').value.trim();
        var dietary = document.getElementById('m-dietary').value.trim();
        var allergies = document.getElementById('m-allergies').value.trim();
        var walletType    = (document.getElementById('m-wallet-type')    || {}).value || '';
        var walletAddress = (document.getElementById('m-wallet-address') || {}).value.trim();

        if (!name) { alert('Name is required'); return; }

        var privateContact = !!(document.getElementById('m-private') && document.getElementById('m-private').checked);

        /* Preserve existing portfolio items and merge with newly added ones */
        var existingPortfolio = [];
        if (state.editingId) {
            var existingC = state.dbContacts.find(function (c) { return c.id === state.editingId; });
            existingPortfolio = (existingC && existingC.portfolio) ? existingC.portfolio : [];
        }
        /* _modalPortfolio was rebuilt from existing items + additions in the modal */
        var finalPortfolio = _modalPortfolio.slice();

        var contact = {
            name: name, department: dept, email: email || null, phone: phone || null,
            rate: rate || null, role: dept, category: dept,
            dietaryRestrictions: dietary || null, allergies: allergies || null,
            walletType:    walletType    || null,
            walletAddress: walletAddress || null,
            portfolio:     finalPortfolio,
            privateContact: privateContact
        };
        if (state.editingId) contact.id = state.editingId;

        STORAGE.saveContact(contact).then(function () {
            /* Rate sync: dispatch to Budget Editor if editing an existing contact */
            if (state.editingId && contact.rate && window.parent !== window) {
                window.parent.postMessage({
                    type: 'mbt:tool-action',
                    action: 'update-contact-rate',
                    payload: { name: contact.name, rate: contact.rate }
                }, '*');
            }
            return STORAGE.getAllContacts();
        }).then(function (all) {
            state.dbContacts = all || [];
            closeModal();
            render();
        }).catch(function (e) {
            console.error('[mBTContacts] Save error:', e);
            alert('Error saving contact');
        });
    }

    /* --- Phase 127.B: Contact Import --- */
    function parseVCard(text) {
        var contacts = [];
        var blocks = text.split(/BEGIN:VCARD/i);
        for (var i = 1; i < blocks.length; i++) {
            var block = blocks[i];
            var fnMatch    = block.match(/^FN[^:]*:(.+)$/m);
            var telMatch   = block.match(/^TEL[^:]*:(.+)$/m);
            var emailMatch = block.match(/^EMAIL[^:]*:(.+)$/m);
            if (!fnMatch) continue;
            contacts.push({
                name:  fnMatch[1].trim(),
                phone: telMatch   ? telMatch[1].trim()   : null,
                email: emailMatch ? emailMatch[1].trim() : null
            });
        }
        return contacts;
    }

    function parseJSON(text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { return []; }
        var arr = Array.isArray(data) ? data : [data];
        return arr.filter(function (item) {
            return item && (item.name || item.FN || item.full_name);
        }).map(function (item) {
            return {
                name:       (item.name || item.FN || item.full_name || '').trim(),
                phone:      item.phone || item.tel || item.TEL || item.telephone || null,
                email:      item.email || item.EMAIL || null,
                department: item.department || item.dept || '',
                role:       item.role || item.department || item.dept || ''
            };
        });
    }

    function importContacts(file) {
        if (!file) return;
        var ext = file.name.split('.').pop().toLowerCase();
        var reader = new FileReader();
        reader.onload = function (ev) {
            var text = ev.target.result;
            var parsed = [];
            if (ext === 'vcf') parsed = parseVCard(text);
            else if (ext === 'json') parsed = parseJSON(text);
            else if (ext === 'csv') {
                /* Use service's CSV parser if available, otherwise fallback to basic */
                var _svc = (window.mBT && window.mBT.services && window.mBT.services.contacts) || window.mBTContactsService;
                if (_svc && typeof _svc.parseCSV === 'function') {
                    parsed = _svc.parseCSV(text);
                } else if (STORAGE && STORAGE.parseCSV) {
                    parsed = STORAGE.parseCSV(text);
                }
            }
            if (!parsed || !parsed.length) { walletSnack('No contacts found in file.'); return; }

            var existingNames  = {};
            var existingEmails = {};
            state.dbContacts.forEach(function (c) {
                if (c.name)  existingNames[c.name.toLowerCase()]   = true;
                if (c.email) existingEmails[c.email.toLowerCase()] = true;
            });

            var toAdd = parsed.filter(function (c) {
                if (c.name  && existingNames[c.name.toLowerCase()])   return false;
                if (c.email && existingEmails[c.email.toLowerCase()]) return false;
                return true;
            });

            if (!toAdd.length) { walletSnack('All contacts already exist — nothing imported.'); return; }

            var chain = Promise.resolve();
            toAdd.forEach(function (c) {
                chain = chain.then(function () {
                    return STORAGE.saveContact({
                        name:                c.name,
                        department:          c.department || '',
                        role:                c.role || c.department || '',
                        category:            c.department || '',
                        email:               c.email || null,
                        phone:               c.phone || null,
                        rate:                null,
                        dietaryRestrictions: null,
                        allergies:           null,
                        walletType:          null,
                        walletAddress:       null
                    });
                });
            });
            chain.then(function () {
                return STORAGE.getAllContacts();
            }).then(function (all) {
                state.dbContacts = all || [];
                render();
                walletSnack('Imported ' + toAdd.length + ' contact' + (toAdd.length !== 1 ? 's' : '') + '.');
            }).catch(function (e) {
                console.error('[mBTContacts] Import error:', e);
                walletSnack('Import failed — see console.');
            });
        };
        reader.readAsText(file);
    }

    function importFromDevice() {
        /* Mobile: use native Contact Picker API */
        if ('contacts' in navigator && 'ContactsManager' in window) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true }).then(function (results) {
                if (!results || !results.length) { walletSnack('No contacts selected.'); return; }
                var svc = (window.mBT && window.mBT.services && window.mBT.services.contacts) || window.mBTContactsService;
                var saves = results.map(function (r, i) {
                    var contact = {
                        id: 'device_' + Date.now() + '_' + i,
                        name: (r.name && r.name[0]) ? r.name[0] : 'Unknown',
                        email: (r.email && r.email[0]) ? r.email[0] : null,
                        phone: (r.tel && r.tel[0]) ? r.tel[0] : null,
                        category: 'Crew', role: '', isMe: false, source: 'device'
                    };
                    return svc ? svc.save(contact) : STORAGE.saveContact(contact);
                });
                Promise.all(saves).then(function () {
                    return STORAGE.getAllContacts();
                }).then(function (all) {
                    state.dbContacts = all || [];
                    render();
                    walletSnack('Imported ' + results.length + ' device contact' + (results.length !== 1 ? 's' : '') + '.');
                });
            }).catch(function () { walletSnack('Contact access denied or cancelled.'); });
            return;
        }

        /* Desktop: show choice modal — file import or pick from mBT roster */
        showDesktopImportModal();
    }

    function showDesktopImportModal() {
        /* Build modal overlay */
        var overlay = dom.createElement('div');
        overlay.id = 'desktop-import-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;';

        function closeOverlay() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }

        var modal = dom.createElement('div');
        modal.style.cssText = 'background:#fff;border-radius:1.25rem;padding:1.5rem;width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
        modal.innerHTML =
            '<h3 style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#0f172a;margin:0 0 4px">Import Contacts</h3>' +
            '<p style="font-size:9px;color:#94a3b8;font-weight:700;margin:0 0 16px">Choose an import source</p>' +
            '<button id="dim-file" style="width:100%;padding:12px;background:#f1f5f9;border:none;border-radius:.75rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;margin-bottom:8px;text-align:left;">Upload VCF / CSV File</button>' +
            '<button id="dim-roster" style="width:100%;padding:12px;background:#eff6ff;border:none;border-radius:.75rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;margin-bottom:16px;text-align:left;color:#1d4ed8;">Select from mBT Contacts</button>' +
            '<button id="dim-cancel" style="width:100%;padding:8px;background:none;border:none;font-size:9px;font-weight:700;color:#94a3b8;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;">Cancel</button>';

        overlay.appendChild(modal);
        dom.body.appendChild(overlay);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });

        dom.getElementById('dim-cancel').addEventListener('click', closeOverlay);

        /* Option 1: file import */
        dom.getElementById('dim-file').addEventListener('click', function () {
            closeOverlay();
            var inp = dom.getElementById('contact-import-input');
            if (inp) { inp.value = ''; inp.click(); }
        });

        /* Option 2: pick from mBT roster in parent window */
        dom.getElementById('dim-roster').addEventListener('click', function () {
            closeOverlay();
            var roster = [];
            try { roster = (window.parent && window.parent.mBTOG && window.parent.mBTOG.contacts) ? window.parent.mBTOG.contacts : []; } catch(ex) {}
            if (!roster.length) { walletSnack('No contacts in mBT roster yet. Add them via Settings first.'); return; }
            showRosterPicker(roster);
        });
    }

    function showRosterPicker(roster) {
        var overlay = dom.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;';
        function closeOverlay() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }

        var modal = dom.createElement('div');
        modal.style.cssText = 'background:#fff;border-radius:1.25rem;padding:1.25rem;width:340px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3);';

        var searchId = 'rp-search-' + Date.now();
        var listId   = 'rp-list-' + Date.now();
        modal.innerHTML =
            '<h3 style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#0f172a;margin:0 0 10px">Select Contacts</h3>' +
            '<input id="' + searchId + '" type="text" placeholder="Search..." style="width:100%;box-sizing:border-box;padding:8px 10px;background:#f1f5f9;border:none;border-radius:.625rem;font-size:10px;font-weight:700;outline:none;margin-bottom:8px;">' +
            '<div id="' + listId + '" style="overflow-y:auto;flex:1;"></div>' +
            '<div style="display:flex;gap:8px;margin-top:12px;">' +
            '<button id="rp-cancel" style="flex:1;padding:8px;background:#f1f5f9;border:none;border-radius:.625rem;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;">Cancel</button>' +
            '<button id="rp-import" style="flex:1;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:.625rem;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;">Import Selected</button>' +
            '</div>';

        overlay.appendChild(modal);
        dom.body.appendChild(overlay);

        var selected = {};

        function renderList(filter) {
            var list = dom.getElementById(listId);
            if (!list) return;
            var html = '';
            roster.forEach(function (c) {
                if (filter && (c.name || '').toLowerCase().indexOf(filter.toLowerCase()) === -1) return;
                var chk = selected[c.id] ? '#2563eb' : '#e2e8f0';
                var chkTxt = selected[c.id] ? '#fff' : '#e2e8f0';
                html += '<div data-rid="' + esc(c.id) + '" style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:.625rem;cursor:pointer;margin-bottom:4px;background:' + (selected[c.id] ? '#eff6ff' : '#fff') + ';">' +
                    '<div style="width:24px;height:24px;border-radius:50%;background:' + chk + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
                    '<span style="font-size:10px;font-weight:900;color:' + chkTxt + ';">' + (selected[c.id] ? '&#10003;' : '') + '</span></div>' +
                    '<div><div style="font-size:10px;font-weight:900;color:#0f172a;">' + esc(c.name || '') + '</div>' +
                    '<div style="font-size:9px;color:#94a3b8;font-weight:700;">' + esc(c.role || c.category || '') + '</div></div></div>';
            });
            list.innerHTML = html || '<p style="font-size:9px;color:#94a3b8;font-weight:700;text-align:center;padding:16px;">No matches</p>';
            list.querySelectorAll('[data-rid]').forEach(function (el) {
                el.addEventListener('click', function () {
                    var rid = el.getAttribute('data-rid');
                    if (selected[rid]) { delete selected[rid]; } else { selected[rid] = true; }
                    renderList(dom.getElementById(searchId) ? dom.getElementById(searchId).value : '');
                });
            });
        }

        renderList('');
        dom.getElementById(searchId).addEventListener('input', function () { renderList(this.value); });
        dom.getElementById('rp-cancel').addEventListener('click', closeOverlay);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });

        dom.getElementById('rp-import').addEventListener('click', function () {
            var ids = Object.keys(selected);
            if (!ids.length) { walletSnack('No contacts selected.'); return; }
            var toImport = roster.filter(function (c) { return selected[c.id]; });
            var chain = Promise.resolve();
            toImport.forEach(function (c) {
                chain = chain.then(function () {
                    return STORAGE.saveContact({
                        name: c.name, email: c.email || null, phone: c.phone || null,
                        role: c.role || '', category: c.category || '', department: c.department || '',
                        rate: c.rate || null, walletType: c.walletType || null, walletAddress: c.walletAddress || null
                    });
                });
            });
            chain.then(function () { return STORAGE.getAllContacts(); }).then(function (all) {
                state.dbContacts = all || [];
                render();
                closeOverlay();
                walletSnack('Imported ' + toImport.length + ' contact' + (toImport.length !== 1 ? 's' : '') + ' from mBT roster.');
            });
        });

        setTimeout(function () { var s = dom.getElementById(searchId); if (s) s.focus(); }, 50);
    }

    /* ========= Init ========= */
    dom.getElementById('btn-back').addEventListener('click', function () {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'mbt:tool-action', action: 'close-tool' }, '*');
    } else {
      /* Fallback for standalone direct-launch */
      window.location.href = '/index.html';
    }
    });

    dom.getElementById('btn-add-contact').addEventListener('click', function () { showAddContactModal(); });

    /* Phase 127.B: Contact Import Bridge Wiring */
    var importBtn = dom.getElementById('btn-import-contacts');
    var importInput = dom.getElementById('contact-import-input');
    if (importBtn && importInput) {
        importBtn.addEventListener('click', function () {
            importInput.value = ''; /* Reset so same file can be re-selected */
            importInput.click();
        });
        importInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files.length > 0 && typeof mBTContacts !== 'undefined') {
                mBTContacts.importContacts(e.target.files[0]);
            }
        });
    }
    dom.getElementById('btn-save-all').addEventListener('click', saveAllBudgetContacts);
    dom.getElementById('btn-import-device').addEventListener('click', importFromDevice);
    dom.getElementById('btn-catering').addEventListener('click', openCateringSummary);
    dom.getElementById('btn-print').addEventListener('click', printDirectory);
    dom.getElementById('snackbar-undo').addEventListener('click', undoDelete);

    var searchTimeout = null;
    dom.getElementById('contact-search').addEventListener('input', function () {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(render, 250);
    });

    load();

    /* --- Public API --- */
    return {
        setTab: setTab,
        setDept: setDept,
        showAddContactModal: showAddContactModal,
        editContact: editContact,
        render: render,
        importContacts: importContacts
    };
})();
</script>
</body>
</html>
