<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mBT Cloud Backup</title>
  <script src="../../lib/tailwind.min.js"></script>
  <script src="../../core/components/EmbeddedMode.js"></script>
  <style>
    .sync-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    body.embedded .max-w-4xl { max-width: 100%; }
    body.embedded .p-6 { padding: 12px; }
    body.embedded h1 { font-size: 1.1rem; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">

    <!-- Header -->
    <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold text-gray-900">Cloud Backup</h1>
        <div id="syncStatus" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-700">Disconnected</div>
      </div>

      <!-- Configuration -->
      <div class="bg-gray-50 rounded-lg p-4 border">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Supabase Configuration</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Project URL</label>
            <input type="text" id="supabaseUrl"
              class="w-full px-3 py-2 border rounded-md text-sm"
              placeholder="https://your-project.supabase.co">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Anon Key</label>
            <input type="password" id="supabaseKey"
              class="w-full px-3 py-2 border rounded-md text-sm"
              placeholder="Your anon key">
          </div>
        </div>
        <div class="mt-3 flex items-center justify-between">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" id="syncEnabled" class="rounded border-gray-300">
            <span class="text-sm text-gray-700">Enable Auto-Sync (hourly)</span>
          </label>
          <button onclick="saveConfig()"
            class="px-4 py-2 bg-gray-800 text-white rounded-lg text-sm hover:bg-gray-900 transition-colors">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Actions</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <button onclick="syncPush()"
          class="px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium text-sm">
          Push to Cloud
        </button>
        <button onclick="syncPull()"
          class="px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium text-sm">
          Pull from Cloud
        </button>
        <button onclick="exportData()"
          class="px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium text-sm">
          Export JSON
        </button>
      </div>
    </div>

    <!-- Statistics -->
    <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Statistics</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="text-center p-4 bg-blue-50 rounded-lg">
          <div id="syncCount" class="text-2xl font-bold text-blue-600">0</div>
          <div class="text-xs text-gray-500 mt-1">Total Syncs</div>
        </div>
        <div class="text-center p-4 bg-green-50 rounded-lg">
          <div id="lastSync" class="text-lg font-bold text-green-600">Never</div>
          <div class="text-xs text-gray-500 mt-1">Last Sync</div>
        </div>
        <div class="text-center p-4 bg-purple-50 rounded-lg">
          <div id="localRecords" class="text-2xl font-bold text-purple-600">—</div>
          <div class="text-xs text-gray-500 mt-1">Local Records</div>
        </div>
        <div class="text-center p-4 bg-yellow-50 rounded-lg">
          <div id="cloudStatus" class="text-sm font-bold text-yellow-600">Not tested</div>
          <div class="text-xs text-gray-500 mt-1">Cloud</div>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="bg-white rounded-lg shadow-sm border p-6">
      <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Sync Log</h2>
      <div id="logs" class="h-48 bg-gray-900 rounded-lg p-4 overflow-y-auto font-mono text-sm text-green-400"></div>
    </div>

  </div>

  <script src="../../scripts/storage.js"></script>
  <script src="../../config/supabase.js"></script>
  <script src="../../services/supabase-sync.js"></script>
  <script>
var dom = (document && document.currentScript && document.currentScript.getRootNode) ? document.currentScript.getRootNode() : document;
if (dom === document && window.shadowRoot) dom = window.shadowRoot;

    /* ========= v1.0 Supabase Tool Controller v2.0 ========= */

    var syncCount = parseInt(localStorage.getItem('mbt_sync_count') || '0', 10);

    /* --- Config persistence using localStorage per security protocol --- */
    function saveConfig() {
        var url = dom.getElementById('supabaseUrl').value.trim();
        var key = dom.getElementById('supabaseKey').value.trim();
        var enabled = dom.getElementById('syncEnabled').checked;

        localStorage.setItem('mbt_supabase_url', url);
        localStorage.setItem('mbt_supabase_key', key);
        localStorage.setItem('mbt_supabase_sync_enabled', enabled ? 'true' : 'false');

        updateSyncStatus();
        addLog('Configuration saved.');
    }

    function updateSyncStatus() {
        var url  = localStorage.getItem('mbt_supabase_url') || '';
        var key  = localStorage.getItem('mbt_supabase_key') || '';
        var el   = dom.getElementById('syncStatus');

        if (!url || !key) {
            el.textContent = 'Not Configured';
            el.className   = 'px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-700';
        } else {
            el.textContent = 'Connected';
            el.className   = 'px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-700 sync-pulse';
        }
    }

    /* --- Count all local records across stores --- */
    async function countLocalRecords() {
        var s = window.mBT.storage;
        var projects   = (await s.getAllProjects()).length;
        var stages     = (await s.getAllStages()).length;
        var ogItems    = (await s.getAllOGItems()).length;
        var db         = await s.getDb();

        function countStore(storeName) {
            return new Promise(function (resolve) {
                var st  = db.transaction(storeName, 'readonly').objectStore(storeName);
                var req = st.count();
                req.onsuccess = function () { resolve(req.result || 0); };
                req.onerror   = function () { resolve(0); };
            });
        }

        var contacts = await countStore('contacts');
        var sessions = await countStore('sessions');

        return projects + stages + ogItems + contacts + sessions;
    }

    async function syncPush() {
        if (!window.mBTSupabaseConfig.isConfigured()) {
            addLog('Configuration required — set URL and Key first.');
            return;
        }
        addLog('Pushing local data to Supabase...');
        try {
            var result = await window.mBTSync.pushAll();
            syncCount++;
            localStorage.setItem('mbt_sync_count', syncCount);
            dom.getElementById('syncCount').textContent = syncCount;
            dom.getElementById('lastSync').textContent  = new Date().toLocaleTimeString();
            dom.getElementById('cloudStatus').textContent = 'Synced';
            addLog('Push complete: ' + result.synced + ' records, ' + result.errors + ' errors.');
        } catch (e) {
            addLog('Push failed: ' + e.message);
        }
    }

    async function syncPull() {
        if (!window.mBTSupabaseConfig.isConfigured()) {
            addLog('Configuration required — set URL and Key first.');
            return;
        }
        addLog('Pulling data from Supabase...');
        try {
            var result = await window.mBTSync.pullAll();
            dom.getElementById('lastSync').textContent  = new Date().toLocaleTimeString();
            dom.getElementById('cloudStatus').textContent = 'Pulled';
            addLog('Pull complete: ' + result.pulled + ' new records, ' + result.errors + ' errors.');
            await refreshLocalCount();
        } catch (e) {
            addLog('Pull failed: ' + e.message);
        }
    }

    async function exportData() {
        addLog('Preparing JSON export...');
        try {
            var jsonStr = await window.mBTSync.exportData();
            var blob    = new Blob([jsonStr], { type: 'application/json' });
            var url     = URL.createObjectURL(blob);
            var a       = document.createElement('a');
            a.href      = url;
            a.download  = 'mBT-backup-' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            addLog('Export downloaded successfully.');
        } catch (e) {
            addLog('Export failed: ' + e.message);
        }
    }

    async function refreshLocalCount() {
        var count = await countLocalRecords();
        dom.getElementById('localRecords').textContent = count.toLocaleString();
    }

    function addLog(message) {
        var el        = dom.getElementById('logs');
        var timestamp = new Date().toLocaleTimeString();
        var line      = document.createElement('div');
        line.textContent = '[' + timestamp + '] ' + message;
        line.className   = message.startsWith('Push') || message.startsWith('Pull') || message.startsWith('Export') || message.startsWith('Config') ? 'text-green-400' :
                           message.toLowerCase().includes('fail') || message.toLowerCase().includes('error') ? 'text-red-400' : 'text-yellow-300';
        el.appendChild(line);
        if (el.children.length > 50) el.removeChild(el.firstChild);
        el.scrollTop = el.scrollHeight;
    }

    /* --- Init --- */
    async function init() {
        /* --- Restore saved credentials to inputs --- */
        var savedUrl = localStorage.getItem('mbt_supabase_url') || '';
        var savedKey = localStorage.getItem('mbt_supabase_key') || '';
        var savedSync = localStorage.getItem('mbt_supabase_sync_enabled') !== 'false';

        dom.getElementById('supabaseUrl').value   = savedUrl;
        dom.getElementById('supabaseKey').value   = savedKey;
        dom.getElementById('syncEnabled').checked = savedSync;
        dom.getElementById('syncCount').textContent = syncCount;

        updateSyncStatus();
        await refreshLocalCount();
        addLog('Cloud Backup initialized.');
    }

    init();
  </script>
</body>
</html>
