<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mBT — Test Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }

        .sub {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .suite {
            background: #1e293b;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .suite-title {
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: #93c5fd;
        }

        .test {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1e293b;
        }

        .test:last-child {
            border-bottom: none;
        }

        .pass {
            color: #4ade80;
        }

        .fail {
            color: #f87171;
        }

        .skip {
            color: #fbbf24;
        }

        .icon {
            width: 1.25rem;
            text-align: center;
            font-weight: 900;
        }

        .label {
            flex: 1;
            font-size: 0.9rem;
        }

        .error-detail {
            color: #fca5a5;
            font-size: 0.8rem;
            margin-left: 2rem;
            font-family: monospace;
        }

        #summary {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #1e293b;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 2rem;
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .bar {
            flex: 1;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .bar-pass {
            background: #4ade80;
        }

        .bar-fail {
            background: #f87171;
        }
    </style>
</head>

<body>

    <h1>🐄 mBT Test Runner</h1>
    <p class="sub">Vanilla JS unit tests for core engines — Open via file:// to verify offline functionality.</p>

    <div id="results"></div>
    <div id="summary"></div>

    <!-- Load core modules under test -->
    <script src="../src/scripts/storage.js"></script>
    <script src="../src/scripts/engine/mbtle.js"></script>
    <script src="../src/scripts/engine/totalizer.js"></script>
    <script src="../src/core/blueprints.js"></script>
    <!-- External Test Suites -->
    <script src="storage-test-suite.js"></script>
    <script src="math-test-suite.js"></script>

    <script>
        (function () {
            'use strict';

            const results = [];
            let passed = 0;
            let failed = 0;
            let skipped = 0;

            function assert(condition, message) {
                if (!condition) throw new Error(message || 'Assertion failed');
            }

            function assertEqual(actual, expected, message) {
                if (actual !== expected) {
                    throw new Error((message || 'assertEqual') + ` — expected: ${JSON.stringify(expected)}, got: ${JSON.stringify(actual)}`);
                }
            }

            function assertClose(actual, expected, tolerance, message) {
                if (Math.abs(actual - expected) > tolerance) {
                    throw new Error((message || 'assertClose') + ` — expected ~${expected} (±${tolerance}), got ${actual}`);
                }
            }

            function test(suite, name, fn) {
                try {
                    fn();
                    results.push({ suite, name, status: 'pass' });
                    passed++;
                } catch (e) {
                    results.push({ suite, name, status: 'fail', error: e.message });
                    failed++;
                }
            }

            function skip(suite, name) {
                results.push({ suite, name, status: 'skip' });
                skipped++;
            }

            // =====================================================
            // SUITE 1: window.mBT Namespace
            // =====================================================
            test('Namespace', 'window.mBT exists', () => {
                assert(typeof window.mBT === 'object', 'window.mBT should be an object');
            });

            test('Namespace', 'mBT.storage exists', () => {
                assert(typeof window.mBT.storage === 'object', 'mBT.storage should be an object');
            });

            test('Namespace', 'mBT.le (MBTLE) exists', () => {
                assert(typeof window.mBT.le === 'object', 'mBT.le should be an object');
            });

            test('Namespace', 'mBT.totalizer exists', () => {
                assert(typeof window.mBT.totalizer === 'object', 'mBT.totalizer should be an object');
            });

            test('Namespace', 'mBT.blueprints exists', () => {
                assert(typeof window.mBT.blueprints === 'object', 'mBT.blueprints should be an object');
            });

            // =====================================================
            // SUITE 2: MBTLE (Logic Engine)
            // =====================================================
            const LE = window.mBT.le;

            test('MBTLE', 'formatCurrency returns formatted string', () => {
                const result = LE.formatCurrency(1234.56);
                assert(typeof result === 'string', 'Result should be a string');
                assert(result.includes('1'), 'Should contain digits');
            });

            test('MBTLE', 'formatCurrency handles zero', () => {
                const result = LE.formatCurrency(0);
                assert(typeof result === 'string', 'Zero should return a string');
            });

            test('MBTLE', 'formatCurrency handles negative', () => {
                const result = LE.formatCurrency(-500);
                assert(typeof result === 'string', 'Negative should return a string');
            });

            test('MBTLE', 'calculatePercentage correct', () => {
                if (!LE.calculatePercentage) { skip('MBTLE', 'calculatePercentage not implemented'); return; }
                assertClose(LE.calculatePercentage(25, 100), 25, 0.01, 'Should be 25%');
            });

            test('MBTLE', 'calculatePercentage divide by zero', () => {
                if (!LE.calculatePercentage) { skip('MBTLE', 'calculatePercentage not implemented'); return; }
                assertEqual(LE.calculatePercentage(10, 0), 0, 'Divide by zero should return 0');
            });

            // =====================================================
            // SUITE 3: Totalizer Engine
            // =====================================================
            const TOTALIZER = window.mBT.totalizer;

            test('Totalizer', 'reconcile returns object with grandTotal', () => {
                const project = { total_budget: 50000, categories: {} };
                const result = TOTALIZER.reconcile(project);
                assert(result !== null && typeof result === 'object', 'Should return an object');
                assert(typeof result.grandTotal === 'number', 'grandTotal should be a number');
            });

            test('Totalizer', 'reconcile sums category amounts', () => {
                const project = {
                    total_budget: 100000,
                    categories: {
                        cat_a: { name: 'A', amount: 30000, items: [] },
                        cat_b: { name: 'B', amount: 20000, items: [] },
                    }
                };
                const result = TOTALIZER.reconcile(project);
                assertEqual(result.grandTotal, 50000, 'Grand total should be sum of categories');
            });

            test('Totalizer', 'reconcile with empty categories', () => {
                const project = { total_budget: 10000, categories: {} };
                const result = TOTALIZER.reconcile(project);
                assertEqual(result.grandTotal, 0, 'Empty categories should total 0');
            });

            test('Totalizer', 'reconcile handles missing categories gracefully', () => {
                const project = { total_budget: 10000 };
                const result = TOTALIZER.reconcile(project);
                assert(typeof result.grandTotal === 'number', 'Should not crash on missing categories');
            });

            test('Totalizer', 'reconcile calculates contingency', () => {
                const project = {
                    total_budget: 100000,
                    contingency_pct: 10,
                    categories: {
                        cat_a: { name: 'A', amount: 50000, items: [] },
                    }
                };
                const result = TOTALIZER.reconcile(project);
                assert(typeof result.contingency === 'number', 'contingency should be a number');
            });

            // =====================================================
            // SUITE 4: Blueprints
            // =====================================================
            const BP = window.mBT.blueprints;

            test('Blueprints', 'getTemplates returns array', () => {
                if (!BP.getTemplates) { skip('Blueprints', 'getTemplates not implemented'); return; }
                const templates = BP.getTemplates();
                assert(Array.isArray(templates), 'Should return an array');
                assert(templates.length > 0, 'Should have at least 1 template');
            });

            test('Blueprints', 'generateBudgetFromTemplate returns object', () => {
                const result = BP.generateBudgetFromTemplate('commercial', 50000);
                assert(result !== null && typeof result === 'object', 'Should return a budget object');
            });

            test('Blueprints', 'generateBudgetFromTemplate has categories', () => {
                const result = BP.generateBudgetFromTemplate('commercial', 50000);
                assert(result.categories !== undefined, 'Should have categories');
                assert(Object.keys(result.categories).length > 0, 'Should have at least 1 category');
            });

            test('Blueprints', 'hydrateBudget enriches the budget', () => {
                const raw = BP.generateBudgetFromTemplate('commercial', 50000);
                const hydrated = BP.hydrateBudget(raw);
                assert(hydrated !== null, 'Hydrated result should not be null');
                assert(typeof hydrated.categories === 'object', 'Hydrated budget should have categories');
            });

            test('Blueprints', 'generateBudgetFromTemplate with zero budget', () => {
                const result = BP.generateBudgetFromTemplate('commercial', 0);
                assert(result !== null, 'Should handle zero budget gracefully');
            });

            // =====================================================
            // SUITE 5: Storage Module (smoke tests)
            // =====================================================
            const STORAGE = window.mBT.storage;

            test('Storage', 'storage object has _getDb', () => {
                assert(typeof STORAGE._getDb === 'function', '_getDb should be a function');
            });

            test('Storage', 'storage has CRUD methods for projects', () => {
                assert(typeof STORAGE.createProject === 'function', 'createProject missing');
                assert(typeof STORAGE.getProject === 'function', 'getProject missing');
                assert(typeof STORAGE.updateProject === 'function', 'updateProject missing');
                assert(typeof STORAGE.deleteProject === 'function', 'deleteProject missing');
                assert(typeof STORAGE.getAllProjects === 'function', 'getAllProjects missing');
            });

            test('Storage', 'storage has CRUD methods for stages', () => {
                assert(typeof STORAGE.createStage === 'function', 'createStage missing');
                assert(typeof STORAGE.getStage === 'function', 'getStage missing');
                assert(typeof STORAGE.updateStage === 'function', 'updateStage missing');
                assert(typeof STORAGE.deleteStage === 'function', 'deleteStage missing');
            });

            test('Storage', 'storage has CRUD methods for executions', () => {
                assert(typeof STORAGE.createExecution === 'function', 'createExecution missing');
                assert(typeof STORAGE.getExecution === 'function', 'getExecution missing');
                assert(typeof STORAGE.updateExecution === 'function', 'updateExecution missing');
                assert(typeof STORAGE.deleteExecution === 'function', 'deleteExecution missing');
            });

            test('Storage', 'storage has OG_REF methods', () => {
                assert(typeof STORAGE.createOGItem === 'function', 'createOGItem missing');
                assert(typeof STORAGE.getAllOGItems === 'function', 'getAllOGItems missing');
            });

            test('Storage', 'storage utility methods exist', () => {
                assert(typeof STORAGE.getTotalBudget === 'function', 'getTotalBudget missing');
                assert(typeof STORAGE.getTotalAllocated === 'function', 'getTotalAllocated missing');
                assert(typeof STORAGE.getTotalCompleted === 'function', 'getTotalCompleted missing');
                assert(typeof STORAGE.getTotalExecutionCost === 'function', 'getTotalExecutionCost missing');
            });

            // =====================================================
            // SUITE 6: Security (XSS Sanitization)
            // =====================================================
            test('Security', 'escapeHtml prevents XSS in template literals', () => {
                // Simulate the escapeHtml used in db_full
                function escapeHtml(str) {
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                }
                const dangerous = '<' + 'script>alert("xss")<' + '/script>';
                const safe = escapeHtml(dangerous);
                assert(!safe.includes('\\x3Cscript>'), 'Should escape script tags');
                assert(safe.includes('&lt;script&gt;'), 'Should convert to entities');
            });

            test('Security', 'escapeHtml handles edge cases', () => {
                function escapeHtml(str) {
                    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }
                assertEqual(escapeHtml(''), '', 'Empty string');
                assertEqual(escapeHtml('hello'), 'hello', 'Plain text');
                assert(escapeHtml('a & b').includes('&amp;'), 'Should escape ampersand');
            });

            // =====================================================
            // SUITE 7: External Suites
            // =====================================
            (async function runExternalSuites() {
                // 1. Run Storage Tests
                if (window.mBT.tests && window.mBT.tests.storage && window.mBT.tests.storage.runAll) {
                    const storageResults = await window.mBT.tests.storage.runAll();
                    storageResults.tests.forEach(t => {
                        results.push({ suite: 'Storage (External)', name: t.name, status: t.passed ? 'pass' : 'fail', error: t.message });
                        if (t.passed) passed++; else failed++;
                    });
                }

                // 2. Run Math Tests
                if (window.mBT.tests && window.mBT.tests.math && window.mBT.tests.math.runAll) {
                    const mathResults = window.mBT.tests.math.runAll();
                    mathResults.tests.forEach(t => {
                        results.push({ suite: 'Math (External)', name: t.name, status: t.passed ? 'pass' : 'fail', error: t.message });
                        if (t.passed) passed++; else failed++;
                    });
                }

                // Final Render
                renderResults();
                renderSummary();
            })();

            function renderResults() {
                const container = document.getElementById('results');
                container.innerHTML = '';
                const suites = {};

                results.forEach(r => {
                    if (!suites[r.suite]) suites[r.suite] = [];
                    suites[r.suite].push(r);
                });

                Object.keys(suites).forEach(suiteName => {
                    const section = document.createElement('div');
                    section.className = 'suite';

                    const title = document.createElement('div');
                    title.className = 'suite-title';
                    title.textContent = suiteName;
                    section.appendChild(title);

                    suites[suiteName].forEach(t => {
                        const row = document.createElement('div');
                        row.className = 'test';

                        const icon = document.createElement('span');
                        icon.className = 'icon ' + t.status;
                        icon.textContent = t.status === 'pass' ? '✓' : t.status === 'fail' ? '✗' : '⊘';
                        row.appendChild(icon);

                        const label = document.createElement('span');
                        label.className = 'label ' + t.status;
                        label.textContent = t.name;
                        row.appendChild(label);

                        section.appendChild(row);

                        if (t.error) {
                            const detail = document.createElement('div');
                            detail.className = 'error-detail';
                            detail.textContent = t.error;
                            section.appendChild(detail);
                        }
                    });

                    container.appendChild(section);
                });
            }

            function renderSummary() {
                const total = passed + failed + skipped;
                const pct = total > 0 ? Math.round((passed / total) * 100) : 0;
                const summaryEl = document.getElementById('summary');
                summaryEl.innerHTML = `
        <div class="stat">
          <div class="stat-num pass">${passed}</div>
          <div class="stat-label">Passed</div>
        </div>
        <div class="stat">
          <div class="stat-num fail">${failed}</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat">
          <div class="stat-num skip">${skipped}</div>
          <div class="stat-label">Skipped</div>
        </div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;">
            <span style="font-size:0.8rem;color:#94a3b8;">Coverage (approx)</span>
            <span style="font-size:0.8rem;font-weight:700;color:${pct >= 80 ? '#4ade80' : '#fbbf24'};">${pct}%</span>
          </div>
          <div class="bar">
            <div class="bar-fill ${pct >= 80 ? 'bar-pass' : 'bar-fail'}" style="width:${pct}%"></div>
          </div>
        </div>
      `;

                console.log(`[mBT Test Runner] ${passed}/${total} passed (${pct}%)`);
            }

        })();
    </script>

</body>

</html>
