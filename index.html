    window.renderStageDatabaseList = function (items, stageKey, targetSectionName) {
        if (!items.length) return `<div class="p-4 text-center text-xs text-gray-400">No matches.</div>`;
        return items.map(item => `
            <div onclick="${item.isExisting ? `assignItemToStage('${RenderEngine.esc(item.id)}', '${RenderEngine.esc(stageKey)}')` : `addStageItemToBudget('${RenderEngine.esc(item.description)}', ${item.rate}, '${RenderEngine.esc(item.unit)}', '${RenderEngine.esc(stageKey)}', '${RenderEngine.esc(targetSectionName)}')`}" 
                 class="p-3 border-b bg-white hover:bg-blue-50 cursor-pointer flex justify-between items-center group">
                <div><div class="text-sm font-bold text-gray-700">${item.description}</div>${item.isExisting ? `<div class="text-[9px] text-emerald-600 font-bold">LINK FROM: ${item.sectionName}</div>` : ''}</div>
                <div class="font-mono text-xs text-gray-500 font-bold">${mBTLE.format.currency(item.rate)}</div>
            </div>`).join('');
    };

    window.assignItemToStage = function (itemId, stageKey) {
        let item = null;
        Object.values(budget.sections).forEach(sec => { if (!item) item = sec.items.find(i => i.id === itemId); });
        if (item) {
            if (!item.stageData) item.stageData = {};
            if (!item.stageData[stageKey]) {
                item.stageData[stageKey] = { days: 1, rate: item.rate || 0 };
                saveBudget();
                mBTME.close('stageAddModal');
                if (document.getElementById('stagesViewModal')) window.showStagesModal();
                mBTLE.reconcile();
            }
        }
    };

    window.addStageItemToBudget = function (desc, rate, unit, stageKey, targetSectionName) {
        const newItem = { id: crypto.randomUUID(), description: desc, quantity: 1, unit, multiplier: 1, rate, actual: 0, rateType: 'negotiable', stageData: {} };
        newItem.stageData[stageKey] = { days: 1, rate };
        if (budget.sections[targetSectionName]) {
            budget.sections[targetSectionName].items.push(newItem);
            mBTME.close('stageAddModal');
            saveBudget();
            if (document.getElementById('stagesViewModal')) window.showStagesModal();
            if (typeof render === 'function') render();
        }
    };

    // Stage Drag & Drop
    window.handleStageDragStart = (e, itemId, sourceStage) => { e.dataTransfer.setData('text/plain', JSON.stringify({ itemId, sourceStage })); };
    window.handleStageDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    window.handleStageDrop = (e, targetStage) => {
        e.preventDefault();
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        const { itemId, sourceStage } = data;
        if (sourceStage === targetStage) return;
        let item = null;
        Object.values(budget.sections).forEach(sec => { if (!item) item = sec.items.find(i => i.id === itemId); });
        if (item && item.stageData && item.stageData[sourceStage]) {
            item.stageData[targetStage] = { ...item.stageData[sourceStage] }; // Clone to new stage
            saveBudget();
            showStagesModal();
        }
    };

    window.updateStageItem = function (itemId, sectionName, stageKey, field, value, isRealTime = false) {
        const item = budget.sections[sectionName]?.items.find(i => i.id === itemId);
        if (item && item.stageData && item.stageData[stageKey]) {
            item.stageData[stageKey][field] = parseFloat(value) || 0;

            // Surgical Paint: Update Card Cost Immediately
            const days = item.stageData[stageKey].days || 0;
            const rate = item.stageData[stageKey].rate || 0;
            const cost = days * rate;
            const costEl = document.getElementById(`cost-${itemId}-${stageKey}`);
            if (costEl) costEl.innerText = mBTLE.format.currency(cost);

            // Update Headers & Main Budget
            if (typeof window.updateAllHeaders === 'function') window.updateAllHeaders();
            mBTLE.reconcile();
            if (typeof mBT.ui.paint === 'function') mBT.ui.paint();

            // Save Strategy: Debounce if realtime
            if (isRealTime) {
                if (mBT.features.stages.state._timer) clearTimeout(mBT.features.stages.state._timer);
                mBT.features.stages.state._timer = setTimeout(saveBudget, 1000);
            } else {
                // Fix: Clear any pending debounce to prevent double-save on blur
                if (mBT.features.stages.state._timer) clearTimeout(mBT.features.stages.state._timer);
                saveBudget();
            }
        }
    };

    window.handleStageBulkAction = function (action) {
        const validKeys = ['dev', 'pre', 'prod', 'post', 'dist'];
        if (action === 'lockAll' || action === 'unlockAll') {
            validKeys.forEach(k => budget.targetLock.stages[k].locked = (action === 'lockAll'));
            saveBudget();
            window.showStagesModal();
        } else if (action === 'syncDays') {
            mBTME.confirm("Sync Duration", "Overwrite individual item days with Stage settings?", () => {
                validKeys.forEach(k => {
                    const d = budget.targetLock.stages[k].days;
                    if (d > 0) Object.values(budget.sections).forEach(s => s.items.forEach(i => { if (i.stageData?.[k]) i.stageData[k].days = d; }));
                });
                saveBudget();
                window.showStagesModal();
            });
        }
    };

    // --- TIER 5 UPGRADE: Manual Duration Handler (Phase 2 Fix) ---
    window.updateStageDuration = function (stageKey, value) {
        if (!budget || !budget.targetLock || !budget.targetLock.stages) return;

        // 1. Update Data Model — create key if Stages tool hasn't visited it yet
        const days = parseFloat(value) || 0;
        if (!budget.targetLock.stages[stageKey]) {
            budget.targetLock.stages[stageKey] = { label: stageKey.toUpperCase(), ratio: 20, days: 0, locked: false };
        }
        budget.targetLock.stages[stageKey].days = days;

        // 2. Persist
        saveBudget();

        // 3. Trigger Temporal Engine (Updates Dates instantly)
        if (typeof window.updateAllHeaders === 'function') window.updateAllHeaders();

        // 4. Update Logic Engine (Burn Rates)
        if (typeof mBTLE !== 'undefined') mBTLE.reconcile();
    };

    // --- TIER 5 UPGRADE: Smart Sync Controller ---
    window.syncStageDays = function (stageKey) {
        // 1. Ask Tier 3 for the Truth
        const validation = mBT.logic.stages.validateTimeline(stageKey);

        if (validation.maxNeeded > 0) {
            // 2. Update the Governor (User Input) to match Reality
            if (!budget.targetLock.stages[stageKey]) return;

            budget.targetLock.stages[stageKey].days = validation.maxNeeded;

            // 3. Persist & Refresh
            saveBudget();
            mBTLE.reconcile(); // Recalc burn rates

            // 4. Update UI (Removes Red Warning)
            if (document.getElementById('stagesViewModal')) window.showStagesModal();
        } else {
            mBTME.alert("Sync Info", "No scheduled items found in this stage to sync with.");
        }
    };

    // --- NEW: Smart Auto-Fill Logic (Tier 5 Bridge) ---
    window.handleStageAutoFill = function (stageKey, mode = 'link') {
        const stageLabel = (budget.targetLock && budget.targetLock.stages[stageKey]) ? budget.targetLock.stages[stageKey].label : stageKey.toUpperCase();
        let count = 0;

        if (mode === 'link') {
            const matches = mBT.features.stages.logic.findMatchesInBudget(stageKey);
            if (matches.length === 0) return mBTME.alert("No Matches", "No matching items found to link.");

            matches.forEach(item => {
                if (!item.stageData) item.stageData = {};
                item.stageData[stageKey] = { days: 1, rate: item.rate };
                count++;
            });
        }
        else if (mode === 'generate') {
            const missing = mBT.features.stages.logic.findMissingEssentials(stageKey);
            if (missing.length === 0) return mBTME.alert("Complete", "No missing essentials found.");

            // Determine target section
            const sectionNames = Object.keys(budget.sections);
            let targetSec = sectionNames.find(s => s.toLowerCase().includes('production')) || sectionNames[0];
            if (stageKey === 'post') targetSec = sectionNames.find(s => /post|edit/.test(s.toLowerCase())) || targetSec;
            else if (stageKey === 'dev') targetSec = sectionNames.find(s => /dev|creative/.test(s.toLowerCase())) || targetSec;

            if (!budget.sections[targetSec]) return mBTME.alert("Error", "Target section not found.");

            missing.forEach(dbItem => {
                const newItem = {
                    id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                    description: dbItem.description,
                    quantity: 1,
                    unit: dbItem.unit,
                    rate: dbItem.rate,
                    multiplier: 1,
                    actual: 0,
                    rateType: 'negotiable',
                    stageData: {}
                };
                newItem.stageData[stageKey] = { days: 1, rate: dbItem.rate };
                budget.sections[targetSec].items.push(newItem);
                count++;
            });
        }

        if (count > 0) {
            saveBudget();
            mBTLE.reconcile();
            if (document.getElementById('stagesViewModal')) window.showStagesModal();
            mBTME.alert("Auto-Fill Complete", `${count} items processed for ${stageLabel}.`);
        }
    };

    window.handleStageBulkAutoFill = function () {
        mBTME.confirm("Smart Scan", "Auto-populate ALL stages with existing budget items?", () => {
            let total = 0;
            const validKeys = ['dev', 'pre', 'prod', 'post', 'dist'];

            validKeys.forEach(k => {
                const matches = mBT.features.stages.logic.findMatchesInBudget(k);
                matches.forEach(item => {
                    if (!item.stageData) item.stageData = {};
                    item.stageData[k] = { days: 1, rate: item.rate };
                    total++;
                });
            });

            if (total > 0) {
                saveBudget();
                mBTLE.reconcile();
                window.showStagesModal();
                mBTME.alert("Scan Complete", `Smart Scan Linked ${total} items.`);
            } else {
                mBTME.alert("Scan Complete", "No new matches found.");
            }
        });
    };

    /* Phase 94.2: const/let/arrow → ES5 */
    window.importContactsCSV = function (input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            var text = e.target.result;
            if (!text) return;
            var lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return mBTME.alert('Error', 'Invalid CSV format.');
            var headers = lines[0].split(',').map(function (h) { return h.trim(); });
            var contacts = [];
            for (var i = 1; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;
                var values = line.split(',');
                var obj = {};
                headers.forEach(function (h, idx) {
                    var val = values[idx] ? values[idx].trim() : '';
                    if (val.charAt(0) === '"' && val.charAt(val.length - 1) === '"') val = val.slice(1, -1);
                    obj[h] = val;
                });
                contacts.push(obj);
            }
            var count = mBTOG.ingest(contacts, 'contact');
            if (count > 0) {
                mBTME.alert('Success', count + ' new contacts imported.', function () {
                    if (typeof showSettingsModal === 'function') showSettingsModal('database', 'contacts');
                });
            } else {
                mBTME.alert('Info', 'Import completed. No new contacts added.');
            }
            input.value = '';
        };
        reader.readAsText(file);
    };

        /* --- Phase 66: Command Palette Engine --- */
        (function () {
            var _open = false;

            function openPalette() {
                var el = document.getElementById('cmdPalette');
                if (!el) return;
                _open = true;
                el.classList.remove('hidden');
                var inp = document.getElementById('cmdInput');
                if (inp) { inp.value = ''; inp.focus(); }
                renderResults('');
            }

            function closePalette() {
                var el = document.getElementById('cmdPalette');
                if (el) el.classList.add('hidden');
                _open = false;
            }

            function renderResults(query) {
                var ul = document.getElementById('cmdResults');
                var hint = document.getElementById('cmdHint');
                if (!ul) return;
                if (!budget || !budget.sections) { ul.innerHTML = ''; return; }
                var q = (query || '').trim().toLowerCase();
                var results = [];
                Object.keys(budget.sections).forEach(function (secKey) {
                    var sec = budget.sections[secKey];
                    if (!sec || !sec.items) return;
                    sec.items.forEach(function (item) {
                        var desc = (item.description || '').toLowerCase();
                        var crew = (item.crew && item.crew.name ? item.crew.name : '').toLowerCase();
                        if (!q || desc.indexOf(q) !== -1 || crew.indexOf(q) !== -1 || secKey.toLowerCase().indexOf(q) !== -1) {
                            results.push({ secKey: secKey, item: item });
                        }
                    });
                });
                if (results.length === 0) {
                    ul.innerHTML = '<li class="px-4 py-3 text-slate-500 text-[11px] text-center uppercase tracking-widest">No results</li>';
                    if (hint) hint.textContent = 'No results';
                    return;
                }
                var html = '';
                var limit = Math.min(results.length, 40);
                for (var i = 0; i < limit; i++) {
                    var r = results[i];
                    html += '<li data-result-id="' + esc(r.item.id) + '" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer hover:bg-white/10 transition-colors">' +
                        '<div class="flex flex-col min-w-0">' +
                        '<span class="text-white text-[12px] font-bold truncate">' + esc(r.item.description || 'Untitled') + '</span>' +
                        '<span class="text-slate-400 text-[10px] font-black uppercase tracking-widest">' + esc(r.secKey) + (r.item.crew && r.item.crew.name ? ' &mdash; ' + esc(r.item.crew.name) : '') + '</span>' +
                        '</div>' +
                        '</li>';
                }
                if (results.length > 40) html += '<li class="px-4 py-2 text-slate-500 text-[10px] text-center">+ ' + (results.length - 40) + ' more &mdash; refine your search</li>';
                ul.innerHTML = html;
                if (hint) hint.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');
            }

            // Bind listeners immediately (elements are already in DOM at script execution)
            var overlay = document.getElementById('cmdPalette');
            var inp = document.getElementById('cmdInput');
            var ul = document.getElementById('cmdResults');
            if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) closePalette(); });
            if (inp) inp.addEventListener('input', function () { renderResults(inp.value); });
            if (ul) ul.addEventListener('click', function (e) {
                var li = e.target.closest('[data-result-id]');
                if (!li) return;
                var row = document.querySelector('[data-id="' + li.dataset.resultId + '"]');
                if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                closePalette();
            });
            document.body.addEventListener('keydown', function (e) {
                if (_open && e.key === 'Escape') { e.preventDefault(); closePalette(); }
            }, true);

            // Phase 66 Update: Mobile Swipe-Up to Search (PWA constraints)
            var _startY = 0;
            document.addEventListener('touchstart', function (e) {
                if (e.touches && e.touches.length > 0) _startY = e.touches[0].clientY;
            }, { passive: true });
            document.addEventListener('touchend', function (e) {
                if (e.changedTouches && e.changedTouches.length > 0) {
                    var endY = e.changedTouches[0].clientY;
                    // Detect deliberate swipe up from the strict bottom bezel (within 100px of bottom edge)
                    if (_startY > window.innerHeight - 100 && (_startY - endY) > 50) {
                        openPalette();
                    }
                }
            }, { passive: true });

            mBT.core.action('command-palette', openPalette);
        }());

    /* --- 3. GLOBAL EVENT ORCHESTRATION --- */
    function bindAppEventListeners() {
        const footer = document.querySelector('footer');

        // Initialize Registry
        registerCoreActions();

        if (!document.body.dataset.listenersBound) {
            document.body.dataset.listenersBound = 'true';

            // --- Master Router (Delegation) ---
            const router = (e) => {
                if (mBT.core.route(e)) return;
                const target = e.target;
                if (target.closest('#loginBtn')) handleLogin();
                if (target.closest('#openAiToolsBtn')) showAIToolsModal();
            };

            document.body.addEventListener('click', router);
            document.body.addEventListener('change', router);

            // --- Keyboard Shortcuts (Tier 6 Wiring) ---
            document.body.addEventListener('keydown', (e) => {
                // Undo: Ctrl+Z
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (mBT.core.actions['undo']) mBT.core.actions['undo']();
                }
                // Redo: Ctrl+Y or Ctrl+Shift+Z (standard Mac/Linux)
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    if (mBT.core.actions['redo']) mBT.core.actions['redo']();
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Z') {
                    e.preventDefault();
                    if (mBT.core.actions['redo']) mBT.core.actions['redo']();
                }
                // Search: Ctrl+K
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    if (mBT.core.actions['command-palette']) mBT.core.actions['command-palette']();
                }
                // Phase 87C: Help Overlay (? key, only when not typing)
                if (e.key === '?' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && !e.target.isContentEditable) {
                    e.preventDefault();
                    if (mBT.core.actions['help-overlay']) mBT.core.actions['help-overlay']();
                }
            });

            // --- Real-time Input Handling ---
            document.body.addEventListener('input', (e) => {
                const input = e.target;
                if (input.id === 'projectName') { handleProjectNameChange(e); return; }
                if (['discountPercentage', 'contingencyPercentage', 'salesTaxPercentage'].includes(input.id)) {
                    budget[input.id] = parseFloat(input.value) || 0;
                    if (typeof mBTLE !== 'undefined') mBTLE.reconcile();
                    return;
                }
                if (input.dataset.field) {
                    if (input.dataset.action === 'stage-update') {
                        if (typeof updateStageItem === 'function') updateStageItem(input.dataset.id, input.dataset.section, input.dataset.stage, input.dataset.field, input.value, true);
                    } else if (!input.dataset.action) {
                        handleUpdate(input.dataset.section, input.dataset.id, input.dataset.field, input.value, 'User Input');
                    }
                }
            });
        }

        /* --- Phase 64: Ghost Cursor Locking --- Wire focus/blur on line item inputs to broadcastTypingLock/Release --- */
        document.addEventListener('focus', function (e) {
            var input = e.target;
            if (input.matches && input.matches('input[data-id][data-field], select[data-id][data-field]')) {
                var fieldId = (input.dataset.section || '') + '::' + (input.dataset.id || '') + '::' + (input.dataset.field || '');
                if (window.mBTRealtime && typeof mBTRealtime.broadcastTypingLock === 'function') {
                    mBTRealtime.broadcastTypingLock(fieldId);
                }
            }
        }, true);

        document.addEventListener('blur', function (e) {
            var input = e.target;
            if (input.matches && input.matches('input[data-id][data-field], select[data-id][data-field]')) {
                var fieldId = (input.dataset.section || '') + '::' + (input.dataset.id || '') + '::' + (input.dataset.field || '');
                if (window.mBTRealtime && typeof mBTRealtime.broadcastTypingRelease === 'function') {
                    mBTRealtime.broadcastTypingRelease(fieldId);
                }
            }
        }, true);

        /* --- Phase 64: Ghost Cursor Visuals --- Listen for peer locks and tint the DOM --- */
        window.addEventListener('mbt:peer-typing', function (e) {

                        _poIframe.contentWindow.postMessage({ type: 'mbt:tool-action', action: 'reload-ledgers', payload: { pos: budget.ledgers.pos, pettyCash: budget.ledgers.pettyCash } }, '*');
                    }
                }

                /* --- close-tool: dismiss tool modal and lifecycle sync --- */
            } else if (action === 'close-tool') {
                if (typeof mBTME !== 'undefined' && mBTME.close) mBTME.close('tool-window');
                mBTActiveTool = null; /* Phase 73B */
                /* Phase 50C.8 Step C: Re-broadcast editor focus when tool is dismissed */
                if (window.mBTRealtime && mBTRealtime.isConnected()) {
                    mBTRealtime.broadcastFocus('Budget Editor');
                }
                /* Lifecycle sync: push any changes made inside the tool back to cloud.
                   Sub-Phase 51.2 Task 8: Skip if realtime is live (changes already propagated). */
                var _rtLiveClose = window.mBTRealtime && mBTRealtime.isConnected();
                if (!_rtLiveClose && window.mBTSync && localStorage.getItem('mbt_supabase_sync_on_reconnect') === 'true' && localStorage.getItem('mbt_supabase_auth_token')) {
                    mBTSync.pushAll().catch(function (e2) { console.warn('[mBT] Lifecycle push on tool close failed:', e2); });
                }

                /* --- inject-contact: push a contact as a crew line item into the budget --- */
            } else if (action === 'inject-contact' && currentProjectName) {
                if (payload.name && budget) {
                    var crewItem = {
                        id: 'crew_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        description: payload.name,
                        rate: payload.rate || 0,
                        qty: 1,
                        unit: 'day',
                        contact_id: payload.email || null,
                        contact_name: payload.name,
                        contact_phone: payload.phone || null,
                        contact_email: payload.email || null
                    };
                    if (!budget.globalItems) budget.globalItems = [];
                    budget.globalItems.push(crewItem);
                    saveBudget();
                    if (typeof window.mBT_Finance !== 'undefined' && window.mBT_Finance.reconcile) {
                        window.mBT_Finance.reconcile(budget); /* Phase 94: explicit call to extracted engine */
                    }
                    console.log('[mBT] Injected contact:', payload.name);
                }

                /* --- calendar-updated: reload milestones from localforage --- */
            } else if (action === 'calendar-updated' && currentProjectName) {
                mBT.data.load(currentProjectName);

                /* --- update-contact-rate: sync edited CRM rate to matching budget line items --- */
            } else if (action === 'update-contact-rate' && budget) {
                var crName = (payload.name || '').toLowerCase();
                var crRate = parseFloat(payload.rate);
                if (crName && crRate && budget.globalItems) {
                    var crUpdated = false;
                    for (var ci = 0; ci < budget.globalItems.length; ci++) {
                        if ((budget.globalItems[ci].description || '').toLowerCase() === crName) {
                            budget.globalItems[ci].rate = crRate;
                            crUpdated = true;
                        }
                    }
                    if (crUpdated) {
                        saveBudget();
                        if (typeof window.mBT_Finance !== 'undefined' && window.mBT_Finance.reconcile) {
                            window.mBT_Finance.reconcile(budget); /* Phase 94: explicit call to extracted engine */
                        }
                        console.log('[mBT] Contact rate synced:', payload.name, crRate);
                    }
                }

                /* --- user-focus-changed: peripheral tool reports active focus — relay to presence channel --- */
            } else if (action === 'user-focus-changed') {
                if (window.mBTRealtime && mBTRealtime.isConnected()) {
                    mBTRealtime.broadcastFocus(payload.tool || 'unknown');
                }

                /* --- og-rate-changed: update matching line items with new rate --- */
            } else if (action === 'og-rate-changed' && budget) {
                var desc = (payload.description || '').toLowerCase();
                var newRate = payload.rate;
                if (desc && newRate && budget.globalItems) {
                    var updated = false;
                    for (var ri = 0; ri < budget.globalItems.length; ri++) {
                        if ((budget.globalItems[ri].description || '').toLowerCase() === desc) {
                            budget.globalItems[ri].rate = newRate;
                            updated = true;
                        }
                    }
                    if (updated) {
                        saveBudget();
                        if (typeof window.mBT_Finance !== 'undefined' && window.mBT_Finance.reconcile) {
                            window.mBT_Finance.reconcile(budget); /* Phase 94: explicit call to extracted engine */
                        }
                        console.log('[mBT] Rate updated for:', payload.description);
                    }
                }

                /* --- Phase 64: Share Hub Peer Roster Request --- */
            } else if (action === 'get-peers') {
                if (window.mBTRealtime && typeof mBTRealtime.getPresencePeers === 'function') {
                    event.source.postMessage({ type: 'mbt-tools-response', action: 'peers-list', payload: mBTRealtime.getPresencePeers() }, '*');
                } else {
                    event.source.postMessage({ type: 'mbt-tools-response', action: 'peers-list', payload: [] }, '*');
                }

                /* --- Phase 64: Share Hub Role Management --- */
            } else if (action === 'role-change' && payload.targetUserId && payload.newRole) {
                if (window.mBTRealtime && mBTRealtime.broadcastRoleChange) mBTRealtime.broadcastRoleChange(payload.targetUserId, payload.newRole);

                /* --- Phase 64: Share Hub Link Revocation --- */
            } else if (action === 'revoke-link' || action === 'revoke-user') {
                window.dispatchEvent(new CustomEvent('mbt:auth-changed', { detail: { evictAll: action === 'revoke-link', userId: payload.userId } }));

                /* --- load-budget: receive AI-generated .moo payload from Oracle iframe --- */
            } else if (action === 'load-budget' && payload.budgetData) {
                /* Defense-in-depth sanitization — iframe already sanitized, monolith sanitizes again */
                function sanitizeBudgetNode(node) {
                    if (typeof node === 'string') return node.replace(/<[^>]*>/g, '').substring(0, 500);
                    if (Array.isArray(node)) return node.map(sanitizeBudgetNode);
                    if (node && typeof node === 'object') {
                        var c = {};
                        Object.keys(node).forEach(function (k) { c[k] = sanitizeBudgetNode(node[k]); });
                        return c;
                    }
                    return node;
                }
                var lbSanitized = sanitizeBudgetNode(payload.budgetData);

                if (!lbSanitized.projectName || typeof lbSanitized.sections !== 'object') {
                    mBTME.alert('Invalid Budget', 'The AI returned an incomplete structure. Try again with more detail.');
                    return;
                }

                Object.keys(lbSanitized.sections).forEach(function (sName) {
                    var sec = lbSanitized.sections[sName];
                    if (!sec.id) sec.id = sName.toLowerCase().replace(/\s+/g, '_').substring(0, 20);
                    if (sec.isOpen === undefined) sec.isOpen = true;
                    if (!Array.isArray(sec.items)) { sec.items = []; return; }
                    sec.items = sec.items
                        .filter(function (it) { return it && typeof it.description === 'string'; })
                        .map(function (it, idx) {
                            it.id = it.id || ('item_' + idx + '_' + Math.random().toString(36).substr(2, 4));
                            it.quantity = Number(it.quantity) || 1;
                            it.rate = Number(it.rate) || 0;
                            it.multiplier = Number(it.multiplier) || 1;
                            it.actual = Number(it.actual) || 0;
                            it.unit = it.unit || 'Flat';
                            it.rateType = it.rateType || 'negotiable';
                            it.crew = it.crew || {};
                            return it;
                        });
                });

                lbSanitized.company = lbSanitized.company || 'Independent';
                lbSanitized.startDate = lbSanitized.startDate || new Date().toISOString().split('T')[0];
                lbSanitized.contingencyPercentage = Number(lbSanitized.contingencyPercentage) || 10;
                lbSanitized.salesTaxPercentage = Number(lbSanitized.salesTaxPercentage) || 0;
                lbSanitized.discountPercentage = Number(lbSanitized.discountPercentage) || 0;
                lbSanitized.documents = Array.isArray(lbSanitized.documents) ? lbSanitized.documents : [];
                lbSanitized.attachments = Array.isArray(lbSanitized.attachments) ? lbSanitized.attachments : [];
                lbSanitized.globalItems = Array.isArray(lbSanitized.globalItems) ? lbSanitized.globalItems : [];
                lbSanitized.aiContext = lbSanitized.aiContext || { chat: [], analysis: '' };
                lbSanitized.activityLog = lbSanitized.activityLog || [];

                var lbBase = lbSanitized.projectName.replace(/[^a-zA-Z0-9 _-]/g, '').trim() || 'AI Budget';
                lbSanitized.projectName = lbBase + ' ' + new Date().toISOString().split('T')[0];

                budget = mBT.data.state.wrap(lbSanitized);
                currentProjectName = lbSanitized.projectName;
                mBT.data.save().then(function () { mBT.data.load(lbSanitized.projectName); });
                mBTME.close('tool-window');
                mBTActiveTool = null; /* Phase 73B */
                mBTME.alert('Budget Loaded', '\u201c' + lbSanitized.projectName + '\u201d is now active in the editor.');

                /* --- Phase 63: resolve-diff — user resolved conflict in diff iframe --- */
            } else if (action === 'resolve-diff' && payload.mergedSections) {
                _diffActive = false;
                _unsealRealtimeRenderer();
                mBTME.close('tool-window');
                mBTActiveTool = null; /* Phase 73B */

                /* Apply merged sections to the live budget */
                if (budget) {
                    budget.sections = payload.mergedSections;
                    budget.updated_at = new Date().toISOString();
                    mBT.data.save().then(function () {
                        if (typeof mBTLE !== 'undefined') mBTLE.reconcile();
                        /* Force-push the resolved state to Supabase, bypassing conflict check */
                        if (window.mBTSync && budget) {
                            var budgetId = budget.id || budget.projectName;
                            mBTSync.forcePushProject(budgetId, budget).catch(function (e) {
                                console.warn('[mBT] Force-push after diff resolution failed:', e);
                            });
                        }
                    });
                    _diffPendingRecord = null;
                    mBTME.alert('Conflict Resolved', 'Merged budget saved and pushed to cloud.');
                }

                /* --- Phase 63: abort-diff — user chose to discard and cancel sync --- */
            } else if (action === 'abort-diff') {
                _diffActive = false;
                _diffPendingRecord = null;
                _unsealRealtimeRenderer();
                mBTME.close('tool-window');
                mBTActiveTool = null; /* Phase 73B */
                mBTME.alert('Sync Aborted', 'The pending sync was cancelled. Your local budget is unchanged.');

                /* --- Phase 64: role-change — Share Hub changed a peer's role --- */
            } else if (action === 'role-change' && payload.targetUserId && payload.newRole) {
                if (window.mBTRealtime && mBTRealtime.broadcastRoleChange) {
                    mBTRealtime.broadcastRoleChange(payload.targetUserId, payload.newRole);
                }

                /* --- Phase 64: revoke-link / revoke-user — Share Hub burned the link or evicted a user --- */
            } else if (action === 'revoke-link' || action === 'revoke-user') {
                /* Broadcast auth-changed event to evict all viewers or a specific user */
                var evt = new CustomEvent('mbt:auth-changed', {
                    detail: { evictAll: action === 'revoke-link', userId: payload.userId }
                });
                window.dispatchEvent(evt);

                /* --- Phase 68B: approve-pending-edit — Owner approves an Editor proposal --- */
            } else if (action === 'approve-pending-edit' && payload.editId) {
                if (window.mBTSync && window.mBTSync.sbPatchPendingEdit) {
                    mBTSync.sbPatchPendingEdit(payload.editId, {
                        status: 'approved',
                        updated_at: new Date().toISOString()
                    }).then(function () {
                        if (payload.projectId && payload.budgetSnapshot) {
                            return mBTSync.forcePushProject(payload.projectId, payload.budgetSnapshot);
                        }
                    }).then(function () {
                        if (window.mBTRealtime && window.mBTRealtime.broadcastApproval && payload.editorUserId) {
                            mBTRealtime.broadcastApproval(payload.editorUserId, payload.projectId, 'approved');
                        }
                        if (typeof window.mBTClearPendingBadge === 'function') window.mBTClearPendingBadge();
                    }).catch(function (e) {
                        console.error('[mBT] Approval failed:', e);
                    });
                }

                /* --- Phase 68B: reject-pending-edit — Owner rejects an Editor proposal --- */
            } else if (action === 'reject-pending-edit' && payload.editId) {
                if (window.mBTSync && window.mBTSync.sbPatchPendingEdit) {
                    mBTSync.sbPatchPendingEdit(payload.editId, {
                        status: 'rejected',
                        updated_at: new Date().toISOString()
                    }).then(function () {
                        if (window.mBTRealtime && window.mBTRealtime.broadcastApproval && payload.editorUserId) {
                            mBTRealtime.broadcastApproval(payload.editorUserId, payload.projectId, 'rejected');
                        }
                    }).catch(function (e) {
                        console.error('[mBT] Rejection failed:', e);
                    });
                }

                /* --- Phase 81: export-accounting — generate and download accounting exports (Wise/QB) --- */
            } else if (action === 'export-accounting' && payload.type && currentProjectName && budget) {
                var exportType = payload.type; /* 'wise' or 'qb' */
                var csvContent = '';

                if (exportType === 'wise') {
                    csvContent = generateWiseCSV(budget);
                } else if (exportType === 'qb') {
                    csvContent = generateQuickBooksCSV(budget);
                } else {
                    console.warn('[mBT] Unknown export type:', exportType);
                    return;
                }

                /* Trigger download */
                var fileName = 'mbt_export_' + exportType + '_' + new Date().toISOString().split('T')[0] + '.csv';
                triggerCSVDownload(csvContent, fileName);
            }
        });

        /* --- Phase 63 / Phase 62 bridge: relay RBAC eviction into open diff iframe --- */
        window.addEventListener('mbt:auth-changed', function (evictEvt) {
            if (!_diffActive) return;
            var modal = document.querySelector('[data-modal-id="tool-window"] iframe, #global-modal-container iframe');
            if (modal && modal.contentWindow) {
                modal.contentWindow.postMessage({ type: 'mbt:rbac-eviction' }, '*');
            }
            /* Also immediately abort on the monolith side */
            _diffActive = false;
            _diffPendingRecord = null;
            _unsealRealtimeRenderer();
        });
    }

    // OAuth callback handler
    (function () {
        var hash = window.location.hash;
        if (!hash || hash.indexOf('access_token=') === -1) return;
        var params = {};
        hash.substring(1).split('&').forEach(function (pair) {
            var kv = pair.split('=');
            params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
        });
        if (params.access_token) {
            localStorage.setItem('mbt_supabase_auth_token', params.access_token);
            if (params.refresh_token) localStorage.setItem('mbt_supabase_refresh_token', params.refresh_token);
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', window.location.pathname + window.location.search);
            }
        }
    })();

            });
